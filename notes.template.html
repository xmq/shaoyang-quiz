      if (colorMode) return;
      content.querySelectorAll(".chapter-complete-button").forEach((button) => {
        const complete = isChapterCompleted(button.dataset.chapterId);
        button.classList.toggle("is-complete", complete);
        button.setAttribute("aria-pressed", String(complete));
        button.textContent = complete ? "取消完成" : "完成本章";
      });
    }

    function toggleChapterComplete(chapterId) {
      if (!currentCourse || !chapterId) return;
      const progress = readReadingProgress();
      const courseProgress = progress[currentCourse.name] && typeof progress[currentCourse.name] === "object" ? progress[currentCourse.name] : {};
      const completed = new Set(Array.isArray(courseProgress.completed) ? courseProgress.completed : []);
      if (completed.has(chapterId)) completed.delete(chapterId);
      else completed.add(chapterId);
      courseProgress.completed = [...completed];
      progress[currentCourse.name] = courseProgress;
      try { localStorage.setItem(readingProgressKey, JSON.stringify(progress)); } catch {}
      syncChapterCompleteButtons();
    }

    function syncRecallTargets() {
      const active = study.classList.contains("recall-mode");
      content.querySelectorAll(".red, .blue, .black").forEach((item) => {
        item.classList.remove("recall-revealed");
        if (active && !mobileMedia.matches) {
          item.setAttribute("role", "button");
          item.setAttribute("tabindex", "0");
          item.setAttribute("aria-label", `显示答案：${item.dataset.recallCue || "这条笔记"}`);
        } else {
          item.removeAttribute("role");
          item.removeAttribute("tabindex");
          item.removeAttribute("aria-label");
        }
      });
    }

    function recallRatingKey(chapterIndex = activeChapterIndex, cardIndex = activeRecallIndex) {
      return currentCourse ? `${currentCourse.name}::${chapterIndex + 1}::${cardIndex + 1}` : "";
    }

    function pendingRecallCards() {
      if (!currentCourse) return [];
      const prefix = `${currentCourse.name}::`;
      return Object.entries(recallRatings)
        .filter(([key, rating]) => key.startsWith(prefix) && StudyReview.isDue(rating))
        .map(([key]) => {
          const [, chapter, card] = key.split("::");
          return {chapterIndex: Number(chapter) - 1, cardIndex: Number(card) - 1};
        })
        .filter((item) => Number.isInteger(item.chapterIndex) && Number.isInteger(item.cardIndex))
        .sort((left, right) => left.chapterIndex - right.chapterIndex || left.cardIndex - right.cardIndex);
    }

    function updateRecallToggleLabel(active = study.classList.contains("recall-mode")) {
      if (active) recallToggle.textContent = "显示全文";
      else {
        const pending = pendingRecallCards().length;
        recallToggle.textContent = pending ? `到期回忆 · ${pending}` : "回忆模式";
      }
    }

    function saveRecallRating(value) {
      const key = recallRatingKey();
      if (!key) return;
      const rating = StudyReview.nextRating(recallRatings[key], value);
      if (!rating) return;
      recallRatings[key] = rating;
      try {
        localStorage.setItem(StudyReview.key, JSON.stringify(recallRatings));
      } catch {}
      updateRecallToggleLabel();
      const status = document.getElementById("recall-status");
      const due = new Date(rating.nextReviewAt);
      status.textContent = value === "again" ? "已安排稍后重忆" : `下次回忆：${due.toLocaleDateString("zh-CN", {month: "numeric", day: "numeric"})}`;
      status.hidden = false;
    }

    function concealRecallCard(card) {
      card?.querySelectorAll(".red, .blue, .black").forEach((item) => {
        item.classList.remove("recall-revealed");
        item.removeAttribute("aria-label");
      });
    }

    function revealRecallItem(item) {
      if (!study.classList.contains("recall-mode") || !item || mobileMedia.matches) return;
      item.classList.add("recall-revealed");
      item.setAttribute("aria-label", `已显示答案：${item.dataset.recallCue || "这条笔记"}`);
    }

    function publicFacingText(value) {
      return String(value || "");
    }

    function publicMarkdownLines(markdown) {
      return String(markdown || "").split(/\r?\n/);
    }

    function formatInline(value) {
      const source = publicFacingText(value);
      const marker = source.match(/^(🔴|🔵|⚫️?)\s*/u);
      const visibleSource = marker ? source.slice(marker[0].length) : source;
      let output = escapeHtml(visibleSource)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      if (colorMode && marker) {
        const className = marker[1] === "🔴" ? "red" : marker[1] === "🔵" ? "blue" : "black";
        const recallRole = className === "red" ? "结论" : className === "blue" ? "方法与步骤" : "条件与易错";
        output = `<span class="${className}" data-recall-cue="${recallRole}"><span class="recall-answer">${output}</span></span>`;
      } else if (marker) {
        const kind = marker[1] === "🔴" ? "core" : marker[1] === "🔵" ? "method" : "caution";
        output = `<span class="lecture-line lecture-${kind}">${output}</span>`;
      }
      return output;
    }

    function tableCells(line) {
      let trimmed = line.trim();
      if (trimmed.startsWith("|")) trimmed = trimmed.slice(1);
      if (trimmed.endsWith("|")) trimmed = trimmed.slice(0, -1);
      const cells = [];
      let cell = "";
      for (let index = 0; index < trimmed.length; index += 1) {
        if (trimmed[index] === "\\" && trimmed[index + 1] === "|") {
          cell += "|";
          index += 1;
        } else if (trimmed[index] === "|") {
          cells.push(cell.trim());
          cell = "";
        } else {
          cell += trimmed[index];
        }
      }
      cells.push(cell.trim());
      return cells;
    }

    function isSeparatorRow(cells) {
      return cells.length > 0 && cells.every((cell) => /^:?-{3,}:?$/.test(cell));
    }

    function isTableStart(lines, index) {
      if (index + 1 >= lines.length || !lines[index].includes("|") || !lines[index + 1].includes("|")) return false;
      const first = tableCells(lines[index]);
      const second = tableCells(lines[index + 1]);
      const hasSeparator = isSeparatorRow(second);
      const rowsStartWithPipe = lines[index].trim().startsWith("|") && lines[index + 1].trim().startsWith("|");
      return first.length >= 2 && second.length === first.length && (hasSeparator || rowsStartWithPipe);
    }

    function renderTable(rows) {
      const parsed = rows.map(tableCells);
      const bodyRows = isSeparatorRow(parsed[1] || []) ? parsed.slice(2) : parsed.slice(1);
      const header = parsed[0];
      return `<div class="table-wrap" tabindex="0" aria-label="可横向滚动的表格"><table><thead><tr>${header.map((cell) => `<th scope="col">${formatInline(cell)}</th>`).join("")}</tr></thead><tbody>${bodyRows.map((row) => `<tr>${row.map((cell) => `<td>${formatInline(cell)}</td>`).join("")}</tr>`).join("")}</tbody></table></div><p class="table-hint">↔ 左右滑动查看完整表格</p>`;
    }

    function topicForHeading(title, chapterIndex) {
      const plainTitle = title.replace(/^\d+(?:\.\d+)*\s*/, "").trim();
      const exact = currentCourse?.topics?.find((item) => item.title === plainTitle || item.title === title);
      if (exact) return exact;
      const chapterId = currentCourse?.learning_chapters?.[chapterIndex]?.chapter_id;
      const candidates = currentCourse?.topics?.filter((item) => !chapterId || item.chapter_id === chapterId) || [];
      let best = null;
      let bestScore = 0;
      candidates.forEach((topic) => {
        const terms = [topic.title, ...(topic.keywords || [])].filter((term) => String(term).length >= 2);
        const score = terms.reduce((total, term) => total + (plainTitle.toLowerCase().includes(String(term).toLowerCase()) ? String(term).length : 0), 0);
        if (score > bestScore) {
          best = topic;
          bestScore = score;
        }
      });
      return bestScore >= 2 ? best : null;
    }

    function renderMarkdown(markdown) {
      const lines = publicMarkdownLines(markdown);
      const output = ["<div class=\"preface\">"];
      let index = 0;
      let chapterOpen = false;
      let renderedChapterIndex = -1;
      let prefaceOpen = true;
      let listType = null;

      const closeList = () => {
        if (!listType) return;
        output.push(`</${listType}>`);
        listType = null;
      };
      const closePreface = () => {
        if (!prefaceOpen) return;
        closeList();
        output.push("</div>");
        prefaceOpen = false;
      };
      const closeChapter = () => {
        closeList();
        if (!chapterOpen) return;
        output.push("</div></section>");
        chapterOpen = false;
      };

      while (index < lines.length) {
        const trimmed = lines[index].trim();
        if (!trimmed) {
          closeList();
          index += 1;
          continue;
        }
        if (trimmed.startsWith("使用说明")) {
          index += 1;
          continue;
        }
        if (trimmed.startsWith("```")) {
          closeList();
          const language = trimmed.slice(3).trim().replace(/[^a-zA-Z0-9_-]/g, "");
          const code = [];
          index += 1;
          while (index < lines.length && !lines[index].trim().startsWith("```")) {
            code.push(lines[index]);
            index += 1;
          }
          if (index < lines.length) index += 1;
          output.push(`<pre><code${language ? ` class="language-${language}"` : ""}>${escapeHtml(code.join("\n"))}</code></pre>`);
          continue;
        }
        if (isTableStart(lines, index)) {
          closeList();
          const rows = [lines[index]];
          const columnCount = tableCells(lines[index]).length;
          index += 1;
          while (index < lines.length && lines[index].trim() && lines[index].includes("|") && tableCells(lines[index]).length === columnCount) {
            rows.push(lines[index]);
            index += 1;
          }
          output.push(renderTable(rows));
          continue;
        }

        const imageMatch = trimmed.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
        if (imageMatch) {
          closeList();
          const caption = imageMatch[1].trim();
          const rawSource = imageMatch[2].trim();
          const normalizedSource = rawSource.replace(/^\.\.\/media\//, "media/");
          if (/^media\/[a-zA-Z0-9_./-]+\.svg$/i.test(normalizedSource)) {
            const size = imageSizes[normalizedSource];
            const dimensions = size ? ` width="${size[0]}" height="${size[1]}" style="--image-ratio:${size[0] / size[1]}"` : "";
            output.push(`<figure class="note-figure"><button class="figure-open" type="button" aria-label="放大查看：${escapeHtml(caption || "配图")}" title="点击放大"><img src="${escapeHtml(normalizedSource)}"${dimensions} alt="${escapeHtml(caption)}" loading="eager" decoding="async"></button>${caption ? `<figcaption>${formatInline(caption)}</figcaption>` : ""}</figure>`);
          }
          index += 1;
          continue;
        }

        const inlineDetailsSummary = trimmed.match(/^<details>\s*<summary>(.+)<\/summary>$/);
        if (inlineDetailsSummary) {
          closeList();
          output.push('<details class="answer-details"><summary>' + formatInline(inlineDetailsSummary[1]) + '</summary>');
          index += 1;
          continue;
        }
        if (trimmed === "<details>") {
          closeList();
          output.push('<details class="answer-details">');
          index += 1;
          continue;
        }
        const summaryMatch = trimmed.match(/^<summary>(.+)<\/summary>$/);
        if (summaryMatch) {
          closeList();
          output.push(`<summary>${formatInline(summaryMatch[1])}</summary>`);
          index += 1;
          continue;
        }
        if (trimmed === "</details>") {
          closeList();
          output.push("</details>");
          index += 1;
          continue;
        }

        const h1 = trimmed.match(/^#\s+(.+)$/);
        const markdownH2 = trimmed.match(/^##\s+(.+)$/);
        const markdownH3 = trimmed.match(/^###\s+(.+)$/);
        const markdownSubheading = trimmed.match(/^(#{4,6})\s+(.+)$/);
        const plainChapter = trimmed.match(/^第[一二三四五六七八九十百\d]+(?:章|节|篇|部分)[：:]?.*$/);
        const plainPoint = trimmed.match(/^(?:考点|专题|模块)\s*\d+[：:]?.*$/);
        const examMarker = trimmed.match(/^<!--\s*exam:\s*([ABC])\s*\|\s*(.+?)\s*-->$/i);
        const testMarker = trimmed.match(/^<!--\s*test:\s*(.+?)\s*\|\s*(.+?)\s*-->$/i);

        if (markdownH2 || plainChapter) {
          closeChapter();
          closePreface();
          const title = markdownH2 ? markdownH2[1] : plainChapter[0];
          renderedChapterIndex += 1;
          let marker = null;
          for (let lookahead = index + 1; lookahead < Math.min(lines.length, index + 4); lookahead += 1) {
            const candidate = lines[lookahead].trim();
            if (!candidate) continue;
            marker = candidate.match(/^<!--\s*exam:\s*([ABC])\s*\|\s*(.+?)\s*-->$/i);
            break;
          }
          const levelLabels = {A: "课程核心", B: "课程基础", C: "课程拓展"};
          const examHtml = !colorMode && marker && !lines.some(line => /^<!--\s*test:/.test(line.trim()))
            ? `<span class="exam-meta"><span class="exam-level level-${marker[1].toLowerCase()}">${levelLabels[marker[1].toUpperCase()]}</span><span class="exam-types">练习形式：${formatInline(marker[2].replace(/[、，]/g, " · "))}</span></span>`
            : "";
          output.push(`<section class="chapter-section"><h2 class="chapter-heading"><button class="chapter-toggle" type="button" aria-expanded="true"><span class="chapter-heading-copy"><span class="chapter-title">${formatInline(title)}</span>${examHtml}</span><span class="chapter-chevron" aria-hidden="true">▾</span></button></h2><div class="chapter-body">`);
          chapterOpen = true;
        } else if (testMarker) {
          closeList();
          output.push(`<p class="test-point"><strong>可能考 · ${formatInline(testMarker[1].replace(/[、，]/g, " / "))}</strong>　${formatInline(testMarker[2])}</p>`);
        } else if (examMarker) {
          index += 1;
          continue;
        } else if (h1) {
          closeList();
          output.push(`<h1>${formatInline(h1[1])}</h1>`);
        } else if (markdownH3 || plainPoint) {
          closeList();
          const rawTitle = markdownH3 ? markdownH3[1] : plainPoint[0];
          const title = colorMode ? rawTitle.replace(/^回忆卡\s*\d+\s*[|｜:：—-]\s*/, "") : rawTitle;
          const topic = topicForHeading(title, renderedChapterIndex);
          output.push(`<h3 class="point"${topic ? ` data-topic-id="${escapeHtml(topic.topic_id)}"` : ""}>${formatInline(title)}</h3>`);
        } else if (markdownSubheading) {
          closeList();
          const level = markdownSubheading[1].length;
          const title = markdownSubheading[2];
          const topic = !colorMode && currentCourse?.topics?.find(item => item.title === title);
          output.push(`<h${level}${topic ? ` class="point" data-topic-id="${escapeHtml(topic.topic_id)}"` : ""}>${formatInline(title)}</h${level}>`);
        } else if (colorMode && /^先答[：:]/.test(trimmed)) {
          closeList();
          output.push(`<p class="recall-prompt">${formatInline(trimmed)}</p>`);
        } else if (/^>\s?/.test(trimmed)) {
          closeList();
          output.push(`<blockquote>${formatInline(trimmed.replace(/^>\s?/, ""))}</blockquote>`);
        } else if (/^[-*]\s+/.test(trimmed) || /^\d+[.)]\s+/.test(trimmed)) {
          const nextListType = /^\d+[.)]\s+/.test(trimmed) ? "ol" : "ul";
          if (listType !== nextListType) {
            closeList();
            output.push(`<${nextListType}>`);
            listType = nextListType;
          }
          output.push(`<li>${formatInline(trimmed.replace(/^(?:[-*]|\d+[.)])\s+/, ""))}</li>`);
        } else {
          closeList();
          output.push(`<p>${formatInline(trimmed)}</p>`);
        }
        index += 1;
      }
      closePreface();
      closeChapter();
      content.innerHTML = output.join("");
      decorateLectureContent();
      bindTopicGuidance();
      bindChapters();
      if (colorMode) content.querySelectorAll(".recall-card").forEach((card) => {
        card.querySelectorAll(".note-figure").forEach((figure) => {
          const details = document.createElement("details");
          details.className = "recall-diagram";
          details.open = !mobileMedia.matches;
          const summary = document.createElement("summary");
          summary.textContent = `图解：${figure.querySelector("img")?.alt || "过程示意"}`;
          figure.before(details);
          details.append(summary, figure);
        });
        const practice = card.querySelector(".point-practice-link");
        if (practice) card.appendChild(practice);
      });
    }

    function decorateLectureContent() {
      if (colorMode) return;
      content.querySelectorAll("p").forEach((paragraph) => {
        const label = paragraph.querySelector(":scope > strong:first-child")?.textContent.trim().replace(/[：:]$/, "") || "";
        const text = paragraph.textContent.trim();
        if (label === "通俗理解") paragraph.classList.add("lecture-callout", "concept");
        else if (label === "例题" || label === "小例子") paragraph.classList.add("lecture-callout", "example");
        else if (["注意", "易错"].includes(label) || /^(注意|易错)[：:]/.test(text)) paragraph.classList.add("lecture-callout", "warning");
      });
    }

    function bindTopicGuidance() {
      if (!colorMode) return;
      content.querySelectorAll(".point[data-topic-id]").forEach((point) => {
        const topic = currentCourse?.topics?.find((item) => item.topic_id === point.dataset.topicId);
        if (!topic) return;
        const meta = document.createElement("div");
        meta.className = "topic-study-meta";
        const priority = topic.practice_priority || "正常练";
        const tag = document.createElement("span");
        tag.className = `topic-study-tag ${priority === "优先练" ? "topic-key" : priority === "补充练" ? "topic-supplement" : ""}`.trim();
        tag.textContent = priority;
        const copy = document.createElement("span");
        copy.className = "topic-study-copy";
        copy.textContent = topic.study_task || "";
        meta.appendChild(tag);
        if (copy.textContent) meta.appendChild(copy);
        point.insertAdjacentElement("afterend", meta);
        if (!topic.question_count) return;
        const link = document.createElement("a");
        link.className = "chapter-study-link point-practice-link";
        const params = new URLSearchParams({topic: point.dataset.topicId, mode: "seq"});
        link.href = `./quiz.html?${params.toString()}`;
        link.textContent = `练习这个知识点（${topic.question_count}题） →`;
        meta.insertAdjacentElement("afterend", link);
      });
    }

    function cleanChapterLabel(label) {
      const cleaned = label.replace(/^第[一二三四五六七八九十百\d]+(?:章|节|篇|部分)[：:]?\s*/, "").trim();
      return cleaned || label;
    }

    function updateStudyPosition({replaceRoute = true, sectionId = ""} = {}) {
      study.classList.toggle("due-recall", Boolean(dueRecallQueue));
      const sections = [...content.querySelectorAll(".chapter-section")];
      activeChapterIndex = Math.max(0, Math.min(activeChapterIndex, Math.max(0, sections.length - 1)));
      const section = sections[activeChapterIndex];
      const cards = section ? [...section.querySelectorAll(".recall-card")] : [];
      sections.forEach((item, index) => item.classList.toggle("mobile-active", index === activeChapterIndex));
      chapterLinks.querySelectorAll(".chapter-link").forEach((link, index) => {
        const active = index === activeChapterIndex;
        link.classList.toggle("active", active);
        if (active) link.setAttribute("aria-current", "location");
        else link.removeAttribute("aria-current");
      });
      mobileChapterProgress.textContent = colorMode ? "目录" : (sections.length ? `${activeChapterIndex + 1}/${sections.length}章` : "章节");
      chapterPrev.disabled = activeChapterIndex <= 0;
      chapterNext.disabled = activeChapterIndex >= sections.length - 1;

      if (colorMode) {
        activeRecallIndex = Math.max(0, Math.min(activeRecallIndex, Math.max(0, cards.length - 1)));
        cards.forEach((card, index) => card.classList.toggle("mobile-active", index === activeRecallIndex));
        mobileCardProgress.textContent = cards.length ? `笔记 ${activeRecallIndex + 1}/${cards.length}` : "";
        recallPrev.disabled = activeChapterIndex <= 0 && activeRecallIndex <= 0;
        recallNext.disabled = activeChapterIndex >= sections.length - 1 && activeRecallIndex >= cards.length - 1;
        if (dueRecallQueue) {
          mobileCardProgress.textContent = `待回忆 ${dueRecallQueue.length} 个`;
          recallPrev.disabled = true;
          recallNext.disabled = false;
        }
        recallNext.textContent = dueRecallQueue ? "稍后再练" : "下一张 →";
        const activeCard = cards[activeRecallIndex];
        const hiddenAnswer = activeCard && [...activeCard.querySelectorAll(".red, .blue, .black")].some((item) => !item.classList.contains("recall-revealed"));
        revealCard.textContent = hiddenAnswer ? "显示答案" : "答案已显示";
        revealCard.disabled = !activeCard || !hiddenAnswer;
        const awaitingRating = Boolean(activeCard && !hiddenAnswer && (mobileMedia.matches || dueRecallQueue));
        recallPager.classList.toggle("is-rating", awaitingRating);
        recallRating.classList.toggle("hidden", !awaitingRating);
      } else {
        mobileCardProgress.textContent = "";
      }

      if (currentCourse) {
        const position = new URLSearchParams();
        position.set("course", currentCourse.name);
        position.set("chapter", String(activeChapterIndex + 1));
        if (colorMode) position.set("card", String(activeRecallIndex + 1));
        moduleLinks.forEach((link) => {
          const title = currentCourse.chapters?.[pageKind]?.[activeChapterIndex];
          for (const [kind, file] of [["lecture", "notes.html"], ["color-notes", "color-notes.html"]]) {
            if (!link.pathname.endsWith(`/${file}`)) continue;
            const targetIndex = currentCourse.chapters?.[kind]?.indexOf(title) ?? -1;
            const target = new URLSearchParams({course: currentCourse.name});
            if (currentCourse.layout_revision) target.set("layout", currentCourse.layout_revision);
            if (targetIndex >= 0) target.set("chapter", String(targetIndex + 1));
            link.href = `./${file}#${target.toString()}`;
          }
        });
      }

      if (replaceRoute && currentCourse) {
        const params = new URLSearchParams();
        params.set("course", currentCourse.name);
        params.set("chapter", String(activeChapterIndex + 1));
        if (currentCourse.layout_revision) params.set("layout", currentCourse.layout_revision);
        if (colorMode) params.set("card", String(activeRecallIndex + 1));
        if (sectionId) params.set("section", sectionId);
        history.replaceState(history.state, "", `#${params.toString()}`);
        try {
          localStorage.setItem("shaoyang-last-learning", JSON.stringify({
            course: currentCourse.name,
            module: pageKind,
            chapter: activeChapterIndex + 1,
            card: colorMode ? activeRecallIndex + 1 : undefined,
            savedAt: new Date().toISOString(),
            layoutRevision: currentCourse.layout_revision,
          }));
        } catch {}
      }
      if (currentCourse && sections.length) {
        try {
          const progress = readReadingProgress();
          const courseProgress = progress[currentCourse.name] && typeof progress[currentCourse.name] === "object" ? progress[currentCourse.name] : {};
          const chapterId = chapterProgressId();
          const visited = new Set(Array.isArray(courseProgress[pageKind]) ? courseProgress[pageKind] : []);
          visited.add(chapterId);
          courseProgress[pageKind] = [...visited];
          if (pageKind === "lecture") courseProgress.lastLectureChapter = activeChapterIndex + 1;
          progress[currentCourse.name] = courseProgress;
          localStorage.setItem(readingProgressKey, JSON.stringify(progress));
        } catch {}
      }
      syncChapterCompleteButtons();
    }

    function scrollToStudyTarget(target) {
      const request = ++pendingStudyScroll;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        if (request !== pendingStudyScroll || !target?.isConnected) return;
        const heading = target.matches(".chapter-section") ? target.querySelector(".chapter-title") : null;
        const anchor = heading ? (heading.getBoundingClientRect().height ? heading : target.querySelector(".point")) : target;
        if (!anchor) return;
        const pinnedBottom = (element) => {
          const rect = element.getBoundingClientRect();
          if (!rect.height) return 0;
          const style = getComputedStyle(element);
          return ["sticky", "fixed"].includes(style.position)
            ? (parseFloat(style.top) || 0) + rect.height
            : rect.bottom;
        };
        const toolbarBottom = pinnedBottom(studyToolbar);
        const headerBottom = pinnedBottom(siteHeader);
        const offset = Math.max(0, toolbarBottom, headerBottom) + 12;
        studyContent.style.setProperty("--study-scroll-offset", `${offset}px`);
        const top = scrollY + anchor.getBoundingClientRect().top - offset;
        window.scrollTo({top: Math.max(0, top), behavior: "auto"});
      }));
    }

    function setActiveChapter(index, {replaceRoute = true, focus = false} = {}) {
      const sections = [...content.querySelectorAll(".chapter-section")];
      if (!sections.length) return;
      activeChapterIndex = Math.max(0, Math.min(index, sections.length - 1));
      activeRecallIndex = 0;
      recallRetryQueue = [];
      recallRetryMode = false;
      dueRecallQueue = null;
      sections[activeChapterIndex].classList.remove("collapsed");
      sections[activeChapterIndex].querySelector(".chapter-toggle")?.setAttribute("aria-expanded", "true");
      updateStudyPosition({replaceRoute});
      if (focus) {
        window.scrollTo({top: 0, behavior: "auto"});
        requestAnimationFrame(() => sections[activeChapterIndex].querySelector(".chapter-title")?.focus?.({preventScroll: true}));
      }
    }

    function setActiveRecallCard(index, {replaceRoute = true, focus = false, conceal = true} = {}) {
      const section = content.querySelectorAll(".chapter-section")[activeChapterIndex];
      const cards = section ? [...section.querySelectorAll(".recall-card")] : [];
      if (!cards.length) return;
      activeRecallIndex = Math.max(0, Math.min(index, cards.length - 1));
      if (conceal) concealRecallCard(cards[activeRecallIndex]);
      updateStudyPosition({replaceRoute});
      if (focus) {
        window.scrollTo({top: 0, behavior: "auto"});
        requestAnimationFrame(() => cards[activeRecallIndex].querySelector(".point")?.scrollIntoView({block: "start"}));
      }
    }

    function moveRecallCard(direction, {focus = true} = {}) {
      const sections = [...content.querySelectorAll(".chapter-section")];
      const section = sections[activeChapterIndex];
      const cards = section ? [...section.querySelectorAll(".recall-card")] : [];
      if (!cards.length) return;
      const nextCard = activeRecallIndex + direction;
      if (nextCard >= 0 && nextCard < cards.length) {
        recallRetryMode = false;
        setActiveRecallCard(nextCard, {focus});
        return;
      }
      const nextChapter = activeChapterIndex + direction;
      if (nextChapter < 0 || nextChapter >= sections.length) return;
      activeChapterIndex = nextChapter;
      const nextCards = [...sections[nextChapter].querySelectorAll(".recall-card")];
      activeRecallIndex = direction > 0 ? 0 : Math.max(0, nextCards.length - 1);
      recallRetryQueue = [];
      recallRetryMode = false;
      concealRecallCard(nextCards[activeRecallIndex]);
      sections[nextChapter].classList.remove("collapsed");
      updateStudyPosition();
      if (focus) {
        window.scrollTo({top: 0, behavior: "auto"});
        requestAnimationFrame(() => nextCards[activeRecallIndex]?.querySelector(".point")?.scrollIntoView({block: "start"}));
      }
    }

    function advanceAfterRecallRating(value) {
      if (dueRecallQueue) {
        advanceDueRecall();
        return;
      }
      const section = content.querySelectorAll(".chapter-section")[activeChapterIndex];
      const cards = section ? [...section.querySelectorAll(".recall-card")] : [];
      if (!cards.length) return;
      if (!recallRetryMode && value !== "known" && !recallRetryQueue.includes(activeRecallIndex)) {
        recallRetryQueue.push(activeRecallIndex);
      }
      if (!recallRetryMode && activeRecallIndex < cards.length - 1) {
        setActiveRecallCard(activeRecallIndex + 1, {focus: true});
        return;
      }
      if (recallRetryQueue.length) {
        recallRetryMode = true;
        setActiveRecallCard(recallRetryQueue.shift(), {focus: true});
        return;
      }
      if (recallRetryMode) {
        recallRetryMode = false;
        const sections = [...content.querySelectorAll(".chapter-section")];
        if (activeChapterIndex >= sections.length - 1) {
          updateStudyPosition({replaceRoute: false});
          return;
        }
        activeChapterIndex += 1;
        activeRecallIndex = 0;
        const nextCard = sections[activeChapterIndex].querySelector(".recall-card");
        concealRecallCard(nextCard);
        updateStudyPosition();
        window.scrollTo({top: 0, behavior: "auto"});
        return;
      }
      recallRetryMode = false;
      moveRecallCard(1);
    }

    function advanceDueRecall() {
      dueRecallQueue.shift();
      if (dueRecallQueue.length) {
        const next = dueRecallQueue[0];
        activeChapterIndex = next.chapterIndex;
        setActiveRecallCard(next.cardIndex, {focus: true});
      } else {
        dueRecallQueue = null;
        recallToggle.click();
        const status = document.getElementById("recall-status");
        status.textContent = "本轮回忆结束";
        status.hidden = false;
      }
    }

    function bindChapters() {
      if (activeObserver) activeObserver.disconnect();
      chapterLinks.innerHTML = "";
      const sections = [...content.querySelectorAll(".chapter-section")];
      sections.forEach((section, index) => {
        if (colorMode) {
          const body = section.querySelector(".chapter-body");
          let card = null;
          [...body.children].forEach((child) => {
            if (child.matches("h3.point")) {
              card = document.createElement("div");
              card.className = "recall-card";
              body.insertBefore(card, child);
            }
            if (card) card.appendChild(child);
          });
        }
        section.id = `chapter-${index + 1}`;
        const toggle = section.querySelector(".chapter-toggle");
        const title = section.querySelector(".chapter-title").textContent.trim();
        toggle.setAttribute("aria-controls", `${section.id}-body`);
        section.querySelector(".chapter-body").id = `${section.id}-body`;
        toggle.addEventListener("click", () => {
          if (!colorMode) return;
          if (study.classList.contains("color-notes-list")) return;
          if (mobileMedia.matches) return;
          const collapsed = section.classList.toggle("collapsed");
          toggle.setAttribute("aria-expanded", String(!collapsed));
        });

        const link = document.createElement("button");
        link.type = "button";
        link.className = "chapter-link";
        link.textContent = cleanChapterLabel(title);
        link.addEventListener("click", () => {
          if (!colorMode || study.classList.contains("color-notes-list")) {
            activeChapterIndex = index;
            updateStudyPosition({replaceRoute: true});
            closeMobileNav({restoreFocus: false});
            scrollToStudyTarget(section);
            return;
          }
          if (mobileMedia.matches) {
            setActiveChapter(index, {focus: true});
            closeMobileNav({restoreFocus: false});
          } else {
            activeChapterIndex = index;
            updateStudyPosition({replaceRoute: true});
            section.classList.remove("collapsed");
            toggle.setAttribute("aria-expanded", "true");
            scrollToStudyTarget(section);
          }
        });
        chapterLinks.appendChild(link);
        const pointLinks = document.createElement("div");
        pointLinks.className = "section-links";
        pointLinks.dataset.chapterIndex = String(index);
        section.querySelectorAll("h3.point").forEach((point, pointIndex) => {
          if (!point.id) point.id = `section-${index + 1}-${pointIndex + 1}`;
          const pointLink = document.createElement("button");
          pointLink.type = "button";
          pointLink.className = "section-link";
          pointLink.textContent = point.textContent.trim();
          pointLink.addEventListener("click", () => {
            activeChapterIndex = index;
            if (mobileMedia.matches) setActiveChapter(index, {replaceRoute: false});
            section.classList.remove("collapsed");
            toggle.setAttribute("aria-expanded", "true");
            updateStudyPosition({replaceRoute: true, sectionId: point.id});
            closeMobileNav({restoreFocus: false});
            scrollToStudyTarget(point);
          });
          pointLinks.appendChild(pointLink);
        });
        if (pointLinks.childElementCount) chapterLinks.appendChild(pointLinks);
        const otherKind = colorMode ? "lecture" : "color-notes";
        const otherIndex = currentCourse?.chapters?.[otherKind]?.indexOf(title) ?? -1;
        const actions = document.createElement("div");
        actions.className = "chapter-actions";
        if (otherIndex >= 0) {
          const companion = document.createElement("a");
          companion.className = "chapter-study-link";
          const route = new URLSearchParams({course: currentCourse.name, chapter: String(otherIndex + 1)});
          if (currentCourse.layout_revision) route.set("layout", currentCourse.layout_revision);
          companion.href = `./${colorMode ? "notes" : "color-notes"}.html#${route.toString()}`;
          companion.textContent = colorMode ? "查看本章讲义 →" : "查看本章重点与易错 →";
          actions.appendChild(companion);
        }
        const learningChapter = currentCourse?.learning_chapters?.find((item) => item.title === title);
        if (learningChapter) {
          const practice = document.createElement("a");
          practice.className = "chapter-study-link chapter-practice-link";
          practice.href = `./quiz.html?chapter=${encodeURIComponent(learningChapter.chapter_id)}&mode=seq`;
          practice.textContent = "练习本章 →";
          actions.appendChild(practice);
          if (!colorMode) {
            const complete = document.createElement("button");
            complete.type = "button";
            complete.className = "chapter-complete-button";
            complete.dataset.chapterId = learningChapter.chapter_id;
            complete.setAttribute("aria-pressed", "false");
            complete.textContent = "完成本章";
            complete.addEventListener("click", () => toggleChapterComplete(learningChapter.chapter_id));
            actions.appendChild(complete);
          }
        }
        if (actions.childElementCount) section.querySelector(".chapter-body").appendChild(actions);
      });

      chapterNav.classList.toggle("hidden", sections.length === 0);
      mobileNavToggle.classList.toggle("hidden", sections.length === 0);
      if (!sections.length) return;
      if (!mobileMedia.matches) {
        activeObserver = new IntersectionObserver((entries) => {
          const visible = entries.filter((entry) => entry.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
          if (!visible) return;
          const index = sections.indexOf(visible.target);
          chapterLinks.querySelectorAll(".chapter-link").forEach((link, linkIndex) => {
            const active = linkIndex === index;
            link.classList.toggle("active", active);
            if (active) link.setAttribute("aria-current", "location");
            else link.removeAttribute("aria-current");
          });
        }, {rootMargin: "-135px 0px -62% 0px", threshold: 0});
        sections.forEach((section) => activeObserver.observe(section));
      }
      updateStudyPosition({replaceRoute: false});
    }

    function openCourse(course) {
      currentCourse = course;
      collapsedBeforeSearch = null;
      recallRetryQueue = [];
      recallRetryMode = false;
      const routeParams = new URLSearchParams(location.hash.replace(/^#/, ""));
      if (course.layout_revision && routeParams.has("chapter") && !routeParams.has("topic") && routeParams.get("layout") !== course.layout_revision) {
        const target = StudyReview.mapOldPosition(course, routeParams.get("chapter"), colorMode ? routeParams.get("card") || 1 : 1);
        routeParams.set("chapter", String(target.chapter));
        routeParams.set("card", String(target.card));
        routeParams.set("layout", course.layout_revision);
        routeParams.delete("section");
        history.replaceState(history.state, "", `#${routeParams}`);
      }
      dueRecallQueue = null;
      document.getElementById("recall-status").hidden = true;
      const routeTopic = routeParams.get("topic");
      requestedRecallTopic = routeTopic || "";
      const routeSection = routeParams.get("section");
      activeChapterIndex = Math.max(0, (Number(routeParams.get("chapter")) || 1) - 1);
      activeRecallIndex = Math.max(0, (Number(routeParams.get("card")) || 1) - 1);
      renderMarkdown(course.text);
      if (routeTopic) {
        const topic = currentCourse?.topics?.find((item) => item.topic_id === routeTopic);
        const point = [...content.querySelectorAll(".point[data-topic-id]")].find((item) => item.dataset.topicId === routeTopic);
        let section = point?.closest(".chapter-section");
        const sections = [...content.querySelectorAll(".chapter-section")];
        let sectionIndex = sections.indexOf(section);
        if (sectionIndex < 0 && topic) {
          const chapterTitle = currentCourse.learning_chapters?.find((item) => item.chapter_id === topic.chapter_id)?.title;
          const chapterPosition = currentCourse.chapters?.[pageKind]?.indexOf(chapterTitle) ?? -1;
          if (chapterPosition >= 0) {
            sectionIndex = chapterPosition;
            section = sections[sectionIndex];
          }
        }
        if (sectionIndex >= 0) {
          setActiveChapter(sectionIndex, {replaceRoute: false});
          if (colorMode && point) {
            const card = point.closest(".recall-card");
            const cardIndex = [...section.querySelectorAll(".recall-card")].indexOf(card);
            if (cardIndex >= 0) activeRecallIndex = cardIndex;
          }
        }
        scrollToStudyTarget(point || section);
      } else if (routeSection) {
        const point = document.getElementById(routeSection);
        const sections = [...content.querySelectorAll(".chapter-section")];
        const sectionIndex = sections.indexOf(point?.closest(".chapter-section"));
        if (sectionIndex >= 0) setActiveChapter(sectionIndex, {replaceRoute: false});
        scrollToStudyTarget(point);
      }
      study.classList.remove("recall-mode");
      study.classList.toggle("color-notes-list", colorMode);
      recallToggle.classList.toggle("hidden", !colorMode);
      recallToggle.setAttribute("aria-pressed", "false");
      updateRecallToggleLabel(false);
      recallPager.hidden = true;
      recallPager.classList.add("hidden");
      syncRecallTargets();
      mobileCourseSelect.value = course.name;
      mobileModuleSelect.value = pageKind;
      const courseHash = `#course=${encodeURIComponent(course.name)}`;
      moduleLinks.forEach((link) => {
        if (link.getAttribute("href") === "./notes.html" || link.pathname.endsWith("/notes.html")) link.href = `./notes.html${courseHash}`;
        if (link.getAttribute("href") === "./color-notes.html" || link.pathname.endsWith("/color-notes.html")) link.href = `./color-notes.html${courseHash}`;
        if (link.getAttribute("href") === "./quiz.html" || link.pathname.endsWith("/quiz.html")) {
          link.href = `./quiz.html?course=${encodeURIComponent(course.name)}&mode=home`;
        }
      });
      updateStudyPosition({replaceRoute: mobileMedia.matches, sectionId: routeSection || ""});
      try {
        localStorage.setItem("shaoyang-selected-course-v1", course.name);
        localStorage.setItem("shaoyang-last-learning", JSON.stringify({
          course: course.name,
          module: pageKind,
          chapter: activeChapterIndex + 1,
          card: colorMode ? activeRecallIndex + 1 : undefined,
          savedAt: new Date().toISOString(),
          layoutRevision: course.layout_revision,
        }));
      } catch {}
      study.classList.remove("hidden");
      document.body.classList.add("is-studying");
      search.value = "";
      searchClear.classList.add("hidden");
      searchStatus.textContent = "";
      window.scrollTo({top: 0, behavior: "auto"});
      content.focus({preventScroll: true});
      if (routeParams.has("chapter") && !routeTopic && !routeSection) {
        scrollToStudyTarget(content.querySelectorAll(".chapter-section")[activeChapterIndex]);
      }
      if (colorMode && routeParams.get("recall") === "due") recallToggle.click();
    }

    function showDirectory() {
      location.href = "./index.html";
    }

    function goBackOrHome() {
      const referrer = document.referrer ? new URL(document.referrer, location.href) : null;
      if (referrer?.origin === location.origin && history.length > 1) history.back();
      else showDirectory();
    }

    function prepareStudyHistory() {
      history.replaceState({...history.state, shaoyangStudyPage: true, shaoyangBackVersion: 3}, "", location.href);
    }

    function courseHash(course) {
      return `#course=${encodeURIComponent(course.name)}`;
    }

    function navigateToCourse(course) {
      const target = courseHash(course);
      if (location.hash === target) {
        openCourse(course);
        return;
      }
      history.pushState({shaoyangCourse: true}, "", target);
      applyLocation();
    }

    function applyLocation() {
      const params = new URLSearchParams(location.hash.replace(/^#/, ""));
      const name = params.get("course");
      const course = name ? items.find((item) => item.name === name) : null;
      if (course) openCourse(course);
      else location.replace("./index.html");
    }

    function highlightMatches(root, query) {
      const nodes = [];
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          if (!node.nodeValue.trim() || node.parentElement.closest("mark")) return NodeFilter.FILTER_REJECT;
          return node.nodeValue.toLowerCase().includes(query) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
        },
      });
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach((node) => {
        const text = node.nodeValue;
        const lower = text.toLowerCase();
        const fragment = document.createDocumentFragment();
        let offset = 0;
        let found = lower.indexOf(query, offset);
        while (found !== -1) {
          fragment.append(document.createTextNode(text.slice(offset, found)));
          const mark = document.createElement("mark");
          mark.textContent = text.slice(found, found + query.length);
          fragment.append(mark);
          offset = found + query.length;
          found = lower.indexOf(query, offset);
        }
        fragment.append(document.createTextNode(text.slice(offset)));
        node.replaceWith(fragment);
      });
    }

    function filterContent() {
      const query = search.value.trim().toLowerCase();
      if (query && study.classList.contains("recall-mode")) {
        study.classList.remove("recall-mode");
        study.classList.toggle("color-notes-list", colorMode);
        recallToggle.setAttribute("aria-pressed", "false");
        recallToggle.textContent = "回忆模式";
        recallPager.hidden = true;
        recallPager.classList.add("hidden");
      }
      searchClear.classList.toggle("hidden", !query);
      if (!currentCourse) return;
      if (query && collapsedBeforeSearch === null) {
        collapsedBeforeSearch = new Set([...content.querySelectorAll(".chapter-section")]
          .map((section, index) => section.classList.contains("collapsed") ? index : -1)
          .filter((index) => index >= 0));
      }
      renderMarkdown(currentCourse.text);
      syncRecallTargets();
      const sections = [...content.querySelectorAll(".chapter-section")];
      const targets = [...content.querySelectorAll(".preface, .chapter-section")];
      let matches = 0;
      let firstMatch = null;
      targets.forEach((target) => {
        const show = !query || target.textContent.toLowerCase().includes(query);
        target.classList.toggle("hidden", !show);
        if (query && show) {
          matches += 1;
          firstMatch ||= target;
          target.classList.remove("collapsed");
          target.querySelector(".chapter-toggle")?.setAttribute("aria-expanded", "true");
          highlightMatches(target, query);
        }
      });
      if (!query && collapsedBeforeSearch) {
        sections.forEach((section, index) => {
          const collapsed = collapsedBeforeSearch.has(index);
          section.classList.toggle("collapsed", collapsed);
          section.querySelector(".chapter-toggle")?.setAttribute("aria-expanded", String(!collapsed));
        });
        collapsedBeforeSearch = null;
      }
      searchStatus.textContent = query ? (matches ? `找到 ${matches} 个相关内容区，已定位到首个结果` : "当前科目没有匹配内容") : "";
      chapterLinks.querySelectorAll(".chapter-link").forEach((link, index) => link.classList.toggle("hidden", Boolean(query) && sections[index]?.classList.contains("hidden")));
      chapterLinks.querySelectorAll(".section-links").forEach((links) => {
        const index = Number(links.dataset.chapterIndex);
        links.classList.toggle("hidden", Boolean(query) && sections[index]?.classList.contains("hidden"));
      });
      if (mobileMedia.matches && firstMatch?.classList.contains("chapter-section")) {
        activeChapterIndex = Math.max(0, sections.indexOf(firstMatch));
        activeRecallIndex = 0;
        updateStudyPosition();
      }
      if (firstMatch) scrollToStudyTarget(firstMatch);
    }

    function setDesktopNavCollapsed(collapsed) {
      study.classList.toggle("nav-collapsed", collapsed);
      navCollapse.setAttribute("aria-expanded", String(!collapsed));
      navCollapse.setAttribute("aria-label", collapsed ? "展开章节目录" : "收起章节目录");
      navCollapse.querySelector("span").textContent = collapsed ? "›" : "‹";
    }

    function openMobileNav() {
      mobileNavReturnFocus = document.activeElement;
      study.classList.add("mobile-nav-open");
      chapterNav.setAttribute("aria-hidden", "false");
      chapterNav.setAttribute("role", "dialog");
      chapterNav.setAttribute("aria-modal", "true");
      chapterNav.inert = false;
      studyToolbar.inert = true;
      studyContent.inert = true;
      siteHeader.inert = true;
      mobileNavToggle.setAttribute("aria-expanded", "true");
      mobileNavToggle.setAttribute("aria-label", "关闭章节目录");
      navCollapse.setAttribute("aria-label", "关闭章节目录");
      navCollapse.querySelector("span").textContent = "×";
      document.body.style.overflow = "hidden";
      navCollapse.focus();
      requestAnimationFrame(() => {
        const activeLink = chapterLinks.querySelectorAll(".chapter-link")[activeChapterIndex];
        if (activeLink) chapterLinks.scrollTop = Math.max(0, activeLink.offsetTop - chapterLinks.clientHeight / 2 + activeLink.offsetHeight / 2);
      });
    }

    function closeMobileNav({restoreFocus = true} = {}) {
      const wasOpen = study.classList.contains("mobile-nav-open");
      study.classList.remove("mobile-nav-open");
      chapterNav.setAttribute("aria-hidden", String(mobileMedia.matches));
      chapterNav.removeAttribute("role");
      chapterNav.removeAttribute("aria-modal");
      chapterNav.inert = mobileMedia.matches;
      studyToolbar.inert = false;
      studyContent.inert = false;
      siteHeader.inert = false;
      mobileNavToggle.setAttribute("aria-expanded", "false");
      mobileNavToggle.setAttribute("aria-label", "打开章节目录");
      document.body.style.overflow = "";
      if (wasOpen && restoreFocus && mobileNavReturnFocus && document.contains(mobileNavReturnFocus)) mobileNavReturnFocus.focus();
      mobileNavReturnFocus = null;
    }

    function trapMobileNavFocus(event) {
      const focusable = [...chapterNav.querySelectorAll("button:not([disabled]), [href], [tabindex]:not([tabindex='-1'])")]
        .filter((element) => !element.hidden && element.getClientRects().length);
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    search.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(filterContent, 160);
    });
    searchClear.addEventListener("click", () => {
      search.value = "";
      filterContent();
      search.focus();
    });
    mobileCourseSelect.innerHTML = items.map((course) => `<option value="${escapeHtml(course.name)}">${escapeHtml(course.name)}</option>`).join("");
    mobileCourseSelect.addEventListener("change", () => {
      const course = items.find((item) => item.name === mobileCourseSelect.value);
      if (course) navigateToCourse(course);
    });
    mobileModuleSelect.addEventListener("change", () => {
      if (!currentCourse || mobileModuleSelect.value === pageKind) return;
      closeMobileNav({restoreFocus: false});
      const targetKind = mobileModuleSelect.value;
      const chapterTitle = currentCourse.chapters?.[pageKind]?.[activeChapterIndex];
      const targetIndex = currentCourse.chapters?.[targetKind]?.indexOf(chapterTitle) ?? -1;
      const targetRoute = new URLSearchParams({course: currentCourse.name});
      if (currentCourse.layout_revision) targetRoute.set("layout", currentCourse.layout_revision);
      if (targetIndex >= 0) targetRoute.set("chapter", String(targetIndex + 1));
      const courseHash = `#${targetRoute.toString()}`;
      if (mobileModuleSelect.value === "lecture") location.href = `./notes.html${courseHash}`;
      else if (mobileModuleSelect.value === "color-notes") location.href = `./color-notes.html${courseHash}`;
      else location.href = `./quiz.html?course=${encodeURIComponent(currentCourse.name)}&mode=home`;
    });
    chapterPrev.addEventListener("click", () => setActiveChapter(activeChapterIndex - 1, {focus: true}));
    chapterNext.addEventListener("click", () => setActiveChapter(activeChapterIndex + 1, {focus: true}));
    recallPrev.addEventListener("click", () => moveRecallCard(-1));
    recallNext.addEventListener("click", () => dueRecallQueue ? advanceDueRecall() : moveRecallCard(1));
    revealCard.addEventListener("click", () => {
      const section = content.querySelectorAll(".chapter-section")[activeChapterIndex];
      const card = section?.querySelectorAll(".recall-card")[activeRecallIndex];
      if (!card) return;
      card.querySelectorAll(".red, .blue, .black").forEach((item) => {
        item.classList.add("recall-revealed");
        item.removeAttribute("role");
        item.removeAttribute("tabindex");
        item.setAttribute("aria-label", `已显示答案：${item.dataset.recallCue || "这条笔记"}`);
      });
      updateStudyPosition({replaceRoute: false});
    });
    recallRating.addEventListener("click", (event) => {
      const button = event.target.closest("[data-recall-rating]");
      if (!button) return;
      saveRecallRating(button.dataset.recallRating);
      advanceAfterRecallRating(button.dataset.recallRating);
    });
    backButton.addEventListener("click", () => {
      showDirectory();
    });
    mobileBack.addEventListener("click", goBackOrHome);
    recallToggle.addEventListener("click", () => {
      if (search.value.trim()) {
        search.value = "";
        filterContent();
      }
      const active = study.classList.toggle("recall-mode");
      if (!active) dueRecallQueue = null;
      study.classList.toggle("color-notes-list", !active);
      recallPager.hidden = !active;
      recallPager.classList.toggle("hidden", !active);
      recallToggle.setAttribute("aria-pressed", String(active));
      updateRecallToggleLabel(active);
      syncRecallTargets();
      if (active) {
        const sections = [...content.querySelectorAll(".chapter-section")];
        const routeTopic = requestedRecallTopic;
        requestedRecallTopic = "";
        const targetPoint = routeTopic ? [...content.querySelectorAll(".point[data-topic-id]")].find((point) => point.dataset.topicId === routeTopic) : null;
        const targetCard = targetPoint?.closest(".recall-card");
        if (targetCard) {
          activeChapterIndex = sections.indexOf(targetCard.closest(".chapter-section"));
          activeRecallIndex = [...sections[activeChapterIndex].querySelectorAll(".recall-card")].indexOf(targetCard);
          setActiveRecallCard(activeRecallIndex, {focus: true});
          return;
        }
        const pendingCards = pendingRecallCards().filter((item) => sections[item.chapterIndex]?.querySelectorAll(".recall-card")[item.cardIndex]);
        dueRecallQueue = pendingCards.length ? pendingCards : null;
        const pending = pendingCards[0];
        if (pending) {
          activeChapterIndex = pending.chapterIndex;
          activeRecallIndex = pending.cardIndex;
          setActiveRecallCard(activeRecallIndex, {focus: true});
        } else updateStudyPosition();
      } else updateStudyPosition();
    });
    function openImageViewer(preview, {fromHistory = false} = {}) {
      if (imageViewer) return;
      imageReturnFocus = document.activeElement;
      const size = imageSizes[preview.src] || [Number(preview.width), Number(preview.height)];
      if (!size[0] || !size[1]) return;
      imageCloseFromHistory = false;
      imageClosePending = false;
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const viewer = new PhotoSwipe({
        dataSource: [{src: preview.src, width: size[0], height: size[1], alt: preview.alt}],
        mainClass: "study-image-viewer",
        index: 0,
        initialZoomLevel: "fit",
        secondaryZoomLevel: (zoom) => Math.min(2, Math.max(1, zoom.fit * 1.8)),
        maxZoomLevel: 4,
        paddingFn: (viewport) => {
          const style = getComputedStyle(document.documentElement);
          const inset = (side) => parseFloat(style.getPropertyValue(`--image-safe-${side}`)) || 0;
          const space = viewport.x < 700 ? 12 : 32;
          return {top: 76 + inset("top"), bottom: 24 + inset("bottom"), left: space + inset("left"), right: space + inset("right")};
        },
        bgOpacity: .9,
        wheelToZoom: false,
        imageClickAction: "zoom",
        doubleTapAction: "zoom",
        tapAction: "toggle-controls",
        bgClickAction: "close",
        closeOnVerticalDrag: false,
        pinchToClose: false,
        showHideAnimationType: "none",
        zoomAnimationDuration: reducedMotion ? 0 : 180,
        closeTitle: "关闭图片",
        zoomTitle: "放大或恢复图片",
        errorMsg: "图片暂时无法加载",
        counter: false,
        arrowPrev: false,
        arrowNext: false,
        returnFocus: false,
      });
      viewer.on("uiRegister", () => {
        viewer.ui.registerElement({
          name: "imageTitle", className: "image-viewer-title", order: 1, isButton: false,
          onInit: (element) => { element.textContent = preview.alt || "配图"; },
        });
        viewer.ui.registerElement({
          name: "fit", order: 9, isButton: true, title: "适应屏幕", html: "适应",
          onClick: () => {
            const slide = viewer.currSlide;
            if (slide) slide.zoomTo(slide.zoomLevels.initial, undefined, reducedMotion ? 0 : 180);
          },
        });
      });
      viewer.on("close", () => {
        if (!imageCloseFromHistory && history.state?.imagePreview && !imageClosePending) {
          imageClosePending = true;
          history.back();
        }
      });
      viewer.on("afterInit", () => {
        viewer.element.setAttribute("aria-label", preview.alt || "查看配图");
        viewer.element.setAttribute("aria-modal", "true");
      });
      viewer.on("destroy", () => {
        imageViewer = null;
        document.body.classList.remove("image-viewer-open");
        document.getElementById("main").inert = false;
        siteHeader.inert = false;
        if (imageReturnFocus?.isConnected) imageReturnFocus.focus({preventScroll: true});
        imageReturnFocus = null;
      });
      imageViewer = viewer;
      document.body.classList.add("image-viewer-open");
      document.getElementById("main").inert = true;
      siteHeader.inert = true;
      if (!fromHistory) history.pushState({...history.state, imagePreview: preview}, "", location.href);
      viewer.init();
    }

    function closeImageViewer() {
      if (!imageViewer) return;
      imageCloseFromHistory = true;
      imageViewer.close();
    }

    content.addEventListener("click", (event) => {
      const button = event.target.closest(".figure-open");
      if (button) {
        const image = button.querySelector("img");
        openImageViewer({src: image.getAttribute("src"), alt: image.alt, width: image.getAttribute("width"), height: image.getAttribute("height")});
        return;
      }
      revealRecallItem(event.target.closest(".red, .blue, .black"));
    });
    content.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      const item = event.target.closest(".red, .blue, .black");
      if (!item) return;
      event.preventDefault();
      revealRecallItem(item);
    });
    navCollapse.addEventListener("click", () => {
      if (mobileMedia.matches) closeMobileNav();
      else setDesktopNavCollapsed(!study.classList.contains("nav-collapsed"));
    });
    mobileNavToggle.addEventListener("click", () => {
      if (study.classList.contains("mobile-nav-open")) closeMobileNav();
      else openMobileNav();
    });
    navMask.addEventListener("click", closeMobileNav);
    document.addEventListener("keydown", (event) => {
      if (study.classList.contains("mobile-nav-open")) {
        if (event.key === "Escape") closeMobileNav();
        else if (event.key === "Tab") trapMobileNavFocus(event);
      }
    });
    mobileMedia.addEventListener("change", () => {
      closeMobileNav();
      if (!mobileMedia.matches) setDesktopNavCollapsed(study.classList.contains("nav-collapsed"));
      else updateStudyPosition({replaceRoute: false});
      backButton.textContent = mobileMedia.matches ? "课程" : "换科目";
      syncRecallTargets();
    });

    window.addEventListener("popstate", (event) => {
      if (event.state?.imagePreview) {
        openImageViewer(event.state.imagePreview, {fromHistory: true});
        return;
      }
      if (imageViewer) {
        imageClosePending = false;
        closeImageViewer();
        return;
      }
      if (imageClosePending) {
        imageClosePending = false;
        return;
      }
      applyLocation();
    });
    window.addEventListener("pageshow", (event) => {
      closeMobileNav({restoreFocus: false});
      if (event.persisted) applyLocation();
      if (imageViewer) { document.getElementById("main").inert = true; siteHeader.inert = true; }
    });
    closeMobileNav();
    backButton.textContent = mobileMedia.matches ? "课程" : "换科目";
    prepareStudyHistory();
    applyLocation();
    if (history.state?.imagePreview) openImageViewer(history.state.imagePreview, {fromHistory: true});

    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js", {updateViaCache: "none"}).then((registration) => {
          if (registration.waiting) registration.waiting.postMessage("SKIP_WAITING");
          registration.update().catch(() => {});
        }).catch(() => {});
      });
    }
  </script>
</body>
</html>
