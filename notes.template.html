<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#10191e" media="(prefers-color-scheme: dark)">
  <title>__DOCUMENT_TITLE__</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./vendor/photoswipe/photoswipe.css">
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #fff;
      --text: #182230;
      --muted: #667085;
      --border: #e4e7ec;
      --primary: #2563eb;
      --primary-strong: #1d4ed8;
      --primary-soft: #eaf2ff;
      --deep: #143b6b;
      --red: #b42318;
      --red-soft: #fff2f0;
      --blue: #2563eb;
      --black: #182230;
      --shadow: 0 10px 30px rgba(16, 24, 40, .08);
      --image-safe-top: env(safe-area-inset-top, 0px);
      --image-safe-bottom: env(safe-area-inset-bottom, 0px);
      --image-safe-left: env(safe-area-inset-left, 0px);
      --image-safe-right: env(safe-area-inset-right, 0px);
    }

    * { box-sizing: border-box; }
    html { max-width: 100%; overflow-x: clip; scroll-behavior: auto; }
    body {
      max-width: 100%;
      overflow-x: clip;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.75 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    :where(button, input, a):focus-visible {
      outline: 3px solid rgba(37, 99, 235, .38);
      outline-offset: 2px;
    }
    .skip-link {
      position: fixed;
      left: 12px;
      top: -60px;
      z-index: 100;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
    }
    .skip-link:focus { top: 12px; }
    .hidden { display: none !important; }
    .chapter-study-link { color: #1d4ed8; text-decoration: underline; text-underline-offset: 3px; }
    .chapter-study-link { display: inline-block; margin: 12px 0 20px; font-size: 14px; }
    .point-practice-link { margin: 2px 0 12px; font-size: 13px; }
    .topic-study-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin: -2px 0 8px; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .topic-study-tag { display: inline-flex; align-items: center; min-height: 24px; padding: 3px 8px; border: 1px solid var(--border); border-radius: 999px; background: var(--panel); white-space: nowrap; }
    .topic-study-tag.topic-key { border-color: rgba(198, 40, 40, .26); background: rgba(198, 40, 40, .08); color: var(--red); font-weight: 750; }
    .topic-study-tag.topic-supplement { color: var(--muted); }
    .topic-study-copy { min-width: 0; }
    .chapter-section { scroll-margin-top: 145px; }
    .sr-only { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid rgba(228, 231, 236, .82);
      background: rgba(255, 255, 255, .9);
      backdrop-filter: blur(14px);
      padding-top: env(safe-area-inset-top);
    }
    .header-inner {
      width: min(1160px, 100%);
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin: auto;
      padding: 8px max(18px, env(safe-area-inset-right)) 8px max(18px, env(safe-area-inset-left));
    }
    .module-link {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      color: var(--primary);
      text-decoration: none;
      font-weight: 650;
      white-space: nowrap;
    }
    .module-link:hover { border-color: #84adff; background: var(--primary-soft); }
    .module-link[aria-current="page"] { border-color: #b9d2ff; background: var(--primary-soft); color: var(--primary-strong); }
    .header-brand { min-width: 0; display: inline-flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: var(--deep); color: #fff; font-weight: 850; }
    .module-nav { display: flex; gap: 7px; margin-left: auto; }
    .brand { font-size: 18px; font-weight: 800; letter-spacing: .01em; }

    main {
      width: min(1160px, 100%);
      margin: auto;
      padding: 26px max(18px, env(safe-area-inset-right)) max(56px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    }
    .directory-head {
      max-width: 720px;
      margin: 8px 0 18px;
    }
    .directory-head h1 { margin: 0; font-size: clamp(26px, 4vw, 36px); line-height: 1.25; }
    .directory-search { max-width: 560px; margin: 18px 0; }
    .search-box {
      min-height: 46px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 3px 12px rgba(16, 24, 40, .04);
    }
    .search-box:focus-within { border-color: var(--primary); }
    .search-box input { min-width: 0; flex: 1; border: 0; outline: 0; background: transparent; color: var(--text); }
    .search-box input { min-height: 44px; }
    .search-icon { color: var(--muted); }
    .icon-button {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 20px;
    }
    .icon-button:hover { background: var(--primary-soft); color: var(--primary); }
    .course-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .course-card {
      min-height: 78px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 17px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      text-align: left;
      box-shadow: 0 1px 3px rgba(16, 24, 40, .06);
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }
    .course-card:hover { transform: translateY(-2px); border-color: #84adff; box-shadow: var(--shadow); }
    .course-name { font-size: 17px; font-weight: 750; line-height: 1.45; overflow-wrap: anywhere; }
    .course-arrow { margin-left: auto; color: var(--primary); font-size: 17px; }
    .empty-result { margin: 18px 0; padding: 26px; border-radius: 14px; background: var(--panel); color: var(--muted); text-align: center; }

    .study-toolbar {
      position: sticky;
      top: 59px;
      z-index: 15;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 10px;
      margin: -10px 0 14px;
      padding: 10px 0;
      background: rgba(244, 247, 251, .94);
      backdrop-filter: blur(10px);
      align-items: start;
    }
    .search-area { min-width: 0; }
    .search-area .search-status { margin: 4px 4px 0; }
    .toolbar-actions { display: flex; align-items: flex-start; gap: 8px; }
    .text-button {
      min-height: 46px;
      height: 46px;
      padding: 0 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      white-space: nowrap;
    }
    .text-button:hover { border-color: #84adff; color: var(--primary); }
    .mobile-nav-toggle,
    .mobile-back-button,
    .mobile-search-toggle,
    .mobile-course-context,
    .mobile-module-context,
    .chapter-pager,
    .recall-card-pager { display: none; }
    @media (min-width: 701px) {
      .study:not(.recall-mode) .study-content .chapter-section:last-child {
        min-height: calc(100vh - var(--study-scroll-offset, 137px));
        min-height: calc(100dvh - var(--study-scroll-offset, 137px));
      }
      .study.due-recall .chapter-section:not(.mobile-active),
      .study.due-recall .recall-card:not(.mobile-active),
      .study.due-recall .chapter-pager,
      .study.due-recall .chapter-body > :not(.recall-card) { display: none; }
      .study.due-recall .recall-card-pager { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; margin: 16px 0; }
      .study.due-recall .recall-card-pager button { min-height: 42px; padding: 8px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); color: var(--text); cursor: pointer; }
      .study.due-recall .recall-card-pager.is-rating { grid-template-columns: 1fr; }
      .study.due-recall .is-rating > :not(.recall-rating) { display: none; }
      .study.due-recall .recall-rating { display: none; }
      .study.due-recall .is-rating .recall-rating { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    }

    .study-layout { display: grid; grid-template-columns: 238px minmax(0, 1fr); gap: 18px; align-items: start; }
    .study-content { min-width: 0; }
    .chapter-nav {
      position: sticky;
      top: 154px;
      max-height: calc(100vh - 174px);
      max-height: calc(100dvh - 174px);
      overflow: auto;
      overscroll-behavior-y: contain;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--panel);
      box-shadow: 0 6px 22px rgba(16, 24, 40, .06);
    }
    .chapter-nav-head {
      position: sticky;
      top: 0;
      z-index: 2;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 8px 7px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      font-weight: 750;
    }
    .chapter-links { padding: 8px; overscroll-behavior-y: contain; }
    .chapter-link {
      width: 100%;
      min-height: 44px;
      display: -webkit-box;
      margin: 2px 0;
      padding: 9px 10px;
      overflow: hidden;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      text-align: left;
      line-height: 1.45;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .chapter-link:hover, .chapter-link.active { background: var(--primary-soft); color: var(--primary); }
    .section-links { margin: 0 0 7px 12px; padding-left: 8px; border-left: 1px solid var(--border); }
    .section-link { width: 100%; min-height: 34px; display: block; padding: 6px 8px; overflow: hidden; border: 0; border-radius: 7px; background: transparent; color: var(--muted); text-align: left; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .section-link:hover { background: var(--primary-soft); color: var(--primary); }
    .chapter-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
    .chapter-actions .chapter-study-link { margin: 0; padding: 8px 11px; border: 1px solid var(--border); border-radius: 9px; background: var(--panel); text-decoration: none; font-weight: 700; }
    .chapter-actions .chapter-practice-link { border-color: var(--primary); background: var(--primary); color: #fff; }
    .chapter-complete-button { min-height: 38px; padding: 8px 11px; border: 1px solid var(--primary); border-radius: 9px; background: var(--panel); color: var(--primary); font: inherit; font-weight: 700; cursor: pointer; }
    .chapter-complete-button.is-complete { border-color: #176f68; background: #e8f7f5; color: #176f68; }
    .study.nav-collapsed .study-layout { grid-template-columns: 58px minmax(0, 1fr); }
    .study.nav-collapsed .chapter-nav-head { justify-content: center; padding: 7px; }
    .study.nav-collapsed .chapter-nav-label,
    .study.nav-collapsed .chapter-links { display: none; }

    .note {
      min-width: 0;
      padding: clamp(18px, 3vw, 34px);
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .note:focus { outline: none; }
    .note h1 { margin: 0 0 14px; font-size: clamp(24px, 3.5vw, 32px); line-height: 1.35; overflow-wrap: anywhere; }
    .note p { margin: 0 0 13px; overflow-wrap: anywhere; }
    .note code {
      padding: .1em .36em;
      border-radius: 5px;
      background: #f2f4f7;
      color: #7a271a;
      font: .92em/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    .note ul { margin: 0 0 15px; padding-left: 1.35em; }
    .note ol { margin: 0 0 15px; padding-left: 1.6em; }
    .note li { margin: 5px 0; }
    .note blockquote { margin: 14px 0; padding: 10px 14px; border-left: 4px solid #98a2b3; background: #f8fafc; color: #475467; }
    .note pre { max-width: 100%; overflow: auto; margin: 14px 0; padding: 14px; border-radius: 10px; background: #101828; color: #f2f4f7; line-height: 1.65; }
    .note pre code { padding: 0; background: transparent; color: inherit; white-space: pre; }
    .note mark { padding: 0 .08em; border-radius: 3px; background: #fef08a; color: #422006; }
    .red { color: var(--red); font-weight: 750; }
    .blue { color: var(--blue); font-weight: 750; }
    .black { color: var(--black); }
    .lecture-line { color: var(--text); }
    .recall-answer { display: inline; }
    .study.recall-mode .note :is(.red, .blue, .black):not(.recall-revealed) {
      display: inline-block;
      max-width: 100%;
      padding: .18em .55em;
      border: 1px dashed rgba(37, 99, 235, .42);
      border-radius: 7px;
      background: repeating-linear-gradient(135deg, rgba(37, 99, 235, .13) 0 8px, rgba(37, 99, 235, .06) 8px 16px);
      color: #1d4ed8 !important;
      font-weight: 700;
      cursor: pointer;
      user-select: text;
    }
    .study.recall-mode .note :is(.red, .blue, .black):not(.recall-revealed)::before { content: "点击核对：" attr(data-recall-cue); }
    .study.recall-mode .note :is(.red, .blue, .black):not(.recall-revealed) .recall-answer { display: none; }
    .study.recall-mode .note :is(.red, .blue, .black):focus-visible { outline: 3px solid rgba(37, 99, 235, .42); outline-offset: 2px; }
    .study.recall-mode .note :is(.red, .blue, .black).recall-revealed::before {
      display: inline-flex;
      margin-right: 6px;
      padding: 1px 6px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-size: 11px;
      line-height: 1.55;
      vertical-align: .08em;
    }
    .study.recall-mode .note .red.recall-revealed::before { content: "结论"; }
    .study.recall-mode .note .blue.recall-revealed::before { content: "方法与步骤"; }
    .study.recall-mode .note .black.recall-revealed::before { content: "条件 / 易错"; }
    .recall-prompt { margin: 11px 0 8px !important; padding: 9px 12px; border-left: 4px solid var(--blue); border-radius: 7px; background: #eff6ff; color: #1e3a8a; font-weight: 700; }
    .chapter-section { margin: 24px 0 10px; scroll-margin-top: 138px; }
    .chapter-heading { margin: 0 0 14px; }
    .chapter-toggle {
      width: 100%;
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 15px;
      border: 0;
      border-left: 6px solid var(--primary);
      border-radius: 10px;
      background: var(--primary-soft);
      color: var(--deep);
      text-align: left;
      font-size: clamp(18px, 2.5vw, 22px);
      font-weight: 800;
      line-height: 1.45;
    }
    .chapter-heading-copy { min-width: 0; display: grid; gap: 6px; }
    .exam-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 11px; font-weight: 750; line-height: 1.35; }
    .exam-level,
    .exam-types { min-height: 23px; display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 999px; }
    .exam-level { background: var(--panel); }
    .exam-level.level-a { color: var(--red); }
    .exam-level.level-b { color: var(--blue); }
    .exam-level.level-c { color: var(--muted); }
    .exam-types { background: rgba(255, 255, 255, .62); color: var(--muted); }
    .chapter-chevron { flex: 0 0 auto; transition: transform .16s ease; }
    .chapter-section.collapsed .chapter-chevron { transform: rotate(-90deg); }
    .chapter-section.collapsed .chapter-body { display: none; }
    .point {
      margin: 20px 0 10px;
      padding: 10px 13px;
      border-left: 5px solid var(--blue);
      border-radius: 8px;
      background: var(--primary-soft);
      color: var(--blue);
      font-size: 17px;
      line-height: 1.5;
    }
    .table-wrap { width: 100%; overflow-x: auto; margin: 16px 0; border: 1px solid var(--border); border-radius: 10px; }
    .table-hint { margin: -8px 0 12px !important; color: var(--muted); font-size: 13px; }
    .note-figure { width: fit-content; max-width: 100%; margin: 24px auto; padding: 0; border: 0; border-radius: 0; background: transparent; text-align: center; }
    .note-figure img { display: block; height: auto; max-width: min(100%, calc(min(72svh, 640px) * var(--image-ratio, 1))); max-height: min(72svh, 640px); margin: 0 auto; }
    .note-figure figcaption { margin-top: 10px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .figure-open { display: block; max-width: 100%; margin: 0 auto; padding: 0; border: 0; background: transparent; cursor: zoom-in; }
    body.image-viewer-open { overflow: hidden; }
    .study-image-viewer .pswp__top-bar { height: auto; align-items: center; gap: 4px; padding: calc(8px + env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left)); }
    .study-image-viewer .pswp__button { width: 44px; height: 44px; margin: 0; border-radius: 8px; background: rgba(255,255,255,.08); }
    .study-image-viewer .pswp__icn { top: 7px; left: 7px; }
    .study-image-viewer .pswp__button--fit { width: auto; padding: 0 12px; color: #fff; font-size: 13px; white-space: nowrap; }
    .study-image-viewer .image-viewer-title { flex: 1; min-width: 0; margin: 0 8px 0 0; overflow: hidden; color: #fff; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 500; }
    .study-image-viewer .pswp__button--zoom { display: block; }
    .study-image-viewer img.pswp__img { background: var(--panel); border-radius: 2px; }
    .study-image-viewer .pswp__preloader { position: absolute; top: calc(64px + env(safe-area-inset-top)); right: 16px; }
    .note table { width: 100%; min-width: 620px; border-collapse: collapse; background: var(--panel); font-size: 14px; }
    .note th, .note td { padding: 10px 12px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
    .note tr:last-child td { border-bottom: 0; }
    .note th:last-child, .note td:last-child { border-right: 0; }
    .note th { background: var(--primary-soft); color: var(--blue); font-weight: 750; }
    .search-status { min-height: 24px; margin: 8px 0 0; color: var(--muted); font-size: 13px; }
    .search-status:empty { display: none; }
    .nav-mask { display: none; }
    .recall-card { min-width: 0; }

    /* 讲义保持连续文档形态，不复用重点与易错与刷题模块的卡片视觉。 */
    .lecture-page .note {
      padding: 6px 4px 28px;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }
    .lecture-page .chapter-toggle {
      min-height: 0;
      padding: 0 0 12px;
      border: 0;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      background: transparent;
      color: var(--text);
      cursor: default;
    }
    .lecture-page .chapter-toggle[aria-expanded] { pointer-events: none; }
    .lecture-page .chapter-chevron { display: none; }
    .lecture-page .chapter-section.collapsed .chapter-body { display: block; }
    .lecture-page .exam-meta { gap: 0; color: var(--muted); font-weight: 650; }
    .lecture-page .exam-level,
    .lecture-page .exam-types {
      min-height: 0;
      padding: 0;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
    }
    .lecture-page .exam-level::after { content: "·"; margin: 0 6px; color: #98a2b3; }
    .lecture-page .point {
      margin: 21px 0 9px;
      padding: 0 0 6px;
      border: 0;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      background: transparent;
      color: var(--deep);
    }
    .lecture-page .note strong { color: var(--deep); font-weight: 800; }
    .lecture-page .note .lecture-core > strong { color: var(--red); }
    .lecture-page .note .lecture-method > strong { color: var(--blue); }
    .lecture-page .note .lecture-caution > strong { color: var(--black); }
    .lecture-page .note .test-point { margin: 6px 0 14px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .lecture-page .note .test-point strong { color: var(--blue); font-weight: 750; }
    .lecture-page .note code { border: 1px solid #d8e6f3; background: #eef5fb; color: #174f78; font-weight: 650; }
    .lecture-callout {
      margin: 16px 0 !important;
      padding: 13px 15px;
      border: 1px solid var(--border);
      border-left: 5px solid #3977b7;
      border-radius: 10px;
      background: #f1f6fc;
    }
    .lecture-callout.example { border-left-color: #198754; background: #edf8f2; }
    .lecture-callout.warning { border-left-color: #d98716; background: #fff7e8; }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[char]));
    }

    function readReadingProgress() {
      try {
        const stored = JSON.parse(localStorage.getItem(readingProgressKey) || "{}");
        return stored && typeof stored === "object" ? stored : {};
      } catch {
        return {};
      }
    }

    function chapterProgressId(index = activeChapterIndex) {
      const title = currentCourse?.chapters?.[pageKind]?.[index];
      return currentCourse?.learning_chapters?.find((item) => item.title === title)?.chapter_id || `${pageKind}-${index + 1}`;
    }

    function isChapterCompleted(chapterId) {
      if (!currentCourse || !chapterId) return false;
      const progress = readReadingProgress();
      return Array.isArray(progress[currentCourse.name]?.completed) && progress[currentCourse.name].completed.includes(chapterId);
    }
