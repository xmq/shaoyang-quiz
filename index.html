<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102a43">
  <meta name="description" content="按大学课程系统学习计算机专业知识，支持讲义、重点复习、刷题、错题和模拟考试。">
  <title>知阶 · 计算机专业课学习台</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="platform-home study-home">
  <a class="sr-only home-skip" href="#home-main">跳到主要内容</a>
  <header class="home-header">
    <div class="home-header-inner">
      <a class="home-brand" href="./index.html" aria-current="page">
        <span class="home-brand-mark" aria-hidden="true">知</span>
        <span><strong>知阶</strong><small>计算机专业课学习台</small></span>
      </a>
      <button class="home-reset" id="home-reset" type="button">重置</button>
    </div>
  </header>

  <main class="home-main" id="home-main">
    <section class="study-home-hero" aria-labelledby="home-title">
      <aside class="study-start-card">
        <div class="study-start-head">
          <strong id="home-title">当前课程</strong>
        </div>
        <label class="study-course-select">
          <span class="sr-only">课程</span>
          <select id="home-course-select"><option value="">请选择课程</option></select>
        </label>
        <p class="selected-course-status" id="selected-course-status">选课后可直接进入讲义、重点与易错或专项练习。</p>
        <nav class="home-module-actions hidden" id="home-module-actions" aria-label="学习功能">
          <a id="home-notes-link" href="./notes.html"><strong>开始讲义</strong><small>进入 →</small></a>
          <a id="home-recall-link" href="./color-notes.html"><strong>重点</strong></a>
          <a id="home-quiz-link" href="./quiz.html"><strong>练习</strong></a>
        </nav>
      </aside>
    </section>

    <section class="study-course-section" id="courses" aria-labelledby="courses-title">
      <div class="study-section-heading">
        <div><h2 id="courses-title">全部课程</h2></div>
      </div>
      <nav class="course-jumps" aria-label="筛选课程分类" role="tablist">
        <button type="button" role="tab" aria-selected="true" data-course-filter="all">全部</button>
        <button type="button" role="tab" aria-selected="false" data-course-filter="计算机专业主干">专业主干</button>
        <button type="button" role="tab" aria-selected="false" data-course-filter="计算机应用与安全">应用安全</button>
        <button type="button" role="tab" aria-selected="false" data-course-filter="电子通信方向扩展">电子通信</button>
      </nav>
      <div class="home-course-grid" id="home-course-grid" data-active-filter="all" aria-live="polite"></div>
    </section>

  </main>

  <nav class="mobile-tabbar home-mobile-tabbar" aria-label="主导航">
    <a aria-current="page" href="./index.html"><span aria-hidden="true">⌂</span><strong>课程</strong></a>
    <a href="./notes.html"><span aria-hidden="true">书</span><strong>讲义</strong></a>
    <a href="./color-notes.html"><span aria-hidden="true">重</span><strong>重点</strong></a>
    <a href="./quiz.html"><span aria-hidden="true">练</span><strong>刷题</strong></a>
  </nav>

  <script src="./build-meta.js"></script>
  <script src="./home-data.js"></script>
  <script src="./reset-data.js"></script>
  <script src="./home.js"></script>
</body>
</html>
