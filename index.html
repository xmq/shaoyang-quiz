<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#143b6b">
  <meta name="description" content="刷题器提供专业知识讲义、重点复习、顺序刷题、随机刷题、模拟考试和错题复习。">
  <title>刷题器</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="platform-home home-workbench">
  <a class="sr-only home-skip" href="#home-main">跳到主要内容</a>
  <header class="home-header">
    <div class="home-header-inner">
      <a class="home-brand" href="./index.html" aria-current="page">
        <span class="home-brand-mark" aria-hidden="true">题</span>
        <span><strong>刷题器</strong></span>
      </a>
    </div>
  </header>

  <main class="home-main" id="home-main">
    <section class="course-launcher" aria-labelledby="courses-title">
      <h1 id="courses-title">选择课程</h1>
      <p class="home-scope">选择课程后，按“讲义 → 重点与易错 → 练习 → 错题复习”完成学习。</p>
      <label class="course-select-control">
        <span class="sr-only">课程</span>
        <select id="home-course-select">
          <option value="">请选择课程</option>
        </select>
      </label>
      <nav class="home-module-actions hidden" id="home-module-actions" aria-label="学习功能">
        <a id="home-notes-link" href="./notes.html"><strong>讲义</strong></a>
        <a id="home-recall-link" href="./color-notes.html"><strong>重点与易错</strong></a>
        <a id="home-quiz-link" href="./quiz.html"><strong>刷题</strong></a>
      </nav>
      <a class="home-continue hidden" id="home-continue" href="./notes.html"></a>
      <details class="exam-mode-guide">
        <summary>报考前先看笔试模式</summary>
        <ul>
          <li><strong>分类联考：</strong>职测＋综应，计算机课程用于补专业基础。</li>
          <li><strong>岗位专业卷：</strong>常见为公基或综合知识＋计算机专业知识，客观题和主观应用题都要练。</li>
          <li><strong>实操或专业问答：</strong>公告明确要求时，再增加办公、数据库、网络配置或程序调试训练。</li>
        </ul>
      </details>
    </section>
  </main>

  <script src="./build-meta.js"></script>
  <script src="./home.js"></script>
</body>
</html>
