<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 489" role="img" aria-labelledby="title desc" width="390" height="489"><title id="title">一次故障：RPO和RTO看哪段时间？</title><desc id="desc">一次故障：RPO和RTO看哪段时间？</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><rect class="bg" width="390" height="489" rx="14"/><text class="h" x="20" y="33">一次故障：RPO和RTO看哪段时间？</text><rect class="box" x="18" y="56" width="354" height="68" rx="10"/><text class="h" x="32" y="84">08:00：最近一次可恢复备份</text><text class="t" x="32" y="112">到故障前的新增数据还没备份</text><path class="line" d="M195 127L195 148"/><rect class="box" x="18" y="153" width="354" height="94" rx="10"/><text class="h" x="32" y="181">10:00：系统发生故障</text><text class="t" x="32" y="209">可能丢失08:00—10:00的数据</text><text class="t" x="32" y="235">这次可恢复点距故障2小时</text><path class="line" d="M195 250L195 271"/><rect class="hot" x="18" y="276" width="354" height="94" rx="10"/><text class="h" x="32" y="304">11:30：系统恢复服务</text><text class="t" x="32" y="332">这次停机恢复耗时1.5小时</text><text class="t" x="32" y="358">对照事先约定的RTO目标验收</text><text class="s" x="20" y="399">RPO目标：最多允许损失多久的数据。</text><text class="s" x="20" y="425">RTO目标：最多允许多久恢复业务。</text><text class="s" x="20" y="451">实际间隔不等于目标，须比较是否达标。</text></svg>
