<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 435" role="img" aria-labelledby="title desc" width="400" height="435"><title id="title">轮转：没做完就回队尾</title><desc id="desc">轮转：没做完就回队尾；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><rect x="1" y="1" width="398" height="433" rx="12" class="bg"/><text x="22" y="33" class="title" text-anchor="start">轮转：没做完就回队尾</text><text x="22" y="72" class="" text-anchor="start">都在0时刻到达；初序 P1,P2,P3</text><text x="22" y="99" class="" text-anchor="start">运行需时5、3、2；时间片 q=2</text><rect x="25" y="119" width="115" height="32" rx="7" class="hi"/><text x="82.5" y="141.0" class="mono" text-anchor="middle">[0,2) P1</text><text x="160" y="142" class="" text-anchor="start">剩3，队列P2,P3,P1</text><rect x="25" y="159" width="115" height="32" rx="7" class="box"/><text x="82.5" y="181.0" class="mono" text-anchor="middle">[2,4) P2</text><text x="160" y="182" class="" text-anchor="start">剩1，队列P3,P1,P2</text><rect x="25" y="199" width="115" height="32" rx="7" class="hi"/><text x="82.5" y="221.0" class="mono" text-anchor="middle">[4,6) P3</text><text x="160" y="222" class="" text-anchor="start">完成，队列P1,P2</text><rect x="25" y="239" width="115" height="32" rx="7" class="box"/><text x="82.5" y="261.0" class="mono" text-anchor="middle">[6,8) P1</text><text x="160" y="262" class="" text-anchor="start">剩1，队列P2,P1</text><rect x="25" y="279" width="115" height="32" rx="7" class="hi"/><text x="82.5" y="301.0" class="mono" text-anchor="middle">[8,9) P2</text><text x="160" y="302" class="" text-anchor="start">完成，队列P1</text><rect x="25" y="319" width="115" height="32" rx="7" class="box"/><text x="82.5" y="341.0" class="mono" text-anchor="middle">[9,10) P1</text><text x="160" y="342" class="" text-anchor="start">完成，队列为空</text><text x="22" y="404" class="" text-anchor="start">只需1单位就结束，不必用满2单位。</text></svg>