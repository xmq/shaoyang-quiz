<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430"><defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.box{fill:#fff;stroke:#64748b;stroke-width:2}.hi{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.line{stroke:#2563eb;stroke-width:4;fill:none}.h{font:700 25px system-ui,sans-serif;fill:#102a43}.t{font:19px system-ui,sans-serif;fill:#334155}.m{font:19px ui-monospace,monospace;fill:#1d4ed8}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.box{fill:#17283b;stroke:#647b91}.hi{fill:#173f3c;stroke:#46d6c6}.line{stroke:#66a3ff}.h{fill:#edf4fb}.t{fill:#b8c5d1}.m{fill:#a9cbff}}</style></defs><rect class="bg" x="12" y="12" width="876" height="406" rx="24"/><text class="h" x="45" y="58">时间片轮转 RR：时间片 q=2</text><text class="t" x="45" y="98">P1需5，P2需3，P3需2；就绪队列按P1、P2、P3排列</text><g class="hi"><rect x="55" y="145" width="150" height="75"/><rect x="505" y="145" width="150" height="75"/><rect x="730" y="145" width="75" height="75"/></g><g class="box"><rect x="205" y="145" width="150" height="75"/><rect x="355" y="145" width="150" height="75"/><rect x="655" y="145" width="75" height="75"/></g><g class="m" text-anchor="middle"><text x="130" y="190">P1</text><text x="280" y="190">P2</text><text x="430" y="190">P3</text><text x="580" y="190">P1</text><text x="692" y="190">P2</text><text x="767" y="190">P1</text></g><g class="m"><text x="50" y="250">0</text><text x="197" y="250">2</text><text x="347" y="250">4</text><text x="497" y="250">6</text><text x="647" y="250">8</text><text x="722" y="250">9</text><text x="797" y="250">10</text></g><text class="t" x="55" y="315">每次最多运行2个时间单位，未完成进程回到队尾。</text><text class="t" x="55" y="355">时间片过大接近FCFS；过小会增加切换开销。</text></svg>