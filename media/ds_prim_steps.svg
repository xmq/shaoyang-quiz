<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 365" role="img" aria-labelledby="title desc" width="400" height="365"><title id="title">Prim：在整个已连通集合外找</title><desc id="desc">Prim：在整个已连通集合外找；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><text x="22" y="33" class="title" text-anchor="start">Prim：在整个已连通集合外找</text><text x="22" y="70" class="" text-anchor="start">沿本章五点带权图，从 A 开始</text><text x="22" y="118" class="" text-anchor="start">S={A}</text><rect x="172" y="92" width="200" height="35" rx="7" class="hi"/><text x="272.0" y="115.5" class="mono" text-anchor="middle">选 AB=2</text><text x="22" y="165" class="" text-anchor="start">S={A,B}</text><rect x="172" y="139" width="200" height="35" rx="7" class="hi"/><text x="272.0" y="162.5" class="mono" text-anchor="middle">选 BC=1</text><text x="22" y="212" class="" text-anchor="start">S={A,B,C}</text><rect x="172" y="186" width="200" height="35" rx="7" class="hi"/><text x="272.0" y="209.5" class="mono" text-anchor="middle">选 CD=2</text><text x="22" y="259" class="" text-anchor="start">S={A,B,C,D}</text><rect x="172" y="233" width="200" height="35" rx="7" class="hi"/><text x="272.0" y="256.5" class="mono" text-anchor="middle">选 DE=3</text><text x="22" y="320" class="" text-anchor="start">总费用2+1+2+3=8，边数5−1=4。</text><text x="22" y="347" class="" text-anchor="start">BC两端都入S后，就不再是候选跨界边。</text></svg>