<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 385" role="img" aria-labelledby="title desc" width="400" height="385"><title id="title">KMP：保留相同的前后缀</title><desc id="desc">KMP：保留相同的前后缀；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><text x="22" y="33" class="title" text-anchor="start">KMP：保留相同的前后缀</text><text x="22" y="70" class="" text-anchor="start">模式 P=ABABC；下标统一从0开始</text><rect x="24" y="95" width="67" height="39" rx="7" class="box"/><text x="57.5" y="120.5" class="mono" text-anchor="middle">A</text><rect x="94" y="95" width="67" height="39" rx="7" class="box"/><text x="127.5" y="120.5" class="mono" text-anchor="middle">B</text><rect x="164" y="95" width="67" height="39" rx="7" class="box"/><text x="197.5" y="120.5" class="mono" text-anchor="middle">A</text><rect x="234" y="95" width="67" height="39" rx="7" class="box"/><text x="267.5" y="120.5" class="mono" text-anchor="middle">B</text><rect x="304" y="95" width="67" height="39" rx="7" class="box"/><text x="337.5" y="120.5" class="mono" text-anchor="middle">C</text><rect x="24" y="140" width="67" height="39" rx="7" class="box"/><text x="57.5" y="165.5" class="mono" text-anchor="middle">0</text><rect x="94" y="140" width="67" height="39" rx="7" class="box"/><text x="127.5" y="165.5" class="mono" text-anchor="middle">0</text><rect x="164" y="140" width="67" height="39" rx="7" class="box"/><text x="197.5" y="165.5" class="mono" text-anchor="middle">1</text><rect x="234" y="140" width="67" height="39" rx="7" class="box"/><text x="267.5" y="165.5" class="mono" text-anchor="middle">2</text><rect x="304" y="140" width="67" height="39" rx="7" class="box"/><text x="337.5" y="165.5" class="mono" text-anchor="middle">0</text><text x="22" y="210" class="" text-anchor="start">下排 pi[i]：到 i 为止的最长相等</text><text x="22" y="237" class="" text-anchor="start">真前缀与真后缀长度，不含整个串。</text><text x="22" y="286" class="mono" text-anchor="start">ABAB = [AB] + [AB]</text><text x="22" y="325" class="" text-anchor="start">已匹配 ABAB 后失配：j=4 → pi[3]=2</text><text x="22" y="352" class="" text-anchor="start">保留末尾 AB，当前文本字符再比较。</text></svg>