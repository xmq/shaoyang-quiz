<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">KMP模式串ABABC的前缀函数</title><desc id="desc">模式串ABABC各位置的最长相等真前后缀长度为0、0、1、2、0，失配时按已有前后缀回退。</desc>
  <defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.cell{fill:#fff;stroke:#64748b;stroke-width:2}.hit{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.arrow{stroke:#d97706;stroke-width:4;fill:none;marker-end:url(#a)}.h{font:700 25px system-ui,sans-serif;fill:#102a43}.t{font:20px system-ui,sans-serif;fill:#334155}.m{font:22px ui-monospace,monospace;fill:#1d4ed8}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.cell{fill:#17283b;stroke:#647b91}.hit{fill:#173f3c;stroke:#46d6c6}.h{fill:#edf4fb}.t{fill:#b8c5d1}.m{fill:#a9cbff}}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#d97706"/></marker></defs>
  <rect class="bg" x="12" y="12" width="936" height="496" rx="26"/><text class="h" x="48" y="62">KMP先记住模式串自己的重复结构</text>
  <text class="t" x="50" y="132">位置</text><text class="t" x="50" y="207">字符</text><text class="t" x="50" y="282">最长长度</text>
  <g class="cell"><rect x="160" y="90" width="125" height="70"/><rect x="285" y="90" width="125" height="70"/><rect x="410" y="90" width="125" height="70"/><rect x="535" y="90" width="125" height="70"/><rect x="660" y="90" width="125" height="70"/></g>
  <g class="hit"><rect x="160" y="165" width="125" height="70"/><rect x="285" y="165" width="125" height="70"/><rect x="410" y="165" width="125" height="70"/><rect x="535" y="165" width="125" height="70"/><rect x="660" y="165" width="125" height="70"/></g>
  <g class="cell"><rect x="160" y="240" width="125" height="70"/><rect x="285" y="240" width="125" height="70"/><rect x="410" y="240" width="125" height="70"/><rect x="535" y="240" width="125" height="70"/><rect x="660" y="240" width="125" height="70"/></g>
  <g class="m" text-anchor="middle"><text x="222" y="134">1</text><text x="347" y="134">2</text><text x="472" y="134">3</text><text x="597" y="134">4</text><text x="722" y="134">5</text><text x="222" y="210">A</text><text x="347" y="210">B</text><text x="472" y="210">A</text><text x="597" y="210">B</text><text x="722" y="210">C</text><text x="222" y="285">0</text><text x="347" y="285">0</text><text x="472" y="285">1</text><text x="597" y="285">2</text><text x="722" y="285">0</text></g>
  <path class="arrow" d="M610 355C590 420 325 420 300 355"/><text class="t" x="330" y="390">ABAB失配时，可退回长度2的前后缀AB继续比较</text><text class="t" x="90" y="468">约定可能写成next或前缀函数；先看教材的下标和初值定义。</text>
</svg>
