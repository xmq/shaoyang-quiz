<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 463" role="img" aria-labelledby="title desc" width="390" height="463"><title id="title">同一个28，为什么含义不同？</title><desc id="desc">同一个28，为什么含义不同？</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><text class="h" x="20" y="33">同一个28，为什么含义不同？</text><rect class="box" x="18" y="56" width="354" height="68" rx="10"/><text class="h" x="32" y="84">只有数据：28</text><text class="t" x="32" y="112">不知道单位、时间、测量对象</text><path class="line" d="M195 127L195 148"/><rect class="box" x="18" y="153" width="354" height="94" rx="10"/><text class="h" x="32" y="181">加上语境，成为信息</text><text class="t" x="32" y="209">10:00，教室A，室温28℃</text><text class="t" x="32" y="235">现在可以比较温度是否超标</text><path class="line" d="M195 250L195 271"/><rect class="hot" x="18" y="276" width="354" height="94" rx="10"/><text class="h" x="32" y="304">用规则作决策</text><text class="t" x="32" y="332">规定：室温超过26℃才开风扇</text><text class="t" x="32" y="358">28＞26，因此发出开机指令</text><text class="s" x="20" y="399">试一试：28若是“人数”，还能比较吗？</text><text class="s" x="20" y="425">单位和测量对象不同，不能直接比较。</text></svg>
