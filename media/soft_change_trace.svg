<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 489" role="img" aria-labelledby="title desc" width="390" height="489"><title id="title">请假超过3天改为超过2天</title><desc id="desc">请假超过3天改为超过2天</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><rect class="bg" width="390" height="489" rx="14"/><text class="h" x="20" y="33">请假超过3天改为超过2天</text><rect class="box" x="18" y="56" width="354" height="94" rx="10"/><text class="h" x="32" y="84">需求R1变更：先分析影响</text><text class="t" x="32" y="112">影响审批规则、页面提示和测试</text><text class="t" x="32" y="138">评审通过后，形成受控修改任务</text><path class="line" d="M195 153L195 174"/><rect class="box" x="18" y="179" width="354" height="94" rx="10"/><text class="h" x="32" y="207">沿追踪链修改</text><text class="t" x="32" y="235">R1规则 → 设计D1 → 实现C1</text><text class="t" x="32" y="261">更新测试T1：2天、3天的边界</text><path class="line" d="M195 276L195 297"/><rect class="hot" x="18" y="302" width="354" height="94" rx="10"/><text class="h" x="32" y="330">验证、发布并更新基线</text><text class="t" x="32" y="358">测试新规则，并回归旧功能</text><text class="t" x="32" y="384">记录版本、审批与回退办法</text><text class="s" x="20" y="425">只改代码不改测试，会留下旧判断。</text><text class="s" x="20" y="451">版本控制留历史，不能代替变更审批。</text></svg>
