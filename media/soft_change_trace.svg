<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
  <title id="title">需求追踪与受控变更</title><desc id="desc">业务目标追踪到需求、设计、代码、测试和发布，变更按分析审批实施验证更新推进。</desc>
  <defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.box{fill:#fff;stroke:#2563eb;stroke-width:3}.hot{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.line{stroke:#526777;stroke-width:4;fill:none}.h{font:700 27px system-ui;fill:#102a43}.t{font:19px system-ui;fill:#102a43}.s{font:18px system-ui;fill:#526777}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.box{fill:#17283b;stroke:#78b7ff}.hot{fill:#173f3c;stroke:#46d6c6}.line{stroke:#9fb0c0}.h,.t{fill:#edf4fb}.s{fill:#b8c5d1}}</style></defs>
  <rect class="bg" x="10" y="10" width="700" height="410" rx="24"/><text class="h" x="35" y="55">追踪链说明“为什么改、改了什么、怎样验证”</text>
  <g class="t" text-anchor="middle"><rect class="box" x="30" y="105" width="95" height="58" rx="10"/><text x="78" y="140">目标</text><rect class="box" x="143" y="105" width="95" height="58" rx="10"/><text x="190" y="140">需求</text><rect class="box" x="256" y="105" width="95" height="58" rx="10"/><text x="304" y="140">设计</text><rect class="box" x="369" y="105" width="95" height="58" rx="10"/><text x="416" y="140">代码</text><rect class="box" x="482" y="105" width="95" height="58" rx="10"/><text x="530" y="140">测试</text><rect class="hot" x="595" y="105" width="95" height="58" rx="10"/><text x="642" y="140">发布</text></g>
  <path class="line" d="M125 134H143M238 134H256M351 134H369M464 134H482M577 134H595"/>
  <text class="t" x="35" y="230">变更申请 → 影响分析 → 审批 → 实施 → 验证 → 更新基线</text>
  <rect class="hot" x="35" y="280" width="650" height="70" rx="14"/><text class="t" x="360" y="312" text-anchor="middle">紧急修复仍保留：授权 · 受控版本 · 测试 · 回退 · 发布验证</text><text class="s" x="360" y="338" text-anchor="middle">版本控制记录历史，但不能代替完整配置管理和环境备份</text>
</svg>
