<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430"><defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.b{fill:#fff;stroke:#64748b;stroke-width:2}.h{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.a{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#m)}.tt{font:700 24px system-ui;fill:#102a43}.t{font:18px system-ui;fill:#334155}.s{font:15px system-ui;fill:#475569}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.b{fill:#17283b;stroke:#647b91}.h{fill:#173f3c;stroke:#46d6c6}.tt{fill:#edf4fb}.t{fill:#d2dce6}.s{fill:#b8c5d1}}</style><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#2563eb"/></marker></defs><rect class="bg" x="12" y="12" width="876" height="406" rx="24"/><text class="tt" x="45" y="58">存储程序计算机的数据流</text><rect class="b" x="45" y="145" width="150" height="80" rx="14"/><text class="t" x="120.0" y="179" text-anchor="middle">输入</text><text class="s" x="120.0" y="205" text-anchor="middle">键盘 / 传感器</text><path class="a" d="M195 185H270"/><rect class="h" x="278" y="115" width="340" height="140" rx="14"/><text class="t" x="448.0" y="149" text-anchor="middle">CPU + 主存</text><text class="s" x="448.0" y="175" text-anchor="middle">取指 · 运算 · 控制</text><path class="a" d="M618 185H695"/><rect class="b" x="703" y="145" width="150" height="80" rx="14"/><text class="t" x="778.0" y="179" text-anchor="middle">输出</text><text class="s" x="778.0" y="205" text-anchor="middle">屏幕 / 执行器</text><text class="t" x="448" y="285" text-anchor="middle">指令和数据先进入存储器，CPU按地址取出并处理</text><text class="s" x="448" y="330" text-anchor="middle">外存长期保存　→　主存提供运行数据　→　Cache / 寄存器加速访问</text></svg>