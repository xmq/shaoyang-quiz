<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 463" role="img" aria-labelledby="title desc" width="390" height="463"><title id="title">算出2＋3：数据经过哪里？</title><desc id="desc">算出2＋3：数据经过哪里？</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><rect class="bg" width="390" height="463" rx="14"/><text class="h" x="20" y="33">算出2＋3：数据经过哪里？</text><rect class="box" x="18" y="56" width="354" height="68" rx="10"/><text class="h" x="32" y="84">① 输入：键盘输入2和3</text><text class="t" x="32" y="112">程序和数据先装入主存</text><path class="line" d="M195 127L195 148"/><rect class="box" x="18" y="153" width="354" height="94" rx="10"/><text class="h" x="32" y="181">② CPU：从主存取指、译码</text><text class="t" x="32" y="209">按指令取操作数2和3</text><text class="t" x="32" y="235">运算器执行加法，得到5</text><path class="line" d="M195 250L195 271"/><rect class="hot" x="18" y="276" width="354" height="94" rx="10"/><text class="h" x="32" y="304">③ 写回与输出</text><text class="t" x="32" y="332">结果5先写入寄存器/主存</text><text class="t" x="32" y="358">显示器把结果显示给用户</text><text class="s" x="20" y="399">程序从外存装入主存，才供CPU执行。</text><text class="s" x="20" y="425">断电通常丢失主存数据，外存可保存。</text></svg>
