<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 463" role="img" aria-labelledby="title desc" width="390" height="463"><title id="title">发一份文件：每种机制解决什么？</title><desc id="desc">发一份文件：每种机制解决什么？</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><rect class="bg" width="390" height="463" rx="14"/><text class="h" x="20" y="33">发一份文件：每种机制解决什么？</text><rect class="box" x="18" y="56" width="354" height="68" rx="10"/><text class="h" x="32" y="84">怕被偷看 → 加密</text><text class="t" x="32" y="112">接收者用相应密钥恢复明文</text><path class="line" d="M195 127L195 148"/><rect class="box" x="18" y="153" width="354" height="94" rx="10"/><text class="h" x="32" y="181">判断文件是否变化 → 比较哈希</text><text class="t" x="32" y="209">需从可信渠道取得原摘要</text><text class="t" x="32" y="235">文件和摘要一起被换，就不能证明</text><path class="line" d="M195 250L195 271"/><rect class="hot" x="18" y="276" width="354" height="94" rx="10"/><text class="h" x="32" y="304">验证来源 → MAC或数字签名</text><text class="t" x="32" y="332">MAC：双方共享秘密，双方都能生成</text><text class="t" x="32" y="358">签名：发送者私钥生成，公钥验证</text><text class="s" x="20" y="399">证书把公钥与身份绑定，需要验证。</text><text class="s" x="20" y="425">签名不自动隐藏文件；哈希不能解密。</text></svg>
