<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.b{fill:#fff;stroke:#2563eb;stroke-width:3}.h{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.l{stroke:#526777;stroke-width:4}.tt{font:700 27px system-ui;fill:#102a43}.t{font:21px system-ui;fill:#102a43}.s{font:18px system-ui;fill:#526777}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.b{fill:#17283b;stroke:#78b7ff}.h{fill:#173f3c;stroke:#46d6c6}.l{stroke:#9fb0c0}.tt,.t{fill:#edf4fb}.s{fill:#b8c5d1}}</style></defs><rect class="bg" x="10" y="10" width="700" height="380" rx="24"/><text class="tt" x="35" y="55">样式同时管理外观和文档结构</text><rect class="h" x="50" y="105" width="170" height="70" rx="12"/><text class="t" x="135" y="148" text-anchor="middle">标题1样式</text><path class="l" d="M220 140H310"/><rect class="b" x="310" y="90" width="350" height="100" rx="12"/><text class="t" x="335" y="130">第1章　项目报告</text><text class="s" x="335" y="165">字体 + 段距 + 大纲级别</text><rect class="h" x="50" y="245" width="170" height="70" rx="12"/><text class="t" x="135" y="288" text-anchor="middle">修改样式</text><path class="l" d="M220 280H310"/><rect class="b" x="310" y="230" width="350" height="100" rx="12"/><text class="t" x="335" y="270">所有标题统一更新</text><text class="s" x="335" y="305">导航与自动目录仍保持层次</text><text class="s" x="50" y="365">手工加粗只改当前外观，不能稳定表达标题层次</text></svg>
