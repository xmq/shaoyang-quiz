<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500"><defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.b{fill:#fff;stroke:#64748b;stroke-width:2}.h{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.l{stroke:#2563eb;stroke-width:4;fill:none}.tt{font:700 25px system-ui;fill:#102a43}.t{font:19px system-ui;fill:#334155}.m{font:18px ui-monospace;fill:#1d4ed8}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.b{fill:#17283b;stroke:#647b91}.h{fill:#173f3c;stroke:#46d6c6}.tt{fill:#edf4fb}.t{fill:#b8c5d1}.m{fill:#a9cbff}}</style></defs><rect class="bg" x="12" y="12" width="876" height="476" rx="24"/><text class="tt" x="45" y="58">按“谁决定谁”拆分关系</text><rect class="b" x="55" y="105" width="790" height="75" rx="12"/><text class="m" x="450" y="150" text-anchor="middle">选课(学号, 课程号, 姓名, 成绩)</text><path class="l" d="M450 180V235M450 235H245V275M450 235H655V275"/><rect class="h" x="90" y="275" width="310" height="85" rx="14"/><rect class="h" x="500" y="275" width="310" height="85" rx="14"/><text class="m" x="245" y="325" text-anchor="middle">学生(学号, 姓名)</text><text class="m" x="655" y="325" text-anchor="middle">选课(学号,课程号,成绩)</text><text class="t" x="55" y="420">学号→姓名是对复合键一部分的依赖；拆分减少重复和更新异常。</text><text class="t" x="55" y="458">还要检查无损连接与依赖保持，不能机械地“一列一张表”。</text></svg>