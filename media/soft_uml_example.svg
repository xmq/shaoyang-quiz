<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 604" role="img" aria-labelledby="title desc" width="390" height="604"><title id="title">同一笔订单，类图与顺序图各看什么</title><desc id="desc">同一笔订单，类图与顺序图各看什么</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><rect class="bg" width="390" height="604" rx="14"/><text class="h" x="20" y="33">同一笔订单，类图与顺序图各看什么</text><text class="h" x="22" y="68">类：描述对象有哪些数据和操作</text><rect class="box" x="45" y="87" width="300" height="146" rx="10"/><path class="thin" d="M45 126L345 126"/><path class="thin" d="M45 178L345 178"/><text class="h" x="195" y="114" text-anchor="middle">订单 Order</text><text class="t" x="63" y="159">− amount : Decimal</text><text class="t" x="63" y="211">+ pay() : void</text><text class="h" x="22" y="275">顺序图：描述一次付款的消息先后</text><text class="t" x="55" y="313" text-anchor="middle">用户</text><path class="thin" stroke-dasharray="5 4" d="M55 325V510"/><text class="t" x="195" y="313" text-anchor="middle">订单</text><path class="thin" stroke-dasharray="5 4" d="M195 325V510"/><text class="t" x="335" y="313" text-anchor="middle">支付</text><path class="thin" stroke-dasharray="5 4" d="M335 325V510"/><path class="line" d="M55 358L195 358"/><text class="s" x="87" y="347">pay()</text><path class="line" d="M195 414L335 414"/><text class="s" x="207" y="401">扣款</text><path class="line" d="M335 464L195 464"/><text class="s" x="216" y="452">结果</text><text class="s" x="22" y="549">− 表示私有；＋表示公有。</text><text class="s" x="22" y="577">类图看静态结构；顺序图看交互过程。</text></svg>
