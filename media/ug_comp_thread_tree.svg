<svg xmlns="http://www.w3.org/2000/svg" width="380" height="380" viewBox="0 0 380 380" role="img" aria-label="三结点中序线索树和左右tag"><title>三结点中序线索树和左右tag</title><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:16px;fill:#183a4b} .n{fill:#eef8f6;stroke:#087f75;stroke-width:1.6} .edge{fill:none;stroke:#54778a;stroke-width:1.6} .thread{fill:none;stroke:#087f75;stroke-width:2;stroke-dasharray:5 3} .small{font-size:14px} .title{font-size:18px;font-weight:bold} @media(prefers-color-scheme:dark){text{fill:#e5eff5} .n{fill:#193b3b;stroke:#79d0c3} .edge{stroke:#b0c7d5} .thread{stroke:#79d0c3}}</style><text class="title" x="12" y="25">中序A → B → C：实线是孩子</text><path class="edge" d="M190 93 L80 158 M190 93 L300 158"/><rect class="n" x="160" y="61" width="60" height="32" rx="4"/><text x="190.0" y="83" text-anchor="middle">B</text><rect class="n" x="50" y="158" width="60" height="32" rx="4"/><text x="80.0" y="180" text-anchor="middle">A</text><rect class="n" x="270" y="158" width="60" height="32" rx="4"/><text x="300.0" y="180" text-anchor="middle">C</text><path class="thread" d="M110 174 Q210 210 185 99 M270 174 Q215 160 205 99"/><text class="small" x="95" y="222">虚线：A右指B、C左指B</text><text x="16" y="262">A：左空/右B，tag=(1,1)</text><text x="16" y="293">B：左A/右C，tag=(0,0)</text><text x="16" y="324">C：左B/右空，tag=(1,1)</text><text class="small" x="16" y="357">tag0走孩子，tag1走前驱或后继线索。</text></svg>