<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360"><style>.bg{fill:#f8fafc;stroke:#cbd5e1}.b{fill:#fff;stroke:#64748b;stroke-width:2}.a{stroke:#176f68;stroke-width:4;fill:none}.h{font:700 26px system-ui;fill:#102a43}.t{font:19px system-ui;fill:#334155}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.b{fill:#17283b;stroke:#647b91}.a{stroke:#46d6c6}.h{fill:#edf4fb}.t{fill:#b8c5d1}}</style><rect class="bg" x="10" y="10" width="700" height="340" rx="22"/><text class="h" x="35" y="50">风险管理不是一次表格，而是持续循环</text><g class="b"><rect x="55" y="115" width="130" height="70" rx="12"/><rect x="225" y="115" width="130" height="70" rx="12"/><rect x="395" y="115" width="130" height="70" rx="12"/><rect x="565" y="115" width="100" height="70" rx="12"/></g><g class="t" text-anchor="middle"><text x="120" y="157">识别与评估</text><text x="290" y="157">选择处置</text><text x="460" y="157">实施控制</text><text x="615" y="157">验证</text></g><path class="a" d="M185 150H225M355 150H395M525 150H565M615 185V270H120V185"/><text class="t" x="360" y="305" text-anchor="middle">监测剩余风险；业务、系统或威胁变化后重新评估</text></svg>
