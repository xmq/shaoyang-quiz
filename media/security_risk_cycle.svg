<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 489" role="img" aria-labelledby="title desc" width="390" height="489"><title id="title">旧服务器有漏洞：怎样降低风险？</title><desc id="desc">旧服务器有漏洞：怎样降低风险？</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><rect class="bg" width="390" height="489" rx="14"/><text class="h" x="20" y="33">旧服务器有漏洞：怎样降低风险？</text><rect class="box" x="18" y="56" width="354" height="94" rx="10"/><text class="h" x="32" y="84">识别：成绩库暴露在互联网</text><text class="t" x="32" y="112">威胁：外部攻击；弱点：未补漏洞</text><text class="t" x="32" y="138">后果：泄露或篡改成绩</text><path class="line" d="M195 153L195 174"/><rect class="box" x="18" y="179" width="354" height="94" rx="10"/><text class="h" x="32" y="207">处置：补丁＋限制入口</text><text class="t" x="32" y="235">先评估和备份，在测试环境验证</text><text class="t" x="32" y="261">实施后保留必要业务访问</text><path class="line" d="M195 276L195 297"/><rect class="hot" x="18" y="302" width="354" height="94" rx="10"/><text class="h" x="32" y="330">验证与复查</text><text class="t" x="32" y="358">扫描确认漏洞已修复，测试业务</text><text class="t" x="32" y="384">复查日志、剩余风险和新漏洞</text><text class="s" x="20" y="425">安装补丁≠验证成功，也不等于零风险。</text><text class="s" x="20" y="451">风险同时取决于可能性和影响。</text></svg>
