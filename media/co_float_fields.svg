<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 455" role="img" aria-labelledby="title" width="400" height="455"><title id="title">单精度：把6.5编码成三个字段</title><defs><style>text{font:18px "Microsoft YaHei",system-ui,sans-serif;fill:#183047}.title{font-size:20px;font-weight:700}.bold{font-weight:700}.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#7b8fa2;stroke-width:1.5}.hi{fill:#d9f3ed;stroke:#19806e;stroke-width:1.5}.blue{fill:#e0edff;stroke:#4c79bf;stroke-width:1.5}.warn{fill:#fff0d3;stroke:#c28a25;stroke-width:1.5}.line{stroke:#37768a;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#e6eef6}.bg{fill:#142234;stroke:#405469}.box{fill:#1a2e43;stroke:#859bad}.hi{fill:#16483f;stroke:#69d7bc}.blue{fill:#193e68;stroke:#92b9fb}.warn{fill:#4b3a1e;stroke:#e4b15a}.line{stroke:#82c5d4}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47879b"/></marker></defs><text x="18" y="32" class="title">单精度：把6.5编码成三个字段</text><text x="18" y="68" class="">6.5₁₀ = 110.1₂ = 1.101₂ × 2²</text><rect class="hi" x="18" y="88" width="182" height="35" rx="7"/><text x="109.0" y="111.5" class="" text-anchor="middle">字段</text><rect class="hi" x="200" y="88" width="182" height="35" rx="7"/><text x="291.0" y="111.5" class="" text-anchor="middle">存入内容</text><rect class="box" x="18" y="123" width="182" height="35" rx="7"/><text x="109.0" y="146.5" class="" text-anchor="middle">符号S（1位）</text><rect class="box" x="200" y="123" width="182" height="35" rx="7"/><text x="291.0" y="146.5" class="" text-anchor="middle">0：正数</text><rect class="box" x="18" y="158" width="182" height="35" rx="7"/><text x="109.0" y="181.5" class="" text-anchor="middle">阶码E（8位）</text><rect class="box" x="200" y="158" width="182" height="35" rx="7"/><text x="291.0" y="181.5" class="" text-anchor="middle">2+127=129</text><rect class="box" x="18" y="193" width="182" height="35" rx="7"/><text x="109.0" y="216.5" class="" text-anchor="middle">小数M（23位）</text><rect class="box" x="200" y="193" width="182" height="35" rx="7"/><text x="291.0" y="216.5" class="" text-anchor="middle">101后补20个0</text><rect class="blue" x="18" y="253" width="364" height="44" rx="7"/><text x="200.0" y="281.0" class="" text-anchor="middle">0｜10000001｜101000…000</text><text x="18" y="336" class="">正常数隐藏开头的1，不存进M。</text><text x="18" y="372" class="">还原：(+1)×1.101₂×2² = 6.5。</text><text x="18" y="412" class="">E全0或全1时，使用特殊编码规则。</text></svg>