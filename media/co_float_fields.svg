<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">IEEE 754单精度字段</title><desc id="desc">32位分为1位符号、8位阶码和23位小数，正常数使用偏置127和隐藏位1。</desc>
  <defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.sign{fill:#fee2e2;stroke:#dc2626}.exp{fill:#dbeafe;stroke:#2563eb}.frac{fill:#d1fae5;stroke:#059669}.box{stroke-width:3}.title{font:700 28px system-ui;fill:#102a43}.head{font:700 22px system-ui;fill:#102a43}.text{font:19px system-ui;fill:#334155}.code{font:20px ui-monospace;fill:#102a43}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.sign{fill:#4b2025;stroke:#ff8b8b}.exp{fill:#17304a;stroke:#78b7ff}.frac{fill:#173f3c;stroke:#46d6c6}.title,.head,.code{fill:#edf4fb}.text{fill:#b8c5d1}}</style></defs>
  <rect class="bg" x="10" y="10" width="700" height="340" rx="24"/><text class="title" x="32" y="52">单精度：先分字段，再恢复数值</text>
  <rect class="sign box" x="45" y="95" width="80" height="78" rx="10"/><rect class="exp box" x="135" y="95" width="190" height="78" rx="10"/><rect class="frac box" x="335" y="95" width="340" height="78" rx="10"/>
  <text class="head" x="85" y="128" text-anchor="middle">S</text><text class="text" x="85" y="158" text-anchor="middle">1位</text><text class="head" x="230" y="128" text-anchor="middle">E</text><text class="text" x="230" y="158" text-anchor="middle">8位，偏置127</text><text class="head" x="505" y="128" text-anchor="middle">M</text><text class="text" x="505" y="158" text-anchor="middle">23位，正常数隐藏1</text>
  <text class="code" x="45" y="225">正常数：(−1)^S × 1.M × 2^(E−127)</text><text class="text" x="45" y="270">E全0：零或非规格化数　　E全1：无穷或NaN</text><text class="text" x="45" y="315">范围主要看阶码，精度主要看尾数；对阶可能丢低位。</text>
</svg>
