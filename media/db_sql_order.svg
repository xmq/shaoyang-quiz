<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500"><defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.b{fill:#fff;stroke:#64748b;stroke-width:2}.h{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.l{stroke:#2563eb;stroke-width:4;fill:none}.tt{font:700 25px system-ui;fill:#102a43}.t{font:19px system-ui;fill:#334155}.m{font:18px ui-monospace;fill:#1d4ed8}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.b{fill:#17283b;stroke:#647b91}.h{fill:#173f3c;stroke:#46d6c6}.tt{fill:#edf4fb}.t{fill:#b8c5d1}.m{fill:#a9cbff}}</style></defs><rect class="bg" x="12" y="12" width="876" height="476" rx="24"/><text class="tt" x="45" y="58">SQL逻辑处理顺序</text><rect class="b" x="45" y="125" width="115" height="70" rx="12"/><text class="m" x="102" y="168" text-anchor="middle">FROM</text><rect class="h" x="180" y="125" width="115" height="70" rx="12"/><text class="m" x="237" y="168" text-anchor="middle">WHERE</text><rect class="b" x="315" y="125" width="115" height="70" rx="12"/><text class="m" x="372" y="168" text-anchor="middle">GROUP BY</text><rect class="h" x="450" y="125" width="115" height="70" rx="12"/><text class="m" x="507" y="168" text-anchor="middle">HAVING</text><rect class="b" x="585" y="125" width="115" height="70" rx="12"/><text class="m" x="642" y="168" text-anchor="middle">SELECT</text><rect class="b" x="720" y="125" width="115" height="70" rx="12"/><text class="m" x="777" y="168" text-anchor="middle">ORDER BY</text><path class="l" d="M75 230H825"/><text class="t" x="45" y="290">WHERE筛明细行；HAVING筛分组；SELECT形成输出列；ORDER BY最后排序。</text><text class="t" x="45" y="345">LEFT JOIN后把右表条件放WHERE，可能删掉补NULL的不匹配行。</text><text class="t" x="45" y="400">没有ORDER BY时，不能依赖结果返回顺序。</text></svg>