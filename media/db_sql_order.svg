<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560" role="img" aria-labelledby="title"><title id="title">分组：行先筛，再把同类装一组</title><defs><style>text{font:18px "Microsoft YaHei",system-ui,sans-serif;fill:#183047}.title{font-size:20px;font-weight:700}.bold{font-weight:700}.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#7b8fa2;stroke-width:1.5}.hi{fill:#d9f3ed;stroke:#19806e;stroke-width:1.5}.blue{fill:#e0edff;stroke:#4c79bf;stroke-width:1.5}.warn{fill:#fff0d3;stroke:#c28a25;stroke-width:1.5}.line{stroke:#37768a;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#e6eef6}.bg{fill:#142234;stroke:#405469}.box{fill:#1a2e43;stroke:#859bad}.hi{fill:#16483f;stroke:#69d7bc}.blue{fill:#193e68;stroke:#92b9fb}.warn{fill:#4b3a1e;stroke:#e4b15a}.line{stroke:#82c5d4}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47879b"/></marker></defs><rect class="bg" x="1" y="1" width="398" height="558" rx="14"/><text x="18" y="32" class="title">分组：行先筛，再把同类装一组</text><rect class="hi" x="18" y="62" width="80" height="35" rx="7"/><text x="58.0" y="85.5" class="" text-anchor="middle">id</text><rect class="hi" x="98" y="62" width="120" height="35" rx="7"/><text x="158.0" y="85.5" class="" text-anchor="middle">age</text><rect class="hi" x="218" y="62" width="164" height="35" rx="7"/><text x="300.0" y="85.5" class="" text-anchor="middle">dept_id</text><rect class="box" x="18" y="97" width="80" height="35" rx="7"/><text x="58.0" y="120.5" class="" text-anchor="middle">1</text><rect class="box" x="98" y="97" width="120" height="35" rx="7"/><text x="158.0" y="120.5" class="" text-anchor="middle">18</text><rect class="box" x="218" y="97" width="164" height="35" rx="7"/><text x="300.0" y="120.5" class="" text-anchor="middle">10</text><rect class="box" x="18" y="132" width="80" height="35" rx="7"/><text x="58.0" y="155.5" class="" text-anchor="middle">2</text><rect class="box" x="98" y="132" width="120" height="35" rx="7"/><text x="158.0" y="155.5" class="" text-anchor="middle">17</text><rect class="box" x="218" y="132" width="164" height="35" rx="7"/><text x="300.0" y="155.5" class="" text-anchor="middle">10</text><rect class="box" x="18" y="167" width="80" height="35" rx="7"/><text x="58.0" y="190.5" class="" text-anchor="middle">3</text><rect class="box" x="98" y="167" width="120" height="35" rx="7"/><text x="158.0" y="190.5" class="" text-anchor="middle">20</text><rect class="box" x="218" y="167" width="164" height="35" rx="7"/><text x="300.0" y="190.5" class="" text-anchor="middle">10</text><rect class="box" x="18" y="202" width="80" height="35" rx="7"/><text x="58.0" y="225.5" class="" text-anchor="middle">4</text><rect class="box" x="98" y="202" width="120" height="35" rx="7"/><text x="158.0" y="225.5" class="" text-anchor="middle">19</text><rect class="box" x="218" y="202" width="164" height="35" rx="7"/><text x="300.0" y="225.5" class="" text-anchor="middle">20</text><text x="18" y="265" class="">WHERE age≥18：筛掉id2，不改原表</text><path class="line" d="M200 277L200 300" marker-end="url(#a)"/><rect class="hi" x="18" y="315" width="210" height="35" rx="7"/><text x="123.0" y="338.5" class="" text-anchor="middle">分组后</text><rect class="hi" x="228" y="315" width="154" height="35" rx="7"/><text x="305.0" y="338.5" class="" text-anchor="middle">COUNT(*)</text><rect class="box" x="18" y="350" width="210" height="35" rx="7"/><text x="123.0" y="373.5" class="" text-anchor="middle">dept_id=10</text><rect class="box" x="228" y="350" width="154" height="35" rx="7"/><text x="305.0" y="373.5" class="" text-anchor="middle">2</text><rect class="box" x="18" y="385" width="210" height="35" rx="7"/><text x="123.0" y="408.5" class="" text-anchor="middle">dept_id=20</text><rect class="box" x="228" y="385" width="154" height="35" rx="7"/><text x="305.0" y="408.5" class="" text-anchor="middle">1</text><text x="18" y="458" class="">HAVING COUNT(*)&gt;=2：仅留10组。</text><rect class="hi" x="18" y="478" width="364" height="43" rx="7"/><text x="200.0" y="505.5" class="" text-anchor="middle">最终输出：dept_id=10，人数=2</text></svg>