<svg xmlns="http://www.w3.org/2000/svg" width="360" height="306" viewBox="0 0 360 306" role="img" aria-labelledby="title desc"><title id="title">传输延时与首个负载反射</title><desc id="desc">三伏入射波沿50欧姆线路到100欧姆负载，反射系数三分之一，反射波一伏反向传播，首到负载为四伏。</desc><style>svg{color:#24343b;font:14px system-ui,'Microsoft YaHei',sans-serif}text{fill:currentColor}.wire,.curve{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.part{fill:none;stroke:currentColor;stroke-width:1.8}.accent{fill:none;stroke:#14766d;stroke-width:2.5}.blue{fill:none;stroke:#426b92;stroke-width:2.2}.muted{fill:#67777e}.guide{fill:none;stroke:#93a4aa;stroke-width:1.2;stroke-dasharray:4 4}.node{fill:currentColor}@media(prefers-color-scheme:dark){svg{color:#e7eef0}.accent{stroke:#74cabe}.blue{stroke:#9fbfdb}.muted{fill:#a0b2bb}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<text x="12" y="24" font-size="17" font-weight="650">只看第一个负载反射事件</text>
<path class="wire" d="M27 111H310V145M310 188V228H27"/><rect class="part" x="300" y="145" width="20" height="43"/>
<text x="32" y="90">源端</text><text x="271" y="137">RL=100 Ω</text><text x="94" y="215">Z0=50 Ω；单程100 ns</text>
<path class="accent" d="M56 133H260" marker-end="url(#arrow)"/><text x="99" y="123">入射 +3 V</text>
<path class="blue" d="M260 174H56" marker-end="url(#arrow)"/><text x="99" y="166">反射 +1 V</text>
<text x="24" y="263">负载首到达：3+1=4 V</text><text x="24" y="287" class="muted">反射回到源端后，是否再次反射另看源端。</text></svg>