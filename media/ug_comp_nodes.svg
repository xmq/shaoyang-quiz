<svg xmlns="http://www.w3.org/2000/svg" width="380" height="365" viewBox="0 0 380 365" role="img" aria-label="两个C链表结点中删除头结点的地址与生命周期"><title>两个C链表结点中删除头结点的地址与生命周期</title><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:16px;fill:#183a4b} .n{fill:#eef8f6;stroke:#087f75;stroke-width:1.6} .edge{fill:none;stroke:#54778a;stroke-width:1.6} .thread{fill:none;stroke:#087f75;stroke-width:2;stroke-dasharray:5 3} .small{font-size:14px} .title{font-size:18px;font-weight:bold} @media(prefers-color-scheme:dark){text{fill:#e5eff5} .n{fill:#193b3b;stroke:#79d0c3} .edge{stroke:#b0c7d5} .thread{stroke:#79d0c3}}</style><text class="title" x="12" y="25">先保后继，再释放旧结点</text><text x="12" y="60">① 建链：head/a指10，b指20</text><rect class="n" x="65" y="78" width="90" height="32" rx="4"/><text x="110.0" y="100" text-anchor="middle">10 | next</text><rect class="n" x="245" y="78" width="100" height="32" rx="4"/><text x="295.0" y="100" text-anchor="middle">20 | 空</text><path class="edge" d="M155 94 H240"/><text x="177" y="85">→</text><text x="12" y="148">② old保留10，head改指20</text><rect class="n" x="65" y="167" width="90" height="32" rx="4"/><text x="110.0" y="189" text-anchor="middle">10 | next</text><rect class="n" x="245" y="167" width="100" height="32" rx="4"/><text x="295.0" y="189" text-anchor="middle">20 | 空</text><text class="small" x="77" y="218">old/a</text><text class="small" x="247" y="218">head/b</text><path class="edge" d="M155 183 H240"/><text x="12" y="260">③ free(old)：10对象失效</text><rect x="65" y="278" width="90" height="32" fill="none" stroke="#b67a72" stroke-dasharray="4 3"/><text class="small" x="75" y="300">不能再读</text><rect class="n" x="245" y="278" width="100" height="32" rx="4"/><text x="295.0" y="300" text-anchor="middle">20 | 空</text><text class="small" x="15" y="345">20仍由head访问；最终也要free并清理别名。</text></svg>