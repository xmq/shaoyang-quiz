<svg xmlns="http://www.w3.org/2000/svg" width="360" height="440" viewBox="0 0 360 440" role="img" aria-labelledby="title"><title id="title">伪随机：旧状态反馈后统一更新</title>
<style>svg{--ink:#233b49;--accent:#08796e;--soft:#e8f4f1;--muted:#536d7c;color:var(--ink);font:14px system-ui,"Microsoft YaHei",sans-serif}text{fill:currentColor}.w{stroke:var(--ink);stroke-width:1.7;fill:none}.a{stroke:var(--accent);stroke-width:2;fill:none}.soft{fill:var(--soft);stroke:var(--accent);stroke-width:1.4}.muted{fill:var(--muted)}@media(prefers-color-scheme:dark){svg{--ink:#e0edf2;--accent:#75d2bd;--soft:#173d39;--muted:#b3c4cf}}</style><defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--accent)"/></marker></defs>
<text x="12" y="25" font-size="17" text-anchor="start">伪随机：旧状态反馈后统一更新</text>
<text x="12" y="56" font-size="14" text-anchor="start">输出旧q2，新态(q1,q0,q2⊕q0)</text>
<rect x="26" y="90" width="70" height="44" class="w"/>
<text x="61.0" y="117.0" font-size="14" text-anchor="middle">q2</text>
<rect x="145" y="90" width="70" height="44" class="w"/>
<text x="180.0" y="117.0" font-size="14" text-anchor="middle">q1</text>
<rect x="264" y="90" width="70" height="44" class="w"/>
<text x="299.0" y="117.0" font-size="14" text-anchor="middle">q0</text>
<path class="a" d="M264 112L215 112" marker-end="url(#arr)"/>
<path class="a" d="M145 112L96 112" marker-end="url(#arr)"/>
<rect x="150" y="190" width="65" height="42" class="soft"/>
<text x="182.5" y="216.0" font-size="14" text-anchor="middle">XOR</text>
<path class="w" d="M61 134L61 211"/>
<path class="a" d="M61 211L150 211" marker-end="url(#arr)"/>
<path class="w" d="M299 134L299 260"/>
<path class="w" d="M299 260L182 260"/>
<path class="a" d="M182 260L182 232" marker-end="url(#arr)"/>
<path class="w" d="M215 211L345 211"/>
<path class="w" d="M345 211L345 112"/>
<path class="a" d="M345 112L334 112" marker-end="url(#arr)"/>
<text x="12" y="307" font-size="14" text-anchor="start">001→011→111→110→101</text>
<text x="12" y="339" font-size="14" text-anchor="start">→010→100→001；输出0011101</text>
<text x="12" y="375" font-size="14" text-anchor="start">周期7，零态锁死；R[1]=−1/7。</text>
<text x="12" y="414" font-size="13" text-anchor="start">确定可复现≠真随机≠密码安全。</text>
</svg>