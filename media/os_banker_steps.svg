<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 370" role="img" aria-labelledby="title desc"><title id="title">安全检查：假设完成，再释放</title><desc id="desc">安全检查：假设完成，再释放；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><rect x="1" y="1" width="398" height="368" rx="12" class="bg"/><text x="22" y="33" class="title" text-anchor="start">安全检查：假设完成，再释放</text><text x="22" y="70" class="" text-anchor="start">一种资源，可用 Work=2</text><text x="22" y="97" class="" text-anchor="start">P1：已分1，最大3；P2：已分2，最大5</text><rect x="24" y="130" width="352" height="54" rx="7" class="hi"/><text x="200.0" y="163.0" class="mono" text-anchor="middle">P1 Need=2 ≤ Work=2</text><path class="line" d="M200 184L200 215"/><rect x="24" y="220" width="352" height="54" rx="7" class="box"/><text x="200.0" y="253.0" class="mono" text-anchor="middle">P1完成：Work=2+1=3</text><path class="line" d="M200 274L200 305"/><rect x="24" y="310" width="352" height="40" rx="7" class="hi"/><text x="200.0" y="336.0" class="mono" text-anchor="middle">P2 Need=3 ≤ 3，可完成</text></svg>