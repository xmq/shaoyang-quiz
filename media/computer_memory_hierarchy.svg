<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 390" role="img" aria-labelledby="title" width="400" height="390"><title id="title">存储层次：快与大分层合作</title><defs><style>text{font:18px "Microsoft YaHei",system-ui,sans-serif;fill:#183047}.title{font-size:20px;font-weight:700}.bold{font-weight:700}.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#7b8fa2;stroke-width:1.5}.hi{fill:#d9f3ed;stroke:#19806e;stroke-width:1.5}.blue{fill:#e0edff;stroke:#4c79bf;stroke-width:1.5}.warn{fill:#fff0d3;stroke:#c28a25;stroke-width:1.5}.line{stroke:#37768a;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#e6eef6}.bg{fill:#142234;stroke:#405469}.box{fill:#1a2e43;stroke:#859bad}.hi{fill:#16483f;stroke:#69d7bc}.blue{fill:#193e68;stroke:#92b9fb}.warn{fill:#4b3a1e;stroke:#e4b15a}.line{stroke:#82c5d4}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47879b"/></marker></defs><text x="18" y="32" class="title">存储层次：快与大分层合作</text><rect class="box" x="120" y="65" width="160" height="44" rx="7"/><text x="200.0" y="93.0" class="" text-anchor="middle">寄存器</text><rect class="hi" x="85" y="126" width="230" height="44" rx="7"/><text x="200.0" y="154.0" class="" text-anchor="middle">Cache</text><rect class="box" x="50" y="187" width="300" height="44" rx="7"/><text x="200.0" y="215.0" class="" text-anchor="middle">主存DRAM</text><rect class="box" x="18" y="248" width="364" height="44" rx="7"/><text x="200.0" y="276.0" class="" text-anchor="middle">辅存SSD / HDD</text><text x="18" y="329" class="">越向上：通常越快、越小、每位越贵。</text><text x="18" y="365" class="">Cache利用局部性，保存主存块的副本。</text></svg>