<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.top{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.b{fill:#fff;stroke:#2563eb;stroke-width:3}.l{stroke:#526777;stroke-width:4}.tt{font:700 27px system-ui;fill:#102a43}.t{font:21px system-ui;fill:#102a43}.s{font:18px system-ui;fill:#526777}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.top{fill:#173f3c;stroke:#46d6c6}.b{fill:#17283b;stroke:#78b7ff}.l{stroke:#9fb0c0}.tt,.t{fill:#edf4fb}.s{fill:#b8c5d1}}</style></defs><rect class="bg" x="10" y="10" width="700" height="380" rx="24"/><text class="tt" x="35" y="55">从主题到单页：控制范围逐层变具体</text><rect class="top" x="250" y="85" width="220" height="58" rx="12"/><text class="t" x="360" y="122" text-anchor="middle">主题：颜色 / 字体 / 效果</text><path class="l" d="M360 143V180"/><rect class="top" x="250" y="180" width="220" height="58" rx="12"/><text class="t" x="360" y="217" text-anchor="middle">母版：全局默认</text><path class="l" d="M360 238V275M360 255H155V275M360 255H565V275"/><g class="t" text-anchor="middle"><rect class="b" x="55" y="275" width="200" height="65" rx="12"/><text x="155" y="315">标题版式</text><rect class="b" x="260" y="275" width="200" height="65" rx="12"/><text x="360" y="315">图文版式</text><rect class="b" x="465" y="275" width="200" height="65" rx="12"/><text x="565" y="315">单页直接格式</text></g><text class="s" x="55" y="370">单页直接格式可能覆盖母版默认值，排障时从具体对象向上检查</text></svg>
