<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 489" role="img" aria-labelledby="title desc" width="390" height="489"><title id="title">改整套标题，还是只改一页？</title><desc id="desc">改整套标题，还是只改一页？</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><rect class="bg" width="390" height="489" rx="14"/><text class="h" x="20" y="33">改整套标题，还是只改一页？</text><rect class="box" x="18" y="56" width="354" height="94" rx="10"/><text class="h" x="32" y="84">目标：所有幻灯片标题改蓝色</text><text class="t" x="32" y="112">进入“幻灯片母版”</text><text class="t" x="32" y="138">修改对应母版/版式的标题占位符</text><path class="line" d="M195 153L195 174"/><rect class="box" x="18" y="179" width="354" height="94" rx="10"/><text class="h" x="32" y="207">第1、2页：继承，标题一起变蓝</text><text class="t" x="32" y="235">第3页：手工设红色，可能仍为红色</text><text class="t" x="32" y="261">检查是否有直接格式覆盖默认值</text><path class="line" d="M195 276L195 297"/><rect class="hot" x="18" y="302" width="354" height="94" rx="10"/><text class="h" x="32" y="330">目标：同一页节点依次出现</text><text class="t" x="32" y="358">给节点设置对象动画和顺序</text><text class="t" x="32" y="384">页间翻页效果才叫“切换”</text><text class="s" x="20" y="425">主题管色彩字体；版式管占位符。</text><text class="s" x="20" y="451">单独插入文本框不等于标题占位符。</text></svg>
