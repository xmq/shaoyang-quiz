<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="title desc" width="400" height="320"><title id="title">循环队列：下标跨过末尾</title><desc id="desc">循环队列：下标跨过末尾；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><rect x="1" y="1" width="398" height="318" rx="12" class="bg"/><text x="22" y="33" class="title" text-anchor="start">循环队列：下标跨过末尾</text><text x="22" y="70" class="" text-anchor="start">数组长 m=6，牺牲一个单元区分满空</text><text x="22" y="97" class="" text-anchor="start">front=4 指向首元素；rear=1 指向待写位</text><rect x="20" y="135" width="57" height="39" rx="7" class="hi"/><text x="48.5" y="160.5" class="mono" text-anchor="middle">C</text><rect x="80" y="135" width="57" height="39" rx="7" class="box"/><text x="108.5" y="160.5" class="mono" text-anchor="middle">·</text><rect x="140" y="135" width="57" height="39" rx="7" class="box"/><text x="168.5" y="160.5" class="mono" text-anchor="middle">·</text><rect x="200" y="135" width="57" height="39" rx="7" class="box"/><text x="228.5" y="160.5" class="mono" text-anchor="middle">·</text><rect x="260" y="135" width="57" height="39" rx="7" class="hi"/><text x="288.5" y="160.5" class="mono" text-anchor="middle">A</text><rect x="320" y="135" width="57" height="39" rx="7" class="hi"/><text x="348.5" y="160.5" class="mono" text-anchor="middle">B</text><text x="48" y="201" class="mono" text-anchor="middle">0</text><text x="108" y="201" class="mono" text-anchor="middle">1</text><text x="168" y="201" class="mono" text-anchor="middle">2</text><text x="228" y="201" class="mono" text-anchor="middle">3</text><text x="288" y="201" class="mono" text-anchor="middle">4</text><text x="348" y="201" class="mono" text-anchor="middle">5</text><text x="22" y="240" class="" text-anchor="start">有效顺序：4(A) → 5(B) → 0(C)</text><text x="22" y="267" class="" text-anchor="start">长度：(1−4+6)%6 = 3</text><text x="22" y="294" class="" text-anchor="start">再入队 D：写槽1，rear 变2。</text></svg>