<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" role="img" aria-labelledby="title desc"><title id="title">带权图：数字表示费用</title><desc id="desc">带权图：数字表示费用；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><rect x="1" y="1" width="398" height="378" rx="12" class="bg"/><text x="22" y="33" class="title" text-anchor="start">带权图：数字表示费用</text><path class="edge" d="M50 170L165 85"/><text x="116.5" y="121.5" class="weight" text-anchor="middle">2</text><path class="edge" d="M50 170L165 265"/><text x="116.5" y="211.5" class="weight" text-anchor="middle">5</text><path class="edge" d="M165 85L165 265"/><text x="174.0" y="169.0" class="weight" text-anchor="middle">1</text><path class="edge" d="M165 85L280 170"/><text x="231.5" y="121.5" class="weight" text-anchor="middle">4</text><path class="edge" d="M165 265L280 170"/><text x="231.5" y="211.5" class="weight" text-anchor="middle">2</text><path class="edge" d="M165 265L350 285"/><text x="266.5" y="269.0" class="weight" text-anchor="middle">6</text><path class="edge" d="M280 170L350 285"/><text x="324.0" y="221.5" class="weight" text-anchor="middle">3</text><circle cx="50" cy="170" r="23" class="hi"/><text x="50" y="176" class="mono" text-anchor="middle">A</text><circle cx="165" cy="85" r="23" class="hi"/><text x="165" y="91" class="mono" text-anchor="middle">B</text><circle cx="165" cy="265" r="23" class="hi"/><text x="165" y="271" class="mono" text-anchor="middle">C</text><circle cx="280" cy="170" r="23" class="hi"/><text x="280" y="176" class="mono" text-anchor="middle">D</text><circle cx="350" cy="285" r="23" class="hi"/><text x="350" y="291" class="mono" text-anchor="middle">E</text><text x="22" y="338" class="" text-anchor="start">边的几何长度不代表权值。</text><text x="22" y="365" class="" text-anchor="start">例：A→B→C 费用 2+1=3。</text></svg>