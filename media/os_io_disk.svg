<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 390" role="img" aria-labelledby="title desc" width="400" height="390"><title id="title">I/O：CPU 是否一直等？</title><desc id="desc">I/O：CPU 是否一直等？；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><rect x="1" y="1" width="398" height="388" rx="12" class="bg"/><text x="22" y="33" class="title" text-anchor="start">I/O：CPU 是否一直等？</text><text x="22" y="75" class="" text-anchor="start">查询：CPU反复读设备状态</text><rect x="24" y="90" width="350" height="40" rx="7" class="box"/><text x="199.0" y="116.0" class="mono" text-anchor="middle">CPU → 查询 → 查询 → 查询</text><text x="22" y="175" class="" text-anchor="start">中断：发请求后做别的，设备完成通知</text><rect x="24" y="190" width="350" height="40" rx="7" class="hi"/><text x="199.0" y="216.0" class="mono" text-anchor="middle">发起 → CPU做别的 → 中断处理</text><text x="22" y="275" class="" text-anchor="start">DMA：控制器直接搬运内存与设备数据</text><rect x="24" y="290" width="350" height="40" rx="7" class="box"/><text x="199.0" y="316.0" class="mono" text-anchor="middle">CPU配置 → DMA搬运 → 完成中断</text><text x="22" y="367" class="" text-anchor="start">DMA并非完全不需要 CPU 参与。</text></svg>