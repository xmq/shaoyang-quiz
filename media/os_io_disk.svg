<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.box{fill:#fff;stroke:#64748b;stroke-width:2}.hi{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.line{stroke:#2563eb;stroke-width:4;fill:none}.h{font:700 25px system-ui,sans-serif;fill:#102a43}.t{font:19px system-ui,sans-serif;fill:#334155}.m{font:19px ui-monospace,monospace;fill:#1d4ed8}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.box{fill:#17283b;stroke:#647b91}.hi{fill:#173f3c;stroke:#46d6c6}.line{stroke:#66a3ff}.h{fill:#edf4fb}.t{fill:#b8c5d1}.m{fill:#a9cbff}}</style></defs><rect class="bg" x="12" y="12" width="876" height="496" rx="24"/><text class="h" x="45" y="58">I/O方式与磁盘调度解决的是两类问题</text><g class="box"><rect x="45" y="105" width="240" height="165" rx="16"/><rect x="330" y="105" width="240" height="165" rx="16"/><rect x="615" y="105" width="240" height="165" rx="16"/></g><text class="h" x="165" y="145" text-anchor="middle">程序查询</text><text class="t" x="70" y="190">CPU持续轮询设备</text><text class="t" x="70" y="225">简单但浪费CPU</text><text class="h" x="450" y="145" text-anchor="middle">中断</text><text class="t" x="355" y="190">设备完成后通知</text><text class="t" x="355" y="225">CPU按事件介入</text><text class="h" x="735" y="145" text-anchor="middle">DMA</text><text class="t" x="640" y="190">设备与内存成块传输</text><text class="t" x="640" y="225">CPU负责初始化和收尾</text><text class="h" x="45" y="325">磁盘请求：当前位置50，队列 82、43、140、24</text><text class="m" x="60" y="375">SSTF：50 → 43 → 24 → 82 → 140</text><text class="m" x="60" y="420">SCAN向大号：50 → 82 → 140 → 折返 → 43 → 24</text><text class="t" x="60" y="465">SSTF可能使远端请求饥饿；SCAN必须先给定移动方向。</text></svg>