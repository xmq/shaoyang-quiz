<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" role="img" aria-labelledby="title"><title id="title">/24均分：先借位，再找边界</title><defs><style>text{font:18px "Microsoft YaHei",system-ui,sans-serif;fill:#183047}.title{font-size:20px;font-weight:700}.bold{font-weight:700}.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#7b8fa2;stroke-width:1.5}.hi{fill:#d9f3ed;stroke:#19806e;stroke-width:1.5}.blue{fill:#e0edff;stroke:#4c79bf;stroke-width:1.5}.warn{fill:#fff0d3;stroke:#c28a25;stroke-width:1.5}.line{stroke:#37768a;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#e6eef6}.bg{fill:#142234;stroke:#405469}.box{fill:#1a2e43;stroke:#859bad}.hi{fill:#16483f;stroke:#69d7bc}.blue{fill:#193e68;stroke:#92b9fb}.warn{fill:#4b3a1e;stroke:#e4b15a}.line{stroke:#82c5d4}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47879b"/></marker></defs><rect class="bg" x="1" y="1" width="398" height="498" rx="14"/><text x="18" y="32" class="title">/24均分：先借位，再找边界</text><text x="18" y="66" class="">192.168.10.0/24 → 4个/26</text><rect class="blue" x="18" y="83" width="364" height="42" rx="7"/><text x="200.0" y="110.0" class="" text-anchor="middle">末字节：子网位2位｜主机位6位</text><rect class="hi" x="18" y="145" width="80" height="35" rx="7"/><text x="58.0" y="168.5" class="" text-anchor="middle">子网位</text><rect class="hi" x="98" y="145" width="142" height="35" rx="7"/><text x="169.0" y="168.5" class="" text-anchor="middle">地址范围</text><rect class="hi" x="240" y="145" width="142" height="35" rx="7"/><text x="311.0" y="168.5" class="" text-anchor="middle">可用主机</text><rect class="box" x="18" y="180" width="80" height="35" rx="7"/><text x="58.0" y="203.5" class="" text-anchor="middle">00</text><rect class="box" x="98" y="180" width="142" height="35" rx="7"/><text x="169.0" y="203.5" class="" text-anchor="middle">.0—.63</text><rect class="box" x="240" y="180" width="142" height="35" rx="7"/><text x="311.0" y="203.5" class="" text-anchor="middle">.1—.62</text><rect class="box" x="18" y="215" width="80" height="35" rx="7"/><text x="58.0" y="238.5" class="" text-anchor="middle">01</text><rect class="box" x="98" y="215" width="142" height="35" rx="7"/><text x="169.0" y="238.5" class="" text-anchor="middle">.64—.127</text><rect class="box" x="240" y="215" width="142" height="35" rx="7"/><text x="311.0" y="238.5" class="" text-anchor="middle">.65—.126</text><rect class="box" x="18" y="250" width="80" height="35" rx="7"/><text x="58.0" y="273.5" class="" text-anchor="middle">10</text><rect class="box" x="98" y="250" width="142" height="35" rx="7"/><text x="169.0" y="273.5" class="" text-anchor="middle">.128—.191</text><rect class="box" x="240" y="250" width="142" height="35" rx="7"/><text x="311.0" y="273.5" class="" text-anchor="middle">.129—.190</text><rect class="box" x="18" y="285" width="80" height="35" rx="7"/><text x="58.0" y="308.5" class="" text-anchor="middle">11</text><rect class="box" x="98" y="285" width="142" height="35" rx="7"/><text x="169.0" y="308.5" class="" text-anchor="middle">.192—.255</text><rect class="box" x="240" y="285" width="142" height="35" rx="7"/><text x="311.0" y="308.5" class="" text-anchor="middle">.193—.254</text><text x="18" y="353" class="">每块2⁶=64个地址，边界每次加64。</text><text x="18" y="386" class="">每行首地址＝网络地址，末＝广播。</text><rect class="hi" x="18" y="407" width="364" height="42" rx="7"/><text x="200.0" y="434.0" class="" text-anchor="middle">例如.70落在第二块 → 网络.64</text><text x="18" y="479" class="">普通子网：每块可用64−2=62台。</text></svg>