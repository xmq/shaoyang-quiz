<svg xmlns="http://www.w3.org/2000/svg" width="400" height="405" viewBox="0 0 400 405" role="img" aria-labelledby="title"><title id="title">脏读：读到了后来被撤销的钱</title><defs><style>text{font:18px "Microsoft YaHei",system-ui,sans-serif;fill:#183047}.title{font-size:20px;font-weight:700}.bold{font-weight:700}.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#7b8fa2;stroke-width:1.5}.hi{fill:#d9f3ed;stroke:#19806e;stroke-width:1.5}.blue{fill:#e0edff;stroke:#4c79bf;stroke-width:1.5}.warn{fill:#fff0d3;stroke:#c28a25;stroke-width:1.5}.line{stroke:#37768a;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#e6eef6}.bg{fill:#142234;stroke:#405469}.box{fill:#1a2e43;stroke:#859bad}.hi{fill:#16483f;stroke:#69d7bc}.blue{fill:#193e68;stroke:#92b9fb}.warn{fill:#4b3a1e;stroke:#e4b15a}.line{stroke:#82c5d4}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47879b"/></marker></defs><rect class="bg" x="1" y="1" width="398" height="403" rx="14"/><text x="18" y="32" class="title">脏读：读到了后来被撤销的钱</text><rect class="hi" x="18" y="65" width="62" height="35" rx="7"/><text x="49.0" y="88.5" class="" text-anchor="middle">时间</text><rect class="hi" x="80" y="65" width="161" height="35" rx="7"/><text x="160.5" y="88.5" class="" text-anchor="middle">T1</text><rect class="hi" x="241" y="65" width="141" height="35" rx="7"/><text x="311.5" y="88.5" class="" text-anchor="middle">T2</text><rect class="box" x="18" y="100" width="62" height="35" rx="7"/><text x="49.0" y="123.5" class="" text-anchor="middle">1</text><rect class="box" x="80" y="100" width="161" height="35" rx="7"/><text x="160.5" y="123.5" class="" text-anchor="middle">余额100→50</text><rect class="box" x="241" y="100" width="141" height="35" rx="7"/><rect class="box" x="18" y="135" width="62" height="35" rx="7"/><text x="49.0" y="158.5" class="" text-anchor="middle">2</text><rect class="box" x="80" y="135" width="161" height="35" rx="7"/><text x="160.5" y="158.5" class="" text-anchor="middle">未提交</text><rect class="box" x="241" y="135" width="141" height="35" rx="7"/><text x="311.5" y="158.5" class="" text-anchor="middle">读到50</text><rect class="box" x="18" y="170" width="62" height="35" rx="7"/><text x="49.0" y="193.5" class="" text-anchor="middle">3</text><rect class="box" x="80" y="170" width="161" height="35" rx="7"/><text x="160.5" y="193.5" class="" text-anchor="middle">回滚到100</text><rect class="box" x="241" y="170" width="141" height="35" rx="7"/><text x="311.5" y="193.5" class="" text-anchor="middle">已使用50</text><text x="18" y="259" class="">关键：T2读到T1尚未提交的数据。</text><text x="18" y="295" class="">不可重复读：同一行两次读值不同。</text><text x="18" y="331" class="">幻读：同条件查询的行集合发生变化。</text><text x="18" y="371" class="">先看时间线和提交点，再判断异常。</text></svg>