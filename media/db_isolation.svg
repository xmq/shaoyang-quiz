<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500"><defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.b{fill:#fff;stroke:#64748b;stroke-width:2}.h{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.l{stroke:#2563eb;stroke-width:4;fill:none}.tt{font:700 25px system-ui;fill:#102a43}.t{font:19px system-ui;fill:#334155}.m{font:18px ui-monospace;fill:#1d4ed8}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.b{fill:#17283b;stroke:#647b91}.h{fill:#173f3c;stroke:#46d6c6}.tt{fill:#edf4fb}.t{fill:#b8c5d1}.m{fill:#a9cbff}}</style></defs><rect class="bg" x="12" y="12" width="876" height="476" rx="24"/><text class="tt" x="45" y="58">并发异常看“读到了什么变化”</text><rect class="b" x="55" y="105" width="240" height="240" rx="15"/><rect class="b" x="330" y="105" width="240" height="240" rx="15"/><rect class="b" x="605" y="105" width="240" height="240" rx="15"/><text class="tt" x="175" y="150" text-anchor="middle">脏读</text><text class="t" x="80" y="195">T1写入未提交</text><text class="t" x="80" y="235">T2读取该值</text><text class="t" x="80" y="275">T1随后回滚</text><text class="tt" x="450" y="150" text-anchor="middle">不可重复读</text><text class="t" x="355" y="195">T1两次读同一行</text><text class="t" x="355" y="235">中间T2提交修改</text><text class="t" x="355" y="275">两次结果不同</text><text class="tt" x="725" y="150" text-anchor="middle">幻读</text><text class="t" x="630" y="195">T1两次按条件查询</text><text class="t" x="630" y="235">中间T2插入提交</text><text class="t" x="630" y="275">结果行集合变化</text><text class="t" x="55" y="410">隔离级别越高通常限制更多异常，也可能增加等待和冲突。</text><text class="t" x="55" y="452">具体可见性取决于DBMS的锁与多版本实现。</text></svg>