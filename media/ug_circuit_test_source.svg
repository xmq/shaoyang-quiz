<circle class="part" cx="54" cy="156" r="25"/><text x="48" y="151">+</text><text x="48" y="173">−</text>
<rect class="part" x="166" y="127" width="20" height="49"/>
<path class="part" d="M302 121L326 148L302 175L278 148Z"/>
<path class="accent" d="M302 163V134" marker-end="url(#arrow)"/><text x="226" y="198">0.25u A向上</text>
<path class="blue" d="M96 69H148" marker-end="url(#arrow)"/><text x="99" y="58">It流入</text>
<text x="16" y="203">测试2 V</text><text x="188" y="157">2 Ω</text><text x="208" y="108">u为端口对地电压</text>
<circle class="node" cx="176" cy="85" r="3"/><circle class="node" cx="176" cy="235" r="3"/>
