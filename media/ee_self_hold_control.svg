<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" role="img" aria-labelledby="title desc" width="400" height="540"><title id="title">自锁：松开启动仍有通路</title><desc id="desc">自锁：松开启动仍有通路</desc>
<defs><style>
        :root{--ink:#17324b;--muted:#456075;--paper:#fff;--panel:#edf5fa;--blue:#1464ba;--green:#087c67;--orange:#ad5200;--red:#b42318;--border:#cad8e5}
        @media(prefers-color-scheme:dark){:root{--ink:#edf4fb;--muted:#b5c8d8;--paper:#132334;--panel:#1b3349;--blue:#9bcaff;--green:#7de1c4;--orange:#ffc079;--red:#ffab9b;--border:#527087}}
        .paper{fill:var(--paper)}.panel{fill:var(--panel);stroke:var(--border)}.t{font:18px system-ui,sans-serif;fill:var(--ink)}.h{font:700 21px system-ui,sans-serif;fill:var(--ink)}.b{font:700 18px system-ui,sans-serif;fill:var(--blue)}.g{font:700 18px system-ui,sans-serif;fill:var(--green)}.r{font:700 18px system-ui,sans-serif;fill:var(--red)}.muted{font:18px system-ui,sans-serif;fill:var(--muted)}
        .wire{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}.blue{fill:none;stroke:var(--blue);stroke-width:2.5}.green{fill:none;stroke:var(--green);stroke-width:2.5}.orange{fill:none;stroke:var(--orange);stroke-width:2.5}.red{fill:none;stroke:var(--red);stroke-width:2.5}.dash{stroke-dasharray:5 4}.dot{fill:var(--ink)}.shade{fill:var(--green);opacity:.17}
        </style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs>
<rect class="paper" width="400" height="540" rx="12"/>
<text class="h" x="20" y="33">自锁：松开启动仍有通路</text>
<text class="t" x="20" y="66">图中触点均画未按下/未吸合状态</text>
<path class="wire" d="M50 105L350 105"/>
<text class="t" x="25" y="111">L</text>
<path class="wire" d="M50 440L350 440"/>
<text class="t" x="25" y="446">N</text>
<path class="wire" d="M200 105L200 135"/>
<path class="wire" d="M180 135L220 135"/>
<path class="wire" d="M180 152L220 152"/>
<path class="wire" d="M185 130L215 157"/>
<path class="wire" d="M200 152L200 190"/>
<text class="t" x="230" y="146">停止：常闭</text>
<path class="wire" d="M200 190H110V230M200 190H290V230"/>
<circle class="dot" cx="200" cy="190" r="4"/>
<path class="wire" d="M90 230L130 230"/>
<path class="wire" d="M90 250L130 250"/>
<path class="wire" d="M110 250L110 290"/>
<path class="wire" d="M270 230L310 230"/>
<path class="wire" d="M270 250L310 250"/>
<path class="wire" d="M290 250L290 290"/>
<text class="t" x="25" y="218">启动：常开</text>
<text class="t" x="244" y="218">KM常开</text>
<path class="wire" d="M110 290H290M200 290V310M200 328V345"/>
<circle class="dot" cx="200" cy="290" r="4"/>
<path class="wire" d="M180 310L220 310"/>
<path class="wire" d="M180 328L220 328"/>
<path class="wire" d="M183 305L217 333"/>
<text class="t" x="237" y="324">FR常闭</text>
<rect class="panel" x="164" y="345" width="72" height="50" rx="10"/>
<text class="t" x="200" y="377" text-anchor="middle">KM</text>
<path class="wire" d="M200 395L200 440"/>
<text class="t" x="20" y="482">按启动→KM吸合→右支路闭合。</text>
<text class="t" x="20" y="507">松开启动仍走右支路；按停止则两路都断电。</text>
</svg>
