<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 355" role="img" aria-labelledby="title desc" width="400" height="355"><title id="title">C：普通形参是独立副本</title><desc id="desc">C：普通形参是独立副本；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><rect x="1" y="1" width="398" height="353" rx="12" class="bg"/><text x="22" y="33" class="title" text-anchor="start">C：普通形参是独立副本</text><text x="22" y="70" class="" text-anchor="start">调用 f(x)，设 x=3；函数内执行 a=9</text><rect x="25" y="110" width="140" height="65" rx="7" class="box"/><text x="95.0" y="148.5" class="mono" text-anchor="middle">x=3</text><path class="line" d="M165 140L235 140"/><rect x="235" y="110" width="140" height="65" rx="7" class="hi"/><text x="305.0" y="148.5" class="mono" text-anchor="middle">a=3</text><text x="181" y="105" class="" text-anchor="middle">复制值</text><rect x="25" y="225" width="140" height="65" rx="7" class="box"/><text x="95.0" y="263.5" class="mono" text-anchor="middle">x仍为3</text><rect x="235" y="225" width="140" height="65" rx="7" class="hi"/><text x="305.0" y="263.5" class="mono" text-anchor="middle">a变为9</text><path class="line" d="M305 175L305 225"/><text x="22" y="330" class="" text-anchor="start">要修改调用者对象，可传地址并解引用。</text></svg>