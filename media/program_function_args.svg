<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">C按值传参与Python对象共享</title>
  <desc id="desc">C普通形参是值副本，指针可修改调用者对象；Python形参重新绑定不影响调用者，原地修改共享对象可以被调用者看到。</desc>
  <defs><style>
    .bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.panel{fill:#fff;stroke:#64748b;stroke-width:3}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:3}.shared{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.arrow{stroke:#176f68;stroke-width:4;fill:none;marker-end:url(#a)}.title{font:700 28px system-ui;fill:#102a43}.head{font:700 23px system-ui;fill:#102a43}.text{font:20px system-ui;fill:#334155}.code{font:19px ui-monospace;fill:#1d4ed8}
    @media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.panel{fill:#17283b;stroke:#647b91}.box{fill:#17304a;stroke:#78b7ff}.shared{fill:#173f3c;stroke:#46d6c6}.arrow{stroke:#46d6c6}.title,.head{fill:#edf4fb}.text{fill:#b8c5d1}.code{fill:#a9cbff}}
  </style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#176f68"/></marker></defs>
  <rect class="bg" x="10" y="10" width="700" height="440" rx="24"/><text class="title" x="34" y="52">函数调用先问：改了名字，还是改了对象？</text>
  <rect class="panel" x="35" y="85" width="310" height="330" rx="18"/><text class="head" x="190" y="125" text-anchor="middle">C：普通形参是副本</text>
  <rect class="box" x="70" y="155" width="110" height="70" rx="10"/><text class="code" x="125" y="198" text-anchor="middle">x = 3</text><rect class="box" x="205" y="155" width="110" height="70" rx="10"/><text class="code" x="260" y="198" text-anchor="middle">a = 3</text>
  <text class="text" x="68" y="265">改a：x不变</text><text class="text" x="68" y="305">传&amp;x：可经*p改x</text><text class="text" x="68" y="355">交换调用者变量要传地址</text>
  <rect class="panel" x="375" y="85" width="310" height="330" rx="18"/><text class="head" x="530" y="125" text-anchor="middle">Python：名字指向对象</text>
  <rect class="box" x="405" y="155" width="92" height="62" rx="10"/><text class="code" x="451" y="194" text-anchor="middle">a</text><rect class="box" x="405" y="245" width="92" height="62" rx="10"/><text class="code" x="451" y="284" text-anchor="middle">p</text><rect class="shared" x="555" y="190" width="95" height="82" rx="12"/><text class="code" x="602" y="240" text-anchor="middle">[1,2]</text>
  <path class="arrow" d="M497 186L555 215"/><path class="arrow" d="M497 276L555 248"/><text class="text" x="408" y="350">append：两边都看见变化</text><text class="text" x="408" y="385">p=[]：只让p改指向</text>
</svg>
