<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 531" role="img" aria-labelledby="title desc"><title id="title">负反馈：把输出反送来比较</title><desc id="desc">负反馈：把输出反送来比较</desc>
<defs><style>
        :root{--ink:#17324b;--muted:#456075;--paper:#fff;--panel:#edf5fa;--blue:#1464ba;--green:#087c67;--orange:#ad5200;--red:#b42318;--border:#cad8e5}
        @media(prefers-color-scheme:dark){:root{--ink:#edf4fb;--muted:#b5c8d8;--paper:#132334;--panel:#1b3349;--blue:#9bcaff;--green:#7de1c4;--orange:#ffc079;--red:#ffab9b;--border:#527087}}
        .paper{fill:var(--paper)}.panel{fill:var(--panel);stroke:var(--border)}.t{font:18px system-ui,sans-serif;fill:var(--ink)}.h{font:700 21px system-ui,sans-serif;fill:var(--ink)}.b{font:700 18px system-ui,sans-serif;fill:var(--blue)}.g{font:700 18px system-ui,sans-serif;fill:var(--green)}.r{font:700 18px system-ui,sans-serif;fill:var(--red)}.muted{font:18px system-ui,sans-serif;fill:var(--muted)}
        .wire{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}.blue{fill:none;stroke:var(--blue);stroke-width:2.5}.green{fill:none;stroke:var(--green);stroke-width:2.5}.orange{fill:none;stroke:var(--orange);stroke-width:2.5}.red{fill:none;stroke:var(--red);stroke-width:2.5}.dash{stroke-dasharray:5 4}.dot{fill:var(--ink)}.shade{fill:var(--green);opacity:.17}
        </style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs>
<rect class="paper" width="400" height="531" rx="12"/>
<text class="h" x="20" y="33">负反馈：把输出反送来比较</text>
<text class="t" x="25" y="78">输入Xi=1</text>
<path class="wire" d="M100 90L100 125" marker-end="url(#arrow)"/>
<circle class="panel" cx="100" cy="150" r="25"/>
<text class="t" x="100" y="157" text-anchor="middle">Σ</text>
<text class="t" x="67" y="126">+</text>
<text class="t" x="130" y="146">−</text>
<path class="wire" d="M100 175L100 235" marker-end="url(#arrow)"/>
<text class="t" x="115" y="211">净输入0.1</text>
<rect class="panel" x="40" y="240" width="190" height="65" rx="10"/>
<text class="t" x="135" y="278" text-anchor="middle">放大A=100</text>
<path class="wire" d="M135 305L135 365" marker-end="url(#arrow)"/>
<text class="g" x="35" y="394">输出Xo=10</text>
<path class="wire" d="M135 345H335V150H125"/>
<path class="wire" d="M190 150L125 150" marker-end="url(#arrow)"/>
<circle class="dot" cx="135" cy="345" r="4"/>
<rect class="panel" x="270" y="220" width="110" height="62" rx="10"/>
<text class="t" x="325" y="246" text-anchor="middle">反馈F</text>
<text class="t" x="325" y="270" text-anchor="middle">=0.09</text>
<text class="t" x="192" y="128">反馈Xf=0.9</text>
<text class="t" x="20" y="450">1−0.9=0.1；0.1×100=10</text>
<text class="t" x="20" y="486">Af=100/(1+100×0.09)=10。这个例子不是</text>
<text class="t" x="20" y="511">深度反馈近似1/F。</text>
</svg>
