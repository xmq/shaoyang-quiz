<svg xmlns="http://www.w3.org/2000/svg" width="555" height="252" viewBox="0 0 555 252" role="img" aria-labelledby="title desc"><title id="title">负反馈放大系统的信号与回路</title><desc id="desc">输入Xi为1，反馈量Xf为0.9，求和点按正输入减反馈得到净输入0.1。放大环节A为100，输出Xo为10；输出经过F为0.09的反馈环节返回求和点负端。闭环增益为100除以1加9，即10。</desc><defs><style>:root{--ink:#263d49;--muted:#647781;--line:#c6d3d9;--accent:#147b71;--blue:#356c9b;--warm:#b37327;--pale:#e7f3f0}@media(prefers-color-scheme:dark){:root{--ink:#dfebf0;--muted:#a2b8c3;--line:#415965;--accent:#7ed6c6;--blue:#a3c8ed;--warm:#e7bb77;--pale:#203d3c}}text{font:20px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:var(--ink)}.small{font-size:18px;fill:var(--muted)}.label{font-size:20px;font-weight:600}.accent{fill:var(--accent)}.blue{fill:var(--blue)}.warm{fill:var(--warm)}.wire,.axis{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.guide{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 5}.grid{fill:none;stroke:var(--line);stroke-width:1}.curve{fill:none;stroke:var(--accent);stroke-width:2.6}.point{fill:var(--accent)}.resistor{fill:none;stroke:var(--ink);stroke-width:1.8}.accent-line{fill:none;stroke:var(--accent);stroke-width:2.1}</style><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="var(--ink)"/></marker></defs><path d="M18 88H95" class="axis" marker-end="url(#arrow)"/><circle class="resistor" cx="111" cy="88" r="16"/><text x="80" y="71" class="small" text-anchor="start">+</text><text x="126" y="124" class="label" text-anchor="start">−</text><text x="18" y="52" class="label" text-anchor="start">X<tspan baseline-shift="sub" font-size="70%">i</tspan> = 1</text><path d="M127 88H229" class="axis" marker-end="url(#arrow)"/><text x="178" y="65" class="label" text-anchor="middle">0.1</text><rect x="231" y="57" width="112" height="62" class="resistor"/><text x="287" y="95" class="label" text-anchor="middle">A = 100</text><path d="M343 88H536" class="axis" marker-end="url(#arrow)"/><text x="439" y="61" class="label" text-anchor="middle">X<tspan baseline-shift="sub" font-size="70%">o</tspan> = 10</text><circle cx="455" cy="88" r="3" fill="var(--ink)"/><path d="M455 88V204H350" class="axis" marker-end="url(#arrow)"/><rect x="230" y="175" width="120" height="58" class="resistor"/><text x="290" y="211" class="label" text-anchor="middle">F = 0.09</text><path d="M230 204H111V105" class="axis" marker-end="url(#arrow)"/><text x="165" y="187" class="label" text-anchor="middle">X<tspan baseline-shift="sub" font-size="70%">f</tspan> = 0.9</text></svg>