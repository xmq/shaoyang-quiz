<svg xmlns="http://www.w3.org/2000/svg" width="400" height="490" viewBox="0 0 400 490" role="img" aria-labelledby="title"><title id="title">拥塞控制：先固定题设再算</title><defs><style>text{font:18px "Microsoft YaHei",system-ui,sans-serif;fill:#183047}.title{font-size:20px;font-weight:700}.bold{font-weight:700}.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#7b8fa2;stroke-width:1.5}.hi{fill:#d9f3ed;stroke:#19806e;stroke-width:1.5}.blue{fill:#e0edff;stroke:#4c79bf;stroke-width:1.5}.warn{fill:#fff0d3;stroke:#c28a25;stroke-width:1.5}.line{stroke:#37768a;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#e6eef6}.bg{fill:#142234;stroke:#405469}.box{fill:#1a2e43;stroke:#859bad}.hi{fill:#16483f;stroke:#69d7bc}.blue{fill:#193e68;stroke:#92b9fb}.warn{fill:#4b3a1e;stroke:#e4b15a}.line{stroke:#82c5d4}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47879b"/></marker></defs><rect class="bg" x="1" y="1" width="398" height="488" rx="14"/><text x="18" y="32" class="title">拥塞控制：先固定题设再算</text><text x="18" y="67" class="">教材理想轮次模型，单位为MSS。</text><text x="18" y="97" class="">初值cwnd=1，门限ssthresh=8。</text><rect class="hi" x="18" y="116" width="76" height="35" rx="7"/><text x="56.0" y="139.5" class="" text-anchor="middle">轮次</text><rect class="hi" x="94" y="116" width="48" height="35" rx="7"/><text x="118.0" y="139.5" class="" text-anchor="middle">1</text><rect class="hi" x="142" y="116" width="48" height="35" rx="7"/><text x="166.0" y="139.5" class="" text-anchor="middle">2</text><rect class="hi" x="190" y="116" width="48" height="35" rx="7"/><text x="214.0" y="139.5" class="" text-anchor="middle">3</text><rect class="hi" x="238" y="116" width="48" height="35" rx="7"/><text x="262.0" y="139.5" class="" text-anchor="middle">4</text><rect class="hi" x="286" y="116" width="48" height="35" rx="7"/><text x="310.0" y="139.5" class="" text-anchor="middle">5</text><rect class="hi" x="334" y="116" width="48" height="35" rx="7"/><text x="358.0" y="139.5" class="" text-anchor="middle">6</text><rect class="box" x="18" y="151" width="76" height="35" rx="7"/><text x="56.0" y="174.5" class="" text-anchor="middle">cwnd</text><rect class="box" x="94" y="151" width="48" height="35" rx="7"/><text x="118.0" y="174.5" class="" text-anchor="middle">1</text><rect class="box" x="142" y="151" width="48" height="35" rx="7"/><text x="166.0" y="174.5" class="" text-anchor="middle">2</text><rect class="box" x="190" y="151" width="48" height="35" rx="7"/><text x="214.0" y="174.5" class="" text-anchor="middle">4</text><rect class="box" x="238" y="151" width="48" height="35" rx="7"/><text x="262.0" y="174.5" class="" text-anchor="middle">8</text><rect class="box" x="286" y="151" width="48" height="35" rx="7"/><text x="310.0" y="174.5" class="" text-anchor="middle">9</text><rect class="box" x="334" y="151" width="48" height="35" rx="7"/><text x="358.0" y="174.5" class="" text-anchor="middle">10</text><text x="18" y="216" class="">慢开始近似翻倍，到门限后每轮+1。</text><rect class="warn" x="18" y="238" width="364" height="43" rx="7"/><text x="200.0" y="265.5" class="" text-anchor="middle">在cwnd=10时发生超时</text><path class="line" d="M200 286L200 305" marker-end="url(#a)"/><rect class="hi" x="18" y="316" width="182.0" height="35" rx="7"/><text x="109.0" y="339.5" class="" text-anchor="middle">新门限</text><rect class="hi" x="200.0" y="316" width="182.0" height="35" rx="7"/><text x="291.0" y="339.5" class="" text-anchor="middle">重启窗口</text><rect class="box" x="18" y="351" width="182.0" height="35" rx="7"/><text x="109.0" y="374.5" class="" text-anchor="middle">10÷2=5</text><rect class="box" x="200.0" y="351" width="182.0" height="35" rx="7"/><text x="291.0" y="374.5" class="" text-anchor="middle">cwnd=1</text><text x="18" y="418" class="">随后按1 → 2 → 4 → 5 → 6增长。</text><text x="18" y="451" class="">3次重复ACK是另一分支，不能混算。</text></svg>