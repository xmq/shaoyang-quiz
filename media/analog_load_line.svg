<svg xmlns="http://www.w3.org/2000/svg" width="500" height="330" viewBox="0 0 500 330" role="img" aria-labelledby="title desc"><title id="title">直流负载线与静态工作点</title><desc id="desc">VCC为12伏，RC为2千欧，发射极接地。负载线连接UCE为0伏、IC为6毫安与UCE为12伏、IC为0。基极电流20微安、β为100时，Q点位于8伏、2毫安。</desc><defs><style>:root{--ink:#263d49;--muted:#647781;--line:#c6d3d9;--accent:#147b71;--blue:#356c9b;--warm:#b37327;--pale:#e7f3f0}@media(prefers-color-scheme:dark){:root{--ink:#dfebf0;--muted:#a2b8c3;--line:#415965;--accent:#7ed6c6;--blue:#a3c8ed;--warm:#e7bb77;--pale:#203d3c}}text{font:20px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:var(--ink)}.small{font-size:18px;fill:var(--muted)}.label{font-size:20px;font-weight:600}.accent{fill:var(--accent)}.blue{fill:var(--blue)}.warm{fill:var(--warm)}.wire,.axis{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.guide{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 5}.grid{fill:none;stroke:var(--line);stroke-width:1}.curve{fill:none;stroke:var(--accent);stroke-width:2.6}.point{fill:var(--accent)}.resistor{fill:none;stroke:var(--ink);stroke-width:1.8}.accent-line{fill:none;stroke:var(--accent);stroke-width:2.1}</style><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="var(--ink)"/></marker></defs><path d="M62 275H460" class="axis" marker-end="url(#arrow)"/><path d="M62 275V24" class="axis" marker-end="url(#arrow)"/><text x="22" y="24" class="small" text-anchor="start">I<tspan baseline-shift="sub" font-size="70%">C</tspan> / mA</text><text x="492" y="255" class="small" text-anchor="end">U<tspan baseline-shift="sub" font-size="70%">CE</tspan> / V</text><path d="M62 203h350" class="grid"/><text x="48" y="209" class="small" text-anchor="end">2</text><path d="M62 131h350" class="grid"/><text x="48" y="137" class="small" text-anchor="end">4</text><text x="48" y="65" class="small" text-anchor="end">6</text><path d="M178 275v5" class="axis"/><text x="178" y="303" class="small" text-anchor="middle">4</text><path d="M294 275v5" class="axis"/><text x="294" y="303" class="small" text-anchor="middle">8</text><path d="M410 275v5" class="axis"/><text x="410" y="303" class="small" text-anchor="middle">12</text><text x="48" y="298" class="small" text-anchor="end">0</text><path d="M62 59 410 275" class="curve"/><path d="M62 203H294V275" class="guide"/><circle class="point" cx="294" cy="203" r="5"/><text x="307" y="195" class="label accent" text-anchor="start">Q (8 V, 2 mA)</text><text x="188" y="38" class="label" text-anchor="start">U<tspan baseline-shift="sub" font-size="70%">CE</tspan> + I<tspan baseline-shift="sub" font-size="70%">C</tspan>R<tspan baseline-shift="sub" font-size="70%">C</tspan> = 12 V</text><text x="188" y="66" class="small" text-anchor="start">R<tspan baseline-shift="sub" font-size="70%">C</tspan> = 2 kΩ</text></svg>
