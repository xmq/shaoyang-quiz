<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 489" role="img" aria-labelledby="title desc" width="390" height="489"><title id="title">录音与播放：转换方向相反</title><desc id="desc">录音与播放：转换方向相反</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><text class="h" x="20" y="33">录音与播放：转换方向相反</text><rect class="box" x="18" y="56" width="354" height="94" rx="10"/><text class="h" x="32" y="84">录音：声音 → 麦克风</text><text class="t" x="32" y="112">麦克风产生模拟电信号</text><text class="t" x="32" y="138">抗混叠滤波 → ADC得到数字样本</text><path class="line" d="M195 153L195 174"/><rect class="box" x="18" y="179" width="354" height="94" rx="10"/><text class="h" x="32" y="207">保存：PCM样本或压缩音频</text><text class="t" x="32" y="235">8 kHz、8 bit、单声道、10秒</text><text class="t" x="32" y="261">8000×8×1×10÷8＝80 000 B</text><path class="line" d="M195 276L195 297"/><rect class="hot" x="18" y="302" width="354" height="94" rx="10"/><text class="h" x="32" y="330">播放：数字文件 → 声音</text><text class="t" x="32" y="358">解码 → DAC变成模拟信号</text><text class="t" x="32" y="384">功放 → 扬声器产生声音</text><text class="s" x="20" y="425">ADC：模拟到数字；DAC：数字到模拟。</text><text class="s" x="20" y="451">只有麦克风，尚未完成数字化。</text></svg>
