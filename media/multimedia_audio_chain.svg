<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.b{fill:#fff;stroke:#2563eb;stroke-width:3}.h{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.l{stroke:#526777;stroke-width:4}.tt{font:700 27px system-ui;fill:#102a43}.t{font:19px system-ui;fill:#102a43}.s{font:18px system-ui;fill:#526777}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.b{fill:#17283b;stroke:#78b7ff}.h{fill:#173f3c;stroke:#46d6c6}.l{stroke:#9fb0c0}.tt,.t{fill:#edf4fb}.s{fill:#b8c5d1}}</style></defs><rect class="bg" x="10" y="10" width="700" height="380" rx="24"/><text class="tt" x="35" y="55">声音采集与播放是相反方向的转换链</text><g class="t" text-anchor="middle"><rect class="b" x="30" y="120" width="110" height="65" rx="10"/><text x="85" y="158">声波</text><rect class="b" x="175" y="120" width="110" height="65" rx="10"/><text x="230" y="158">麦克风</text><rect class="h" x="320" y="120" width="110" height="65" rx="10"/><text x="375" y="158">ADC</text><rect class="h" x="465" y="120" width="110" height="65" rx="10"/><text x="520" y="158">数字数据</text><rect class="b" x="600" y="120" width="90" height="65" rx="10"/><text x="645" y="158">存储</text></g><path class="l" d="M140 152H175M285 152H320M430 152H465M575 152H600"/><text class="t" x="90" y="270">播放：数字数据 → 解码 → DAC → 放大器 → 扬声器 → 声波</text><text class="s" x="90" y="320">PCM容量 = 采样率 × 位数 × 通道 × 时间 ÷ 8</text><text class="s" x="90" y="355">数字数据仍需电、光或无线物理信号承载</text></svg>
