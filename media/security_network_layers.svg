<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390"><style>.bg{fill:#f8fafc}.z{fill:#fff;stroke:#64748b;stroke-width:2}.d{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.a{stroke:#2563eb;stroke-width:4}.h{font:700 24px system-ui;fill:#102a43}.t{font:18px system-ui;fill:#334155}@media(prefers-color-scheme:dark){.bg{fill:#142234}.z{fill:#17283b;stroke:#647b91}.d{fill:#173f3c;stroke:#46d6c6}.h{fill:#edf4fb}.t{fill:#b8c5d1}}</style><rect class="bg" x="10" y="10" width="700" height="370" rx="22"/><text class="h" x="35" y="50">分区限制暴露面和横向移动</text><g class="z"><rect x="35" y="100" width="130" height="90" rx="14"/><rect x="210" y="100" width="130" height="90" rx="14"/><rect x="385" y="100" width="130" height="90" rx="14"/></g><rect class="d" x="560" y="100" width="125" height="90" rx="14"/><g class="h" text-anchor="middle"><text x="100" y="145">互联网</text><text x="275" y="145">DMZ</text><text x="450" y="145">应用区</text><text x="622" y="145">数据区</text></g><path class="a" d="M165 145H210M340 145H385M515 145H560"/><g class="t" text-anchor="middle"><text x="100" y="175">不可信来源</text><text x="275" y="175">对外服务</text><text x="450" y="175">业务处理</text><text x="622" y="175">最小开放</text></g><text class="t" x="360" y="260" text-anchor="middle">规则必须写清源、目的、服务、方向和条件</text><text class="t" x="360" y="305" text-anchor="middle">HTTPS保护传输，不会自动阻止注入和越权</text></svg>
