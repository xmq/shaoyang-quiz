<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 515" role="img" aria-labelledby="title desc" width="390" height="515"><title id="title">网站分区：不是每层都能直达</title><desc id="desc">网站分区：不是每层都能直达</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><text class="h" x="20" y="33">网站分区：不是每层都能直达</text><rect class="box" x="18" y="56" width="354" height="94" rx="10"/><text class="h" x="32" y="84">互联网 → DMZ反向代理</text><text class="t" x="32" y="112">示例规则：允许TCP 443到代理</text><text class="t" x="32" y="138">默认拒绝直接访问内网数据库</text><path class="line" d="M195 153L195 174"/><rect class="box" x="18" y="179" width="354" height="94" rx="10"/><text class="h" x="32" y="207">DMZ代理 → 应用区</text><text class="t" x="32" y="235">只允许代理访问应用所需端口</text><text class="t" x="32" y="261">示例：代理地址 → 应用TCP 8443</text><path class="line" d="M195 276L195 297"/><rect class="hot" x="18" y="302" width="354" height="94" rx="10"/><text class="h" x="32" y="330">应用区 → 数据区</text><text class="t" x="32" y="358">只允许指定应用访问数据库端口</text><text class="t" x="32" y="384">示例：应用地址 → 数据库TCP 3306</text><text class="s" x="20" y="425">端口数字是示例，实际按业务配置。</text><text class="s" x="20" y="451">每条规则写清源、目的、协议与方向。</text><text class="s" x="20" y="477">HTTPS不能阻止应用内的注入和越权。</text></svg>
