<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 692" role="img" aria-labelledby="title desc" width="390" height="692"><title id="title">同一组样本：采样、量化、编码</title><desc id="desc">幅值坐标从零轴起每等级30单位，等间隔时刻t0到t3的样本0.2、0.8、1.6、2.6按最近整数等级量化成0、1、2、3，再编码为00、01、10、11。零等级的点准确落在零轴。</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><rect class="bg" width="390" height="692" rx="14"/><text class="h" x="20" y="33" text-anchor="start">同一组样本：采样、量化、编码</text><text class="h" x="20" y="68" text-anchor="start">① 采样：等间隔时刻取高度</text><text class="s" x="20" y="97" text-anchor="start">幅值</text><path class="thin" d="M58 210L354 210"/><path class="thin" d="M58 210L58 105"/><text class="s" x="45" y="216" text-anchor="end">0</text><text class="s" x="45" y="186" text-anchor="end">1</text><path class="thin" stroke-dasharray="3 5" d="M58 180H354"/><text class="s" x="45" y="156" text-anchor="end">2</text><path class="thin" stroke-dasharray="3 5" d="M58 150H354"/><text class="s" x="45" y="126" text-anchor="end">3</text><path class="thin" stroke-dasharray="3 5" d="M58 120H354"/><path class="thin" d="M91 210L91 204.0"/><circle class="color" cx="91" cy="204.0" r="5"/><text class="s" x="91" y="192.0" text-anchor="middle">0.2</text><text class="s" x="91" y="237" text-anchor="middle">t0</text><path class="thin" d="M161 210L161 186.0"/><circle class="color" cx="161" cy="186.0" r="5"/><text class="s" x="161" y="174.0" text-anchor="middle">0.8</text><text class="s" x="161" y="237" text-anchor="middle">t1</text><path class="thin" d="M231 210L231 162.0"/><circle class="color" cx="231" cy="162.0" r="5"/><text class="s" x="231" y="150.0" text-anchor="middle">1.6</text><text class="s" x="231" y="237" text-anchor="middle">t2</text><path class="thin" d="M301 210L301 132.0"/><circle class="color" cx="301" cy="132.0" r="5"/><text class="s" x="301" y="120.0" text-anchor="middle">2.6</text><text class="s" x="301" y="237" text-anchor="middle">t3</text><text class="s" x="312" y="264" text-anchor="start">时间</text><text class="h" x="20" y="290" text-anchor="start">② 量化：选择最近的整数等级</text><text class="s" x="20" y="319" text-anchor="start">幅值</text><path class="thin" d="M58 432L354 432"/><path class="thin" d="M58 432L58 327"/><text class="s" x="45" y="438" text-anchor="end">0</text><text class="s" x="45" y="408" text-anchor="end">1</text><path class="thin" stroke-dasharray="3 5" d="M58 402H354"/><text class="s" x="45" y="378" text-anchor="end">2</text><path class="thin" stroke-dasharray="3 5" d="M58 372H354"/><text class="s" x="45" y="348" text-anchor="end">3</text><path class="thin" stroke-dasharray="3 5" d="M58 342H354"/><path class="thin" d="M91 432L91 432"/><circle class="color" cx="91" cy="432" r="5"/><text class="s" x="91" y="420" text-anchor="middle">0</text><text class="s" x="91" y="459" text-anchor="middle">t0</text><path class="thin" d="M161 432L161 402"/><circle class="color" cx="161" cy="402" r="5"/><text class="s" x="161" y="390" text-anchor="middle">1</text><text class="s" x="161" y="459" text-anchor="middle">t1</text><path class="thin" d="M231 432L231 372"/><circle class="color" cx="231" cy="372" r="5"/><text class="s" x="231" y="360" text-anchor="middle">2</text><text class="s" x="231" y="459" text-anchor="middle">t2</text><path class="thin" d="M301 432L301 342"/><circle class="color" cx="301" cy="342" r="5"/><text class="s" x="301" y="330" text-anchor="middle">3</text><text class="s" x="301" y="459" text-anchor="middle">t3</text><text class="s" x="312" y="486" text-anchor="start">时间</text><text class="h" x="20" y="526" text-anchor="start">③ 编码：2 bit表示四个等级</text><text class="t" x="35" y="565" text-anchor="start">0 → 00</text><text class="t" x="210" y="565" text-anchor="start">1 → 01</text><text class="t" x="35" y="597" text-anchor="start">2 → 10</text><text class="t" x="210" y="597" text-anchor="start">3 → 11</text><text class="s" x="20" y="637" text-anchor="start">样本0.2、0.8、1.6、2.6</text><text class="s" x="20" y="665" text-anchor="start">依次归入0、1、2、3，无等距边界。</text></svg>
