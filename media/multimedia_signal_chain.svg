<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.b{fill:#fff;stroke:#2563eb;stroke-width:3}.h{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.l{stroke:#526777;stroke-width:4}.tt{font:700 27px system-ui;fill:#102a43}.t{font:21px system-ui;fill:#102a43}.s{font:18px system-ui;fill:#526777}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.b{fill:#17283b;stroke:#78b7ff}.h{fill:#173f3c;stroke:#46d6c6}.l{stroke:#9fb0c0}.tt,.t{fill:#edf4fb}.s{fill:#b8c5d1}}</style></defs><rect class="bg" x="10" y="10" width="700" height="380" rx="24"/><text class="tt" x="35" y="55">连续信号变成数字数据的三个不同步骤</text><g class="t" text-anchor="middle"><rect class="b" x="40" y="125" width="170" height="75" rx="12"/><text x="125" y="170">采样</text><rect class="h" x="275" y="125" width="170" height="75" rx="12"/><text x="360" y="170">量化</text><rect class="b" x="510" y="125" width="170" height="75" rx="12"/><text x="595" y="170">编码</text></g><path class="l" d="M210 162H275M445 162H510"/><text class="s" x="55" y="255">时间离散：每秒取多少次</text><text class="s" x="275" y="295">幅值离散：落入有限等级</text><text class="s" x="490" y="335">数字表示：写成二进制代码</text><text class="s" x="55" y="365">采样率和量化位数解决不同问题，不能互相替代</text></svg>
