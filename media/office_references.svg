<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 292" width="520" height="292" role="img" aria-labelledby="title desc"><title id="title">混合引用从D2复制到E3</title><desc id="desc">公式从D2向右一列、向下一行复制到E3。B列固定而行改变，第一行固定而列改变，原公式=$B2*C$1变为=$B3*D$1。</desc><defs><style>
:root{--ink:#243c47;--muted:#5e7580;--line:#8aa0aa;--paper:#fff;--accent:#147d73;--soft:#e9f5f1;--blue:#376e9c;--blue-soft:#edf4fa;--orange:#a56619}
text{font:20px system-ui,"Microsoft YaHei",sans-serif;fill:var(--ink)}.small{font-size:18px;fill:var(--muted)}.strong{font-weight:650}.accent{fill:var(--accent)}.wire{fill:none;stroke:var(--line);stroke-width:1.8}.path{fill:none;stroke:var(--accent);stroke-width:2.4}.cell{fill:var(--paper);stroke:var(--line);stroke-width:1}.node{fill:var(--paper);stroke:var(--ink);stroke-width:1.8}.hot{fill:var(--soft);stroke:var(--accent);stroke-width:1.8}.blue{fill:var(--blue-soft);stroke:var(--blue);stroke-width:1.8}.return{fill:none;stroke:var(--orange);stroke-width:1.8;stroke-dasharray:5 4}
@media(prefers-color-scheme:dark){:root{--ink:#e7eff2;--muted:#afc0c7;--line:#849ba6;--paper:#18252c;--accent:#83d7c9;--soft:#203c3b;--blue:#a9cceb;--blue-soft:#243b4a;--orange:#e7b777}}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="var(--accent)"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="var(--orange)"/></marker></defs><text x="110" y="28" class="strong" text-anchor="middle">B</text><text x="210" y="28" class="strong" text-anchor="middle">C</text><text x="310" y="28" class="strong" text-anchor="middle">D</text><text x="410" y="28" class="strong" text-anchor="middle">E</text><text x="40" y="70" class="small" text-anchor="middle">1</text><rect class="cell" x="60" y="43" width="100" height="40"/><rect class="cell" x="160" y="43" width="100" height="40"/><rect class="cell" x="260" y="43" width="100" height="40"/><rect class="cell" x="360" y="43" width="100" height="40"/><text x="40" y="110" class="small" text-anchor="middle">2</text><rect class="cell" x="60" y="83" width="100" height="40"/><rect class="cell" x="160" y="83" width="100" height="40"/><rect class="blue" x="260" y="83" width="100" height="40"/><rect class="cell" x="360" y="83" width="100" height="40"/><text x="40" y="150" class="small" text-anchor="middle">3</text><rect class="cell" x="60" y="123" width="100" height="40"/><rect class="cell" x="160" y="123" width="100" height="40"/><rect class="cell" x="260" y="123" width="100" height="40"/><rect class="hot" x="360" y="123" width="100" height="40"/><text x="40" y="190" class="small" text-anchor="middle">4</text><rect class="cell" x="60" y="163" width="100" height="40"/><rect class="cell" x="160" y="163" width="100" height="40"/><rect class="cell" x="260" y="163" width="100" height="40"/><rect class="cell" x="360" y="163" width="100" height="40"/><text x="310" y="110" class="strong" text-anchor="middle">D2</text><text x="410" y="150" class="strong accent" text-anchor="middle">E3</text><path class="path" d="M330 113L380 135" marker-end="url(#arrow)"/><text x="260" y="230" class="small" text-anchor="middle">向右1列、向下1行</text><text x="55" y="270" class="strong" text-anchor="start">D2  =$B2*C$1</text><text x="305" y="270" class="strong accent" text-anchor="start">E3  =$B3*D$1</text><path class="path" d="M260 261H286" marker-end="url(#arrow)"/></svg>
