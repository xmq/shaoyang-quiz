<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 627" role="img" aria-labelledby="title desc"><title id="title">复制公式：D2 → E3，右1、下1</title><desc id="desc">带B到E列和1到4行坐标的实际单元格网格，D2与E3高亮，折线箭头先向右一列再向下一行。原公式=$B2*C$1复制后为=$B3*D$1，B列固定而行2变3，C列变D而行1固定。</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><rect class="bg" width="390" height="627" rx="14"/><text class="h" x="20" y="33" text-anchor="start">复制公式：D2 → E3，右1、下1</text><text class="h" x="20" y="67" text-anchor="start">先在表格上看公式移到了哪里</text><rect class="box" x="62" y="91" width="75" height="36" rx="0"/><text class="t" x="99.5" y="116" text-anchor="middle">B</text><rect class="box" x="137" y="91" width="75" height="36" rx="0"/><text class="t" x="174.5" y="116" text-anchor="middle">C</text><rect class="box" x="212" y="91" width="75" height="36" rx="0"/><text class="t" x="249.5" y="116" text-anchor="middle">D</text><rect class="box" x="287" y="91" width="75" height="36" rx="0"/><text class="t" x="324.5" y="116" text-anchor="middle">E</text><text class="t" x="42" y="157" text-anchor="middle">1</text><rect class="box" x="62" y="127" width="75" height="48" rx="0"/><rect class="box" x="137" y="127" width="75" height="48" rx="0"/><rect class="box" x="212" y="127" width="75" height="48" rx="0"/><rect class="box" x="287" y="127" width="75" height="48" rx="0"/><text class="t" x="42" y="205" text-anchor="middle">2</text><rect class="box" x="62" y="175" width="75" height="48" rx="0"/><rect class="box" x="137" y="175" width="75" height="48" rx="0"/><rect class="hot" x="212" y="175" width="75" height="48" rx="0"/><rect class="box" x="287" y="175" width="75" height="48" rx="0"/><text class="h" x="249.5" y="205" text-anchor="middle">D2</text><text class="t" x="42" y="253" text-anchor="middle">3</text><rect class="box" x="62" y="223" width="75" height="48" rx="0"/><rect class="box" x="137" y="223" width="75" height="48" rx="0"/><rect class="box" x="212" y="223" width="75" height="48" rx="0"/><rect class="hot" x="287" y="223" width="75" height="48" rx="0"/><text class="h" x="324.5" y="253" text-anchor="middle">E3</text><text class="t" x="42" y="301" text-anchor="middle">4</text><rect class="box" x="62" y="271" width="75" height="48" rx="0"/><rect class="box" x="137" y="271" width="75" height="48" rx="0"/><rect class="box" x="212" y="271" width="75" height="48" rx="0"/><rect class="box" x="287" y="271" width="75" height="48" rx="0"/><path class="line" d="M249.5 182H324.5V230"/><text class="h" x="20" y="364" text-anchor="start">D2 原公式：=$B2*C$1</text><text class="h" x="20" y="398" text-anchor="start">E3 新公式：=$B3*D$1</text><path class="thin" d="M40 418L352 418"/><text class="h" x="20" y="450" text-anchor="start">右1列、下1行；分别移动引用：</text><text class="t" x="20" y="484" text-anchor="start">$B2 → $B3：B列固定，行2→3</text><text class="t" x="20" y="518" text-anchor="start">C$1 → D$1：列C→D，第1行固定</text><text class="s" x="20" y="565" text-anchor="start">跟一步：若复制到F4，先算位移。</text><text class="s" x="20" y="597" text-anchor="start">右2、下2，公式为 =$B4*E$1。</text></svg>
