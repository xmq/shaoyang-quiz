<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.cell{fill:#fff;stroke:#64748b;stroke-width:2}.fix{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.move{stroke:#2563eb;stroke-width:5;fill:none}.tt{font:700 27px system-ui;fill:#102a43}.t{font:22px ui-monospace;fill:#102a43}.s{font:18px system-ui;fill:#526777}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.cell{fill:#17283b;stroke:#647b91}.fix{fill:#173f3c;stroke:#46d6c6}.move{stroke:#78b7ff}.tt,.t{fill:#edf4fb}.s{fill:#b8c5d1}}</style></defs><rect class="bg" x="10" y="10" width="700" height="380" rx="24"/><text class="tt" x="35" y="55">复制公式：先看移动量，再看$固定哪一侧</text><rect class="cell" x="55" y="105" width="270" height="95" rx="12"/><text class="s" x="80" y="135">D2 原公式</text><text class="t" x="190" y="175" text-anchor="middle">=$B2*C$1</text><path class="move" d="M325 152H400"/><text class="s" x="338" y="135">右1 下1</text><rect class="fix" x="400" y="105" width="270" height="95" rx="12"/><text class="s" x="425" y="135">E3 新公式</text><text class="t" x="535" y="175" text-anchor="middle">=$B3*D$1</text><text class="t" x="70" y="260">$B2：列B固定，行随下移　→　$B3</text><text class="t" x="70" y="310">C$1：列随右移，行1固定　→　D$1</text><text class="s" x="70" y="355">$不锁内容，只控制公式复制时地址怎样变化</text></svg>
