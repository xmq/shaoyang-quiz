<svg xmlns="http://www.w3.org/2000/svg" width="360" height="460" viewBox="0 0 360 460" role="img" aria-labelledby="title"><title id="title">稳压：比较采样与基准</title>
<style>svg{--ink:#233b49;--accent:#08796e;--soft:#e8f4f1;--muted:#536d7c;color:var(--ink);font:14px system-ui,"Microsoft YaHei",sans-serif}text{fill:currentColor}.w{stroke:var(--ink);stroke-width:1.7;fill:none}.a{stroke:var(--accent);stroke-width:2;fill:none}.soft{fill:var(--soft);stroke:var(--accent);stroke-width:1.4}.muted{fill:var(--muted)}@media(prefers-color-scheme:dark){svg{--ink:#e0edf2;--accent:#75d2bd;--soft:#173d39;--muted:#b3c4cf}}</style><defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--accent)"/></marker></defs>
<text x="12" y="25" font-size="17" text-anchor="start">稳压：比较采样与基准</text>
<rect x="112" y="80" width="92" height="43" class="w"/>
<text x="158.0" y="106.5" font-size="14" text-anchor="middle">串联调整管</text>
<path class="w" d="M20 101L112 101"/>
<text x="15" y="85" font-size="14" text-anchor="start">Ui 12V</text>
<path class="w" d="M204 101L290 101"/>
<text x="298" y="107" font-size="14" text-anchor="start">Uo</text>
<path class="w" d="M290 125L290 133"/>
<rect x="285" y="133" width="10" height="26" class="w"/>
<path class="w" d="M290 159L290 167"/>
<text x="299" y="150.0" font-size="12" text-anchor="start">R上3k</text>
<path class="w" d="M290 101L290 125"/>
<path class="w" d="M290 167L290 195"/>
<path class="w" d="M290 195L290 203"/>
<rect x="285" y="203" width="10" height="26" class="w"/>
<path class="w" d="M290 229L290 237"/>
<text x="299" y="220.0" font-size="12" text-anchor="start">R下1k</text>
<path class="w" d="M290 255L290 263"/>
<path class="w" d="M280 263L300 263"/>
<path class="w" d="M284 268L296 268"/>
<path class="w" d="M288 273L292 273"/>
<path class="w" d="M290 237L290 255"/>
<circle cx="290" cy="183" r="2.6" fill="var(--ink)"/>
<path class="w" d="M290 183L205 183"/>
<rect x="82" y="170" width="123" height="60" class="soft"/>
<text x="143.5" y="205.0" font-size="14" text-anchor="middle">误差放大器</text>
<path class="w" d="M40 202L82 202"/>
<text x="12" y="258" font-size="14" text-anchor="start">Vref 2.5 V</text>
<text x="64" y="195" font-size="13" text-anchor="start">+</text>
<text x="209" y="176" font-size="13" text-anchor="start">−</text>
<path class="a" d="M143 170L143 124" marker-end="url(#arr)"/>
<text x="150" y="146" font-size="12" text-anchor="start">增强导通</text>
<path class="w" d="M40 202L40 235"/>
<text x="202" y="208" font-size="12" text-anchor="start">vf</text>
<text x="12" y="300" font-size="14" text-anchor="start">vf≈Vref，Uo=2.5×(1+3/1)=10V</text>
<text x="12" y="330" font-size="14" text-anchor="start">输出下降→vf下降→调整管增强导通。</text>
<text x="12" y="360" font-size="14" text-anchor="start">负载在Uo与0V间；采样不代替负载供电。</text>
<text x="12" y="400" font-size="14" text-anchor="start">输入12V、IL0.2A，主要管耗0.4W。</text>
<text x="12" y="431" font-size="14" text-anchor="start">输入只有9V时，不能仍宣称输出10V。</text>
</svg>