<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-labelledby="title desc" width="400" height="500"><title id="title">遍历：先确定何时访问根</title><desc id="desc">遍历：先确定何时访问根；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><text x="22" y="33" class="title" text-anchor="start">遍历：先确定何时访问根</text><path class="edge" d="M200 88L110 160"/><path class="edge" d="M200 88L290 160"/><path class="edge" d="M110 160L55 238"/><path class="edge" d="M110 160L165 238"/><path class="edge" d="M290 160L345 238"/><circle cx="200" cy="88" r="23" class="hi"/><text x="200" y="94" class="mono" text-anchor="middle">A</text><circle cx="110" cy="160" r="23" class="hi"/><text x="110" y="166" class="mono" text-anchor="middle">B</text><circle cx="290" cy="160" r="23" class="hi"/><text x="290" y="166" class="mono" text-anchor="middle">C</text><circle cx="55" cy="238" r="23" class="hi"/><text x="55" y="244" class="mono" text-anchor="middle">D</text><circle cx="165" cy="238" r="23" class="hi"/><text x="165" y="244" class="mono" text-anchor="middle">E</text><circle cx="345" cy="238" r="23" class="hi"/><text x="345" y="244" class="mono" text-anchor="middle">F</text><text x="22" y="300" class="" text-anchor="start">先序 根左右：A B D E C F</text><text x="22" y="327" class="" text-anchor="start">中序 左根右：D B E A C F</text><text x="22" y="354" class="" text-anchor="start">后序 左右根：D E B F C A</text><text x="22" y="381" class="" text-anchor="start">层序 用队列：A B C D E F</text><text x="22" y="408" class="" text-anchor="start">如中序处理 B 子树：先 D，再 B，再 E。</text><text x="22" y="435" class="" text-anchor="start">返回 A 后，才开始 C 子树。</text></svg>