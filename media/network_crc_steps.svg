<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" role="img" aria-labelledby="title" width="400" height="480"><title id="title">CRC：每次只对齐最高位异或</title><defs><style>text{font:18px "Microsoft YaHei",system-ui,sans-serif;fill:#183047}.title{font-size:20px;font-weight:700}.bold{font-weight:700}.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#7b8fa2;stroke-width:1.5}.hi{fill:#d9f3ed;stroke:#19806e;stroke-width:1.5}.blue{fill:#e0edff;stroke:#4c79bf;stroke-width:1.5}.warn{fill:#fff0d3;stroke:#c28a25;stroke-width:1.5}.line{stroke:#37768a;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#e6eef6}.bg{fill:#142234;stroke:#405469}.box{fill:#1a2e43;stroke:#859bad}.hi{fill:#16483f;stroke:#69d7bc}.blue{fill:#193e68;stroke:#92b9fb}.warn{fill:#4b3a1e;stroke:#e4b15a}.line{stroke:#82c5d4}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47879b"/></marker></defs><text x="18" y="32" class="title">CRC：每次只对齐最高位异或</text><text x="18" y="68" class="">数据1101，生成串1011，先补3个0。</text><rect class="hi" x="18" y="87" width="128" height="35" rx="7"/><text x="82.0" y="110.5" class="" text-anchor="middle">当前被除数</text><rect class="hi" x="146" y="87" width="118" height="35" rx="7"/><text x="205.0" y="110.5" class="" text-anchor="middle">对齐生成串</text><rect class="hi" x="264" y="87" width="118" height="35" rx="7"/><text x="323.0" y="110.5" class="" text-anchor="middle">异或后</text><rect class="box" x="18" y="122" width="128" height="35" rx="7"/><text x="82.0" y="145.5" class="" text-anchor="middle">1101000</text><rect class="box" x="146" y="122" width="118" height="35" rx="7"/><text x="205.0" y="145.5" class="" text-anchor="middle">1011000</text><rect class="box" x="264" y="122" width="118" height="35" rx="7"/><text x="323.0" y="145.5" class="" text-anchor="middle">0110000</text><rect class="box" x="18" y="157" width="128" height="35" rx="7"/><text x="82.0" y="180.5" class="" text-anchor="middle">0110000</text><rect class="box" x="146" y="157" width="118" height="35" rx="7"/><text x="205.0" y="180.5" class="" text-anchor="middle">0101100</text><rect class="box" x="264" y="157" width="118" height="35" rx="7"/><text x="323.0" y="180.5" class="" text-anchor="middle">0011100</text><rect class="box" x="18" y="192" width="128" height="35" rx="7"/><text x="82.0" y="215.5" class="" text-anchor="middle">0011100</text><rect class="box" x="146" y="192" width="118" height="35" rx="7"/><text x="205.0" y="215.5" class="" text-anchor="middle">0010110</text><rect class="box" x="264" y="192" width="118" height="35" rx="7"/><text x="323.0" y="215.5" class="" text-anchor="middle">0001010</text><rect class="box" x="18" y="227" width="128" height="35" rx="7"/><text x="82.0" y="250.5" class="" text-anchor="middle">0001010</text><rect class="box" x="146" y="227" width="118" height="35" rx="7"/><text x="205.0" y="250.5" class="" text-anchor="middle">0001011</text><rect class="box" x="264" y="227" width="118" height="35" rx="7"/><text x="323.0" y="250.5" class="" text-anchor="middle">0000001</text><text x="18" y="298" class="">余数固定取3位：001，前导0不能丢。</text><rect class="hi" x="18" y="321" width="364" height="43" rx="7"/><text x="200.0" y="348.5" class="" text-anchor="middle">发送：原数据1101 + 校验001</text><text x="18" y="405" class="">接收端：1101001 ÷ 1011，余数为0。</text><text x="18" y="445" class="">余数0表示未检出差错，不是绝对无错。</text></svg>