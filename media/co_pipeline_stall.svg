<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 510" role="img" aria-labelledby="title" width="400" height="510"><title id="title">数据相关：I2何时拿到R1？</title><defs><style>text{font:18px "Microsoft YaHei",system-ui,sans-serif;fill:#183047}.title{font-size:20px;font-weight:700}.bold{font-weight:700}.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#7b8fa2;stroke-width:1.5}.hi{fill:#d9f3ed;stroke:#19806e;stroke-width:1.5}.blue{fill:#e0edff;stroke:#4c79bf;stroke-width:1.5}.warn{fill:#fff0d3;stroke:#c28a25;stroke-width:1.5}.line{stroke:#37768a;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#e6eef6}.bg{fill:#142234;stroke:#405469}.box{fill:#1a2e43;stroke:#859bad}.hi{fill:#16483f;stroke:#69d7bc}.blue{fill:#193e68;stroke:#92b9fb}.warn{fill:#4b3a1e;stroke:#e4b15a}.line{stroke:#82c5d4}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47879b"/></marker></defs><text x="18" y="32" class="title">数据相关：I2何时拿到R1？</text><text x="18" y="68" class="">I1：ADD R1,R2,R3</text><text x="18" y="100" class="">I2：SUB R4,R1,R5（要用I1结果）</text><text x="18" y="134" class="">假设无转发，WB前半写，ID后半读。</text><rect class="hi" x="18" y="151" width="60" height="35" rx="7"/><text x="48.0" y="174.5" class="" text-anchor="middle">拍</text><rect class="hi" x="78" y="151" width="146" height="35" rx="7"/><text x="151.0" y="174.5" class="" text-anchor="middle">I1</text><rect class="hi" x="224" y="151" width="158" height="35" rx="7"/><text x="303.0" y="174.5" class="" text-anchor="middle">I2</text><rect class="box" x="18" y="186" width="60" height="35" rx="7"/><text x="48.0" y="209.5" class="" text-anchor="middle">1</text><rect class="box" x="78" y="186" width="146" height="35" rx="7"/><text x="151.0" y="209.5" class="" text-anchor="middle">IF</text><rect class="box" x="224" y="186" width="158" height="35" rx="7"/><text x="303.0" y="209.5" class="" text-anchor="middle">—</text><rect class="box" x="18" y="221" width="60" height="35" rx="7"/><text x="48.0" y="244.5" class="" text-anchor="middle">2</text><rect class="box" x="78" y="221" width="146" height="35" rx="7"/><text x="151.0" y="244.5" class="" text-anchor="middle">ID</text><rect class="box" x="224" y="221" width="158" height="35" rx="7"/><text x="303.0" y="244.5" class="" text-anchor="middle">IF</text><rect class="box" x="18" y="256" width="60" height="35" rx="7"/><text x="48.0" y="279.5" class="" text-anchor="middle">3</text><rect class="box" x="78" y="256" width="146" height="35" rx="7"/><text x="151.0" y="279.5" class="" text-anchor="middle">EX</text><rect class="box" x="224" y="256" width="158" height="35" rx="7"/><text x="303.0" y="279.5" class="" text-anchor="middle">ID等待</text><rect class="box" x="18" y="291" width="60" height="35" rx="7"/><text x="48.0" y="314.5" class="" text-anchor="middle">4</text><rect class="box" x="78" y="291" width="146" height="35" rx="7"/><text x="151.0" y="314.5" class="" text-anchor="middle">MEM</text><rect class="box" x="224" y="291" width="158" height="35" rx="7"/><text x="303.0" y="314.5" class="" text-anchor="middle">ID等待</text><rect class="box" x="18" y="326" width="60" height="35" rx="7"/><text x="48.0" y="349.5" class="" text-anchor="middle">5</text><rect class="box" x="78" y="326" width="146" height="35" rx="7"/><text x="151.0" y="349.5" class="" text-anchor="middle">WB写R1</text><rect class="box" x="224" y="326" width="158" height="35" rx="7"/><text x="303.0" y="349.5" class="" text-anchor="middle">ID读新R1</text><rect class="box" x="18" y="361" width="60" height="35" rx="7"/><text x="48.0" y="384.5" class="" text-anchor="middle">6</text><rect class="box" x="78" y="361" width="146" height="35" rx="7"/><text x="151.0" y="384.5" class="" text-anchor="middle">—</text><rect class="box" x="224" y="361" width="158" height="35" rx="7"/><text x="303.0" y="384.5" class="" text-anchor="middle">EX</text><rect class="box" x="18" y="396" width="60" height="35" rx="7"/><text x="48.0" y="419.5" class="" text-anchor="middle">7</text><rect class="box" x="78" y="396" width="146" height="35" rx="7"/><text x="151.0" y="419.5" class="" text-anchor="middle">—</text><rect class="box" x="224" y="396" width="158" height="35" rx="7"/><text x="303.0" y="419.5" class="" text-anchor="middle">MEM</text><rect class="box" x="18" y="431" width="60" height="35" rx="7"/><text x="48.0" y="454.5" class="" text-anchor="middle">8</text><rect class="box" x="78" y="431" width="146" height="35" rx="7"/><text x="151.0" y="454.5" class="" text-anchor="middle">—</text><rect class="box" x="224" y="431" width="158" height="35" rx="7"/><text x="303.0" y="454.5" class="" text-anchor="middle">WB</text><text x="18" y="494" class="">有转发可更早供数，不能照搬停顿数。</text></svg>