<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430"><defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.b{fill:#fff;stroke:#64748b;stroke-width:2}.h{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.a{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#m)}.tt{font:700 24px system-ui;fill:#102a43}.t{font:18px system-ui;fill:#334155}.s{font:15px system-ui;fill:#475569}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.b{fill:#17283b;stroke:#647b91}.h{fill:#173f3c;stroke:#46d6c6}.tt{fill:#edf4fb}.t{fill:#d2dce6}.s{fill:#b8c5d1}}</style><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#2563eb"/></marker></defs><rect class="bg" x="12" y="12" width="876" height="406" rx="24"/><text class="tt" x="45" y="58">链式哈希怎样暴露历史改动</text><rect class="b" x="45" y="125" width="210" height="95" rx="14"/><text class="t" x="150.0" y="159" text-anchor="middle">区块 101</text><text class="s" x="150.0" y="185" text-anchor="middle">数据 A｜前块哈希</text><path class="a" d="M255 172H292"/><rect class="h" x="300" y="125" width="210" height="95" rx="14"/><text class="t" x="405.0" y="159" text-anchor="middle">区块 102</text><text class="s" x="405.0" y="185" text-anchor="middle">数据 B｜101哈希</text><path class="a" d="M510 172H547"/><rect class="b" x="555" y="125" width="210" height="95" rx="14"/><text class="t" x="660.0" y="159" text-anchor="middle">区块 103</text><text class="s" x="660.0" y="185" text-anchor="middle">数据 C｜102哈希</text><text class="t" x="450" y="285" text-anchor="middle">修改区块101 → 其哈希变化 → 区块102保存的前块哈希不匹配</text><text class="s" x="450" y="335" text-anchor="middle">链式校验能发现改动，但不能保证最初写入的现实事实正确</text></svg>