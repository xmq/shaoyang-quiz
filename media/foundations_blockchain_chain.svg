<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 489" role="img" aria-labelledby="title desc" width="390" height="489"><title id="title">旧记录改动，链上哪里会变？</title><desc id="desc">旧记录改动，链上哪里会变？</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><rect class="bg" width="390" height="489" rx="14"/><text class="h" x="20" y="33">旧记录改动，链上哪里会变？</text><rect class="box" x="18" y="56" width="354" height="68" rx="10"/><text class="h" x="32" y="84">区块101：记录“转账10元”</text><text class="t" x="32" y="112">本块哈希记作 H101</text><path class="line" d="M195 127L195 148"/><rect class="box" x="18" y="153" width="354" height="94" rx="10"/><text class="h" x="32" y="181">区块102：保存前块哈希H101</text><text class="t" x="32" y="209">本块哈希H102也包含这项内容</text><text class="t" x="32" y="235">区块103再引用H102</text><path class="line" d="M195 250L195 271"/><rect class="hot" x="18" y="276" width="354" height="94" rx="10"/><text class="h" x="32" y="304">把101改成“转账100元”</text><text class="t" x="32" y="332">重新计算得H101′，不再等于H101</text><text class="t" x="32" y="358">102中旧引用与新哈希不匹配</text><text class="s" x="20" y="399">哈希只是缩写示意，不是真实哈希值。</text><text class="s" x="20" y="425">若想重算后续，还受共识和副本约束。</text><text class="s" x="20" y="451">链式校验不能保证上链内容本来真实。</text></svg>
