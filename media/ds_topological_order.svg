<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" role="img" aria-labelledby="title desc" width="400" height="350"><title id="title">箭头：先修课 → 后续课</title><desc id="desc">箭头：先修课 → 后续课；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><rect x="1" y="1" width="398" height="348" rx="12" class="bg"/><text x="22" y="33" class="title" text-anchor="start">箭头：先修课 → 后续课</text><circle cx="65" cy="95" r="23" class="hi"/><text x="65" y="101" class="mono" text-anchor="middle">A</text><circle cx="65" cy="240" r="23" class="hi"/><text x="65" y="246" class="mono" text-anchor="middle">B</text><circle cx="205" cy="95" r="23" class="hi"/><text x="205" y="101" class="mono" text-anchor="middle">C</text><circle cx="205" cy="240" r="23" class="hi"/><text x="205" y="246" class="mono" text-anchor="middle">D</text><circle cx="345" cy="165" r="23" class="hi"/><text x="345" y="171" class="mono" text-anchor="middle">E</text><path class="line" d="M88 95L180 95"/><path class="line" d="M83 112L185 222"/><path class="line" d="M88 240L180 240"/><path class="line" d="M226 106L325 154"/><path class="line" d="M226 229L325 177"/><text x="22" y="305" class="" text-anchor="start">先选入度0的 A 或 B；删去其出边。</text><text x="22" y="332" class="" text-anchor="start">例如 A,B,C,D,E 是一种合法次序。</text></svg>