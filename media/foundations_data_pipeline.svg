<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 463" role="img" aria-labelledby="title desc" width="390" height="463"><title id="title">原始成绩，怎样变成可靠均分？</title><desc id="desc">原始成绩，怎样变成可靠均分？</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><text class="h" x="20" y="33">原始成绩，怎样变成可靠均分？</text><rect class="box" x="18" y="56" width="354" height="68" rx="10"/><text class="h" x="32" y="84">采集：读取三条成绩记录</text><text class="t" x="32" y="112">学号01：80；01：80；02：缺失</text><path class="line" d="M195 127L195 148"/><rect class="box" x="18" y="153" width="354" height="94" rx="10"/><text class="h" x="32" y="181">清洗：去重并核实缺失</text><text class="t" x="32" y="209">01只保留一条；查到02实际为60</text><text class="t" x="32" y="235">不能随意把缺失填成0</text><path class="line" d="M195 250L195 271"/><rect class="hot" x="18" y="276" width="354" height="94" rx="10"/><text class="h" x="32" y="304">分析与应用</text><text class="t" x="32" y="332">均分：(80＋60)÷2＝70</text><text class="t" x="32" y="358">发布班级汇总，不公开个人明细</text><text class="s" x="20" y="399">原始值、修正原因和来源应留痕。</text><text class="s" x="20" y="425">错误数据再多，也不能保证结论可靠。</text></svg>
