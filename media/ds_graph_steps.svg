<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" role="img" aria-labelledby="title desc"><title id="title">DFS回退与BFS队列</title><desc id="desc">邻接点按字母升序。DFS访问ABDEFC，D无新邻点时回退B；BFS访问ABCDEF，队列逐步从BC变CDE、DEF。</desc><defs><style>
:root{--ink:#243c47;--muted:#5e7580;--line:#8aa0aa;--paper:#fff;--accent:#147d73;--soft:#e9f5f1;--blue:#376e9c;--blue-soft:#edf4fa;--orange:#a56619}
text{font:20px system-ui,"Microsoft YaHei",sans-serif;fill:var(--ink)}.small{font-size:18px;fill:var(--muted)}.strong{font-weight:650}.accent{fill:var(--accent)}.wire{fill:none;stroke:var(--line);stroke-width:1.8}.path{fill:none;stroke:var(--accent);stroke-width:2.4}.cell{fill:var(--paper);stroke:var(--line);stroke-width:1}.node{fill:var(--paper);stroke:var(--ink);stroke-width:1.8}.hot{fill:var(--soft);stroke:var(--accent);stroke-width:1.8}.blue{fill:var(--blue-soft);stroke:var(--blue);stroke-width:1.8}.return{fill:none;stroke:var(--orange);stroke-width:1.8;stroke-dasharray:5 4}
@media(prefers-color-scheme:dark){:root{--ink:#e7eff2;--muted:#afc0c7;--line:#849ba6;--paper:#18252c;--accent:#83d7c9;--soft:#203c3b;--blue:#a9cceb;--blue-soft:#243b4a;--orange:#e7b777}}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="var(--accent)"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="var(--orange)"/></marker></defs><path class="wire" d="M50 90L150 90"/><path class="wire" d="M50 90L50 230"/><path class="wire" d="M150 90L280 60"/><path class="wire" d="M150 90L280 195"/><path class="wire" d="M280 195L150 230"/><path class="wire" d="M50 230L150 230"/><path class="return" d="M277 36C240 8 173 15 155 65" marker-end="url(#back)"/><text x="219" y="46" class="small" text-anchor="middle">回退</text><circle class="node" cx="50" cy="90" r="21"/><text x="50" y="97" class="strong" text-anchor="middle">A</text><circle class="node" cx="150" cy="90" r="21"/><text x="150" y="97" class="strong" text-anchor="middle">B</text><circle class="node" cx="50" cy="230" r="21"/><text x="50" y="237" class="strong" text-anchor="middle">C</text><circle class="node" cx="280" cy="60" r="21"/><text x="280" y="67" class="strong" text-anchor="middle">D</text><circle class="node" cx="280" cy="195" r="21"/><text x="280" y="202" class="strong" text-anchor="middle">E</text><circle class="node" cx="150" cy="230" r="21"/><text x="150" y="237" class="strong" text-anchor="middle">F</text><text x="413" y="76" class="small" text-anchor="middle">展开A后</text><rect class="hot" x="352" y="88" width="39" height="34"/><text x="371.5" y="112" class="" text-anchor="middle">B</text><rect class="cell" x="391" y="88" width="39" height="34"/><text x="410.5" y="112" class="" text-anchor="middle">C</text><text x="413" y="154" class="small" text-anchor="middle">展开B后</text><rect class="hot" x="352" y="166" width="39" height="34"/><text x="371.5" y="190" class="" text-anchor="middle">C</text><rect class="cell" x="391" y="166" width="39" height="34"/><text x="410.5" y="190" class="" text-anchor="middle">D</text><rect class="cell" x="430" y="166" width="39" height="34"/><text x="449.5" y="190" class="" text-anchor="middle">E</text><text x="413" y="232" class="small" text-anchor="middle">展开C后</text><rect class="hot" x="352" y="244" width="39" height="34"/><text x="371.5" y="268" class="" text-anchor="middle">D</text><rect class="cell" x="391" y="244" width="39" height="34"/><text x="410.5" y="268" class="" text-anchor="middle">E</text><rect class="cell" x="430" y="244" width="39" height="34"/><text x="449.5" y="268" class="" text-anchor="middle">F</text><text x="413" y="46" class="strong" text-anchor="middle">BFS队列</text><text x="12" y="319" class="strong" text-anchor="start">DFS</text><path class="path" d="M125 312H155" marker-end="url(#arrow)"/><circle class="hot" cx="104" cy="312" r="18"/><text x="104" y="319" class="strong" text-anchor="middle">A</text><path class="path" d="M199 312H229" marker-end="url(#arrow)"/><circle class="hot" cx="178" cy="312" r="18"/><text x="178" y="319" class="strong" text-anchor="middle">B</text><path class="path" d="M273 312H303" marker-end="url(#arrow)"/><circle class="hot" cx="252" cy="312" r="18"/><text x="252" y="319" class="strong" text-anchor="middle">D</text><path class="path" d="M347 312H377" marker-end="url(#arrow)"/><circle class="hot" cx="326" cy="312" r="18"/><text x="326" y="319" class="strong" text-anchor="middle">E</text><path class="path" d="M421 312H451" marker-end="url(#arrow)"/><circle class="hot" cx="400" cy="312" r="18"/><text x="400" y="319" class="strong" text-anchor="middle">F</text><circle class="hot" cx="474" cy="312" r="18"/><text x="474" y="319" class="strong" text-anchor="middle">C</text><text x="12" y="375" class="strong" text-anchor="start">BFS</text><path class="path" d="M125 368H155" marker-end="url(#arrow)"/><circle class="hot" cx="104" cy="368" r="18"/><text x="104" y="375" class="strong" text-anchor="middle">A</text><path class="path" d="M199 368H229" marker-end="url(#arrow)"/><circle class="hot" cx="178" cy="368" r="18"/><text x="178" y="375" class="strong" text-anchor="middle">B</text><path class="path" d="M273 368H303" marker-end="url(#arrow)"/><circle class="hot" cx="252" cy="368" r="18"/><text x="252" y="375" class="strong" text-anchor="middle">C</text><path class="path" d="M347 368H377" marker-end="url(#arrow)"/><circle class="hot" cx="326" cy="368" r="18"/><text x="326" y="375" class="strong" text-anchor="middle">D</text><path class="path" d="M421 368H451" marker-end="url(#arrow)"/><circle class="hot" cx="400" cy="368" r="18"/><text x="400" y="375" class="strong" text-anchor="middle">E</text><circle class="hot" cx="474" cy="368" r="18"/><text x="474" y="375" class="strong" text-anchor="middle">F</text></svg>
