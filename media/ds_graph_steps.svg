<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 475" role="img" aria-labelledby="title desc"><title id="title">DFS回退，BFS按队列展开</title><desc id="desc">DFS回退，BFS按队列展开；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><rect x="1" y="1" width="398" height="473" rx="12" class="bg"/><text x="22" y="33" class="title" text-anchor="start">DFS回退，BFS按队列展开</text><text x="22" y="75" class="" text-anchor="start">DFS：箭头前进，↶ 表示退回调用处</text><text x="22" y="102" class="" text-anchor="start">A → B → D；D 无新邻点，退回 B</text><text x="22" y="129" class="" text-anchor="start">B → E → F → C；C 无新邻点再回退</text><text x="22" y="156" class="" text-anchor="start">首次访问序列：A B D E F C</text><text x="22" y="215" class="title" text-anchor="start">BFS：每次从队头取一个展开</text><text x="22" y="263" class="" text-anchor="start">初始</text><rect x="155" y="237" width="220" height="33" rx="7" class="box"/><text x="265.0" y="259.5" class="mono" text-anchor="middle">[A]</text><text x="22" y="302" class="" text-anchor="start">展开 A 后</text><rect x="155" y="276" width="220" height="33" rx="7" class="box"/><text x="265.0" y="298.5" class="mono" text-anchor="middle">[B,C]</text><text x="22" y="341" class="" text-anchor="start">展开 B 后</text><rect x="155" y="315" width="220" height="33" rx="7" class="box"/><text x="265.0" y="337.5" class="mono" text-anchor="middle">[C,D,E]</text><text x="22" y="380" class="" text-anchor="start">展开 C 后</text><rect x="155" y="354" width="220" height="33" rx="7" class="box"/><text x="265.0" y="376.5" class="mono" text-anchor="middle">[D,E,F]</text><text x="22" y="439" class="" text-anchor="start">F 在 C 展开时已标记，E 不再重复加入。</text></svg>