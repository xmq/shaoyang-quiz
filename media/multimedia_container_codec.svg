<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.track{fill:#fff;stroke:#2563eb;stroke-width:3}.codec{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.container{fill:#fff7ed;stroke:#d97706;stroke-width:4}.tt{font:700 27px system-ui;fill:#102a43}.t{font:20px system-ui;fill:#102a43}.s{font:18px system-ui;fill:#526777}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.track{fill:#17283b;stroke:#78b7ff}.codec{fill:#173f3c;stroke:#46d6c6}.container{fill:#402d18;stroke:#f4b45f}.tt,.t{fill:#edf4fb}.s{fill:#b8c5d1}}</style></defs><rect class="bg" x="10" y="10" width="700" height="380" rx="24"/><text class="tt" x="35" y="55">编码器决定压缩，容器组织多条轨道</text><g class="t" text-anchor="middle"><rect class="track" x="40" y="110" width="145" height="55" rx="10"/><text x="112" y="145">视频画面</text><rect class="track" x="40" y="185" width="145" height="55" rx="10"/><text x="112" y="220">声音</text><rect class="track" x="40" y="260" width="145" height="55" rx="10"/><text x="112" y="295">字幕</text><rect class="codec" x="260" y="110" width="170" height="70" rx="12"/><text x="345" y="152">H.264 / AAC</text><rect class="container" x="500" y="125" width="170" height="170" rx="18"/><text x="585" y="195">MP4容器</text><text x="585" y="235">视频+音频</text><text x="585" y="270">+字幕</text></g><text class="s" x="245" y="225">压缩/解压</text><text class="s" x="250" y="335">设备支持容器，不等于支持其中每一种编码</text></svg>
