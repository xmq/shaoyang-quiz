<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 437" role="img" aria-labelledby="title desc" width="390" height="437"><title id="title">MP4能打开，为什么仍然无声？</title><desc id="desc">MP4能打开，为什么仍然无声？</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><rect class="bg" width="390" height="437" rx="14"/><text class="h" x="20" y="33">MP4能打开，为什么仍然无声？</text><rect class="box" x="18" y="56" width="354" height="68" rx="10"/><text class="h" x="32" y="84">原始视频帧 → H.264编码</text><text class="t" x="32" y="112">得到一条压缩视频轨道</text><path class="line" d="M195 127L195 148"/><rect class="box" x="18" y="153" width="354" height="68" rx="10"/><text class="h" x="32" y="181">原始声音 → AAC编码</text><text class="t" x="32" y="209">得到一条压缩音频轨道</text><path class="line" d="M195 224L195 245"/><rect class="hot" x="18" y="250" width="354" height="94" rx="10"/><text class="h" x="32" y="278">MP4容器：把轨道组织在一起</text><text class="t" x="32" y="306">视频H.264＋音频AAC＋可选字幕</text><text class="t" x="32" y="332">它不等于某一种固定编码组合</text><text class="s" x="20" y="373">播放器必须既识别容器，又能解码轨道。</text><text class="s" x="20" y="399">若不支持音频编码，就可能有画面无声。</text></svg>
