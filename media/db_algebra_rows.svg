<svg xmlns="http://www.w3.org/2000/svg" width="400" height="470" viewBox="0 0 400 470" role="img" aria-labelledby="title"><title id="title">关系代数：选择取行，投影取列</title><defs><style>text{font:18px "Microsoft YaHei",system-ui,sans-serif;fill:#183047}.title{font-size:20px;font-weight:700}.bold{font-weight:700}.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#7b8fa2;stroke-width:1.5}.hi{fill:#d9f3ed;stroke:#19806e;stroke-width:1.5}.blue{fill:#e0edff;stroke:#4c79bf;stroke-width:1.5}.warn{fill:#fff0d3;stroke:#c28a25;stroke-width:1.5}.line{stroke:#37768a;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#e6eef6}.bg{fill:#142234;stroke:#405469}.box{fill:#1a2e43;stroke:#859bad}.hi{fill:#16483f;stroke:#69d7bc}.blue{fill:#193e68;stroke:#92b9fb}.warn{fill:#4b3a1e;stroke:#e4b15a}.line{stroke:#82c5d4}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47879b"/></marker></defs><rect class="bg" x="1" y="1" width="398" height="468" rx="14"/><text x="18" y="32" class="title">关系代数：选择取行，投影取列</text><rect class="hi" x="18" y="62" width="80" height="35" rx="7"/><text x="58.0" y="85.5" class="" text-anchor="middle">sid</text><rect class="hi" x="98" y="62" width="144" height="35" rx="7"/><text x="170.0" y="85.5" class="" text-anchor="middle">name</text><rect class="hi" x="242" y="62" width="140" height="35" rx="7"/><text x="312.0" y="85.5" class="" text-anchor="middle">dept</text><rect class="box" x="18" y="97" width="80" height="35" rx="7"/><text x="58.0" y="120.5" class="" text-anchor="middle">1</text><rect class="box" x="98" y="97" width="144" height="35" rx="7"/><text x="170.0" y="120.5" class="" text-anchor="middle">小林</text><rect class="box" x="242" y="97" width="140" height="35" rx="7"/><text x="312.0" y="120.5" class="" text-anchor="middle">CS</text><rect class="box" x="18" y="132" width="80" height="35" rx="7"/><text x="58.0" y="155.5" class="" text-anchor="middle">2</text><rect class="box" x="98" y="132" width="144" height="35" rx="7"/><text x="170.0" y="155.5" class="" text-anchor="middle">小周</text><rect class="box" x="242" y="132" width="140" height="35" rx="7"/><text x="312.0" y="155.5" class="" text-anchor="middle">MA</text><rect class="box" x="18" y="167" width="80" height="35" rx="7"/><text x="58.0" y="190.5" class="" text-anchor="middle">3</text><rect class="box" x="98" y="167" width="144" height="35" rx="7"/><text x="170.0" y="190.5" class="" text-anchor="middle">小林</text><rect class="box" x="242" y="167" width="140" height="35" rx="7"/><text x="312.0" y="190.5" class="" text-anchor="middle">CS</text><text x="18" y="247" class="">σ dept=CS：保留第1、3行。</text><path class="line" d="M200 262L200 285" marker-end="url(#a)"/><rect class="hi" x="18" y="300" width="364" height="35" rx="7"/><text x="200.0" y="323.5" class="" text-anchor="middle">π name后的结果</text><rect class="box" x="18" y="335" width="364" height="35" rx="7"/><text x="200.0" y="358.5" class="" text-anchor="middle">小林</text><text x="18" y="408" class="">集合语义去重，同名的“小林”只留一行。</text><text x="18" y="444" class="">SQL若不用DISTINCT，不保证自动去重。</text></svg>