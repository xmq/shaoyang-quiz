<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500"><defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.b{fill:#fff;stroke:#64748b;stroke-width:2}.h{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.l{stroke:#2563eb;stroke-width:4;fill:none}.tt{font:700 25px system-ui;fill:#102a43}.t{font:19px system-ui;fill:#334155}.m{font:18px ui-monospace;fill:#1d4ed8}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.b{fill:#17283b;stroke:#647b91}.h{fill:#173f3c;stroke:#46d6c6}.tt{fill:#edf4fb}.t{fill:#b8c5d1}.m{fill:#a9cbff}}</style></defs><rect class="bg" x="12" y="12" width="876" height="476" rx="24"/><text class="tt" x="45" y="58">查询条件决定索引方式</text><rect class="h" x="65" y="110" width="220" height="105" rx="15"/><rect class="h" x="340" y="110" width="220" height="105" rx="15"/><rect class="b" x="615" y="110" width="220" height="105" rx="15"/><text class="tt" x="175" y="150" text-anchor="middle">等值查询</text><text class="m" x="175" y="188" text-anchor="middle">哈希 / B+树</text><text class="tt" x="450" y="150" text-anchor="middle">范围与排序</text><text class="m" x="450" y="188" text-anchor="middle">B+树</text><text class="tt" x="725" y="150" text-anchor="middle">返回大部分行</text><text class="m" x="725" y="188" text-anchor="middle">可能全表扫描</text><text class="t" x="65" y="285">联合索引还要看列顺序；低选择性列未必单独建普通索引。</text><text class="t" x="65" y="335">索引减少读取，却增加空间和写入维护成本。</text><text class="t" x="65" y="385">索引是性能结构，唯一约束是数据规则，两者作用不同。</text></svg>