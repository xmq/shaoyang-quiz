<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 435" role="img" aria-labelledby="title" width="400" height="435"><title id="title">索引：按有序键缩小查找范围</title><defs><style>text{font:18px "Microsoft YaHei",system-ui,sans-serif;fill:#183047}.title{font-size:20px;font-weight:700}.bold{font-weight:700}.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#7b8fa2;stroke-width:1.5}.hi{fill:#d9f3ed;stroke:#19806e;stroke-width:1.5}.blue{fill:#e0edff;stroke:#4c79bf;stroke-width:1.5}.warn{fill:#fff0d3;stroke:#c28a25;stroke-width:1.5}.line{stroke:#37768a;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#e6eef6}.bg{fill:#142234;stroke:#405469}.box{fill:#1a2e43;stroke:#859bad}.hi{fill:#16483f;stroke:#69d7bc}.blue{fill:#193e68;stroke:#92b9fb}.warn{fill:#4b3a1e;stroke:#e4b15a}.line{stroke:#82c5d4}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47879b"/></marker></defs><rect class="bg" x="1" y="1" width="398" height="433" rx="14"/><text x="18" y="32" class="title">索引：按有序键缩小查找范围</text><text x="18" y="68" class="">假设B+树叶层按学生id排列：</text><rect class="blue" x="85" y="85" width="230" height="44" rx="7"/><text x="200.0" y="113.0" class="" text-anchor="middle">根节点：边界键30</text><path class="line" d="M140 137L93 164" marker-end="url(#a)"/><path class="line" d="M260 137L300 164" marker-end="url(#a)"/><rect class="box" x="18" y="179" width="174" height="44" rx="7"/><text x="105.0" y="207.0" class="" text-anchor="middle">10｜20</text><rect class="hi" x="208" y="179" width="174" height="44" rx="7"/><text x="295.0" y="207.0" class="" text-anchor="middle">30｜40</text><path class="line" d="M192 202L207 202" marker-end="url(#a)"/><text x="18" y="261" class="">查id=30：沿边界找到右叶，不扫全部。</text><text x="18" y="296" class="">查20≤id≤40：定位20，再顺叶向后扫。</text><text x="18" y="331" class="">联合索引(a,b)先按a排，同a内再按b排。</text><text x="18" y="369" class="">只查b未必能走有效的索引查找。</text><text x="18" y="404" class="">返回大部分行时，全表扫描可能更划算。</text></svg>