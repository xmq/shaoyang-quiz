<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 410" role="img" aria-labelledby="title desc" width="400" height="410"><title id="title">归并：每次只比较两队队首</title><desc id="desc">归并：每次只比较两队队首；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><rect x="1" y="1" width="398" height="408" rx="12" class="bg"/><text x="22" y="33" class="title" text-anchor="start">归并：每次只比较两队队首</text><text x="22" y="70" class="" text-anchor="start">两段已排好：[2,5] 与 [3,4]</text><text x="22" y="118" class="" text-anchor="start">2&lt;3，先取2</text><rect x="185" y="92" width="185" height="36" rx="7" class="hi"/><text x="277.5" y="116.0" class="mono" text-anchor="middle">结果 [2]</text><text x="22" y="170" class="" text-anchor="start">5&gt;3，取3</text><rect x="185" y="144" width="185" height="36" rx="7" class="hi"/><text x="277.5" y="168.0" class="mono" text-anchor="middle">结果 [2,3]</text><text x="22" y="222" class="" text-anchor="start">5&gt;4，取4</text><rect x="185" y="196" width="185" height="36" rx="7" class="hi"/><text x="277.5" y="220.0" class="mono" text-anchor="middle">结果 [2,3,4]</text><text x="22" y="274" class="" text-anchor="start">右段空，复制5</text><rect x="185" y="248" width="185" height="36" rx="7" class="hi"/><text x="277.5" y="272.0" class="mono" text-anchor="middle">结果 [2,3,4,5]</text><text x="22" y="355" class="" text-anchor="start">若相等先取左段，可保持原相对次序。</text><text x="22" y="382" class="" text-anchor="start">前提：两段必须已经分别有序。</text></svg>