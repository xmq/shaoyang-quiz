<svg xmlns="http://www.w3.org/2000/svg" width="352" height="462" viewBox="0 0 352 462" role="img" aria-labelledby="t"><title id="t">两种地址，两条不同的取指路径</title><style>text{font-family:system-ui,"Microsoft YaHei",sans-serif;fill:#17313e}.a{fill:#f1f8f7;stroke:#167b79;stroke-width:1.5}@media(prefers-color-scheme:dark){text{fill:#e1f2f4}.a{fill:#18323d;stroke:#69cec3}}</style><text x="16" y="28" font-size="17" font-weight="700">两种地址，两条不同的取指路径</text><rect class="a" x="12" y="48" width="328" height="78" rx="8"/><text x="24" y="71" font-size="16" font-weight="700">机器 PC：程序走到哪里</text><text x="24" y="93" font-size="14">PC=100 → 主存 → IR</text><text x="24" y="112" font-size="14">取4B指令后，机器PC更新为104</text><path d="M176 130v10m-4-4 4 4 4-4" fill="none" stroke="#218884" stroke-width="2"/><rect class="a" x="12" y="144" width="328" height="78" rx="8"/><text x="24" y="167" font-size="16" font-weight="700">微 PC：控制走到哪一步</text><text x="24" y="189" font-size="14">微PC：02装IR → 03分派 → 20</text><text x="24" y="208" font-size="14">20号微指令：操作数地址送MAR</text><path d="M176 226v10m-4-4 4 4 4-4" fill="none" stroke="#218884" stroke-width="2"/><rect class="a" x="12" y="240" width="328" height="78" rx="8"/><text x="24" y="263" font-size="16" font-weight="700">微指令发出实际控制动作</text><text x="24" y="285" font-size="14">操作字段 → 寄存器/ALU/读写</text><text x="24" y="304" font-size="14">条件与下地址字段选择下一微步</text><path d="M176 322v10m-4-4 4 4 4-4" fill="none" stroke="#218884" stroke-width="2"/><rect class="a" x="12" y="336" width="328" height="78" rx="8"/><text x="24" y="359" font-size="16" font-weight="700">完成执行，回公共取指入口</text><text x="24" y="381" font-size="14">微PC回00，机器PC继续程序</text><text x="24" y="400" font-size="14">回微入口不是让用户程序重头运行</text></svg>