<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360"><style>.bg{fill:#f8fafc}.b{fill:#fff;stroke:#64748b;stroke-width:2}.c{fill:#e7f6f4;stroke:#176f68;stroke-width:2}.a{stroke:#2563eb;stroke-width:4}.h{font:700 25px system-ui;fill:#102a43}.t{font:18px system-ui;fill:#334155}@media(prefers-color-scheme:dark){.bg{fill:#142234}.b{fill:#17283b;stroke:#647b91}.c{fill:#173f3c;stroke:#46d6c6}.h{fill:#edf4fb}.t{fill:#b8c5d1}}</style><rect class="bg" x="10" y="10" width="700" height="340" rx="22"/><text class="h" x="35" y="50">一次访问要经过身份、权限和记录</text><g class="b"><rect x="35" y="105" width="140" height="85" rx="14"/><rect x="210" y="105" width="140" height="85" rx="14"/><rect x="385" y="105" width="140" height="85" rx="14"/></g><rect class="c" x="560" y="105" width="125" height="85" rx="14"/><g class="h" text-anchor="middle"><text x="105" y="145">认证</text><text x="280" y="145">授权</text><text x="455" y="145">访问</text><text x="622" y="145">审计</text></g><g class="t" text-anchor="middle"><text x="105" y="175">你是谁</text><text x="280" y="175">能做什么</text><text x="455" y="175">执行并约束</text><text x="622" y="175">做了什么</text></g><path class="a" d="M175 148H210M350 148H385M525 148H560"/><text class="t" x="360" y="260" text-anchor="middle">会话令牌也需保护、过期、退出与撤销</text><text class="t" x="360" y="300" text-anchor="middle">登录成功不等于拥有全部权限</text></svg>
