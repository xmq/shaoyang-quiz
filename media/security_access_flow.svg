<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 463" role="img" aria-labelledby="title desc" width="390" height="463"><title id="title">学生登录成功，能修改成绩吗？</title><desc id="desc">学生登录成功，能修改成绩吗？</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><rect class="bg" width="390" height="463" rx="14"/><text class="h" x="20" y="33">学生登录成功，能修改成绩吗？</text><rect class="box" x="18" y="56" width="354" height="68" rx="10"/><text class="h" x="32" y="84">① 认证：确认是学生小林</text><text class="t" x="32" y="112">密码＋令牌，建立受保护的会话</text><path class="line" d="M195 127L195 148"/><rect class="box" x="18" y="153" width="354" height="94" rx="10"/><text class="h" x="32" y="181">② 授权：核对操作权限</text><text class="t" x="32" y="209">角色=学生；资源=自己的成绩</text><text class="t" x="32" y="235">允许查询；拒绝修改和查他人成绩</text><path class="line" d="M195 250L195 271"/><rect class="hot" x="18" y="276" width="354" height="94" rx="10"/><text class="h" x="32" y="304">③ 执行与审计</text><text class="t" x="32" y="332">记录：小林 / 10:00 / 查询 / 成功</text><text class="t" x="32" y="358">越权请求也应记录拒绝及必要信息</text><text class="s" x="20" y="399">登录成功只通过第一步，不代表全权。</text><text class="s" x="20" y="425">角色权限在服务端检查，不能只藏按钮。</text></svg>
