<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-labelledby="title" width="400" height="280"><title id="title">丢包后先辨别事件（Reno模型）</title><defs><style>text{font:18px "Microsoft YaHei",system-ui,sans-serif;fill:#183047}.title{font-size:20px;font-weight:700}.bold{font-weight:700}.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#7b8fa2;stroke-width:1.5}.hi{fill:#d9f3ed;stroke:#19806e;stroke-width:1.5}.blue{fill:#e0edff;stroke:#4c79bf;stroke-width:1.5}.warn{fill:#fff0d3;stroke:#c28a25;stroke-width:1.5}.line{stroke:#37768a;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#e6eef6}.bg{fill:#142234;stroke:#405469}.box{fill:#1a2e43;stroke:#859bad}.hi{fill:#16483f;stroke:#69d7bc}.blue{fill:#193e68;stroke:#92b9fb}.warn{fill:#4b3a1e;stroke:#e4b15a}.line{stroke:#82c5d4}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47879b"/></marker></defs><text x="18" y="32" class="title">丢包后先辨别事件（Reno模型）</text><rect class="hi" x="18" y="63" width="174" height="35" rx="7"/><text x="105.0" y="86.5" class="" text-anchor="middle">事件</text><rect class="hi" x="192" y="63" width="190" height="35" rx="7"/><text x="287.0" y="86.5" class="" text-anchor="middle">cwnd</text><rect class="box" x="18" y="98" width="174" height="35" rx="7"/><text x="105.0" y="121.5" class="" text-anchor="middle">超时</text><rect class="box" x="192" y="98" width="190" height="35" rx="7"/><text x="287.0" y="121.5" class="" text-anchor="middle">1 MSS</text><rect class="box" x="18" y="133" width="174" height="35" rx="7"/><text x="105.0" y="156.5" class="" text-anchor="middle">3次重复ACK</text><rect class="box" x="192" y="133" width="190" height="35" rx="7"/><text x="287.0" y="156.5" class="" text-anchor="middle">新门限+3 MSS</text><rect class="box" x="18" y="168" width="174" height="35" rx="7"/><text x="105.0" y="191.5" class="" text-anchor="middle">恢复中新ACK</text><rect class="box" x="192" y="168" width="190" height="35" rx="7"/><text x="287.0" y="191.5" class="" text-anchor="middle">降至新门限</text><text x="18" y="247" class="">假设在途量=cwnd≥4 MSS，门限减半。</text></svg>