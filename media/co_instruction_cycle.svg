<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 425" role="img" aria-labelledby="title" width="400" height="425"><title id="title">执行ADD：寄存器如何一步步变</title><defs><style>text{font:18px "Microsoft YaHei",system-ui,sans-serif;fill:#183047}.title{font-size:20px;font-weight:700}.bold{font-weight:700}.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#7b8fa2;stroke-width:1.5}.hi{fill:#d9f3ed;stroke:#19806e;stroke-width:1.5}.blue{fill:#e0edff;stroke:#4c79bf;stroke-width:1.5}.warn{fill:#fff0d3;stroke:#c28a25;stroke-width:1.5}.line{stroke:#37768a;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#e6eef6}.bg{fill:#142234;stroke:#405469}.box{fill:#1a2e43;stroke:#859bad}.hi{fill:#16483f;stroke:#69d7bc}.blue{fill:#193e68;stroke:#92b9fb}.warn{fill:#4b3a1e;stroke:#e4b15a}.line{stroke:#82c5d4}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47879b"/></marker></defs><text x="18" y="32" class="title">执行ADD：寄存器如何一步步变</text><text x="18" y="68" class="">简化指令：ADD R1,R2（R1←R1+R2）</text><rect class="hi" x="18" y="89" width="118" height="35" rx="7"/><text x="77.0" y="112.5" class="" text-anchor="middle">阶段</text><rect class="hi" x="136" y="89" width="246" height="35" rx="7"/><text x="259.0" y="112.5" class="" text-anchor="middle">可观察状态</text><rect class="box" x="18" y="124" width="118" height="35" rx="7"/><text x="77.0" y="147.5" class="" text-anchor="middle">初始</text><rect class="box" x="136" y="124" width="246" height="35" rx="7"/><text x="259.0" y="147.5" class="" text-anchor="middle">PC=100，R1=3，R2=5</text><rect class="box" x="18" y="159" width="118" height="35" rx="7"/><text x="77.0" y="182.5" class="" text-anchor="middle">取指</text><rect class="box" x="136" y="159" width="246" height="35" rx="7"/><text x="259.0" y="182.5" class="" text-anchor="middle">IR←M[100]，PC←104</text><rect class="box" x="18" y="194" width="118" height="35" rx="7"/><text x="77.0" y="217.5" class="" text-anchor="middle">译码/读数</text><rect class="box" x="136" y="194" width="246" height="35" rx="7"/><text x="259.0" y="217.5" class="" text-anchor="middle">识别ADD；读出3和5</text><rect class="box" x="18" y="229" width="118" height="35" rx="7"/><text x="77.0" y="252.5" class="" text-anchor="middle">执行</text><rect class="box" x="136" y="229" width="246" height="35" rx="7"/><text x="259.0" y="252.5" class="" text-anchor="middle">ALU算3+5，结果为8</text><rect class="box" x="18" y="264" width="118" height="35" rx="7"/><text x="77.0" y="287.5" class="" text-anchor="middle">写回</text><rect class="box" x="136" y="264" width="246" height="35" rx="7"/><text x="259.0" y="287.5" class="" text-anchor="middle">R1←8，R2仍为5</text><text x="18" y="349" class="">此例假设指令长4字节、按字节编址。</text><text x="18" y="385" class="">IR存指令，PC指向下一条，不存结果。</text></svg>