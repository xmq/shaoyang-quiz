<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430"><defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.b{fill:#fff;stroke:#64748b;stroke-width:2}.h{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.l{stroke:#2563eb;stroke-width:4;fill:none}.tt{font:700 24px system-ui;fill:#102a43}.t{font:18px system-ui;fill:#334155}.m{font:18px ui-monospace;fill:#1d4ed8}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.b{fill:#17283b;stroke:#647b91}.h{fill:#173f3c;stroke:#46d6c6}.tt{fill:#edf4fb}.t{fill:#b8c5d1}.m{fill:#a9cbff}}</style></defs><rect class="bg" x="12" y="12" width="876" height="406" rx="24"/><text class="tt" x="45" y="58">一条指令怎样经过CPU数据通路</text><rect class="h" x="40" y="125" width="140" height="70" rx="12"/><text class="m" x="110" y="168" text-anchor="middle">取指</text><rect class="b" x="205" y="125" width="140" height="70" rx="12"/><text class="m" x="275" y="168" text-anchor="middle">译码</text><rect class="b" x="370" y="125" width="140" height="70" rx="12"/><text class="m" x="440" y="168" text-anchor="middle">取操作数</text><rect class="h" x="535" y="125" width="140" height="70" rx="12"/><text class="m" x="605" y="168" text-anchor="middle">执行</text><rect class="b" x="700" y="125" width="140" height="70" rx="12"/><text class="m" x="770" y="168" text-anchor="middle">写回</text><path class="l" d="M110 225H770"/><text class="t" x="55" y="290">PC给出指令地址，IR保存当前指令，控制器产生控制信号。</text><text class="t" x="55" y="340">寻址方式决定操作数在哪里；中断通常在指令边界检查。</text></svg>