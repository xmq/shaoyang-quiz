<svg xmlns="http://www.w3.org/2000/svg" width="360" height="280" viewBox="0 0 360 280" role="img" aria-labelledby="title desc"><title id="title">四个DFT频点和负频率映射</title><desc id="desc">四点DFT系数按k为0到3排列；实余弦系数在k1和k3为2，对应200和负200赫兹。</desc><style>svg{color:#20333b;font:15px system-ui,'Microsoft YaHei',sans-serif}text{fill:currentColor}.line{fill:none;stroke:currentColor;stroke-width:1.6}.box{fill:#edf5f4;stroke:#5c8080;stroke-width:1.5}.accent{fill:none;stroke:#167d70;stroke-width:2.3}.fill{fill:#167d70}.muted{fill:#61747b}@media(prefers-color-scheme:dark){svg{color:#e8f0f2}.box{fill:#1b3438;stroke:#8aabb1}.accent{stroke:#73ceba}.fill{fill:#73ceba}.muted{fill:#adbec5}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="12" y="24" font-size="17">DFT数组位置与正负频率</text><text x="12" y="50" font-size="14">fs=800 Hz，N=4；x=[1,0,−1,0]</text><text x="12" y="72" font-size="13" class="muted">|X[k]|：两条高度2的谱线表示同一实余弦</text><path class="line" d="M38 95V178H336"/><text x="9" y="109" font-size="13">2</text><text x="9" y="179" font-size="13">0</text><circle class="fill" cx="62" cy="178" r="3"/><text x="62" y="202" font-size="14" text-anchor="middle">k=0</text><text x="62" y="229" font-size="13" text-anchor="middle">0 Hz</text><path class="accent" d="M148 178V108"/><circle class="fill" cx="148" cy="108" r="4"/><text x="148" y="202" font-size="14" text-anchor="middle">k=1</text><text x="148" y="229" font-size="13" text-anchor="middle">200 Hz</text><circle class="fill" cx="234" cy="178" r="3"/><text x="234" y="202" font-size="14" text-anchor="middle">k=2</text><text x="234" y="229" font-size="13" text-anchor="middle">±400 Hz</text><path class="accent" d="M320 178V108"/><circle class="fill" cx="320" cy="108" r="4"/><text x="320" y="202" font-size="14" text-anchor="middle">k=3</text><text x="320" y="229" font-size="13" text-anchor="middle">−200 Hz</text><text x="12" y="260" font-size="13" class="muted">k=3也可写600 Hz；减fs后是同一−200 Hz</text></svg>