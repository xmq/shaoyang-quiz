<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 465" role="img" aria-labelledby="title" width="400" height="465"><title id="title">Cache实算：地址0x1234去哪一组？</title><defs><style>text{font:18px "Microsoft YaHei",system-ui,sans-serif;fill:#183047}.title{font-size:20px;font-weight:700}.bold{font-weight:700}.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#7b8fa2;stroke-width:1.5}.hi{fill:#d9f3ed;stroke:#19806e;stroke-width:1.5}.blue{fill:#e0edff;stroke:#4c79bf;stroke-width:1.5}.warn{fill:#fff0d3;stroke:#c28a25;stroke-width:1.5}.line{stroke:#37768a;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#e6eef6}.bg{fill:#142234;stroke:#405469}.box{fill:#1a2e43;stroke:#859bad}.hi{fill:#16483f;stroke:#69d7bc}.blue{fill:#193e68;stroke:#92b9fb}.warn{fill:#4b3a1e;stroke:#e4b15a}.line{stroke:#82c5d4}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47879b"/></marker></defs><text x="18" y="32" class="title">Cache实算：地址0x1234去哪一组？</text><text x="18" y="68" class="">沿用16 KiB、64 B块、4路、32位地址。</text><text x="18" y="103" class="">0x1234 = 十进制4660</text><rect class="hi" x="18" y="123" width="150" height="35" rx="7"/><text x="93.0" y="146.5" class="" text-anchor="middle">先算</text><rect class="hi" x="168" y="123" width="214" height="35" rx="7"/><text x="275.0" y="146.5" class="" text-anchor="middle">结果</text><rect class="box" x="18" y="158" width="150" height="35" rx="7"/><text x="93.0" y="181.5" class="" text-anchor="middle">主存块号</text><rect class="box" x="168" y="158" width="214" height="35" rx="7"/><text x="275.0" y="181.5" class="" text-anchor="middle">4660÷64取整=72</text><rect class="box" x="18" y="193" width="150" height="35" rx="7"/><text x="93.0" y="216.5" class="" text-anchor="middle">块内偏移</text><rect class="box" x="168" y="193" width="214" height="35" rx="7"/><text x="275.0" y="216.5" class="" text-anchor="middle">4660 mod 64=52</text><rect class="box" x="18" y="228" width="150" height="35" rx="7"/><text x="93.0" y="251.5" class="" text-anchor="middle">组索引</text><rect class="box" x="168" y="228" width="214" height="35" rx="7"/><text x="275.0" y="251.5" class="" text-anchor="middle">72 mod 64=8</text><rect class="box" x="18" y="263" width="150" height="35" rx="7"/><text x="93.0" y="286.5" class="" text-anchor="middle">标记</text><rect class="box" x="168" y="263" width="214" height="35" rx="7"/><text x="275.0" y="286.5" class="" text-anchor="middle">72÷64取整=1</text><rect class="hi" x="18" y="324" width="364" height="44" rx="7"/><text x="200.0" y="352.0" class="" text-anchor="middle">到第8组，比较4路标记和有效位</text><text x="18" y="407" class="">有效且标记为1 → 命中，再取偏移52。</text><text x="18" y="443" class="">无匹配 → 不命中，装入主存第72块。</text></svg>