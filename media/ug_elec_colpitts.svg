<text x="12" y="475" font-size="14" text-anchor="start">共基级同相；C1/C2取样同相送回E。</text>
<text x="12" y="505" font-size="14" text-anchor="start">Ceq=75pF，f0≈5.81MHz</text>
<text x="12" y="535" font-size="14" text-anchor="start">无载Ve/Vc=C1/(C1+C2)≈1/4</text>
<text x="12" y="570" font-size="13" text-anchor="start">E输入与RE会加载分压，起振仍查环路增益。</text>
