<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.b{fill:#fff;stroke:#2563eb;stroke-width:3}.h{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.l{stroke:#526777;stroke-width:4}.tt{font:700 27px system-ui;fill:#102a43}.t{font:20px system-ui;fill:#102a43}.s{font:18px system-ui;fill:#526777}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.b{fill:#17283b;stroke:#78b7ff}.h{fill:#173f3c;stroke:#46d6c6}.l{stroke:#9fb0c0}.tt,.t{fill:#edf4fb}.s{fill:#b8c5d1}}</style></defs><rect class="bg" x="10" y="10" width="700" height="380" rx="24"/><text class="tt" x="35" y="55">数据任务先保证记录完整，再分析和呈现</text><g class="t" text-anchor="middle"><rect class="b" x="35" y="125" width="135" height="70" rx="12"/><text x="102" y="168">原始记录</text><rect class="b" x="205" y="125" width="135" height="70" rx="12"/><text x="272" y="168">排序筛选</text><rect class="h" x="375" y="125" width="135" height="70" rx="12"/><text x="442" y="168">透视汇总</text><rect class="b" x="545" y="125" width="135" height="70" rx="12"/><text x="612" y="168">图表打印</text></g><path class="l" d="M170 160H205M340 160H375M510 160H545"/><text class="s" x="40" y="250">排序：扩展整条记录　筛选：隐藏而非删除　透视：源变更后刷新</text><text class="s" x="40" y="300">图表按比较、趋势、关系选择；打印前检查区域、缩放和标题行</text><text class="s" x="40" y="350">保护减少误改，加密保护打开权限，二者都不能代替备份</text></svg>
