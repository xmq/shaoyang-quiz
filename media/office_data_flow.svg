<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 664" role="img" aria-labelledby="title desc" width="390" height="664"><title id="title">同一张成绩表，三种处理</title><desc id="desc">同一张成绩表，三种处理</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><rect class="bg" width="390" height="664" rx="14"/><text class="h" x="20" y="33">同一张成绩表，三种处理</text><rect class="box" x="18" y="56" width="354" height="120" rx="10"/><text class="h" x="32" y="84">原表：姓名 / 班级 / 分数</text><text class="t" x="32" y="112">小林 / 一班 / 90</text><text class="t" x="32" y="138">小周 / 二班 / 70</text><text class="t" x="32" y="164">小吴 / 一班 / 80</text><path class="line" d="M195 179L195 200"/><rect class="box" x="18" y="205" width="354" height="120" rx="10"/><text class="h" x="32" y="233">按分数升序：必须整行一起排</text><text class="t" x="32" y="261">小周 / 二班 / 70</text><text class="t" x="32" y="287">小吴 / 一班 / 80</text><text class="t" x="32" y="313">小林 / 一班 / 90</text><path class="line" d="M195 328L195 349"/><rect class="box" x="18" y="354" width="354" height="94" rx="10"/><text class="h" x="32" y="382">筛选一班：隐藏小周，不删除</text><text class="t" x="32" y="410">小吴 / 一班 / 80</text><text class="t" x="32" y="436">小林 / 一班 / 90</text><path class="line" d="M195 451L195 472"/><rect class="hot" x="18" y="477" width="354" height="94" rx="10"/><text class="h" x="32" y="505">透视汇总：班级放行，分数求平均</text><text class="t" x="32" y="533">一班：85；二班：70</text><text class="t" x="32" y="559">原表增加记录后，刷新汇总</text><text class="s" x="20" y="600">筛选与排序不改变原有字段对应。</text><text class="s" x="20" y="626">只排分数列，会让姓名与成绩错配。</text></svg>
