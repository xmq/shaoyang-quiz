<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430"><defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.axis{stroke:#64748b;stroke-width:2}.sig{stroke:#2563eb;stroke-width:4;fill:none}.alt{stroke:#0f766e;stroke-width:4;fill:none}.dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 7}.box{fill:#fff;stroke:#64748b;stroke-width:2}.hot{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.tt{font:700 24px system-ui;fill:#102a43}.t{font:18px system-ui;fill:#334155}.s{font:15px system-ui;fill:#475569}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.axis{stroke:#8ea3b7}.sig{stroke:#78aefc}.alt{stroke:#46d6c6}.dash{stroke:#647b91}.box{fill:#17283b;stroke:#647b91}.hot{fill:#173f3c;stroke:#46d6c6}.tt{fill:#edf4fb}.t{fill:#d2dce6}.s{fill:#b8c5d1}}</style></defs><rect class="bg" x="12" y="12" width="876" height="406" rx="24"/><text class="tt" x="45" y="55">卷积的核心是滑动后的重叠面积</text><path class="axis" d="M55 275H845"/><path class="sig" d="M90 275V135H310V275"/><path class="alt" d="M245 275V175H500V275"/><rect x="245" y="175" width="65" height="100" fill="#14b8a6" opacity=".28"/><text class="t" x="200" y="115" text-anchor="middle">x(τ)</text><text class="t" x="430" y="155" text-anchor="middle">h(t−τ)</text><text class="t" x="650" y="145">重叠区：相乘后积分</text><text class="s" x="650" y="185">左边沿进入 → 重叠增大</text><text class="s" x="650" y="220">完全覆盖 → 达到峰值</text><text class="s" x="650" y="255">右边沿离开 → 重叠减小</text><text class="s" x="450" y="345" text-anchor="middle">矩形与矩形卷积常得到三角形或梯形</text></svg>