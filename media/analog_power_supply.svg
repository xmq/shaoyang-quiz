<svg xmlns="http://www.w3.org/2000/svg" width="500" height="350" viewBox="0 0 500 350" role="img" aria-labelledby="title desc"><title id="title">直流电源各级波形变化</title><desc id="desc">按左上、右上、右下、左下的箭头顺序阅读。变压改变交流幅度；全波整流将负半周翻为正，形成脉动直流；电容滤波后峰间缓慢放电仍有纹波；稳压后输出进一步平稳。图为各级作用示意，稳压有输入电压及负载范围。</desc><defs><style>:root{--ink:#263d49;--muted:#647781;--line:#c6d3d9;--accent:#147b71;--blue:#356c9b;--warm:#b37327;--pale:#e7f3f0}@media(prefers-color-scheme:dark){:root{--ink:#dfebf0;--muted:#a2b8c3;--line:#415965;--accent:#7ed6c6;--blue:#a3c8ed;--warm:#e7bb77;--pale:#203d3c}}text{font:20px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:var(--ink)}.small{font-size:18px;fill:var(--muted)}.label{font-size:20px;font-weight:600}.accent{fill:var(--accent)}.blue{fill:var(--blue)}.warm{fill:var(--warm)}.wire,.axis{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.guide{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 5}.grid{fill:none;stroke:var(--line);stroke-width:1}.curve{fill:none;stroke:var(--accent);stroke-width:2.6}.point{fill:var(--accent)}.resistor{fill:none;stroke:var(--ink);stroke-width:1.8}.accent-line{fill:none;stroke:var(--accent);stroke-width:2.1}</style><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="var(--ink)"/></marker></defs><text x="22" y="30" class="label" text-anchor="start">① 变压</text><text x="278" y="30" class="label" text-anchor="start">② 全波整流</text><text x="278" y="209" class="label" text-anchor="start">③ 电容滤波</text><text x="22" y="209" class="label" text-anchor="start">④ 稳压输出</text><path d="M22 101H220M278 101H476M278 299H476M22 299H220" class="grid"/><path class="curve" d="M22.00 101.00 L23.98 96.49 L25.96 92.05 L27.94 87.75 L29.92 83.66 L31.90 79.84 L33.88 76.36 L35.86 73.26 L37.84 70.60 L39.82 68.43 L41.80 66.76 L43.78 65.64 L45.76 65.07 L47.74 65.07 L49.72 65.64 L51.70 66.76 L53.68 68.