<svg xmlns="http://www.w3.org/2000/svg" width="400" height="470" viewBox="0 0 400 470" role="img" aria-labelledby="title"><title id="title">跨网发送：查网关MAC</title><defs><style>text{font:18px "Microsoft YaHei",system-ui,sans-serif;fill:#183047}.title{font-size:20px;font-weight:700}.bold{font-weight:700}.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#7b8fa2;stroke-width:1.5}.hi{fill:#d9f3ed;stroke:#19806e;stroke-width:1.5}.blue{fill:#e0edff;stroke:#4c79bf;stroke-width:1.5}.warn{fill:#fff0d3;stroke:#c28a25;stroke-width:1.5}.line{stroke:#37768a;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#e6eef6}.bg{fill:#142234;stroke:#405469}.box{fill:#1a2e43;stroke:#859bad}.hi{fill:#16483f;stroke:#69d7bc}.blue{fill:#193e68;stroke:#92b9fb}.warn{fill:#4b3a1e;stroke:#e4b15a}.line{stroke:#82c5d4}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47879b"/></marker></defs><rect class="bg" x="1" y="1" width="398" height="468" rx="14"/><text x="18" y="32" class="title">跨网发送：查网关MAC</text><text x="18" y="68" class="">A：192.168.1.10/24</text><text x="18" y="98" class="">目的B：192.168.2.20/24</text><rect class="blue" x="18" y="119" width="364" height="43" rx="7"/><text x="200.0" y="146.5" class="" text-anchor="middle">① 网络前缀不同 → 交默认网关</text><path class="line" d="M200 166L200 188" marker-end="url(#a)"/><rect class="box" x="18" y="195" width="364" height="43" rx="7"/><text x="200.0" y="222.5" class="" text-anchor="middle">② ARP查询192.168.1.1的MAC</text><text x="18" y="279" class="">③ A发出的第一帧</text><rect class="hi" x="18" y="291" width="140" height="35" rx="7"/><text x="88.0" y="314.5" class="" text-anchor="middle">字段</text><rect class="hi" x="158" y="291" width="224" height="35" rx="7"/><text x="270.0" y="314.5" class="" text-anchor="middle">实际填入</text><rect class="box" x="18" y="326" width="140" height="35" rx="7"/><text x="88.0" y="349.5" class="" text-anchor="middle">目的MAC</text><rect class="box" x="158" y="326" width="224" height="35" rx="7"/><text x="270.0" y="349.5" class="" text-anchor="middle">网关MAC</text><rect class="box" x="18" y="361" width="140" height="35" rx="7"/><text x="88.0" y="384.5" class="" text-anchor="middle">目的IP</text><rect class="box" x="158" y="361" width="224" height="35" rx="7"/><text x="270.0" y="384.5" class="" text-anchor="middle">192.168.2.20</text><text x="18" y="423" class="">网关转发：换帧头，重新选择下一跳。</text><text x="18" y="453" class="">无NAT时，端到端IP保持不变。</text><text x="18" y="258">已设网关192.168.1.1，ARP缓存为空</text></svg>