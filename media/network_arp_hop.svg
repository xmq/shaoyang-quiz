<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320" role="img" aria-labelledby="title desc"><title id="title">跨网发送的下一跳与目的地址</title><desc id="desc">A与B不在同一子网。A先用ARP查默认网关192.168.1.1的MAC，完成ARP后的数据帧交给网关；IP数据报的目的IP仍是B。</desc><defs><style>
:root{--ink:#243c47;--muted:#5e7580;--line:#8aa0aa;--paper:#fff;--accent:#147d73;--soft:#e9f5f1;--blue:#376e9c;--blue-soft:#edf4fa;--orange:#a56619}
text{font:20px system-ui,"Microsoft YaHei",sans-serif;fill:var(--ink)}.small{font-size:18px;fill:var(--muted)}.strong{font-weight:650}.accent{fill:var(--accent)}.wire{fill:none;stroke:var(--line);stroke-width:1.8}.path{fill:none;stroke:var(--accent);stroke-width:2.4}.cell{fill:var(--paper);stroke:var(--line);stroke-width:1}.node{fill:var(--paper);stroke:var(--ink);stroke-width:1.8}.hot{fill:var(--soft);stroke:var(--accent);stroke-width:1.8}.blue{fill:var(--blue-soft);stroke:var(--blue);stroke-width:1.8}.return{fill:none;stroke:var(--orange);stroke-width:1.8;stroke-dasharray:5 4}
@media(prefers-color-scheme:dark){:root{--ink:#e7eff2;--muted:#afc0c7;--line:#849ba6;--paper:#18252c;--accent:#83d7c9;--soft:#203c3b;--blue:#a9cceb;--blue-soft:#243b4a;--orange:#e7b777}}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="var(--accent)"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="var(--orange)"/></marker></defs><text x="90" y="24" class="small" text-anchor="middle">192.168.1.0/24</text><text x="430" y="24" class="small" text-anchor="middle">192.168.2.0/24</text><path class="wire" stroke-dasharray="5 5" d="M178 40V188M342 40V188"/><rect class="node" x="28" y="85" width="60" height="44"/><path class="wire" d="M58 129V144M40 144H76"/><text x="58" y="71" class="strong" text-anchor="middle">主机A</text><rect class="node" x="432" y="85" width="60" height="44"/><path class="wire" d="M462 129V144M444 144H480"/><text x="462" y="71" class="strong" text-anchor="middle">主机B</text><circle class="blue" cx="260" cy="108" r="28"/><path class="wire" d="M245 100H275M269 95L275 100L269 105M275 116H245M251 111L245 116L251 121"/><text x="260" y="67" class="strong" text-anchor="middle">默认网关</text><path class="path" d="M90 108H230" marker-end="url(#arrow)"/><path class="wire" d="M290 108H429"/><text x="133" y="97" class="small" text-anchor="middle">ARP查MAC</text><text x="58" y="174" class="small" text-anchor="middle">192.168.1.10</text><text x="260" y="159" class="small" text-anchor="middle">192.168.1.1</text><text x="462" y="174" class="small" text-anchor="middle">192.168.2.20</text><text x="20" y="218" class="strong" text-anchor="start">ARP完成后的数据帧</text><text x="500" y="218" class="small" text-anchor="end">ARP缓存原为空</text><rect class="hot" x="20" y="236" width="190" height="64"/><rect class="blue" x="210" y="236" width="290" height="64"/><text x="115" y="261" class="small" text-anchor="middle">目的MAC</text><text x="115" y="286" class="strong accent" text-anchor="middle">网关MAC</text><text x="355" y="261" class="small" text-anchor="middle">IP数据报的目的IP</text><text x="355" y="286" class="strong" text-anchor="middle">192.168.2.20</text></svg>
