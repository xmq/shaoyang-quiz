<svg xmlns="http://www.w3.org/2000/svg" width="440" height="380" viewBox="0 0 440 380" role="img" aria-labelledby="title desc">
<title id="title">银行卡密码验证流程</title>
<desc id="desc">插入银行卡后输入密码并核验，判断密码是否正确；正确则通过验证，错误则返回重新输入。</desc>
<defs><style>
.node{fill:#f3faf8;stroke:#286c66;stroke-width:2}.decision{fill:#fff5de;stroke:#9c7432;stroke-width:2}.text{font:19px "Microsoft YaHei",sans-serif;fill:#173647;text-anchor:middle}.label{font:18px "Microsoft YaHei",sans-serif;fill:#286c66}.arrow{fill:none;stroke:#286c66;stroke-width:2;marker-end:url(#arrow)}
@media(prefers-color-scheme:dark){.node{fill:#153330;stroke:#73ccbc}.decision{fill:#3d301b;stroke:#e1bd78}.text{fill:#edf4fa}.label{fill:#91daca}.arrow{stroke:#73ccbc}}
</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#428f7e"/></marker></defs>
<rect class="node" x="100" y="10" width="160" height="42" rx="21"/>
<text class="text" x="180" y="38">① 插入银行卡</text>
<path class="arrow" d="M180 52V73"/>
<path class="node" d="M100 75H270L260 117H90Z"/>
<text class="text" x="180" y="103">② 输入密码</text>
<path class="arrow" d="M180 117V138"/>
<rect class="node" x="100" y="140" width="160" height="42"/>
<text class="text" x="180" y="168">③ 核验密码</text>
<path class="arrow" d="M180 182V202"/>
<path class="decision" d="M180 204L264 242L180 280L96 242Z"/>
<text class="text" x="180" y="249">④ 密码正确？</text>
<path class="arrow" d="M180 280V318"/>
<text class="label" x="194" y="306">是</text>
<rect class="node" x="100" y="320" width="160" height="42" rx="21"/>
<text class="text" x="180" y="348">⑤ 通过验证</text>
<path class="arrow" d="M264 242H360V189"/>
<text class="label" x="286" y="234">否</text>
<rect class="node" x="310" y="145" width="104" height="42"/>
<text class="text" x="362" y="173">⑥ 重输</text>
<path class="arrow" d="M360 145V96H268"/>
</svg>
