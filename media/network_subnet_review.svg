<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 245" role="img" aria-labelledby="title" width="400" height="245"><title id="title">子网速算：/26还剩6个主机位</title><defs><style>text{font:18px "Microsoft YaHei",system-ui,sans-serif;fill:#183047}.title{font-size:20px;font-weight:700}.bold{font-weight:700}.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#7b8fa2;stroke-width:1.5}.hi{fill:#d9f3ed;stroke:#19806e;stroke-width:1.5}.blue{fill:#e0edff;stroke:#4c79bf;stroke-width:1.5}.warn{fill:#fff0d3;stroke:#c28a25;stroke-width:1.5}.line{stroke:#37768a;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#e6eef6}.bg{fill:#142234;stroke:#405469}.box{fill:#1a2e43;stroke:#859bad}.hi{fill:#16483f;stroke:#69d7bc}.blue{fill:#193e68;stroke:#92b9fb}.warn{fill:#4b3a1e;stroke:#e4b15a}.line{stroke:#82c5d4}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47879b"/></marker></defs><text x="18" y="32" class="title">子网速算：/26还剩6个主机位</text><rect class="hi" x="18" y="63" width="182.0" height="35" rx="7"/><text x="109.0" y="86.5" class="" text-anchor="middle">一块地址数</text><rect class="hi" x="200.0" y="63" width="182.0" height="35" rx="7"/><text x="291.0" y="86.5" class="" text-anchor="middle">普通可用主机</text><rect class="box" x="18" y="98" width="182.0" height="35" rx="7"/><text x="109.0" y="121.5" class="" text-anchor="middle">2⁶=64</text><rect class="box" x="200.0" y="98" width="182.0" height="35" rx="7"/><text x="291.0" y="121.5" class="" text-anchor="middle">64−2=62</text><text x="18" y="177" class="">末字节边界：0、64、128、192。</text><text x="18" y="214" class="">例：.70在.64—.127内，网络为.64。</text></svg>