<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-labelledby="title desc" width="400" height="500"><title id="title">Python：改对象，还是改绑定？</title><desc id="desc">Python：改对象，还是改绑定？；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><text x="22" y="33" class="title" text-anchor="start">Python：改对象，还是改绑定？</text><text x="22" y="70" class="" text-anchor="start">调用前 a=[1,2]；函数形参是 p</text><rect x="30" y="100" width="75" height="42" rx="7" class="box"/><text x="67.5" y="127.0" class="mono" text-anchor="middle">a</text><rect x="30" y="175" width="75" height="42" rx="7" class="box"/><text x="67.5" y="202.0" class="mono" text-anchor="middle">p</text><rect x="235" y="135" width="135" height="50" rx="7" class="hi"/><text x="302.5" y="166.0" class="mono" text-anchor="middle">[1,2]</text><path class="line" d="M105 120L235 150"/><path class="line" d="M105 195L235 170"/><text x="22" y="267" class="" text-anchor="start">p.append(3)：修改同一个列表</text><text x="22" y="294" class="" text-anchor="start">a、p 都能看到 [1,2,3]。</text><rect x="30" y="340" width="75" height="42" rx="7" class="box"/><text x="67.5" y="367.0" class="mono" text-anchor="middle">a</text><rect x="30" y="415" width="75" height="42" rx="7" class="box"/><text x="67.5" y="442.0" class="mono" text-anchor="middle">p</text><rect x="235" y="330" width="135" height="42" rx="7" class="hi"/><text x="302.5" y="357.0" class="mono" text-anchor="middle">[1,2,3]</text><rect x="235" y="415" width="135" height="42" rx="7" class="box"/><text x="302.5" y="442.0" class="mono" text-anchor="middle">[]</text><path class="line" d="M105 360L235 351"/><path class="line" d="M105 435L235 436"/><text x="138" y="405" class="mono" text-anchor="start">再执行 p=[]：</text></svg>