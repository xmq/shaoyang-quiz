<svg xmlns="http://www.w3.org/2000/svg" width="520" height="278" viewBox="0 0 520 278" role="img" aria-labelledby="title desc"><title id="title">NPN三极管的三种工作状态</title><desc id="desc">三个NPN器件符号并列。截止时BE未充分正偏、集电极电流近似0；放大时BE正偏BC反偏，IC约为βIB；饱和时BE与BC都正偏，UCE很小，集电极电流受外电路限制，不能再直接套用βIB。</desc><defs><style>:root{--ink:#263d49;--muted:#647781;--line:#c6d3d9;--accent:#147b71;--blue:#356c9b;--warm:#b37327;--pale:#e7f3f0}@media(prefers-color-scheme:dark){:root{--ink:#dfebf0;--muted:#a2b8c3;--line:#415965;--accent:#7ed6c6;--blue:#a3c8ed;--warm:#e7bb77;--pale:#203d3c}}text{font:20px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:var(--ink)}.small{font-size:18px;fill:var(--muted)}.label{font-size:20px;font-weight:600}.accent{fill:var(--accent)}.blue{fill:var(--blue)}.warm{fill:var(--warm)}.wire,.axis{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.guide{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 5}.grid{fill:none;stroke:var(--line);stroke-width:1}.curve{fill:none;stroke:var(--accent);stroke-width:2.6}.point{fill:var(--accent)}.resistor{fill:none;stroke:var(--ink);stroke-width:1.8}.accent-line{fill:none;stroke:var(--accent);stroke-width:2.1}</style><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="var(--ink)"/></marker></defs><text x="88" y="27" class="label" text-anchor="middle">截止</text><path d="M80 67v66M37 100H80M80 80l45-23V42M80 120l45 25v17" class="wire"/><path d="M103 133l19 11" class="wire" marker-end="url(#arrow)"/><text x="32" y="106" class="small" text-anchor="end">B</text><text x="132" y="47" class="small" text-anchor="start">C</text><text x="132" y="165" class="small" text-anchor="start">E</text><text x="88" y="193" class="small" text-anchor="middle">BE 未充分正偏</text><text x="88" y="222" class="small" text-anchor="middle">BC 通常反偏</text><text x="88" y="258" class="label accent" text-anchor="middle">I<tspan baseline-shift="sub" font-size="70%">C</tspan> ≈ 0</text><text x="258" y="27" class="label" text-anchor="middle">放大</text><path d="M250 67v66M207 100H250M250 80l45-23V42M250 120l45 25v17" class="wire"/><path d="M273 133l19 11" class="wire" marker-end="url(#arrow)"/><text x="202" y="106" class="small" text-anchor="end">B</text><text x="302" y="47" class="small" text-anchor="start">C</text><text x="302" y="165" class="small" text-anchor="start">E</text><text x="258" y="193" class="small" text-anchor="middle">BE 正偏</text><text x="258" y="222" class="small" text-anchor="middle">BC 反偏</text><text x="258" y="258" class="label accent" text-anchor="middle">I<tspan baseline-shift="sub" font-size="70%">C</tspan> ≈ βI<tspan baseline-shift="sub" font-size="70%">B</tspan></text><text x="428" y="27" class="label" text-anchor="middle">饱和</text><path d="M420 67v66M377 100H420M420 80l45-23V42M420 120l45 25v17" class="wire"/><path d="M443 133l19 11" class="wire" marker-end="url(#arrow)"/><text x="372" y="106" class="small" text-anchor="end">B</text><text x="472" y="47" class="small" text-anchor="start">C</text><text x="472" y="165" class="small" text-anchor="start">E</text><text x="428" y="193" class="small" text-anchor="middle">BE 正偏</text><text x="428" y="222" class="small" text-anchor="middle">BC 正偏</text><text x="428" y="258" class="label accent" text-anchor="middle">U<tspan baseline-shift="sub" font-size="70%">CE</tspan> 很小</text></svg>