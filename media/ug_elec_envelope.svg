<text x="12" y="278" font-size="14" text-anchor="start">导通：源→D→C充电；截止：C经R放电。</text>
<text x="12" y="308" font-size="14" text-anchor="start">5V截止1μs，RC10μs：约4.52V。</text>
<text x="12" y="340" font-size="14" text-anchor="start">太小：载波纹波；太大：下降包络斜切。</text>
<text x="12" y="380" font-size="14" text-anchor="start">1/ωc≪RC≪1/ωm只是量级起点。</text>
