<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="t d"><title id="t">CIA安全目标与风险链</title><desc id="d">从资产、威胁和脆弱性判断对机密性、完整性、可用性的影响。</desc><style>.bg{fill:#f8fafc;stroke:#cbd5e1}.b{fill:#fff;stroke:#64748b}.c{fill:#e7f6f4;stroke:#176f68}.a{stroke:#2563eb;stroke-width:4}.h{font:700 26px system-ui;fill:#102a43}.t{font:19px system-ui;fill:#334155}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.b{fill:#17283b;stroke:#647b91}.c{fill:#173f3c;stroke:#46d6c6}.h{fill:#edf4fb}.t{fill:#b8c5d1}}</style><rect class="bg" x="10" y="10" width="700" height="370" rx="22"/><text class="h" x="35" y="50">安全分析：先找风险链，再判断保护目标</text><rect class="b" x="35" y="85" width="135" height="70" rx="12"/><text class="t" x="102" y="128" text-anchor="middle">资产</text><rect class="b" x="215" y="85" width="135" height="70" rx="12"/><text class="t" x="282" y="128" text-anchor="middle">威胁</text><rect class="b" x="395" y="85" width="135" height="70" rx="12"/><text class="t" x="462" y="128" text-anchor="middle">脆弱性</text><rect class="c" x="575" y="85" width="110" height="70" rx="12"/><text class="t" x="630" y="128" text-anchor="middle">风险</text><path class="a" d="M170 120H215M350 120H395M530 120H575"/><rect class="c" x="70" y="225" width="160" height="90" rx="14"/><text class="h" x="150" y="265" text-anchor="middle">机密性</text><text class="t" x="150" y="295" text-anchor="middle">防未授权泄露</text><rect class="c" x="280" y="225" width="160" height="90" rx="14"/><text class="h" x="360" y="265" text-anchor="middle">完整性</text><text class="t" x="360" y="295" text-anchor="middle">防篡改并可发现</text><rect class="c" x="490" y="225" width="160" height="90" rx="14"/><text class="h" x="570" y="265" text-anchor="middle">可用性</text><text class="t" x="570" y="295" text-anchor="middle">授权时可使用</text></svg>
