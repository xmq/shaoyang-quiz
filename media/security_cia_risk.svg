<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 489" role="img" aria-labelledby="title desc"><title id="title">同一份成绩表，三种安全事故</title><desc id="desc">同一份成绩表，三种安全事故</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><rect class="bg" width="390" height="489" rx="14"/><text class="h" x="20" y="33">同一份成绩表，三种安全事故</text><rect class="box" x="18" y="56" width="354" height="94" rx="10"/><text class="h" x="32" y="84">机密性C：不该看的人看到了</text><text class="t" x="32" y="112">陌生人拿到全班成绩表</text><text class="t" x="32" y="138">控制：限制访问、加密敏感数据</text><path class="line" d="M195 153L195 174"/><rect class="box" x="18" y="179" width="354" height="94" rx="10"/><text class="h" x="32" y="207">完整性I：内容被未授权修改</text><text class="t" x="32" y="235">80分被改成90分</text><text class="t" x="32" y="261">控制：授权修改、完整性校验、审计</text><path class="line" d="M195 276L195 297"/><rect class="hot" x="18" y="302" width="354" height="94" rx="10"/><text class="h" x="32" y="330">可用性A：需要时不能使用</text><text class="t" x="32" y="358">选课期间系统瘫痪，无法查成绩</text><text class="t" x="32" y="384">控制：冗余、容量、恢复与演练</text><text class="s" x="20" y="425">一个事件可能同时破坏多个安全目标。</text><text class="s" x="20" y="451">删库既损害完整性，也可能损害可用性。</text></svg>
