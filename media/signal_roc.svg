<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 350" role="img" aria-labelledby="title desc" width="420" height="350">
<title id="title">连续因果系统的拉普拉斯收敛域</title><desc id="desc">横轴实部，纵轴虚部。因果有理系统ROC在最右极点右方；本图不含虚轴，系统不稳定。</desc>
<defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1}.axis{stroke:#64748b;stroke-width:2}.pole{stroke:#d92d20;stroke-width:3}.shade{fill:#14b8a6;opacity:.15}.dash{stroke:#0f766e;stroke-width:2;stroke-dasharray:5 4}.h{font:700 21px system-ui,sans-serif;fill:#102a43}.t{font:19px system-ui,sans-serif;fill:#334155}.a{font:700 19px system-ui,sans-serif;fill:#0f766e}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.axis{stroke:#a1b1c2}.pole{stroke:#ff9688}.dash{stroke:#46d6c6}.h{fill:#edf4fb}.t{fill:#d2dce6}.a{fill:#80e4ce}}</style></defs>
<rect class="bg" x="5" y="5" width="410" height="340" rx="16"/>
<text class="h" x="22" y="36">s平面：比较实部，不比较模长</text>
<rect class="shade" x="241" y="62" width="150" height="196"/>
<path class="axis" d="M24 180H397M150 62V260"/>
<text class="t" x="365" y="203">Re(s)</text><text class="t" x="157" y="79">jω</text>
<path class="pole" d="M82 172l16 16m0-16l-16 16M232 172l16 16m0-16l-16 16"/>
<path class="dash" d="M240 62V258"/>
<text class="t" x="71" y="163">p₁</text><text class="t" x="204" y="229">最右极点 p₂</text>
<text class="a" x="278" y="107">因果ROC</text><text class="t" x="269" y="136">在虚线右侧</text>
<text class="t" x="22" y="285">ROC：Re(s) &gt; max Re(pᵢ)</text>
<text class="t" x="22" y="313">本图不含jω轴：因果，但不稳定。</text>
