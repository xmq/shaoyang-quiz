<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430"><defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.b{fill:#fff;stroke:#64748b;stroke-width:2}.h{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.a{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#m)}.tt{font:700 24px system-ui;fill:#102a43}.t{font:18px system-ui;fill:#334155}.s{font:15px system-ui;fill:#475569}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.b{fill:#17283b;stroke:#647b91}.h{fill:#173f3c;stroke:#46d6c6}.tt{fill:#edf4fb}.t{fill:#d2dce6}.s{fill:#b8c5d1}}</style><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#2563eb"/></marker></defs><rect class="bg" x="12" y="12" width="876" height="406" rx="24"/><text class="tt" x="45" y="58">智慧灌溉的感知—决策—执行闭环</text><rect class="h" x="35" y="130" width="140" height="80" rx="14"/><text class="t" x="105.0" y="164" text-anchor="middle">传感器</text><text class="s" x="105.0" y="190" text-anchor="middle">读取湿度</text><path class="a" d="M175 170H230"/><rect class="b" x="240" y="130" width="140" height="80" rx="14"/><text class="t" x="310.0" y="164" text-anchor="middle">网络 / 网关</text><text class="s" x="310.0" y="190" text-anchor="middle">传输与过滤</text><path class="a" d="M380 170H435"/><rect class="b" x="445" y="130" width="140" height="80" rx="14"/><text class="t" x="515.0" y="164" text-anchor="middle">平台规则</text><text class="s" x="515.0" y="190" text-anchor="middle">是否灌溉</text><path class="a" d="M585 170H640"/><rect class="b" x="650" y="130" width="175" height="80" rx="14"/><text class="t" x="737.5" y="164" text-anchor="middle">执行器</text><text class="s" x="737.5" y="190" text-anchor="middle">打开 / 关闭阀门</text><path class="a" d="M735 245V300H105V220"/><text class="t" x="450" y="335" text-anchor="middle">执行结果再次感知，才形成闭环</text><text class="s" x="450" y="375" text-anchor="middle">断网或读数异常时，现场按安全状态运行并告警</text></svg>