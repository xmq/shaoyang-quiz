<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 560" role="img" aria-labelledby="title desc" width="390" height="560"><title id="title">花盆自动浇水：真正的闭环</title><desc id="desc">花盆自动浇水：真正的闭环</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><rect class="bg" width="390" height="560" rx="14"/><text class="h" x="20" y="33">花盆自动浇水：真正的闭环</text><rect class="box" x="18" y="56" width="354" height="68" rx="10"/><text class="h" x="32" y="84">① 感知层：湿度传感器</text><text class="t" x="32" y="112">读数20%，低于阈值30%</text><path class="line" d="M195 127L195 148"/><rect class="box" x="18" y="153" width="354" height="68" rx="10"/><text class="h" x="32" y="181">② 网络层：上传读数</text><text class="t" x="32" y="209">网关把设备身份、时间和20%传送</text><path class="line" d="M195 224L195 245"/><rect class="box" x="18" y="250" width="354" height="94" rx="10"/><text class="h" x="32" y="278">③ 应用层：作出控制决定</text><text class="t" x="32" y="306">平台下发“开阀”指令</text><text class="t" x="32" y="332">执行器开阀，传感器继续测量</text><path class="line" d="M195 347L195 368"/><rect class="hot" x="18" y="373" width="354" height="94" rx="10"/><text class="h" x="32" y="401">④ 反馈：湿度升到40%</text><text class="t" x="32" y="429">达到停止阈值，关阀</text><text class="t" x="32" y="455">不是开一次阀后永远不再测量</text><text class="s" x="20" y="496">失联不能无限开阀，需本地超时保护。</text><text class="s" x="20" y="522">两条阈值可减少临界点反复开关。</text><path class="line" d="M372 420H382V45H195V56"/></svg>
