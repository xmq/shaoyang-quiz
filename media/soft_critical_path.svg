<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 540" role="img" aria-labelledby="title desc" width="390" height="540"><title id="title">并行任务不能把所有天数直接相加</title><desc id="desc">并行任务不能把所有天数直接相加</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><rect class="bg" width="390" height="540" rx="14"/><text class="h" x="20" y="33">并行任务不能把所有天数直接相加</text><text class="h" x="22" y="68">先A，之后B与C并行，最后D</text><rect class="hot" x="146" y="88" width="98" height="55" rx="10"/><text class="t" x="195.0" y="122" text-anchor="middle">A 2天</text><rect class="hot" x="32" y="201" width="120" height="55" rx="10"/><text class="t" x="92.0" y="235" text-anchor="middle">B 4天</text><rect class="box" x="238" y="201" width="120" height="55" rx="10"/><text class="t" x="298.0" y="235" text-anchor="middle">C 2天</text><rect class="hot" x="146" y="318" width="98" height="55" rx="10"/><text class="t" x="195.0" y="352" text-anchor="middle">D 3天</text><path class="line" d="M171 143L100 201"/><path class="line" d="M220 143L295 201"/><path class="line" d="M100 256L171 318"/><path class="line" d="M295 256L220 318"/><text class="t" x="22" y="414">A→B→D：2＋4＋3＝9天</text><text class="t" x="22" y="448">A→C→D：2＋2＋3＝7天</text><text class="s" x="22" y="486">最长路径A→B→D决定工期：9天。</text><text class="s" x="22" y="514">C可延迟2天；B延迟1天会推迟完工。</text></svg>
