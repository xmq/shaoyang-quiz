<svg xmlns="http://www.w3.org/2000/svg" width="500" height="370" viewBox="0 0 500 370" role="img" aria-labelledby="title desc"><title id="title">分压偏置共射放大电路</title><desc id="desc">NPN晶体管。R1与R2分压为基极提供直流偏置，RC为集电极电阻，RE为发射极电阻。输入ui经C1耦合至基极，输出uo从集电极经C2耦合引出，发射极电流箭头向外。</desc><defs><style>:root{--ink:#263d49;--muted:#647781;--line:#c6d3d9;--accent:#147b71;--blue:#356c9b;--warm:#b37327;--pale:#e7f3f0}@media(prefers-color-scheme:dark){:root{--ink:#dfebf0;--muted:#a2b8c3;--line:#415965;--accent:#7ed6c6;--blue:#a3c8ed;--warm:#e7bb77;--pale:#203d3c}}text{font:20px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:var(--ink)}.small{font-size:18px;fill:var(--muted)}.label{font-size:20px;font-weight:600}.accent{fill:var(--accent)}.blue{fill:var(--blue)}.warm{fill:var(--warm)}.wire,.axis{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.guide{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 5}.grid{fill:none;stroke:var(--line);stroke-width:1}.curve{fill:none;stroke:var(--accent);stroke-width:2.6}.point{fill:var(--accent)}.resistor{fill:none;stroke:var(--ink);stroke-width:1.8}.accent-line{fill:none;stroke:var(--accent);stroke-width:2.1}</style><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="var(--ink)"/></marker></defs><path d="M105 32H350" class="wire"/><text x="365" y="39" class="label" text-anchor="start">VCC</text><path d="M135 32v10M135 110v10" class="wire"/><rect class="resistor" x="128" y="42" width="14" height="68"/><text x="150" y="82.0" class="" text-anchor="start">R₁</text><path d="M135 120V184H260" class="wire"/><path d="M135 216v10M135 284v10" class="wire"/><rect class="resistor" x="128" y="226" width="14" height="58"/><text x="150" y="261.0" class="" text-anchor="start">R₂</text><path d="M135 184V216M135 294V328H340" class="wire"/><path d="M340 32v10M340 110v10" class="wire"/><rect class="resistor" x="333" y="42" width="14" height="68"/><text x="355" y="82.0" class="" text-anchor="start">R<tspan baseline-shift="sub" font-size="70%">C</tspan></text><path d="M340 120V139L260 168M260 154V221M260 207L340 253" class="wire"/><path d="M315 239 337 251" class="wire" marker-end="url(#arrow)"/><path d="M340 253v10M340 318v10" class="wire"/><rect class="resistor" x="333" y="263" width="14" height="55"/><text x="355" y="296.5" class="" text-anchor="start">R<tspan baseline-shift="sub" font-size="70%">E</tspan></text><path d="M242 328v12M226 340h32m-26 7h20m-14 7h8" class="wire"/><path d="M25 184H65M73 184H135M65 170v28m8-28v28" class="wire"/><text x="29" y="215" class="label blue" text-anchor="start">u<tspan baseline-shift="sub" font-size="70%">i</tspan></text><text x="67" y="156" class="small" text-anchor="middle">C₁</text><path d="M340 139H410M418 139H477M410 125v28m8-28v28" class="wire"/><text x="460" y="172" class="label accent" text-anchor="start">u<tspan baseline-shift="sub" font-size="70%">o</tspan></text><text x="414" y="113" class="small" text-anchor="middle">C₂</text><circle cx="135" cy="184" r="3" fill="var(--ink)"/><circle cx="340" cy="139" r="3" fill="var(--ink)"/><text x="244" y="147" class="small" text-anchor="end">B</text><text x="353" y="140" class="small" text-anchor="start">C</text><text x="354" y="254" class="small" text-anchor="start">E</text></svg>