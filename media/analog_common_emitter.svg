<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 630" role="img" aria-labelledby="title desc" width="400" height="630"><title id="title">共射电路：先找到B、C、E</title><desc id="desc">共射电路：先找到B、C、E</desc>
<defs><style>
        :root{--ink:#17324b;--muted:#456075;--paper:#fff;--panel:#edf5fa;--blue:#1464ba;--green:#087c67;--orange:#ad5200;--red:#b42318;--border:#cad8e5}
        @media(prefers-color-scheme:dark){:root{--ink:#edf4fb;--muted:#b5c8d8;--paper:#132334;--panel:#1b3349;--blue:#9bcaff;--green:#7de1c4;--orange:#ffc079;--red:#ffab9b;--border:#527087}}
        .paper{fill:var(--paper)}.panel{fill:var(--panel);stroke:var(--border)}.t{font:18px system-ui,sans-serif;fill:var(--ink)}.h{font:700 21px system-ui,sans-serif;fill:var(--ink)}.b{font:700 18px system-ui,sans-serif;fill:var(--blue)}.g{font:700 18px system-ui,sans-serif;fill:var(--green)}.r{font:700 18px system-ui,sans-serif;fill:var(--red)}.muted{font:18px system-ui,sans-serif;fill:var(--muted)}
        .wire{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}.blue{fill:none;stroke:var(--blue);stroke-width:2.5}.green{fill:none;stroke:var(--green);stroke-width:2.5}.orange{fill:none;stroke:var(--orange);stroke-width:2.5}.red{fill:none;stroke:var(--red);stroke-width:2.5}.dash{stroke-dasharray:5 4}.dot{fill:var(--ink)}.shade{fill:var(--green);opacity:.17}
        </style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs>
<rect class="paper" width="400" height="630" rx="12"/>
<text class="h" x="20" y="33">共射电路：先找到B、C、E</text>
<path class="wire" d="M65 100H285"/>
<text class="t" x="300" y="106">VCC</text>
<path class="wire" d="M90 100L90 110"/>
<rect class="panel" x="81" y="110" width="18" height="70" rx="0"/>
<path class="wire" d="M90 180L90 190"/>
<text class="t" x="107" y="151.0">R1</text>
<path class="wire" d="M90 190V265H185"/>
<circle class="dot" cx="90" cy="265" r="4"/>
<path class="wire" d="M90 280L90 290"/>
<rect class="panel" x="81" y="290" width="18" height="70" rx="0"/>
<path class="wire" d="M90 360L90 370"/>
<text class="t" x="107" y="331.0">R2</text>
<path class="wire" d="M90 265V280M90 370V455"/>
<path class="wire" d="M265 100L265 110"/>
<rect class="panel" x="256" y="110" width="18" height="75" rx="0"/>
<path class="wire" d="M265 185L265 195"/>
<text class="t" x="282" y="153.5">RC</text>
<path class="wire" d="M265 195V220L185 250"/>
<path class="wire" d="M185 240L185 305"/>
<path class="wire" d="M185 290L265 330"/>
<path class="wire" d="M235 315L262 329" marker-end="url(#arrow)"/>
<text class="t" x="165" y="240">B</text>
<text class="t" x="272" y="219">C</text>
<text class="t" x="272" y="330">E</text>
<path class="wire" d="M265 330L265 340"/>
<rect class="panel" x="256" y="340" width="18" height="65" rx="0"/>
<path class="wire" d="M265 405L265 415"/>
<text class="t" x="282" y="378.5">RE</text>
<path class="wire" d="M265 415V455H90M175 455V475"/>
<path class="wire" d="M155 475L195 475"/>
<path class="wire" d="M163 483L187 483"/>
<path class="wire" d="M170 491L180 491"/>
<path class="wire" d="M22 265H37M46 265H90"/>
<path class="wire" d="M37 248L37 282"/>
<path class="wire" d="M46 248L46 282"/>
<text class="t" x="20" y="311">ui、C1</text>
<path class="wire" d="M265 220H316M325 220H375"/>
<circle class="dot" cx="265" cy="220" r="4"/>
<path class="wire" d="M316 204L316 236"/>
<path class="wire" d="M325 204L325 236"/>
<text class="t" x="335" y="198">uo</text>
<text class="t" x="20" y="532">R1/R2定基极偏置，RE稳定静态点。</text>
<text class="t" x="20" y="557">输入升高→IC增大→RC压降增大→集电极电压</text>
<text class="t" x="20" y="582">下降，所以反相。</text>
</svg>
