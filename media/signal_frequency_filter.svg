<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 573" role="img" aria-labelledby="title desc" width="400" height="573"><title id="title">滤波：把输入谱逐项乘H</title><desc id="desc">滤波：把输入谱逐项乘H</desc>
<defs><style>
        :root{--ink:#17324b;--muted:#456075;--paper:#fff;--panel:#edf5fa;--blue:#1464ba;--green:#087c67;--orange:#ad5200;--red:#b42318;--border:#cad8e5}
        @media(prefers-color-scheme:dark){:root{--ink:#edf4fb;--muted:#b5c8d8;--paper:#132334;--panel:#1b3349;--blue:#9bcaff;--green:#7de1c4;--orange:#ffc079;--red:#ffab9b;--border:#527087}}
        .paper{fill:var(--paper)}.panel{fill:var(--panel);stroke:var(--border)}.t{font:18px system-ui,sans-serif;fill:var(--ink)}.h{font:700 21px system-ui,sans-serif;fill:var(--ink)}.b{font:700 18px system-ui,sans-serif;fill:var(--blue)}.g{font:700 18px system-ui,sans-serif;fill:var(--green)}.r{font:700 18px system-ui,sans-serif;fill:var(--red)}.muted{font:18px system-ui,sans-serif;fill:var(--muted)}
        .wire{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}.blue{fill:none;stroke:var(--blue);stroke-width:2.5}.green{fill:none;stroke:var(--green);stroke-width:2.5}.orange{fill:none;stroke:var(--orange);stroke-width:2.5}.red{fill:none;stroke:var(--red);stroke-width:2.5}.dash{stroke-dasharray:5 4}.dot{fill:var(--ink)}.shade{fill:var(--green);opacity:.17}
        </style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs>
<rect class="paper" width="400" height="573" rx="12"/>
<text class="h" x="20" y="33">滤波：把输入谱逐项乘H</text>
<text class="b" x="20" y="93">输入：1 kHz与8 kHz</text>
<path class="wire" d="M30 155L375 155" marker-end="url(#arrow)"/>
<path class="green" d="M66 155L66 113" marker-end="url(#arrow)"/>
<path class="green" d="M185 155L185 113" marker-end="url(#arrow)"/>
<path class="green" d="M219 155L219 113" marker-end="url(#arrow)"/>
<path class="green" d="M338 155L338 113" marker-end="url(#arrow)"/>
<text class="t" x="66" y="183" text-anchor="middle">-8</text>
<text class="t" x="185" y="183" text-anchor="middle">-1</text>
<text class="t" x="219" y="183" text-anchor="middle">1</text>
<text class="t" x="338" y="183" text-anchor="middle">8</text>
<text class="t" x="293" y="208">f / kHz</text>
<text class="b" x="20" y="253">低通：只放行|f|≤3 kHz</text>
<path class="wire" d="M30 315L375 315" marker-end="url(#arrow)"/>
<path class="orange" d="M30 315H151V273H253V315H375"/>
<text class="t" x="151" y="343" text-anchor="middle">-3</text>
<text class="t" x="202" y="343" text-anchor="middle">0</text>
<text class="t" x="253" y="343" text-anchor="middle">3</text>
<text class="t" x="293" y="368">f / kHz</text>
<text class="b" x="20" y="408">输出：只剩1 kHz</text>
<path class="wire" d="M30 470L375 470" marker-end="url(#arrow)"/>
<path class="green" d="M185 470L185 428" marker-end="url(#arrow)"/>
<path class="green" d="M219 470L219 428" marker-end="url(#arrow)"/>
<text class="t" x="66" y="498" text-anchor="middle">-8</text>
<text class="t" x="185" y="498" text-anchor="middle">-1</text>
<text class="t" x="219" y="498" text-anchor="middle">1</text>
<text class="t" x="338" y="498" text-anchor="middle">8</text>
<text class="t" x="293" y="523">f / kHz</text>
<text class="t" x="20" y="553">Y(f)=X(f)H(f)；谱线高度归一化示意。</text>
</svg>
