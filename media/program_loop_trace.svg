<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 475" role="img" aria-labelledby="title desc" width="400" height="475"><title id="title">循环：条件、累加、更新分开看</title><desc id="desc">循环：条件、累加、更新分开看；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><text x="22" y="33" class="title" text-anchor="start">循环：条件、累加、更新分开看</text><text x="22" y="70" class="" text-anchor="start">i=1, sum=0；当 i≤4 时执行</text><text x="22" y="97" class="" text-anchor="start">循环体：sum=sum+i；随后 i=i+1</text><text x="22" y="145" class="" text-anchor="start">第1轮开始</text><rect x="163" y="119" width="210" height="34" rx="7" class="box"/><text x="268.0" y="142.0" class="mono" text-anchor="middle">i=1, sum=0</text><text x="22" y="188" class="" text-anchor="start">加1，再更新</text><rect x="163" y="162" width="210" height="34" rx="7" class="box"/><text x="268.0" y="185.0" class="mono" text-anchor="middle">i=2, sum=1</text><text x="22" y="231" class="" text-anchor="start">加2，再更新</text><rect x="163" y="205" width="210" height="34" rx="7" class="box"/><text x="268.0" y="228.0" class="mono" text-anchor="middle">i=3, sum=3</text><text x="22" y="274" class="" text-anchor="start">加3，再更新</text><rect x="163" y="248" width="210" height="34" rx="7" class="box"/><text x="268.0" y="271.0" class="mono" text-anchor="middle">i=4, sum=6</text><text x="22" y="317" class="" text-anchor="start">加4，再更新</text><rect x="163" y="291" width="210" height="34" rx="7" class="hi"/><text x="268.0" y="314.0" class="mono" text-anchor="middle">i=5, sum=10</text><text x="22" y="360" class="" text-anchor="start">检查5≤4？</text><rect x="163" y="334" width="210" height="34" rx="7" class="box"/><text x="268.0" y="357.0" class="mono" text-anchor="middle">假 → 退出</text><text x="22" y="425" class="" text-anchor="start">循环执行4次；退出后的 i 是5。</text><text x="22" y="452" class="" text-anchor="start">条件为假时，循环体不会再运行。</text></svg>