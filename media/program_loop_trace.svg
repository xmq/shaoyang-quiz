<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500"><defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.b{fill:#fff;stroke:#64748b;stroke-width:2}.h{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.l{stroke:#2563eb;stroke-width:4}.tt{font:700 25px system-ui;fill:#102a43}.t{font:19px system-ui;fill:#334155}.m{font:19px ui-monospace;fill:#1d4ed8}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.b{fill:#17283b;stroke:#647b91}.h{fill:#173f3c;stroke:#46d6c6}.tt{fill:#edf4fb}.t{fill:#b8c5d1}.m{fill:#a9cbff}}</style></defs><rect class="bg" x="12" y="12" width="876" height="476" rx="24"/><text class="tt" x="45" y="58">循环题先跟踪：条件 → 本轮变化 → 下一轮</text><rect class="h" x="330" y="90" width="240" height="65" rx="14"/><text class="m" x="450" y="130" text-anchor="middle">初始化 i=1, sum=0</text><rect class="b" x="330" y="200" width="240" height="65" rx="14"/><text class="m" x="450" y="240" text-anchor="middle">条件 i≤4 ?</text><rect class="h" x="330" y="310" width="240" height="85" rx="14"/><text class="m" x="450" y="345" text-anchor="middle">sum += i</text><text class="m" x="450" y="375" text-anchor="middle">i += 1</text><path class="l" d="M450 155V200M450 265V310M330 353H210V232H330" fill="none"/><text class="t" x="610" y="235">否 → 结束</text><text class="t" x="610" y="335">每轮只改一次状态</text><text class="t" x="90" y="450">i依次为1、2、3、4，最终sum=10；先写表再判断边界。</text></svg>