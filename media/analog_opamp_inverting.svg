<svg xmlns="http://www.w3.org/2000/svg" width="515" height="313" viewBox="0 0 515 313" role="img" aria-labelledby="title desc"><title id="title">反相比例运算放大器的负反馈电路</title><desc id="desc">反相输入端经10千欧电阻接0.2伏输入，输出经50千欧反馈电阻接回反相输入节点，同相输入接地。在线性负反馈且未饱和条件下，输入节点近似0伏，20微安流经输入及反馈电阻，输出为负1伏。</desc><defs><style>:root{--ink:#263d49;--muted:#647781;--line:#c6d3d9;--accent:#147b71;--blue:#356c9b;--warm:#b37327;--pale:#e7f3f0}@media(prefers-color-scheme:dark){:root{--ink:#dfebf0;--muted:#a2b8c3;--line:#415965;--accent:#7ed6c6;--blue:#a3c8ed;--warm:#e7bb77;--pale:#203d3c}}text{font:20px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:var(--ink)}.small{font-size:18px;fill:var(--muted)}.label{font-size:20px;font-weight:600}.accent{fill:var(--accent)}.blue{fill:var(--blue)}.warm{fill:var(--warm)}.wire,.axis{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.guide{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 5}.grid{fill:none;stroke:var(--line);stroke-width:1}.curve{fill:none;stroke:var(--accent);stroke-width:2.6}.point{fill:var(--accent)}.resistor{fill:none;stroke:var(--ink);stroke-width:1.8}.accent-line{fill:none;stroke:var(--accent);stroke-width:2.1}</style><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="var(--ink)"/></marker></defs><path d="M250 111 250 251 377 181Z" class="wire"/><text x="263" y="155" class="label" text-anchor="start">−</text><text x="263" y="225" class="label" text-anchor="start">+</text><path d="M24 148H90M158 148H250" class="wire"/><rect class="resistor" x="90" y="141" width="68" height="14"/><text x="124" y="126" class="small" text-anchor="middle">R<tspan baseline-shift="sub" font-size="70%">in</tspan> = 10 kΩ</text><path d="M212 148V57H280M354 57H433V181M377 181H497" class="wire"/><rect class="resistor" x="280" y="50" width="74" height="14"/><text x="317" y="33" class="small" text-anchor="middle">R<tspan baseline-shift="sub" font-size="70%">f</tspan> = 50 kΩ</text><circle cx="212" cy="148" r="3" fill="var(--ink)"/><circle cx="433" cy="181" r="3" fill="var(--ink)"/><path d="M250 216H213V281M197 281h32m-27 7h22m-16 7h10" class="wire"/><text x="24" y="181" class="label blue" text-anchor="start">u<tspan baseline-shift="sub" font-size="70%">i</tspan> = 0.2 V</text><text x="400" y="216" class="label accent" text-anchor="start">u<tspan baseline-shift="sub" font-size="70%">o</tspan> = −1 V</text><text x="212" y="107" class="small" text-anchor="middle">u<tspan baseline-shift="sub" font-size="70%">−</tspan> ≈ 0</text><path d="M177 137H201" class="accent-line" marker-end="url(#arrow)"/><text x="186" y="246" class="small" text-anchor="end">20 μA</text><path d="M173 226 183 158" class="guide"/></svg>