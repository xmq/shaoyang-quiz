<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 530" role="img" aria-labelledby="title desc" width="400" height="530"><title id="title">反相运放：沿电流列方程</title><desc id="desc">反相运放：沿电流列方程</desc>
<defs><style>
        :root{--ink:#17324b;--muted:#456075;--paper:#fff;--panel:#edf5fa;--blue:#1464ba;--green:#087c67;--orange:#ad5200;--red:#b42318;--border:#cad8e5}
        @media(prefers-color-scheme:dark){:root{--ink:#edf4fb;--muted:#b5c8d8;--paper:#132334;--panel:#1b3349;--blue:#9bcaff;--green:#7de1c4;--orange:#ffc079;--red:#ffab9b;--border:#527087}}
        .paper{fill:var(--paper)}.panel{fill:var(--panel);stroke:var(--border)}.t{font:18px system-ui,sans-serif;fill:var(--ink)}.h{font:700 21px system-ui,sans-serif;fill:var(--ink)}.b{font:700 18px system-ui,sans-serif;fill:var(--blue)}.g{font:700 18px system-ui,sans-serif;fill:var(--green)}.r{font:700 18px system-ui,sans-serif;fill:var(--red)}.muted{font:18px system-ui,sans-serif;fill:var(--muted)}
        .wire{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}.blue{fill:none;stroke:var(--blue);stroke-width:2.5}.green{fill:none;stroke:var(--green);stroke-width:2.5}.orange{fill:none;stroke:var(--orange);stroke-width:2.5}.red{fill:none;stroke:var(--red);stroke-width:2.5}.dash{stroke-dasharray:5 4}.dot{fill:var(--ink)}.shade{fill:var(--green);opacity:.17}
        </style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs>
<rect class="paper" width="400" height="530" rx="12"/>
<text class="h" x="20" y="33">反相运放：沿电流列方程</text>
<path class="wire" d="M165 170L165 310L300 240Z"/>
<text class="t" x="177" y="214">−</text>
<text class="t" x="177" y="281">+</text>
<path class="wire" d="M30 205L40 205"/>
<rect class="panel" x="40" y="196" width="75" height="18" rx="0"/>
<path class="wire" d="M115 205L125 205"/>
<text class="t" x="77.5" y="186" text-anchor="middle">Rin=10kΩ</text>
<path class="wire" d="M125 205L165 205"/>
<circle class="dot" cx="142" cy="205" r="4"/>
<text class="t" x="22" y="249">ui=0.2 V</text>
<path class="wire" d="M142 205V110H185"/>
<path class="wire" d="M185 110L195 110"/>
<rect class="panel" x="195" y="101" width="75" height="18" rx="0"/>
<path class="wire" d="M270 110L280 110"/>
<text class="t" x="232.5" y="91" text-anchor="middle">Rf=50kΩ</text>
<path class="wire" d="M280 110H325V240H300"/>
<circle class="dot" cx="325" cy="240" r="4"/>
<path class="wire" d="M325 240L375 240"/>
<text class="g" x="301" y="284">uo=−1 V</text>
<path class="wire" d="M165 275H105V325"/>
<path class="wire" d="M85 325L125 325"/>
<path class="wire" d="M94 334L116 334"/>
<text class="t" x="20" y="371">负反馈且未饱和：u−≈u+=0</text>
<text class="t" x="20" y="403">输入电流：0.2/10k = 20 μA</text>
<text class="t" x="20" y="435">输入端不吸电流，同样流过Rf。</text>
<text class="t" x="20" y="467">uo = −20 μA×50k = −1 V</text>
<text class="t" x="20" y="501">输出超出供电摆幅时，不能再套虚短。</text>
</svg>
