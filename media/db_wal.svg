<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500"><defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.b{fill:#fff;stroke:#64748b;stroke-width:2}.h{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.l{stroke:#2563eb;stroke-width:4;fill:none}.tt{font:700 25px system-ui;fill:#102a43}.t{font:19px system-ui;fill:#334155}.m{font:18px ui-monospace;fill:#1d4ed8}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.b{fill:#17283b;stroke:#647b91}.h{fill:#173f3c;stroke:#46d6c6}.tt{fill:#edf4fb}.t{fill:#b8c5d1}.m{fill:#a9cbff}}</style></defs><rect class="bg" x="12" y="12" width="876" height="476" rx="24"/><text class="tt" x="45" y="58">WAL恢复：日志先于数据页落盘</text><rect class="b" x="55" y="120" width="200" height="90" rx="14"/><rect class="h" x="350" y="120" width="200" height="90" rx="14"/><rect class="b" x="645" y="120" width="200" height="90" rx="14"/><text class="tt" x="155" y="173" text-anchor="middle">内存修改</text><text class="tt" x="450" y="173" text-anchor="middle">先写日志</text><text class="tt" x="745" y="173" text-anchor="middle">再写数据页</text><path class="l" d="M255 165H350M550 165H645"/><text class="m" x="95" y="285">未提交事务 → UNDO</text><text class="m" x="95" y="335">已提交但数据页未落盘 → REDO</text><text class="t" x="95" y="400">检查点缩短日志扫描范围；备份用于介质损坏后的数据恢复。</text><text class="t" x="95" y="450">RAID和复制提高可用性，但不能替代独立备份。</text></svg>