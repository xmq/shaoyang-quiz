<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" role="img" aria-labelledby="title" width="400" height="460"><title id="title">WAL：崩溃后靠日志补回状态</title><defs><style>text{font:18px "Microsoft YaHei",system-ui,sans-serif;fill:#183047}.title{font-size:20px;font-weight:700}.bold{font-weight:700}.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#7b8fa2;stroke-width:1.5}.hi{fill:#d9f3ed;stroke:#19806e;stroke-width:1.5}.blue{fill:#e0edff;stroke:#4c79bf;stroke-width:1.5}.warn{fill:#fff0d3;stroke:#c28a25;stroke-width:1.5}.line{stroke:#37768a;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#e6eef6}.bg{fill:#142234;stroke:#405469}.box{fill:#1a2e43;stroke:#859bad}.hi{fill:#16483f;stroke:#69d7bc}.blue{fill:#193e68;stroke:#92b9fb}.warn{fill:#4b3a1e;stroke:#e4b15a}.line{stroke:#82c5d4}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47879b"/></marker></defs><text x="18" y="32" class="title">WAL：崩溃后靠日志补回状态</text><rect class="hi" x="18" y="65" width="76" height="35" rx="7"/><text x="56.0" y="88.5" class="" text-anchor="middle">时刻</text><rect class="hi" x="94" y="65" width="184" height="35" rx="7"/><text x="186.0" y="88.5" class="" text-anchor="middle">已持久化日志</text><rect class="hi" x="278" y="65" width="104" height="35" rx="7"/><text x="330.0" y="88.5" class="" text-anchor="middle">数据页A</text><rect class="box" x="18" y="100" width="76" height="35" rx="7"/><text x="56.0" y="123.5" class="" text-anchor="middle">初始</text><rect class="box" x="94" y="100" width="184" height="35" rx="7"/><text x="186.0" y="123.5" class="" text-anchor="middle">—</text><rect class="box" x="278" y="100" width="104" height="35" rx="7"/><text x="330.0" y="123.5" class="" text-anchor="middle">100</text><rect class="box" x="18" y="135" width="76" height="35" rx="7"/><text x="56.0" y="158.5" class="" text-anchor="middle">修改</text><rect class="box" x="94" y="135" width="184" height="35" rx="7"/><text x="186.0" y="158.5" class="" text-anchor="middle">&lt;T,A,100,80&gt;</text><rect class="box" x="278" y="135" width="104" height="35" rx="7"/><text x="330.0" y="158.5" class="" text-anchor="middle">100</text><rect class="box" x="18" y="170" width="76" height="35" rx="7"/><text x="56.0" y="193.5" class="" text-anchor="middle">提交</text><rect class="box" x="94" y="170" width="184" height="35" rx="7"/><text x="186.0" y="193.5" class="" text-anchor="middle">COMMIT(T)</text><rect class="box" x="278" y="170" width="104" height="35" rx="7"/><text x="330.0" y="193.5" class="" text-anchor="middle">100</text><rect class="box" x="18" y="205" width="76" height="35" rx="7"/><text x="56.0" y="228.5" class="" text-anchor="middle">崩溃</text><rect class="box" x="94" y="205" width="184" height="35" rx="7"/><text x="186.0" y="228.5" class="" text-anchor="middle">日志还在</text><rect class="box" x="278" y="205" width="104" height="35" rx="7"/><text x="330.0" y="228.5" class="" text-anchor="middle">仍是100</text><path class="line" d="M200 254L200 279" marker-end="url(#a)"/><rect class="hi" x="18" y="292" width="364" height="44" rx="7"/><text x="200.0" y="320.0" class="" text-anchor="middle">REDO已提交修改：A恢复为80</text><text x="18" y="377" class="">修改页写盘之前，相关日志先写盘。</text><text x="18" y="410" class="">若未提交且脏页已写盘，需UNDO。</text><text x="18" y="441" class="">此图采用教材UNDO/REDO日志模型。</text></svg>