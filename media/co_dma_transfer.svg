<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 435" role="img" aria-labelledby="title" width="400" height="435"><title id="title">DMA：谁搬数据，谁负责开始结束</title><defs><style>text{font:18px "Microsoft YaHei",system-ui,sans-serif;fill:#183047}.title{font-size:20px;font-weight:700}.bold{font-weight:700}.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#7b8fa2;stroke-width:1.5}.hi{fill:#d9f3ed;stroke:#19806e;stroke-width:1.5}.blue{fill:#e0edff;stroke:#4c79bf;stroke-width:1.5}.warn{fill:#fff0d3;stroke:#c28a25;stroke-width:1.5}.line{stroke:#37768a;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#e6eef6}.bg{fill:#142234;stroke:#405469}.box{fill:#1a2e43;stroke:#859bad}.hi{fill:#16483f;stroke:#69d7bc}.blue{fill:#193e68;stroke:#92b9fb}.warn{fill:#4b3a1e;stroke:#e4b15a}.line{stroke:#82c5d4}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47879b"/></marker></defs><rect class="bg" x="1" y="1" width="398" height="433" rx="14"/><text x="18" y="32" class="title">DMA：谁搬数据，谁负责开始结束</text><rect class="blue" x="18" y="65" width="364" height="44" rx="7"/><text x="200.0" y="93.0" class="" text-anchor="middle">① CPU初始化地址、方向、长度</text><path class="line" d="M200 117L200 140" marker-end="url(#a)"/><rect class="box" x="18" y="153" width="140" height="55" rx="7"/><text x="88.0" y="186.5" class="" text-anchor="middle">设备</text><rect class="hi" x="242" y="153" width="140" height="55" rx="7"/><text x="312.0" y="186.5" class="" text-anchor="middle">主存</text><path class="line" d="M158 180L242 180" marker-end="url(#a)"/><text x="18" y="250" class="">② DMA控制器成块搬运，CPU可做别事。</text><text x="18" y="285" class="">搬运时可能与CPU争用内存或总线。</text><path class="line" d="M200 300L200 321" marker-end="url(#a)"/><rect class="blue" x="18" y="334" width="364" height="44" rx="7"/><text x="200.0" y="362.0" class="" text-anchor="middle">③ 完成后通知CPU，CPU处理结束状态</text><text x="18" y="414" class="">DMA减少CPU逐次搬运，不是完全绕过CPU。</text></svg>