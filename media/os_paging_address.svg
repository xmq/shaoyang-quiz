<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500"><defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.box{fill:#fff;stroke:#64748b;stroke-width:2}.hi{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.line{stroke:#2563eb;stroke-width:4;fill:none}.h{font:700 25px system-ui,sans-serif;fill:#102a43}.t{font:19px system-ui,sans-serif;fill:#334155}.m{font:19px ui-monospace,monospace;fill:#1d4ed8}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.box{fill:#17283b;stroke:#647b91}.hi{fill:#173f3c;stroke:#46d6c6}.line{stroke:#66a3ff}.h{fill:#edf4fb}.t{fill:#b8c5d1}.m{fill:#a9cbff}}</style></defs><rect class="bg" x="12" y="12" width="876" height="476" rx="24"/><text class="h" x="45" y="58">分页地址转换：页内偏移保持不变</text><rect class="box" x="55" y="115" width="210" height="90" rx="15"/><text class="h" x="160" y="150" text-anchor="middle">逻辑地址</text><text class="m" x="160" y="185" text-anchor="middle">页号 p | 偏移 d</text><rect class="hi" x="345" y="100" width="210" height="120" rx="15"/><text class="h" x="450" y="140" text-anchor="middle">TLB / 页表</text><text class="m" x="450" y="180" text-anchor="middle">p → 页框 f</text><rect class="box" x="635" y="115" width="210" height="90" rx="15"/><text class="h" x="740" y="150" text-anchor="middle">物理地址</text><text class="m" x="740" y="185" text-anchor="middle">页框 f | 偏移 d</text><path class="line" d="M265 160H345M555 160H635"/><text class="t" x="55" y="285">页号=floor(地址/页大小)，偏移=地址 mod 页大小。</text><text class="t" x="55" y="330">TLB未命中：继续查页表；页表显示未装入：才发生缺页。</text><text class="t" x="55" y="375">置换时：FIFO看装入先后，LRU看最近使用先后。</text><text class="t" x="55" y="420">算物理地址：f×页大小+d。</text></svg>