<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" role="img" aria-labelledby="title desc"><title id="title">分页：页号变，偏移不变</title><desc id="desc">分页：页号变，偏移不变；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><rect x="1" y="1" width="398" height="448" rx="12" class="bg"/><text x="22" y="33" class="title" text-anchor="start">分页：页号变，偏移不变</text><text x="22" y="70" class="" text-anchor="start">页大小1024 B；逻辑地址2500</text><rect x="35" y="100" width="330" height="50" rx="7" class="hi"/><text x="200.0" y="131.0" class="mono" text-anchor="middle">2500 = 2×1024 + 452</text><path class="line" d="M120 150L120 193"/><path class="line" d="M305 150L305 283"/><rect x="30" y="200" width="190" height="65" rx="7" class="box"/><text x="125.0" y="238.5" class="mono" text-anchor="middle">页表：页2 → 框5</text><path class="line" d="M120 265L120 305"/><rect x="35" y="310" width="330" height="50" rx="7" class="box"/><text x="200.0" y="341.0" class="mono" text-anchor="middle">物理地址 = 5×1024 + 452</text><text x="22" y="395" class="" text-anchor="start">得到5572；452原样保留。</text><text x="22" y="422" class="" text-anchor="start">TLB未命中要查页表，不等于缺页。</text></svg>