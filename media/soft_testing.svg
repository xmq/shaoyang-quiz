<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 368" role="img" aria-labelledby="title desc" width="390" height="368"><title id="title">边界值：先预测每个输入的结果</title><desc id="desc">边界值：先预测每个输入的结果</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><text class="h" x="20" y="33">边界值：先预测每个输入的结果</text><text class="h" x="22" y="69">年龄要求：整数18～60，含两端</text><path class="thin" d="M35 124L355 124"/><rect class="bad" x="22" y="101" width="52" height="48" rx="5"/><text class="t" x="48" y="131" text-anchor="middle">17</text><rect class="hot" x="82" y="101" width="52" height="48" rx="5"/><text class="t" x="108" y="131" text-anchor="middle">18</text><rect class="hot" x="142" y="101" width="52" height="48" rx="5"/><text class="t" x="168" y="131" text-anchor="middle">19</text><rect class="hot" x="202" y="101" width="52" height="48" rx="5"/><text class="t" x="228" y="131" text-anchor="middle">59</text><rect class="hot" x="262" y="101" width="52" height="48" rx="5"/><text class="t" x="288" y="131" text-anchor="middle">60</text><rect class="bad" x="322" y="101" width="52" height="48" rx="5"/><text class="t" x="348" y="131" text-anchor="middle">61</text><text class="t" x="22" y="186">17、61：拒绝；18、19、59、60：通过</text><text class="s" x="22" y="219">覆盖边界内、边界上与边界外。</text><text class="h" x="22" y="263">若程序写成 age ＞ 18，会怎样？</text><text class="t" x="22" y="299">18岁被误拒，边界用例立刻发现错误。</text><text class="s" x="22" y="343">这是黑盒输入选择，与测试层次不同。</text></svg>
