<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" role="img" aria-labelledby="title desc"><title id="title">并联：每条支路同电压</title><desc id="desc">并联：每条支路同电压</desc>
<defs><style>
        :root{--ink:#17324b;--muted:#456075;--paper:#fff;--panel:#edf5fa;--blue:#1464ba;--green:#087c67;--orange:#ad5200;--red:#b42318;--border:#cad8e5}
        @media(prefers-color-scheme:dark){:root{--ink:#edf4fb;--muted:#b5c8d8;--paper:#132334;--panel:#1b3349;--blue:#9bcaff;--green:#7de1c4;--orange:#ffc079;--red:#ffab9b;--border:#527087}}
        .paper{fill:var(--paper)}.panel{fill:var(--panel);stroke:var(--border)}.t{font:18px system-ui,sans-serif;fill:var(--ink)}.h{font:700 21px system-ui,sans-serif;fill:var(--ink)}.b{font:700 18px system-ui,sans-serif;fill:var(--blue)}.g{font:700 18px system-ui,sans-serif;fill:var(--green)}.r{font:700 18px system-ui,sans-serif;fill:var(--red)}.muted{font:18px system-ui,sans-serif;fill:var(--muted)}
        .wire{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}.blue{fill:none;stroke:var(--blue);stroke-width:2.5}.green{fill:none;stroke:var(--green);stroke-width:2.5}.orange{fill:none;stroke:var(--orange);stroke-width:2.5}.red{fill:none;stroke:var(--red);stroke-width:2.5}.dash{stroke-dasharray:5 4}.dot{fill:var(--ink)}.shade{fill:var(--green);opacity:.17}
        </style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs>
<rect class="paper" width="400" height="450" rx="12"/>
<text class="h" x="20" y="33">并联：每条支路同电压</text>
<text class="b" x="20" y="64">三个6 Ω支路接在同一对节点</text>
<path class="wire" d="M55 120H345M55 260H345M55 120V260"/>
<path class="wire" d="M130 120L130 130"/>
<rect class="panel" x="121" y="130" width="18" height="120" rx="0"/>
<path class="wire" d="M130 250L130 260"/>
<text class="t" x="147" y="196.0">6 Ω</text>
<circle class="dot" cx="130" cy="120" r="4"/>
<circle class="dot" cx="130" cy="260" r="4"/>
<path class="wire" d="M230 120L230 130"/>
<rect class="panel" x="221" y="130" width="18" height="120" rx="0"/>
<path class="wire" d="M230 250L230 260"/>
<text class="t" x="247" y="196.0">6 Ω</text>
<circle class="dot" cx="230" cy="120" r="4"/>
<circle class="dot" cx="230" cy="260" r="4"/>
<path class="wire" d="M330 120L330 130"/>
<rect class="panel" x="321" y="130" width="18" height="120" rx="0"/>
<path class="wire" d="M330 250L330 260"/>
<text class="t" x="347" y="196.0">6 Ω</text>
<circle class="dot" cx="330" cy="120" r="4"/>
<circle class="dot" cx="330" cy="260" r="4"/>
<rect class="panel" x="34" y="162" width="42" height="55" rx="10"/>
<text class="t" x="55" y="185" text-anchor="middle">6 V</text>
<text class="t" x="20" y="305">每路电流：6 V / 6 Ω = 1 A</text>
<text class="t" x="20" y="335">总电流：1+1+1 = 3 A</text>
<text class="g" x="20" y="365">等效电阻：6 V / 3 A = 2 Ω</text>
<text class="t" x="20" y="401">先认共同节点，不能只看电阻在纸上的左右</text>
<text class="t" x="20" y="426">位置。</text>
</svg>
