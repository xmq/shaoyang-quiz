<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 410" role="img" aria-labelledby="title desc"><title id="title">堆排序：已排好的尾部不再动</title><desc id="desc">堆排序：已排好的尾部不再动；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><rect x="1" y="1" width="398" height="408" rx="12" class="bg"/><text x="22" y="33" class="title" text-anchor="start">堆排序：已排好的尾部不再动</text><text x="22" y="70" class="" text-anchor="start">初始 [5,2,4,3]；先建大根堆</text><text x="22" y="116" class="" text-anchor="start">① 2与孩子3交换</text><rect x="55" y="130" width="74" height="39" rx="7" class="box"/><text x="92.0" y="155.5" class="mono" text-anchor="middle">5</text><rect x="132" y="130" width="74" height="39" rx="7" class="box"/><text x="169.0" y="155.5" class="mono" text-anchor="middle">3</text><rect x="209" y="130" width="74" height="39" rx="7" class="box"/><text x="246.0" y="155.5" class="mono" text-anchor="middle">4</text><rect x="286" y="130" width="74" height="39" rx="7" class="box"/><text x="323.0" y="155.5" class="mono" text-anchor="middle">2</text><text x="22" y="191" class="" text-anchor="start">② 堆顶5与末项2交换</text><rect x="55" y="205" width="74" height="39" rx="7" class="box"/><text x="92.0" y="230.5" class="mono" text-anchor="middle">2</text><rect x="132" y="205" width="74" height="39" rx="7" class="box"/><text x="169.0" y="230.5" class="mono" text-anchor="middle">3</text><rect x="209" y="205" width="74" height="39" rx="7" class="box"/><text x="246.0" y="230.5" class="mono" text-anchor="middle">4</text><rect x="286" y="205" width="74" height="39" rx="7" class="hi"/><text x="323.0" y="230.5" class="mono" text-anchor="middle">5</text><text x="22" y="266" class="" text-anchor="start">③ 仅在前3项中下沉2</text><rect x="55" y="280" width="74" height="39" rx="7" class="box"/><text x="92.0" y="305.5" class="mono" text-anchor="middle">4</text><rect x="132" y="280" width="74" height="39" rx="7" class="box"/><text x="169.0" y="305.5" class="mono" text-anchor="middle">3</text><rect x="209" y="280" width="74" height="39" rx="7" class="box"/><text x="246.0" y="305.5" class="mono" text-anchor="middle">2</text><rect x="286" y="280" width="74" height="39" rx="7" class="hi"/><text x="323.0" y="305.5" class="mono" text-anchor="middle">5</text><text x="22" y="374" class="" text-anchor="start">剩余堆顶是4；5已归位，不参与下沉。</text></svg>