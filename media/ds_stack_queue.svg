<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 355" role="img" aria-labelledby="title desc" width="400" height="355"><title id="title">栈与队列：谁先出来？</title><desc id="desc">栈与队列：谁先出来？；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><text x="22" y="33" class="title" text-anchor="start">栈与队列：谁先出来？</text><text x="22" y="70" class="" text-anchor="start">按 A、B、C 顺序放入</text><text x="22" y="115" class="" text-anchor="start">栈：同一端进出</text><rect x="24" y="135" width="77" height="39" rx="7" class="box"/><text x="62.5" y="160.5" class="mono" text-anchor="middle">A</text><rect x="104" y="135" width="77" height="39" rx="7" class="box"/><text x="142.5" y="160.5" class="mono" text-anchor="middle">B</text><rect x="184" y="135" width="77" height="39" rx="7" class="hi"/><text x="222.5" y="160.5" class="mono" text-anchor="middle">C</text><text x="260" y="160" class="" text-anchor="start">← 栈顶</text><text x="22" y="205" class="" text-anchor="start">先取 C，再取 B，最后 A</text><text x="22" y="250" class="" text-anchor="start">队列：队尾进，队头出</text><rect x="24" y="267" width="77" height="39" rx="7" class="hi"/><text x="62.5" y="292.5" class="mono" text-anchor="middle">A</text><rect x="104" y="267" width="77" height="39" rx="7" class="box"/><text x="142.5" y="292.5" class="mono" text-anchor="middle">B</text><rect x="184" y="267" width="77" height="39" rx="7" class="box"/><text x="222.5" y="292.5" class="mono" text-anchor="middle">C</text><text x="22" y="330" class="" text-anchor="start">队头 A 先出；新元素从 C 后入队。</text></svg>