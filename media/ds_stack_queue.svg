<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">栈、普通队列与循环队列</title><desc id="desc">栈后进先出，队列先进先出，循环队列用取模让下标从数组末尾回到开头。</desc>
  <defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.cell{fill:#fff;stroke:#64748b;stroke-width:2}.active{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.arrow{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#a)}.h{font:700 25px system-ui,sans-serif;fill:#102a43}.t{font:19px system-ui,sans-serif;fill:#334155}.m{font:19px ui-monospace,monospace;fill:#1d4ed8}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.cell{fill:#17283b;stroke:#647b91}.active{fill:#173f3c;stroke:#46d6c6}.h{fill:#edf4fb}.t{fill:#b8c5d1}.m{fill:#a9cbff}}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2563eb"/></marker></defs>
  <rect class="bg" x="12" y="12" width="936" height="576" rx="26"/><text class="h" x="48" y="58">受限操作决定数据离开的顺序</text>
  <text class="h" x="75" y="115">栈 LIFO</text><g class="cell"><rect x="70" y="150" width="180" height="60"/><rect x="70" y="210" width="180" height="60"/><rect x="70" y="270" width="180" height="60"/></g><g class="m" text-anchor="middle"><text x="160" y="188">C ← 栈顶</text><text x="160" y="248">B</text><text x="160" y="308">A</text></g><path class="arrow" d="M280 175H355"/><text class="t" x="290" y="145">pop C</text>
  <text class="h" x="445" y="115">队列 FIFO</text><g class="cell"><rect x="430" y="150" width="120" height="70"/><rect x="550" y="150" width="120" height="70"/><rect x="670" y="150" width="120" height="70"/></g><g class="m" text-anchor="middle"><text x="490" y="193">A</text><text x="610" y="193">B</text><text x="730" y="193">C</text></g><path class="arrow" d="M420 185H350"/><text class="t" x="360" y="145">出队</text><path class="arrow" d="M800 185H870"/><text class="t" x="805" y="145">入队</text>
  <text class="h" x="48" y="395">循环队列：m=6，front=4，rear=1</text>
  <g class="cell"><rect x="70" y="430" width="120" height="70"/><rect x="190" y="430" width="120" height="70"/><rect x="310" y="430" width="120" height="70"/><rect x="430" y="430" width="120" height="70"/></g><g class="active"><rect x="550" y="430" width="120" height="70"/><rect x="670" y="430" width="120" height="70"/></g>
  <g class="m" text-anchor="middle"><text x="130" y="472">0:C</text><text x="250" y="472">1 rear</text><text x="370" y="472">2</text><text x="490" y="472">3</text><text x="610" y="472">4:A</text><text x="730" y="472">5:B</text></g>
  <text class="t" x="70" y="548">长度=(rear-front+m)%m=(1-4+6)%6=3</text>
</svg>
