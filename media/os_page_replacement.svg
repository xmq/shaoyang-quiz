<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" role="img" aria-labelledby="title desc"><title id="title">同一访问串，FIFO与LRU不同</title><desc id="desc">同一访问串，FIFO与LRU不同；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><rect x="1" y="1" width="398" height="378" rx="12" class="bg"/><text x="22" y="33" class="title" text-anchor="start">同一访问串，FIFO与LRU不同</text><text x="22" y="70" class="" text-anchor="start">3个空页框，依次访问1、2、3、1、4</text><text x="24" y="118" class="" text-anchor="start">装1、2、3</text><rect x="154" y="92" width="220" height="35" rx="7" class="hi"/><text x="264.0" y="115.5" class="mono" text-anchor="middle">[1,2,3]</text><text x="24" y="166" class="" text-anchor="start">再访问1</text><rect x="154" y="140" width="220" height="35" rx="7" class="hi"/><text x="264.0" y="163.5" class="mono" text-anchor="middle">命中，内容不变</text><text x="24" y="214" class="" text-anchor="start">最后访问4</text><rect x="154" y="188" width="220" height="35" rx="7" class="hi"/><text x="264.0" y="211.5" class="mono" text-anchor="middle">缺页，需要淘汰</text><text x="22" y="280" class="" text-anchor="start">FIFO：1最早装入，淘汰1 → [4,2,3]</text><text x="22" y="307" class="" text-anchor="start">LRU：刚访问过1；2最久未用，淘汰2</text><text x="22" y="334" class="" text-anchor="start">所以 LRU 得 [1,4,3]。命中也更新新旧。</text></svg>