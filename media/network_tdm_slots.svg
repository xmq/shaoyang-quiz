<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 370" role="img" aria-labelledby="title" width="400" height="370"><title id="title">TDM：固定时隙按帧轮流给A、B</title><defs><style>text{font:18px "Microsoft YaHei",system-ui,sans-serif;fill:#183047}.title{font-size:20px;font-weight:700}.bold{font-weight:700}.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#7b8fa2;stroke-width:1.5}.hi{fill:#d9f3ed;stroke:#19806e;stroke-width:1.5}.blue{fill:#e0edff;stroke:#4c79bf;stroke-width:1.5}.warn{fill:#fff0d3;stroke:#c28a25;stroke-width:1.5}.line{stroke:#37768a;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#e6eef6}.bg{fill:#142234;stroke:#405469}.box{fill:#1a2e43;stroke:#859bad}.hi{fill:#16483f;stroke:#69d7bc}.blue{fill:#193e68;stroke:#92b9fb}.warn{fill:#4b3a1e;stroke:#e4b15a}.line{stroke:#82c5d4}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47879b"/></marker></defs><rect class="bg" x="1" y="1" width="398" height="368" rx="14"/><text x="18" y="32" class="title">TDM：固定时隙按帧轮流给A、B</text><text x="18" y="68" class="">A、B各1 kbit/s，每帧各占1 bit。</text><text x="18" y="105" class="">第1帧</text><text x="210" y="105" class="">第2帧</text><rect class="hi" x="18" y="122" width="82" height="46" rx="7"/><text x="59.0" y="151.0" class="" text-anchor="middle">A₁</text><rect class="blue" x="106" y="122" width="82" height="46" rx="7"/><text x="147.0" y="151.0" class="" text-anchor="middle">B₁</text><rect class="hi" x="210" y="122" width="82" height="46" rx="7"/><text x="251.0" y="151.0" class="" text-anchor="middle">A₂</text><rect class="blue" x="298" y="122" width="82" height="46" rx="7"/><text x="339.0" y="151.0" class="" text-anchor="middle">B₂</text><path class="line" d="M18 193L382 193" marker-end="url(#a)"/><text x="18" y="227" class="">每秒1000帧 × 每帧2 bit = 2 kbit/s。</text><text x="18" y="266" class="">A暂无数据：</text><rect class="warn" x="18" y="285" width="160" height="44" rx="7"/><text x="98.0" y="313.0" class="" text-anchor="middle">A时隙空着</text><rect class="blue" x="195" y="285" width="187" height="44" rx="7"/><text x="288.5" y="313.0" class="" text-anchor="middle">B仍用原时隙</text><text x="18" y="356" class="">同步TDM固定分配，不自动把空隙给B。</text></svg>