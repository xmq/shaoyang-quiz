<svg xmlns="http://www.w3.org/2000/svg" width="360" height="530" viewBox="0 0 360 530" role="img" aria-labelledby="title desc"><title id="title">输入、输出与程序结构的对应</title><desc id="desc">三棵树分别给出表头、重复记录、表尾，以及对应初始化、逐条处理、汇总。星号只标重复部分。</desc><style>svg{color:#20333b;font:15px system-ui,'Microsoft YaHei',sans-serif}text{fill:currentColor}.line{fill:none;stroke:currentColor;stroke-width:1.6}.box{fill:#edf5f4;stroke:#5c8080;stroke-width:1.5}.accent{fill:none;stroke:#167d70;stroke-width:2.3}.fill{fill:#167d70}.muted{fill:#61747b}@media(prefers-color-scheme:dark){svg{color:#e8f0f2}.box{fill:#1b3438;stroke:#8aabb1}.accent{stroke:#73ceba}.fill{fill:#73ceba}.muted{fill:#adbec5}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="12" y="24" font-size="17">JSP：让程序结构对应数据结构</text><rect class="box" x="119" y="40" width="122" height="34"/><text x="180" y="63" text-anchor="middle">输入批次</text><path class="line" d="M180 74V91M64 91H296M64 91V108M180 91V108M296 91V108"/><rect class="line" x="16" y="108" width="96" height="56"/><text x="64" y="131" font-size="14" text-anchor="middle">HEAD</text><text x="64" y="151" font-size="14" text-anchor="middle">批次号</text><rect class="line" x="132" y="108" width="96" height="56"/><text x="180" y="131" font-size="14" text-anchor="middle">ITEM</text><text x="180" y="151" font-size="14" text-anchor="middle">金额</text><text x="219" y="122" font-size="17" text-anchor="middle">*</text><rect class="line" x="248" y="108" width="96" height="56"/><text x="296" y="131" font-size="14" text-anchor="middle">END</text><text x="296" y="151" font-size="14" text-anchor="middle">结束标记</text><rect class="box" x="119" y="188" width="122" height="34"/><text x="180" y="211" text-anchor="middle">输出报告</text><path class="line" d="M180 222V239M64 239H296M64 239V256M180 239V256M296 239V256"/><rect class="line" x="16" y="256" width="96" height="56"/><text x="64" y="279" font-size="14" text-anchor="middle">REPORT</text><text x="64" y="299" font-size="14" text-anchor="middle">批次号</text><rect class="line" x="132" y="256" width="96" height="56"/><text x="180" y="279" font-size="14" text-anchor="middle">DETAIL</text><text x="180" y="299" font-size="14" text-anchor="middle">金额</text><text x="219" y="270" font-size="17" text-anchor="middle">*</text><rect class="line" x="248" y="256" width="96" height="56"/><text x="296" y="279" font-size="14" text-anchor="middle">TOTAL</text><text x="296" y="299" font-size="14" text-anchor="middle">笔数、合计</text><rect class="box" x="119" y="336" width="122" height="34"/><text x="180" y="359" text-anchor="middle">程序处理</text><path class="line" d="M180 370V387M64 387H296M64 387V404M180 387V404M296 387V404"/><rect class="line" x="16" y="404" width="96" height="56"/><text x="64" y="427" font-size="14" text-anchor="middle">读表头</text><text x="64" y="447" font-size="14" text-anchor="middle">初始化</text><rect class="line" x="132" y="404" width="96" height="56"/><text x="180" y="427" font-size="14" text-anchor="middle">逐条读入</text><text x="180" y="447" font-size="14" text-anchor="middle">累计、写明细</text><text x="219" y="418" font-size="17" text-anchor="middle">*</text><rect class="line" x="248" y="404" width="96" height="56"/><text x="296" y="427" font-size="14" text-anchor="middle">结束循环</text><text x="296" y="447" font-size="14" text-anchor="middle">写汇总</text><text x="12" y="488" font-size="13" class="muted">每组从左到右；*表示该部分重复零次或多次</text><text x="12" y="510" font-size="13" class="muted">10 → 20 → 5：合计10 → 30 → 35，最终3笔</text></svg>