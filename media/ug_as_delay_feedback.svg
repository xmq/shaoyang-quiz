<svg xmlns="http://www.w3.org/2000/svg" width="420" height="296" viewBox="0 0 420 296" role="img" aria-labelledby="title desc"><title id="title">输出延迟和增益反馈的离散系统</title><desc id="desc">输出分支先延迟一拍再乘0.5，沿正号反馈加到输入；对应y当前等于x当前加0.5倍y前拍。</desc><style>svg{color:#20333b;font:15px system-ui,'Microsoft YaHei',sans-serif}text{fill:currentColor}.line{fill:none;stroke:currentColor;stroke-width:1.6}.box{fill:#edf5f4;stroke:#5c8080;stroke-width:1.5}.accent{fill:none;stroke:#167d70;stroke-width:2.3}.fill{fill:#167d70}.muted{fill:#61747b}@media(prefers-color-scheme:dark){svg{color:#e8f0f2}.box{fill:#1b3438;stroke:#8aabb1}.accent{stroke:#73ceba}.fill{fill:#73ceba}.muted{fill:#adbec5}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="12" y="25" font-size="18">先沿支路写量，再列差分方程</text><text x="15" y="85" font-size="16">x[n]</text><path class="line" d="M60 80H136" marker-end="url(#arrow)"/><circle class="box" cx="155" cy="80" r="19"/><text x="155" y="86" font-size="22" text-anchor="middle">+</text><path class="line" d="M174 80H386" marker-end="url(#arrow)"/><text x="353" y="66" font-size="16">y[n]</text><circle class="fill" cx="320" cy="80" r="3"/><path class="line" d="M320 80V193H285" marker-end="url(#arrow)"/><rect class="box" x="215" y="171" width="70" height="44"/><text x="250" y="199" font-size="20" text-anchor="middle">z⁻¹</text><path class="line" d="M215 193H160" marker-end="url(#arrow)"/><text x="186" y="160" font-size="14" text-anchor="middle">y[n−1]</text><rect class="box" x="90" y="171" width="70" height="44"/><text x="125" y="199" font-size="18" text-anchor="middle">×0.5</text><path class="line" d="M90 193H60V135H155V100" marker-end="url(#arrow)"/><text x="74" y="236" font-size="14">0.5y[n−1]</text><text x="12" y="272" font-size="16">y[n]=x[n]+0.5y[n−1]；初态须另给</text></svg>