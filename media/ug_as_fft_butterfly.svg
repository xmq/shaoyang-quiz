<svg xmlns="http://www.w3.org/2000/svg" width="420" height="304" viewBox="0 0 420 304" role="img" aria-labelledby="title desc"><title id="title">四点FFT中k1的一对加权蝶形</title><desc id="desc">偶序列频点1，奇序列频点2先乘负j得到负2j，和为1减2j，差为1加2j。交叉连线无连接点。</desc><style>svg{color:#20333b;font:15px system-ui,'Microsoft YaHei',sans-serif}text{fill:currentColor}.line{fill:none;stroke:currentColor;stroke-width:1.6}.box{fill:#edf5f4;stroke:#5c8080;stroke-width:1.5}.accent{fill:none;stroke:#167d70;stroke-width:2.3}.fill{fill:#167d70}.muted{fill:#61747b}@media(prefers-color-scheme:dark){svg{color:#e8f0f2}.box{fill:#1b3438;stroke:#8aabb1}.accent{stroke:#73ceba}.fill{fill:#73ceba}.muted{fill:#adbec5}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="12" y="25" font-size="18">一对蝶形：同一乘积作和与差</text><text x="12" y="51" font-size="15">k=1，E[1]=1，O[1]=2，W₄=−j</text><path class="line" d="M70 100H279" marker-end="url(#arrow)"/><path class="line" d="M70 100L279 220" marker-end="url(#arrow)"/><path class="line" d="M194 220L279 100" marker-end="url(#arrow)"/><path class="line" d="M194 220H279" marker-end="url(#arrow)"/><text x="15" y="105" font-size="16">E=1</text><path class="line" d="M64 220H92" marker-end="url(#arrow)"/><rect class="box" x="92" y="198" width="102" height="44"/><text x="143" y="225" font-size="17" text-anchor="middle">×(−j)</text><text x="14" y="225" font-size="16">O=2</text><text x="205" y="245" font-size="14" text-anchor="middle" class="muted">−2j</text><circle class="box" cx="298" cy="100" r="17"/><circle class="box" cx="298" cy="220" r="17"/><text x="298" y="106" font-size="21" text-anchor="middle">+</text><text x="298" y="226" font-size="21" text-anchor="middle">−</text><path class="line" d="M315 100H404" marker-end="url(#arrow)"/><path class="line" d="M315 220H404" marker-end="url(#arrow)"/><text x="330" y="87" font-size="15">X[1]</text><text x="330" y="124" font-size="17">1−2j</text><text x="330" y="207" font-size="15">X[3]</text><text x="330" y="244" font-size="17">1+2j</text><text x="12" y="282" font-size="14" class="muted">上：E+W₄O；下：E−W₄O，非两个相同输出</text></svg>