<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 415" role="img" aria-labelledby="title" width="400" height="415"><title id="title">E-R：先区分三种图形</title><defs><style>text{font:18px "Microsoft YaHei",system-ui,sans-serif;fill:#183047}.title{font-size:20px;font-weight:700}.bold{font-weight:700}.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#7b8fa2;stroke-width:1.5}.hi{fill:#d9f3ed;stroke:#19806e;stroke-width:1.5}.blue{fill:#e0edff;stroke:#4c79bf;stroke-width:1.5}.warn{fill:#fff0d3;stroke:#c28a25;stroke-width:1.5}.line{stroke:#37768a;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#e6eef6}.bg{fill:#142234;stroke:#405469}.box{fill:#1a2e43;stroke:#859bad}.hi{fill:#16483f;stroke:#69d7bc}.blue{fill:#193e68;stroke:#92b9fb}.warn{fill:#4b3a1e;stroke:#e4b15a}.line{stroke:#82c5d4}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47879b"/></marker></defs><text x="18" y="32" class="title">E-R：先区分三种图形</text><rect class="box" x="30" y="81" width="125" height="48" rx="7"/><text x="92.5" y="111.0" class="" text-anchor="middle">学生</text><rect class="box" x="245" y="81" width="125" height="48" rx="7"/><text x="307.5" y="111.0" class="" text-anchor="middle">课程</text><polygon class="hi" points="200,170 263,208 200,246 137,208"/><text x="200" y="215" class="" text-anchor="middle">选课</text><ellipse class="blue" cx="82" cy="211" rx="42" ry="28"/><text x="82" y="217" class="" text-anchor="middle">学号</text><path class="line" d="M92 129V182M155 105L200 170M245 105L220 182"/><text x="160" y="142" class="">m</text><text x="240" y="148" class="">n</text><text x="18" y="291" class="">矩形＝实体；椭圆＝属性。</text><text x="18" y="324" class="">菱形＝联系；m:n＝双方都可以多。</text><text x="18" y="359" class="">一名学生选多门课，一门课多人选。</text><text x="18" y="392" class="">实体之间通过联系连接，不是属性。</text></svg>