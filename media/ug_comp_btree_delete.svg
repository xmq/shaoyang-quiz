<svg xmlns="http://www.w3.org/2000/svg" width="380" height="590" viewBox="0 0 380 590" role="img" aria-label="四阶B树两次独立删除10：借位与合并降根"><title>四阶B树两次独立删除10：借位与合并降根</title><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:16px;fill:#183a4b} .n{fill:#eef8f6;stroke:#087f75;stroke-width:1.6} .edge{fill:none;stroke:#54778a;stroke-width:1.6} .thread{fill:none;stroke:#087f75;stroke-width:2;stroke-dasharray:5 3} .small{font-size:14px} .title{font-size:18px;font-weight:bold} @media(prefers-color-scheme:dark){text{fill:#e5eff5} .n{fill:#193b3b;stroke:#79d0c3} .edge{stroke:#b0c7d5} .thread{stroke:#79d0c3}}</style><text class="title" x="12" y="25">四阶B树：非根最少1键</text><text x="12" y="55">① 删10后，兄弟有余键可借</text><path class="edge" d="M190 102 L90 135 M190 102 L290 135"/><rect class="n" x="155" y="70" width="70" height="32" rx="4"/><text x="190.0" y="92" text-anchor="middle">20</text><rect class="n" x="28" y="135" width="124" height="32" rx="4"/><text x="90.0" y="157" text-anchor="middle">10</text><rect class="n" x="228" y="135" width="124" height="32" rx="4"/><text x="290.0" y="157" text-anchor="middle">30, 40</text><text class="small" x="14" y="190">删10 → 父20下移，兄弟30上提</text><path class="edge" d="M190 240 L90 273 M190 240 L290 273"/><rect class="n" x="155" y="208" width="70" height="32" rx="4"/><text x="190.0" y="230" text-anchor="middle">30</text><rect class="n" x="28" y="273" width="124" height="32" rx="4"/><text x="90.0" y="295" text-anchor="middle">20</text><rect class="n" x="228" y="273" width="124" height="32" rx="4"/><text x="290.0" y="295" text-anchor="middle">40</text><text x="12" y="342">② 独立案例：兄弟只有1键，不能借</text><path class="edge" d="M190 392 L90 425 M190 392 L290 425"/><rect class="n" x="155" y="360" width="70" height="32" rx="4"/><text x="190.0" y="382" text-anchor="middle">20</text><rect class="n" x="28" y="425" width="124" height="32" rx="4"/><text x="90.0" y="447" text-anchor="middle">10</text><rect class="n" x="228" y="425" width="124" height="32" rx="4"/><text x="290.0" y="447" text-anchor="middle">30</text><text class="small" x="14" y="480">删10 → 连父20合并，旧根空后降层</text><rect class="n" x="120" y="500" width="140" height="32" rx="4"/><text x="190.0" y="522" text-anchor="middle">20, 30</text><text class="small" x="14" y="565">最后一框是新根，不再保留空父结点。</text></svg>