<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 425" role="img" aria-labelledby="title desc"><title id="title">快排一趟：只固定枢轴位置</title><desc id="desc">快排一趟：只固定枢轴位置；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><rect x="1" y="1" width="398" height="423" rx="12" class="bg"/><text x="22" y="33" class="title" text-anchor="start">快排一趟：只固定枢轴位置</text><text x="22" y="70" class="" text-anchor="start">末项3为枢轴；只把比3小的项搬到左边</text><text x="22" y="119" class="" text-anchor="start">开始：扫描前3项</text><rect x="55" y="132" width="74" height="39" rx="7" class="box"/><text x="92.0" y="157.5" class="mono" text-anchor="middle">5</text><rect x="132" y="132" width="74" height="39" rx="7" class="box"/><text x="169.0" y="157.5" class="mono" text-anchor="middle">2</text><rect x="209" y="132" width="74" height="39" rx="7" class="box"/><text x="246.0" y="157.5" class="mono" text-anchor="middle">4</text><rect x="286" y="132" width="74" height="39" rx="7" class="hi"/><text x="323.0" y="157.5" class="mono" text-anchor="middle">3</text><text x="22" y="197" class="" text-anchor="start">扫到2，与左边界5交换</text><rect x="55" y="210" width="74" height="39" rx="7" class="box"/><text x="92.0" y="235.5" class="mono" text-anchor="middle">2</text><rect x="132" y="210" width="74" height="39" rx="7" class="box"/><text x="169.0" y="235.5" class="mono" text-anchor="middle">5</text><rect x="209" y="210" width="74" height="39" rx="7" class="box"/><text x="246.0" y="235.5" class="mono" text-anchor="middle">4</text><rect x="286" y="210" width="74" height="39" rx="7" class="hi"/><text x="323.0" y="235.5" class="mono" text-anchor="middle">3</text><text x="22" y="275" class="" text-anchor="start">最后：枢轴3与边界5交换</text><rect x="55" y="288" width="74" height="39" rx="7" class="box"/><text x="92.0" y="313.5" class="mono" text-anchor="middle">2</text><rect x="132" y="288" width="74" height="39" rx="7" class="hi"/><text x="169.0" y="313.5" class="mono" text-anchor="middle">3</text><rect x="209" y="288" width="74" height="39" rx="7" class="box"/><text x="246.0" y="313.5" class="mono" text-anchor="middle">4</text><rect x="286" y="288" width="74" height="39" rx="7" class="box"/><text x="323.0" y="313.5" class="mono" text-anchor="middle">5</text><text x="22" y="375" class="" text-anchor="start">本例两边恰好有序，一般仍需递归。</text></svg>