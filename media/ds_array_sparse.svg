<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 355" role="img" aria-labelledby="title desc"><title id="title">二维数组：先数元素再算字节</title><desc id="desc">二维数组：先数元素再算字节；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><rect x="1" y="1" width="398" height="353" rx="12" class="bg"/><text x="22" y="33" class="title" text-anchor="start">二维数组：先数元素再算字节</text><text x="22" y="70" class="" text-anchor="start">A[3][4]：每行4个元素，下标从0开始</text><rect x="34" y="95" width="79" height="39" rx="7" class="box"/><text x="73.5" y="120.5" class="mono" text-anchor="middle">0,0</text><rect x="116" y="95" width="79" height="39" rx="7" class="box"/><text x="155.5" y="120.5" class="mono" text-anchor="middle">0,1</text><rect x="198" y="95" width="79" height="39" rx="7" class="box"/><text x="237.5" y="120.5" class="mono" text-anchor="middle">0,2</text><rect x="280" y="95" width="79" height="39" rx="7" class="box"/><text x="319.5" y="120.5" class="mono" text-anchor="middle">0,3</text><rect x="34" y="140" width="79" height="39" rx="7" class="box"/><text x="73.5" y="165.5" class="mono" text-anchor="middle">1,0</text><rect x="116" y="140" width="79" height="39" rx="7" class="box"/><text x="155.5" y="165.5" class="mono" text-anchor="middle">1,1</text><rect x="198" y="140" width="79" height="39" rx="7" class="box"/><text x="237.5" y="165.5" class="mono" text-anchor="middle">1,2</text><rect x="280" y="140" width="79" height="39" rx="7" class="box"/><text x="319.5" y="165.5" class="mono" text-anchor="middle">1,3</text><rect x="34" y="185" width="79" height="39" rx="7" class="box"/><text x="73.5" y="210.5" class="mono" text-anchor="middle">2,0</text><rect x="116" y="185" width="79" height="39" rx="7" class="hi"/><text x="155.5" y="210.5" class="mono" text-anchor="middle">2,1</text><rect x="198" y="185" width="79" height="39" rx="7" class="box"/><text x="237.5" y="210.5" class="mono" text-anchor="middle">2,2</text><rect x="280" y="185" width="79" height="39" rx="7" class="box"/><text x="319.5" y="210.5" class="mono" text-anchor="middle">2,3</text><text x="22" y="267" class="" text-anchor="start">A[2][1] 前面有 2×4+1=9 个元素</text><text x="22" y="294" class="" text-anchor="start">每个4字节，基址1000：</text><text x="22" y="321" class="" text-anchor="start">地址 = 1000 + 9×4 = 1036</text></svg>