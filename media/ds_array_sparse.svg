<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">二维数组行优先地址与稀疏矩阵三元组</title><desc id="desc">二维数组按行映射到连续内存，并把稀疏矩阵的非零元素表示为行列值三元组。</desc>
  <defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.cell{fill:#fff;stroke:#64748b;stroke-width:2}.hit{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.h{font:700 25px system-ui,sans-serif;fill:#102a43}.t{font:19px system-ui,sans-serif;fill:#334155}.m{font:19px ui-monospace,monospace;fill:#1d4ed8}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.cell{fill:#17283b;stroke:#647b91}.hit{fill:#173f3c;stroke:#46d6c6}.h{fill:#edf4fb}.t{fill:#b8c5d1}.m{fill:#a9cbff}}</style></defs>
  <rect class="bg" x="12" y="12" width="936" height="576" rx="26"/><text class="h" x="48" y="60">二维结构最终仍要落到一维存储</text>
  <text class="h" x="48" y="112">A[3][4] 行优先</text>
  <g class="cell"><rect x="55" y="140" width="95" height="55"/><rect x="150" y="140" width="95" height="55"/><rect x="245" y="140" width="95" height="55"/><rect x="340" y="140" width="95" height="55"/><rect x="55" y="195" width="95" height="55"/><rect x="150" y="195" width="95" height="55"/><rect x="245" y="195" width="95" height="55"/><rect x="340" y="195" width="95" height="55"/><rect x="55" y="250" width="95" height="55"/><rect class="hit" x="150" y="250" width="95" height="55"/><rect x="245" y="250" width="95" height="55"/><rect x="340" y="250" width="95" height="55"/></g>
  <g class="m" text-anchor="middle"><text x="102" y="175">[0,0]</text><text x="197" y="175">[0,1]</text><text x="292" y="175">[0,2]</text><text x="387" y="175">[0,3]</text><text x="102" y="230">[1,0]</text><text x="197" y="230">[1,1]</text><text x="292" y="230">[1,2]</text><text x="387" y="230">[1,3]</text><text x="102" y="285">[2,0]</text><text x="197" y="285">[2,1]</text><text x="292" y="285">[2,2]</text><text x="387" y="285">[2,3]</text></g>
  <text class="t" x="485" y="165">元素偏移：i×列数+j</text><text class="m" x="485" y="210">A[2][1] → 2×4+1=9</text><text class="m" x="485" y="255">地址=1000+9×4=1036</text>
  <text class="h" x="48" y="372">稀疏矩阵：只记录非零元素</text>
  <g class="cell"><rect x="55" y="402" width="95" height="55"/><rect x="150" y="402" width="95" height="55"/><rect x="245" y="402" width="95" height="55"/><rect x="55" y="457" width="95" height="55"/><rect x="150" y="457" width="95" height="55"/><rect x="245" y="457" width="95" height="55"/></g><g class="m" text-anchor="middle"><text x="102" y="438">0</text><text x="197" y="438">8</text><text x="292" y="438">0</text><text x="102" y="493">5</text><text x="197" y="493">0</text><text x="292" y="493">9</text></g>
  <text class="m" x="405" y="420">(0,1,8)</text><text class="m" x="405" y="465">(1,0,5)</text><text class="m" x="405" y="510">(1,2,9)</text><text class="t" x="610" y="463">节省零元素空间，定位方式改变</text>
</svg>
