<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 390" role="img" aria-labelledby="title desc" width="400" height="390"><title id="title">指针的值是地址，*p是对象</title><desc id="desc">指针的值是地址，*p是对象；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><rect x="1" y="1" width="398" height="388" rx="12" class="bg"/><text x="22" y="33" class="title" text-anchor="start">指针的值是地址，*p是对象</text><text x="22" y="70" class="" text-anchor="start">int x=42; int *p=&amp;x;</text><text x="22" y="97" class="" text-anchor="start">地址仅为示意，不代表真实机器地址。</text><rect x="25" y="120" width="140" height="85" rx="7" class="box"/><text x="95.0" y="168.5" class="mono" text-anchor="middle">p：值1000</text><rect x="235" y="120" width="140" height="85" rx="7" class="hi"/><text x="305.0" y="168.5" class="mono" text-anchor="middle">x：值42</text><path class="line" d="M165 163L235 163"/><text x="305" y="235" class="mono" text-anchor="middle">x的地址1000</text><text x="22" y="292" class="" text-anchor="start">&amp;x：取地址1000；p：保存1000</text><text x="22" y="319" class="" text-anchor="start">*p：沿地址找到x，读出42</text><text x="22" y="346" class="" text-anchor="start">执行 *p=7 后：x变7，p仍是1000。</text></svg>