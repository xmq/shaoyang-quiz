<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470"><defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.b{fill:#fff;stroke:#64748b;stroke-width:2}.h{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.l{stroke:#2563eb;stroke-width:4}.tt{font:700 25px system-ui;fill:#102a43}.t{font:19px system-ui;fill:#334155}.m{font:19px ui-monospace;fill:#1d4ed8}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.b{fill:#17283b;stroke:#647b91}.h{fill:#173f3c;stroke:#46d6c6}.tt{fill:#edf4fb}.t{fill:#b8c5d1}.m{fill:#a9cbff}}</style></defs><rect class="bg" x="12" y="12" width="876" height="446" rx="24"/><text class="tt" x="45" y="58">指针保存地址，解引用才访问对象</text><rect class="h" x="90" y="125" width="240" height="130" rx="16"/><text class="tt" x="210" y="170" text-anchor="middle">变量 x</text><text class="m" x="210" y="210" text-anchor="middle">地址 1000</text><text class="m" x="210" y="240" text-anchor="middle">值 42</text><rect class="b" x="570" y="125" width="240" height="130" rx="16"/><text class="tt" x="690" y="170" text-anchor="middle">指针 p</text><text class="m" x="690" y="210" text-anchor="middle">值 1000</text><path class="l" d="M570 205H330"/><text class="m" x="405" y="190">p=&amp;x</text><text class="t" x="90" y="320">&amp;x：取得x的地址　　p：保存该地址　　*p：访问地址中的值42</text><text class="t" x="90" y="370">空指针、未初始化指针和悬空指针都不能安全解引用。</text><text class="t" x="90" y="415">数组名常转换为首元素地址，但数组对象不等于指针变量。</text></svg>