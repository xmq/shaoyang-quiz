<svg xmlns="http://www.w3.org/2000/svg" width="465" height="320" viewBox="0 0 465 320" role="img" aria-labelledby="title desc"><title id="title">二极管的伏安特性</title><desc id="desc">横轴二极管电压，纵轴电流。正向电流随电压非线性增加；反向只有很小漏电，达到反向击穿电压后反向电流急增。坐标仅示意，硅管0.7伏是常用恒压降模型近似，并非严格阈值。</desc><defs><style>:root{--ink:#263d49;--muted:#647781;--line:#c6d3d9;--accent:#147b71;--blue:#356c9b;--warm:#b37327;--pale:#e7f3f0}@media(prefers-color-scheme:dark){:root{--ink:#dfebf0;--muted:#a2b8c3;--line:#415965;--accent:#7ed6c6;--blue:#a3c8ed;--warm:#e7bb77;--pale:#203d3c}}text{font:20px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:var(--ink)}.small{font-size:18px;fill:var(--muted)}.label{font-size:20px;font-weight:600}.accent{fill:var(--accent)}.blue{fill:var(--blue)}.warm{fill:var(--warm)}.wire,.axis{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.guide{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 5}.grid{fill:none;stroke:var(--line);stroke-width:1}.curve{fill:none;stroke:var(--accent);stroke-width:2.6}.point{fill:var(--accent)}.resistor{fill:none;stroke:var(--ink);stroke-width:1.8}.accent-line{fill:none;stroke:var(--accent);stroke-width:2.1}</style><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="var(--ink)"/></marker></defs><path d="M24 198H445" class="axis" marker-end="url(#arrow)"/><path d="M202 288V22" class="axis" marker-end="url(#arrow)"/><text x="218" y="28" class="label" text-anchor="start">i<tspan baseline-shift="sub" font-size="70%">D</tspan></text><text x="445" y="230" class="small" text-anchor="end">u<tspan baseline-shift="sub" font-size="70%">D</tspan> / V</text><text x="190" y="221" class="small" text-anchor="end">0</text><path d="M202 198C255 198 300 196 326 181C350 164 359 107 374 31" class="curve"/><path d="M202 198C160 201 121 203 92 203C77 203 73 221 70 238L64 282" class="curve"/><path d="M352 136V198" class="guide"/><text x="353" y="253" class="label" text-anchor="middle">0.7 V</text><text x="353" y="278" class="small" text-anchor="middle">硅管常用近似</text><text x="280" y="61" class="label accent" text-anchor="start">正向导通</text><text x="20" y="165" class="small" text-anchor="start">反向漏电</text><path d="M98 171 122 202" class="guide"/><text x="19" y="302" class="small" text-anchor="start">反向击穿</text><text x="65" y="189" class="small" text-anchor="middle">−U<tspan baseline-shift="sub" font-size="70%">BR</tspan></text></svg>