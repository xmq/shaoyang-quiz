<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 463" role="img" aria-labelledby="title desc" width="390" height="463"><title id="title">语句都执行过，分支就覆盖了吗？</title><desc id="desc">语句都执行过，分支就覆盖了吗？</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><rect class="bg" width="390" height="463" rx="14"/><text class="h" x="20" y="33">语句都执行过，分支就覆盖了吗？</text><rect class="box" x="18" y="56" width="354" height="68" rx="10"/><text class="h" x="32" y="84">程序：y＝0；if x＞0 then y＝1</text><text class="t" x="32" y="112">最后输出y；注意这里没有else语句</text><path class="line" d="M195 127L195 148"/><rect class="box" x="18" y="153" width="354" height="94" rx="10"/><text class="h" x="32" y="181">只测x＝1：走真分支</text><text class="t" x="32" y="209">y＝0、y＝1、输出，全部语句已执行</text><text class="t" x="32" y="235">但条件为假的出口从未走过</text><path class="line" d="M195 250L195 271"/><rect class="hot" x="18" y="276" width="354" height="94" rx="10"/><text class="h" x="32" y="304">再测x＝0：条件为假，跳过赋值</text><text class="t" x="32" y="332">输出y＝0</text><text class="t" x="32" y="358">现在真、假两个出口都覆盖了</text><text class="s" x="20" y="399">语句覆盖关注语句；分支覆盖关注出口。</text><text class="s" x="20" y="425">本例说明语句全覆盖不保证分支全覆盖。</text></svg>
