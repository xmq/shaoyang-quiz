<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc" width="400" height="400"><title id="title">递归：先往下调用，再往上返回</title><desc id="desc">递归：先往下调用，再往上返回；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><rect x="1" y="1" width="398" height="398" rx="12" class="bg"/><text x="22" y="33" class="title" text-anchor="start">递归：先往下调用，再往上返回</text><text x="22" y="70" class="" text-anchor="start">fact(0)=1；fact(n)=n×fact(n−1)</text><rect x="25" y="100" width="295" height="40" rx="7" class="box"/><text x="172.5" y="126.0" class="mono" text-anchor="middle">fact(3) 等 3×fact(2)</text><rect x="49" y="155" width="271" height="40" rx="7" class="box"/><text x="184.5" y="181.0" class="mono" text-anchor="middle">fact(2) 等 2×fact(1)</text><rect x="73" y="210" width="247" height="40" rx="7" class="box"/><text x="196.5" y="236.0" class="mono" text-anchor="middle">fact(1) 等 1×fact(0)</text><rect x="97" y="265" width="223" height="40" rx="7" class="hi"/><text x="208.5" y="291.0" class="mono" text-anchor="middle">fact(0) 返回1</text><text x="22" y="337" class="" text-anchor="start">返回：1 → 1×1=1 → 2×1=2 → 3×2=6</text><text x="22" y="364" class="" text-anchor="start">每层有自己的 n，不会把上一层 n 覆盖。</text></svg>