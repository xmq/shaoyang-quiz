<svg xmlns="http://www.w3.org/2000/svg" width="400" height="515" viewBox="0 0 400 515" role="img" aria-labelledby="title"><title id="title">两次查询：值变了，还是行变了？</title><defs><style>text{font:18px "Microsoft YaHei",system-ui,sans-serif;fill:#183047}.title{font-size:20px;font-weight:700}.bold{font-weight:700}.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#7b8fa2;stroke-width:1.5}.hi{fill:#d9f3ed;stroke:#19806e;stroke-width:1.5}.blue{fill:#e0edff;stroke:#4c79bf;stroke-width:1.5}.warn{fill:#fff0d3;stroke:#c28a25;stroke-width:1.5}.line{stroke:#37768a;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#e6eef6}.bg{fill:#142234;stroke:#405469}.box{fill:#1a2e43;stroke:#859bad}.hi{fill:#16483f;stroke:#69d7bc}.blue{fill:#193e68;stroke:#92b9fb}.warn{fill:#4b3a1e;stroke:#e4b15a}.line{stroke:#82c5d4}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47879b"/></marker></defs><rect class="bg" x="1" y="1" width="398" height="513" rx="14"/><text x="18" y="32" class="title">两次查询：值变了，还是行变了？</text><text x="18" y="69" class="">① 不可重复读：同一账户余额</text><rect class="hi" x="18" y="85" width="64" height="35" rx="7"/><text x="50.0" y="108.5" class="" text-anchor="middle">步骤</text><rect class="hi" x="82" y="85" width="126" height="35" rx="7"/><text x="145.0" y="108.5" class="" text-anchor="middle">T1</text><rect class="hi" x="208" y="85" width="174" height="35" rx="7"/><text x="295.0" y="108.5" class="" text-anchor="middle">T2</text><rect class="box" x="18" y="120" width="64" height="35" rx="7"/><text x="50.0" y="143.5" class="" text-anchor="middle">1</text><rect class="box" x="82" y="120" width="126" height="35" rx="7"/><text x="145.0" y="143.5" class="" text-anchor="middle">读A=100</text><rect class="box" x="208" y="120" width="174" height="35" rx="7"/><rect class="box" x="18" y="155" width="64" height="35" rx="7"/><text x="50.0" y="178.5" class="" text-anchor="middle">2</text><rect class="box" x="82" y="155" width="126" height="35" rx="7"/><rect class="box" x="208" y="155" width="174" height="35" rx="7"/><text x="295.0" y="178.5" class="" text-anchor="middle">改A=80并提交</text><rect class="box" x="18" y="190" width="64" height="35" rx="7"/><text x="50.0" y="213.5" class="" text-anchor="middle">3</text><rect class="box" x="82" y="190" width="126" height="35" rx="7"/><text x="145.0" y="213.5" class="" text-anchor="middle">再读A=80</text><rect class="box" x="208" y="190" width="174" height="35" rx="7"/><text x="18" y="267" class="">② 幻读：WHERE age&gt;=18</text><rect class="hi" x="18" y="283" width="64" height="35" rx="7"/><text x="50.0" y="306.5" class="" text-anchor="middle">步骤</text><rect class="hi" x="82" y="283" width="126" height="35" rx="7"/><text x="145.0" y="306.5" class="" text-anchor="middle">T1</text><rect class="hi" x="208" y="283" width="174" height="35" rx="7"/><text x="295.0" y="306.5" class="" text-anchor="middle">T2</text><rect class="box" x="18" y="318" width="64" height="35" rx="7"/><text x="50.0" y="341.5" class="" text-anchor="middle">1</text><rect class="box" x="82" y="318" width="126" height="35" rx="7"/><text x="145.0" y="341.5" class="" text-anchor="middle">查询得3行</text><rect class="box" x="208" y="318" width="174" height="35" rx="7"/><rect class="box" x="18" y="353" width="64" height="35" rx="7"/><text x="50.0" y="376.5" class="" text-anchor="middle">2</text><rect class="box" x="82" y="353" width="126" height="35" rx="7"/><rect class="box" x="208" y="353" width="174" height="35" rx="7"/><text x="295.0" y="376.5" class="" text-anchor="middle">插入20岁并提交</text><rect class="box" x="18" y="388" width="64" height="35" rx="7"/><text x="50.0" y="411.5" class="" text-anchor="middle">3</text><rect class="box" x="82" y="388" width="126" height="35" rx="7"/><text x="145.0" y="411.5" class="" text-anchor="middle">再查得4行</text><rect class="box" x="208" y="388" width="174" height="35" rx="7"/><text x="18" y="477" class="">隔离级别与具体实现共同决定可见性。</text></svg>