<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 435" role="img" aria-labelledby="title" width="400" height="435"><title id="title">TCP窗口：确认的是字节</title><defs><style>text{font:18px "Microsoft YaHei",system-ui,sans-serif;fill:#183047}.title{font-size:20px;font-weight:700}.bold{font-weight:700}.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#7b8fa2;stroke-width:1.5}.hi{fill:#d9f3ed;stroke:#19806e;stroke-width:1.5}.blue{fill:#e0edff;stroke:#4c79bf;stroke-width:1.5}.warn{fill:#fff0d3;stroke:#c28a25;stroke-width:1.5}.line{stroke:#37768a;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#e6eef6}.bg{fill:#142234;stroke:#405469}.box{fill:#1a2e43;stroke:#859bad}.hi{fill:#16483f;stroke:#69d7bc}.blue{fill:#193e68;stroke:#92b9fb}.warn{fill:#4b3a1e;stroke:#e4b15a}.line{stroke:#82c5d4}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47879b"/></marker></defs><text x="18" y="32" class="title">TCP窗口：确认的是字节</text><text x="18" y="69" class="">已发100—199，尚未收到确认。</text><text x="18" y="100" class="">下一序号200，rwnd=300字节。</text><rect class="hi" x="18" y="122" width="158" height="35" rx="7"/><text x="97.0" y="145.5" class="" text-anchor="middle">100—199</text><rect class="hi" x="176" y="122" width="206" height="35" rx="7"/><text x="279.0" y="145.5" class="" text-anchor="middle">200—399</text><rect class="box" x="18" y="157" width="158" height="35" rx="7"/><text x="97.0" y="180.5" class="" text-anchor="middle">已发未确认</text><rect class="box" x="176" y="157" width="206" height="35" rx="7"/><text x="279.0" y="180.5" class="" text-anchor="middle">还能发200字节</text><rect class="blue" x="18" y="222" width="364" height="44" rx="7"/><text x="200.0" y="250.0" class="" text-anchor="middle">先发至399，再收到ACK=200</text><path class="line" d="M200 270L200 292" marker-end="url(#a)"/><rect class="hi" x="18" y="302" width="204" height="35" rx="7"/><text x="120.0" y="325.5" class="" text-anchor="middle">200—399</text><rect class="hi" x="222" y="302" width="160" height="35" rx="7"/><text x="302.0" y="325.5" class="" text-anchor="middle">400—499</text><rect class="box" x="18" y="337" width="204" height="35" rx="7"/><text x="120.0" y="360.5" class="" text-anchor="middle">已发未确认</text><rect class="box" x="222" y="337" width="160" height="35" rx="7"/><text x="302.0" y="360.5" class="" text-anchor="middle">还能发100字节</text><text x="18" y="402" class="">rwnd始终300；此例忽略拥塞限制。</text></svg>