<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 489" role="img" aria-labelledby="title desc"><title id="title">垃圾邮件识别：训练和推理</title><desc id="desc">垃圾邮件识别：训练和推理</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><rect class="bg" width="390" height="489" rx="14"/><text class="h" x="20" y="33">垃圾邮件识别：训练和推理</text><rect class="box" x="18" y="56" width="354" height="94" rx="10"/><text class="h" x="32" y="84">训练：使用带标签的历史邮件</text><text class="t" x="32" y="112">输入：文本＋“垃圾/正常”标签</text><text class="t" x="32" y="138">算法调整参数以降低训练错误</text><path class="line" d="M195 153L195 174"/><rect class="box" x="18" y="179" width="354" height="94" rx="10"/><text class="h" x="32" y="207">验证与测试：使用分开的数据</text><text class="t" x="32" y="235">验证集用于选择参数/模型</text><text class="t" x="32" y="261">测试集用于最后评估，不能反复调参</text><path class="line" d="M195 276L195 297"/><rect class="hot" x="18" y="302" width="354" height="94" rx="10"/><text class="h" x="32" y="330">推理：判断一封没见过的新邮件</text><text class="t" x="32" y="358">输入：新邮件，不提供真实标签</text><text class="t" x="32" y="384">输出：垃圾概率0.92，按规则处置</text><text class="s" x="20" y="425">试一试：新邮件附上答案再训练？</text><text class="s" x="20" y="451">那是新增训练样本，不是单纯推理。</text></svg>
