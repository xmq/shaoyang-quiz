<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 586" role="img" aria-labelledby="title desc" width="390" height="586"><title id="title">发现批量加密后，先做什么？</title><desc id="desc">发现批量加密后，先做什么？</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><text class="h" x="20" y="33">发现批量加密后，先做什么？</text><rect class="box" x="18" y="56" width="354" height="94" rx="10"/><text class="h" x="32" y="84">发现与分析：告警＋核对影响</text><text class="t" x="32" y="112">记录时间、主机、账号和异常日志</text><text class="t" x="32" y="138">按预案上报，保护证据</text><path class="line" d="M195 153L195 174"/><rect class="box" x="18" y="179" width="354" height="94" rx="10"/><text class="h" x="32" y="207">遏制：隔离失陷主机</text><text class="t" x="32" y="235">阻止继续扩散，保留必要取证条件</text><text class="t" x="32" y="261">隔离不是已清除木马</text><path class="line" d="M195 276L195 297"/><rect class="box" x="18" y="302" width="354" height="68" rx="10"/><text class="h" x="32" y="330">根除：清代码、补入口、换凭据</text><text class="t" x="32" y="358">确认漏洞及失陷账号已处置</text><path class="line" d="M195 373L195 394"/><rect class="hot" x="18" y="399" width="354" height="94" rx="10"/><text class="h" x="32" y="427">恢复与复盘：可信备份逐步上线</text><text class="t" x="32" y="455">先验证备份，再监控恢复效果</text><text class="t" x="32" y="481">改进规则、权限和演练</text><text class="s" x="20" y="522">不要一发现告警就随意格式化、删日志。</text><text class="s" x="20" y="548">业务恢复不代表调查与复盘结束。</text></svg>
