<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390"><style>.bg{fill:#f8fafc}.b{fill:#fff;stroke:#64748b;stroke-width:2}.c{fill:#e7f6f4;stroke:#176f68;stroke-width:2}.a{stroke:#2563eb;stroke-width:3}.h{font:700 24px system-ui;fill:#102a43}.t{font:17px system-ui;fill:#334155}@media(prefers-color-scheme:dark){.bg{fill:#142234}.b{fill:#17283b;stroke:#647b91}.c{fill:#173f3c;stroke:#46d6c6}.h{fill:#edf4fb}.t{fill:#b8c5d1}}</style><rect class="bg" x="10" y="10" width="700" height="370" rx="22"/><text class="h" x="35" y="50">事件响应：控制影响，也要保留证据</text><g class="b"><rect x="30" y="100" width="85" height="70" rx="12"/><rect x="130" y="100" width="85" height="70" rx="12"/><rect x="230" y="100" width="85" height="70" rx="12"/></g><g class="c"><rect x="330" y="100" width="85" height="70" rx="12"/><rect x="430" y="100" width="85" height="70" rx="12"/><rect x="530" y="100" width="85" height="70" rx="12"/><rect x="630" y="100" width="65" height="70" rx="12"/></g><g class="t" text-anchor="middle"><text x="72" y="142">准备</text><text x="172" y="142">发现</text><text x="272" y="142">分析</text><text x="372" y="142">遏制</text><text x="472" y="142">根除</text><text x="572" y="142">恢复</text><text x="662" y="142">复盘</text></g><path class="a" d="M115 135H130M215 135H230M315 135H330M415 135H430M515 135H530M615 135H630"/><text class="t" x="360" y="245" text-anchor="middle">隔离主机≠已经根除；恢复前要验证入口已关闭、备份可信</text><text class="t" x="360" y="290" text-anchor="middle">记录时间、主机、账号、告警和操作，避免随意删日志或格式化</text></svg>
