<svg xmlns="http://www.w3.org/2000/svg" width="352" height="462" viewBox="0 0 352 462" role="img" aria-labelledby="t"><title id="t">一次异步读：双方确认后再前进</title><style>text{font-family:system-ui,"Microsoft YaHei",sans-serif;fill:#17313e}.a{fill:#f1f8f7;stroke:#167b79;stroke-width:1.5}@media(prefers-color-scheme:dark){text{fill:#e1f2f4}.a{fill:#18323d;stroke:#69cec3}}</style><text x="16" y="28" font-size="17" font-weight="700">一次异步读：双方确认后再前进</text><rect class="a" x="12" y="48" width="328" height="78" rx="8"/><text x="24" y="71" font-size="16" font-weight="700">① 主设备发起</text><text x="24" y="93" font-size="14">地址稳定后置 REQ=1</text><text x="24" y="112" font-size="14">ACK尚未有效，不能读旧数据</text><path d="M176 130v10m-4-4 4 4 4-4" fill="none" stroke="#218884" stroke-width="2"/><rect class="a" x="12" y="144" width="328" height="78" rx="8"/><text x="24" y="167" font-size="16" font-weight="700">② 从设备就绪</text><text x="24" y="189" font-size="14">读出数据并置 ACK=1</text><text x="24" y="208" font-size="14">此时主设备可以采样</text><path d="M176 226v10m-4-4 4 4 4-4" fill="none" stroke="#218884" stroke-width="2"/><rect class="a" x="12" y="240" width="328" height="78" rx="8"/><text x="24" y="263" font-size="16" font-weight="700">③ 主设备确认收到</text><text x="24" y="285" font-size="14">采样数据后撤 REQ=0</text><text x="24" y="304" font-size="14">数据已接收，请求结束</text><path d="M176 322v10m-4-4 4 4 4-4" fill="none" stroke="#218884" stroke-width="2"/><rect class="a" x="12" y="336" width="328" height="78" rx="8"/><text x="24" y="359" font-size="16" font-weight="700">④ 从设备收尾</text><text x="24" y="381" font-size="14">看到REQ撤销，再撤 ACK=0</text><text x="24" y="400" font-size="14">回到空闲，才开始下一轮</text></svg>