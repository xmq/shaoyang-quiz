<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">直接插入排序逐趟过程</title><desc id="desc">序列5、2、4、3通过三次插入变为2、3、4、5，左侧有序区逐步扩大。</desc>
  <defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.cell{fill:#fff;stroke:#64748b;stroke-width:2}.sorted{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.pick{fill:#fff4df;stroke:#d97706;stroke-width:3}.h{font:700 25px system-ui,sans-serif;fill:#102a43}.t{font:19px system-ui,sans-serif;fill:#334155}.m{font:22px ui-monospace,monospace;fill:#1d4ed8}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.cell{fill:#17283b;stroke:#647b91}.sorted{fill:#173f3c;stroke:#46d6c6}.pick{fill:#3c3020;stroke:#ffbd66}.h{fill:#edf4fb}.t{fill:#b8c5d1}.m{fill:#a9cbff}}</style></defs>
  <rect class="bg" x="12" y="12" width="936" height="536" rx="26"/><text class="h" x="48" y="60">直接插入排序：每次把一个元素插入左侧有序区</text>
  <g class="t"><text x="55" y="140">初始</text><text x="55" y="240">插入2</text><text x="55" y="340">插入4</text><text x="55" y="440">插入3</text></g>
  <g class="sorted"><rect x="190" y="95" width="105" height="65"/><rect x="190" y="195" width="105" height="65"/><rect x="295" y="195" width="105" height="65"/><rect x="190" y="295" width="105" height="65"/><rect x="295" y="295" width="105" height="65"/><rect x="400" y="295" width="105" height="65"/><rect x="190" y="395" width="105" height="65"/><rect x="295" y="395" width="105" height="65"/><rect x="400" y="395" width="105" height="65"/><rect x="505" y="395" width="105" height="65"/></g>
  <g class="cell"><rect x="295" y="95" width="105" height="65"/><rect x="400" y="95" width="105" height="65"/><rect x="505" y="95" width="105" height="65"/><rect x="400" y="195" width="105" height="65"/><rect x="505" y="195" width="105" height="65"/><rect x="505" y="295" width="105" height="65"/></g>
  <g class="pick"><rect x="295" y="95" width="105" height="65"/><rect x="400" y="195" width="105" height="65"/><rect x="505" y="295" width="105" height="65"/></g>
  <g class="m" text-anchor="middle"><text x="242" y="137">5</text><text x="347" y="137">2</text><text x="452" y="137">4</text><text x="557" y="137">3</text><text x="242" y="237">2</text><text x="347" y="237">5</text><text x="452" y="237">4</text><text x="557" y="237">3</text><text x="242" y="337">2</text><text x="347" y="337">4</text><text x="452" y="337">5</text><text x="557" y="337">3</text><text x="242" y="437">2</text><text x="347" y="437">3</text><text x="452" y="437">4</text><text x="557" y="437">5</text></g>
  <text class="t" x="665" y="135">黄色：本趟待插入元素</text><text class="t" x="665" y="185">绿色：本趟结束后的有序区</text><text class="t" x="665" y="285">基本有序时移动较少</text><text class="t" x="665" y="335">常规实现稳定</text><text class="t" x="665" y="385">最坏时间 O(n²)</text>
</svg>
