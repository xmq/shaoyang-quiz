<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 477" role="img" aria-labelledby="title desc" width="390" height="477"><title id="title">相同斜边：像素格与几何线</title><desc id="desc">相同斜边：像素格与几何线</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><rect class="bg" width="390" height="477" rx="14"/><text class="h" x="20" y="33">相同斜边：像素格与几何线</text><text class="h" x="22" y="67">位图：存每个像素的颜色</text><rect x="35" y="87" width="26" height="26" fill="#2368b5" stroke="#7890a5"/><rect x="61" y="87" width="26" height="26" fill="#e2edf7" stroke="#7890a5"/><rect x="87" y="87" width="26" height="26" fill="#e2edf7" stroke="#7890a5"/><rect x="113" y="87" width="26" height="26" fill="#e2edf7" stroke="#7890a5"/><rect x="139" y="87" width="26" height="26" fill="#e2edf7" stroke="#7890a5"/><rect x="35" y="113" width="26" height="26" fill="#2368b5" stroke="#7890a5"/><rect x="61" y="113" width="26" height="26" fill="#2368b5" stroke="#7890a5"/><rect x="87" y="113" width="26" height="26" fill="#e2edf7" stroke="#7890a5"/><rect x="113" y="113" width="26" height="26" fill="#e2edf7" stroke="#7890a5"/><rect x="139" y="113" width="26" height="26" fill="#e2edf7" stroke="#7890a5"/><rect x="35" y="139" width="26" height="26" fill="#2368b5" stroke="#7890a5"/><rect x="61" y="139" width="26" height="26" fill="#2368b5" stroke="#7890a5"/><rect x="87" y="139" width="26" height="26" fill="#2368b5" stroke="#7890a5"/><rect x="113" y="139" width="26" height="26" fill="#e2edf7" stroke="#7890a5"/><rect x="139" y="139" width="26" height="26" fill="#e2edf7" stroke="#7890a5"/><rect x="35" y="165" width="26" height="26" fill="#2368b5" stroke="#7890a5"/><rect x="61" y="165" width="26" height="26" fill="#2368b5" stroke="#7890a5"/><rect x="87" y="165" width="26" height="26" fill="#2368b5" stroke="#7890a5"/><rect x="113" y="165" width="26" height="26" fill="#2368b5" stroke="#7890a5"/><rect x="139" y="165" width="26" height="26" fill="#e2edf7" stroke="#7890a5"/><rect x="35" y="191" width="26" height="26" fill="#2368b5" stroke="#7890a5"/><rect x="61" y="191" width="26" height="26" fill="#2368b5" stroke="#7890a5"/><rect x="87" y="191" width="26" height="26" fill="#2368b5" stroke="#7890a5"/><rect x="113" y="191" width="26" height="26" fill="#2368b5" stroke="#7890a5"/><rect x="139" y="191" width="26" height="26" fill="#2368b5" stroke="#7890a5"/><text class="s" x="193" y="130">把每格放大</text><text class="s" x="193" y="158">边缘像台阶</text><text class="h" x="22" y="254">矢量：存一条斜线的几何规则</text><path d="M40 376L165 281" stroke="#168679" stroke-width="9"/><text class="s" x="193" y="312">放大时重算</text><text class="s" x="193" y="340">边缘仍平滑</text><text class="s" x="22" y="424">照片细节多选位图；标志常选矢量。</text><text class="s" x="22" y="452">矢量最终在屏幕上仍需光栅化显示。</text></svg>
