<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470"><defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.b{fill:#fff;stroke:#64748b;stroke-width:2}.h{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.l{stroke:#2563eb;stroke-width:4;fill:none}.tt{font:700 24px system-ui;fill:#102a43}.t{font:18px system-ui;fill:#334155}.m{font:18px ui-monospace;fill:#1d4ed8}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.b{fill:#17283b;stroke:#647b91}.h{fill:#173f3c;stroke:#46d6c6}.tt{fill:#edf4fb}.t{fill:#b8c5d1}.m{fill:#a9cbff}}</style></defs><rect class="bg" x="12" y="12" width="876" height="446" rx="24"/><text class="tt" x="45" y="58">5级流水线：多条指令重叠执行</text><text class="m" x="50" y="120">周期  1    2    3    4    5    6    7</text><text class="m" x="50" y="170">I1   IF → ID → EX → MEM → WB</text><text class="m" x="50" y="225">I2       IF → ID → EX → MEM → WB</text><text class="m" x="50" y="280">I3           IF → ID → EX → MEM → WB</text><text class="t" x="50" y="370">理想完成n条指令需 k+n-1 个周期；分支、数据相关和资源冲突会插入停顿。</text><text class="t" x="50" y="420">流水线提高吞吐率，不等于单条指令延迟一定缩短。</text></svg>