<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 370" role="img" aria-labelledby="title desc"><title id="title">先认清边，再做 DFS 与 BFS</title><desc id="desc">先认清边，再做 DFS 与 BFS；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><rect x="1" y="1" width="398" height="368" rx="12" class="bg"/><text x="22" y="33" class="title" text-anchor="start">先认清边，再做 DFS 与 BFS</text><path class="edge" d="M70 115L180 85"/><path class="edge" d="M70 115L180 230"/><path class="edge" d="M180 85L310 70"/><path class="edge" d="M180 85L310 150"/><path class="edge" d="M180 230L310 260"/><path class="edge" d="M310 150L310 260"/><circle cx="70" cy="115" r="23" class="hi"/><text x="70" y="121" class="mono" text-anchor="middle">A</text><circle cx="180" cy="85" r="23" class="hi"/><text x="180" y="91" class="mono" text-anchor="middle">B</text><circle cx="180" cy="230" r="23" class="hi"/><text x="180" y="236" class="mono" text-anchor="middle">C</text><circle cx="310" cy="70" r="23" class="hi"/><text x="310" y="76" class="mono" text-anchor="middle">D</text><circle cx="310" cy="150" r="23" class="hi"/><text x="310" y="156" class="mono" text-anchor="middle">E</text><circle cx="310" cy="260" r="23" class="hi"/><text x="310" y="266" class="mono" text-anchor="middle">F</text><text x="22" y="320" class="" text-anchor="start">无向边；从 A 开始，邻接点按字母升序。</text><text x="22" y="347" class="" text-anchor="start">注意 E—F 连着两条分支，不是两棵树。</text></svg>