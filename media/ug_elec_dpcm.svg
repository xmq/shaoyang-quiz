<svg xmlns="http://www.w3.org/2000/svg" width="360" height="480" viewBox="0 0 360 480" role="img" aria-labelledby="title"><title id="title">DPCM：双方用相同的重建历史</title>
<style>svg{--ink:#233b49;--accent:#08796e;--soft:#e8f4f1;--muted:#536d7c;color:var(--ink);font:14px system-ui,"Microsoft YaHei",sans-serif}text{fill:currentColor}.w{stroke:var(--ink);stroke-width:1.7;fill:none}.a{stroke:var(--accent);stroke-width:2;fill:none}.soft{fill:var(--soft);stroke:var(--accent);stroke-width:1.4}.muted{fill:var(--muted)}@media(prefers-color-scheme:dark){svg{--ink:#e0edf2;--accent:#75d2bd;--soft:#173d39;--muted:#b3c4cf}}</style><defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--accent)"/></marker></defs>
<text x="12" y="25" font-size="17" text-anchor="start">DPCM：双方用相同的重建历史</text>
<rect x="16" y="80" width="75" height="42" class="w"/>
<text x="53.5" y="106.0" font-size="14" text-anchor="middle">原x</text>
<rect x="140" y="80" width="100" height="42" class="w"/>
<text x="190.0" y="106.0" font-size="14" text-anchor="middle">x−预测p</text>
<rect x="140" y="166" width="100" height="42" class="w"/>
<text x="190.0" y="192.0" font-size="14" text-anchor="middle">误差量化q</text>
<path class="a" d="M91 101L140 101" marker-end="url(#arr)"/>
<path class="a" d="M190 122L190 166" marker-end="url(#arr)"/>
<rect x="140" y="255" width="145" height="42" class="w"/>
<text x="212.5" y="281.0" font-size="14" text-anchor="middle">重建x帽=p+q</text>
<path class="a" d="M190 208L190 255" marker-end="url(#arr)"/>
<rect x="15" y="255" width="90" height="42" class="w"/>
<text x="60.0" y="281.0" font-size="14" text-anchor="middle">下一预测</text>
<path class="a" d="M140 276L105 276" marker-end="url(#arr)"/>
<path class="w" d="M60 255L60 223"/>
<path class="w" d="M60 223L130 223"/>
<path class="w" d="M130 223L130 112"/>
<path class="a" d="M130 112L140 112" marker-end="url(#arr)"/>
<text x="12" y="345" font-size="14" text-anchor="start">初预测8：x10→q2→重建10</text>
<text x="12" y="374" font-size="14" text-anchor="start">再x13→q4→重建14（不是原13）</text>
<text x="12" y="403" font-size="14" text-anchor="start">下次x12：预测14→q−2→重建12</text>
<text x="12" y="445" font-size="13" text-anchor="start">接收端同样p+q，两端状态才能一致。</text>
</svg>