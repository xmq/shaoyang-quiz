<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 447" role="img" aria-labelledby="title desc" width="390" height="447"><title id="title">先数像素，再数每个像素的位数</title><desc id="desc">先数像素，再数每个像素的位数</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><rect class="bg" width="390" height="447" rx="14"/><text class="h" x="20" y="33">先数像素，再数每个像素的位数</text><text class="h" x="22" y="68">800×600像素，每像素24 bit</text><rect class="hot" x="28" y="88" width="40" height="40" rx="0"/><rect class="hot" x="71" y="88" width="40" height="40" rx="0"/><rect class="hot" x="114" y="88" width="40" height="40" rx="0"/><rect class="hot" x="157" y="88" width="40" height="40" rx="0"/><rect class="hot" x="28" y="131" width="40" height="40" rx="0"/><rect class="hot" x="71" y="131" width="40" height="40" rx="0"/><rect class="hot" x="114" y="131" width="40" height="40" rx="0"/><rect class="hot" x="157" y="131" width="40" height="40" rx="0"/><rect class="hot" x="28" y="174" width="40" height="40" rx="0"/><rect class="hot" x="71" y="174" width="40" height="40" rx="0"/><rect class="hot" x="114" y="174" width="40" height="40" rx="0"/><rect class="hot" x="157" y="174" width="40" height="40" rx="0"/><text class="s" x="213" y="126">只是局部网格</text><text class="s" x="213" y="154">整幅48万像素</text><text class="t" x="24" y="258">一个像素：R 8位＋G 8位＋B 8位</text><text class="t" x="24" y="297">＝24 bit＝3 Byte</text><text class="t" x="24" y="344">总量：800×600×3＝1 440 000 B</text><text class="t" x="24" y="381">约1.44 MB（1000进制）</text><text class="s" x="24" y="421">不含文件头、压缩、行对齐等开销。</text></svg>
