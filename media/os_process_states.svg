<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 390" role="img" aria-labelledby="title desc"><title id="title">进程状态：先满足运行条件</title><desc id="desc">进程状态：先满足运行条件；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><rect x="1" y="1" width="398" height="388" rx="12" class="bg"/><text x="22" y="33" class="title" text-anchor="start">进程状态：先满足运行条件</text><rect x="130" y="75" width="140" height="48" rx="7" class="hi"/><text x="200.0" y="105.0" class="mono" text-anchor="middle">运行</text><rect x="25" y="225" width="130" height="48" rx="7" class="box"/><text x="90.0" y="255.0" class="mono" text-anchor="middle">就绪</text><rect x="245" y="225" width="130" height="48" rx="7" class="box"/><text x="310.0" y="255.0" class="mono" text-anchor="middle">阻塞</text><path class="line" d="M144 123L88 223"/><text x="20" y="166" class="" text-anchor="start">时间片到</text><path class="line" d="M90 225L157 124"/><text x="112" y="193" class="" text-anchor="start">被调度</text><path class="line" d="M260 123L310 223"/><text x="282" y="163" class="" text-anchor="start">等待 I/O</text><path class="line" d="M245 250L157 250"/><text x="145" y="300" class="" text-anchor="start">I/O 完成</text><text x="22" y="343" class="" text-anchor="start">阻塞 → 就绪 → 运行；事件完成后</text><text x="22" y="370" class="" text-anchor="start">仍需排队获得 CPU，不能直接跳到运行。</text></svg>