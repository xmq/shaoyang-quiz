<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 489" role="img" aria-labelledby="title desc" width="390" height="489"><title id="title">签名不是加密：谁用哪把钥匙？</title><desc id="desc">签名不是加密：谁用哪把钥匙？</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><text class="h" x="20" y="33">签名不是加密：谁用哪把钥匙？</text><rect class="box" x="18" y="56" width="354" height="94" rx="10"/><text class="h" x="32" y="84">发送者：合同 → 哈希得到摘要h</text><text class="t" x="32" y="112">用发送者私钥，对摘要执行签名</text><text class="t" x="32" y="138">发送：合同原文＋签名</text><path class="line" d="M195 153L195 174"/><rect class="box" x="18" y="179" width="354" height="94" rx="10"/><text class="h" x="32" y="207">接收者：收到合同 → 重算摘要h′</text><text class="t" x="32" y="235">用可信的发送者公钥验证签名</text><text class="t" x="32" y="261">验证通过：摘要与签名所绑定内容一致</text><path class="line" d="M195 276L195 297"/><rect class="hot" x="18" y="302" width="354" height="94" rx="10"/><text class="h" x="32" y="330">若“金额100”被改成“金额900”</text><text class="t" x="32" y="358">重算摘要改变，原签名验证失败</text><text class="t" x="32" y="384">原文仍可读：签名本身不保密</text><text class="s" x="20" y="425">公钥身份还需通过可信方式确认。</text><text class="s" x="20" y="451">实际调用签名算法，不是泛称“私钥加密”。</text></svg>
