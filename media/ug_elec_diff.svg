<text x="48" y="153" font-size="12" text-anchor="start">uo1</text>
<text x="277" y="153" font-size="12" text-anchor="start">uo2</text>
<path class="w" d="M92 240L92 265"/>
<path class="w" d="M268 240L268 265"/>
<path class="w" d="M92 265L268 265"/>
<path class="w" d="M180 265L180 294"/>
<circle cx="180" cy="265" r="2.6" fill="var(--ink)"/>
<circle cx="180" cy="315" r="21" class="w"/>
