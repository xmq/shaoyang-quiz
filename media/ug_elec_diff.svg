<path class="w" d="M268 129L268 137"/>
<text x="277" y="120.0" font-size="12" text-anchor="start">RC2</text>
<path class="w" d="M92 83L92 95"/>
<path class="w" d="M268 83L268 95"/>
<path class="w" d="M42 205L67 205"/>
<path class="w" d="M67 185L67 225"/>
<path class="w" d="M67 191L92 170"/>
