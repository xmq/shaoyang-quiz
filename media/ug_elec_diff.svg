<path class="w" d="M180 336L180 360"/>
<text x="202" y="321" font-size="14" text-anchor="start">尾电流2 mA</text>
<text x="155" y="382" font-size="14" text-anchor="start">−12 V</text>
<path class="w" d="M8 205L42 205"/>
<text x="8" y="192" font-size="12" text-anchor="start">u1=+ud/2</text>
<path class="w" d="M205 205L218 205"/>
<text x="196" y="192" font-size="12" text-anchor="start">u2=−ud/2</text>
<text x="12" y="415" font-size="14" text-anchor="start">每管ICQ≈1 mA，两个集电极均7 V。</text>
<text x="12" y="444" font-size="14" text-anchor="start">gm=0.04 S；左单端−100，右单端+100。</text>
<text x="12" y="473" font-size="14" text-anchor="start">uod=uo1−uo2：双端差模增益−200。</text>
<text x="12" y="501" font-size="13" text-anchor="start">输出方向先约定，不把双端再多乘一次2。</text>
</svg>