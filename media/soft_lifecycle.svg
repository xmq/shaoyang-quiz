<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 463" role="img" aria-labelledby="title desc" width="390" height="463"><title id="title">做一个请假系统：每步产出什么？</title><desc id="desc">做一个请假系统：每步产出什么？</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><text class="h" x="20" y="33">做一个请假系统：每步产出什么？</text><rect class="box" x="18" y="56" width="354" height="68" rx="10"/><text class="h" x="32" y="84">需求：谁能请假，谁能审批？</text><text class="t" x="32" y="112">规则：超过3天需院系审批</text><path class="line" d="M195 127L195 148"/><rect class="box" x="18" y="153" width="354" height="94" rx="10"/><text class="h" x="32" y="181">设计与实现：怎样实现规则？</text><text class="t" x="32" y="209">设计角色、表结构和审批状态</text><text class="t" x="32" y="235">写程序实现，做代码评审</text><path class="line" d="M195 250L195 271"/><rect class="hot" x="18" y="276" width="354" height="94" rx="10"/><text class="h" x="32" y="304">测试与交付：规则真的生效吗？</text><text class="t" x="32" y="332">3天与4天走不同审批分支</text><text class="t" x="32" y="358">用户确认满足需求，发布运行</text><text class="s" x="20" y="399">测试发现规则理解错，应反馈需求。</text><text class="s" x="20" y="425">维护出现新需求，要再次分析和验证。</text></svg>
