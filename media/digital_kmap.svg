<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-labelledby="title desc"><title id="title">卡诺图：圈内谁没有变？</title><desc id="desc">卡诺图：圈内谁没有变？</desc>
<defs><style>
        :root{--ink:#17324b;--muted:#456075;--paper:#fff;--panel:#edf5fa;--blue:#1464ba;--green:#087c67;--orange:#ad5200;--red:#b42318;--border:#cad8e5}
        @media(prefers-color-scheme:dark){:root{--ink:#edf4fb;--muted:#b5c8d8;--paper:#132334;--panel:#1b3349;--blue:#9bcaff;--green:#7de1c4;--orange:#ffc079;--red:#ffab9b;--border:#527087}}
        .paper{fill:var(--paper)}.panel{fill:var(--panel);stroke:var(--border)}.t{font:18px system-ui,sans-serif;fill:var(--ink)}.h{font:700 21px system-ui,sans-serif;fill:var(--ink)}.b{font:700 18px system-ui,sans-serif;fill:var(--blue)}.g{font:700 18px system-ui,sans-serif;fill:var(--green)}.r{font:700 18px system-ui,sans-serif;fill:var(--red)}.muted{font:18px system-ui,sans-serif;fill:var(--muted)}
        .wire{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}.blue{fill:none;stroke:var(--blue);stroke-width:2.5}.green{fill:none;stroke:var(--green);stroke-width:2.5}.orange{fill:none;stroke:var(--orange);stroke-width:2.5}.red{fill:none;stroke:var(--red);stroke-width:2.5}.dash{stroke-dasharray:5 4}.dot{fill:var(--ink)}.shade{fill:var(--green);opacity:.17}
        </style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs>
<rect class="paper" width="400" height="470" rx="12"/>
<text class="h" x="20" y="33">卡诺图：圈内谁没有变？</text>
<text class="t" x="20" y="67">F(A,B,C)=Σm(1,3,5,7)</text>
<text class="t" x="33" y="114">A</text>
<text class="t" x="235" y="103" text-anchor="middle">BC（格雷顺序）</text>
<text class="t" x="125" y="136" text-anchor="middle">00</text>
<text class="t" x="192" y="136" text-anchor="middle">01</text>
<text class="t" x="259" y="136" text-anchor="middle">11</text>
<text class="t" x="326" y="136" text-anchor="middle">10</text>
<text class="t" x="40" y="195" text-anchor="middle">0</text>
<rect class="panel" x="92" y="155" width="67" height="70" rx="0"/>
<text class="t" x="125" y="197" text-anchor="middle">0</text>
<rect class="panel" x="159" y="155" width="67" height="70" rx="0"/>
<text class="t" x="192" y="197" text-anchor="middle">1</text>
<rect class="panel" x="226" y="155" width="67" height="70" rx="0"/>
<text class="t" x="259" y="197" text-anchor="middle">1</text>
<rect class="panel" x="293" y="155" width="67" height="70" rx="0"/>
<text class="t" x="326" y="197" text-anchor="middle">0</text>
<text class="t" x="40" y="265" text-anchor="middle">1</text>
<rect class="panel" x="92" y="225" width="67" height="70" rx="0"/>
<text class="t" x="125" y="267" text-anchor="middle">0</text>
<rect class="panel" x="159" y="225" width="67" height="70" rx="0"/>
<text class="t" x="192" y="267" text-anchor="middle">1</text>
<rect class="panel" x="226" y="225" width="67" height="70" rx="0"/>
<text class="t" x="259" y="267" text-anchor="middle">1</text>
<rect class="panel" x="293" y="225" width="67" height="70" rx="0"/>
<text class="t" x="326" y="267" text-anchor="middle">0</text>
<rect x="159" y="155" width="134" height="140" rx="8" fill="none" stroke="var(--green)" stroke-width="4"/>
<text class="g" x="20" y="337">绿框四格：C始终为1</text>
<text class="t" x="20" y="369">A、B都变化，被消去 → F=C</text>
<text class="t" x="20" y="407">相邻格仅一位不同；可以跨左右/上下边界，</text>
<text class="t" x="20" y="432">但对角线不相邻。</text>
</svg>
