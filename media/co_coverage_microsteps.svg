<svg xmlns="http://www.w3.org/2000/svg" width="352" height="462" viewBox="0 0 352 462" role="img" aria-labelledby="t"><title id="t">单总线：一拍只放行一个源</title><style>text{font-family:system-ui,"Microsoft YaHei",sans-serif;fill:#17313e}.a{fill:#f1f8f7;stroke:#167b79;stroke-width:1.5}@media(prefers-color-scheme:dark){text{fill:#e1f2f4}.a{fill:#18323d;stroke:#69cec3}}</style><text x="16" y="28" font-size="17" font-weight="700">单总线：一拍只放行一个源</text><rect class="a" x="12" y="48" width="328" height="78" rx="8"/><text x="24" y="71" font-size="16" font-weight="700">T0：地址先出发</text><text x="24" y="93" font-size="14">PC → 内部总线 → MAR</text><text x="24" y="112" font-size="14">PC=100，MAR变为100</text><path d="M176 130v10m-4-4 4 4 4-4" fill="none" stroke="#218884" stroke-width="2"/><rect class="a" x="12" y="144" width="328" height="78" rx="8"/><text x="24" y="167" font-size="16" font-weight="700">T1：读并等待主存</text><text x="24" y="189" font-size="14">Read；READY后装入MDR</text><text x="24" y="208" font-size="14">MDR取得地址100处的指令</text><path d="M176 226v10m-4-4 4 4 4-4" fill="none" stroke="#218884" stroke-width="2"/><rect class="a" x="12" y="240" width="328" height="78" rx="8"/><text x="24" y="263" font-size="16" font-weight="700">T2：指令进入控制器</text><text x="24" y="285" font-size="14">MDR → 内部总线 → IR</text><text x="24" y="304" font-size="14">独立增量器可同时令PC=104</text><path d="M176 322v10m-4-4 4 4 4-4" fill="none" stroke="#218884" stroke-width="2"/><rect class="a" x="12" y="336" width="328" height="78" rx="8"/><text x="24" y="359" font-size="16" font-weight="700">执行：先存一个操作数</text><text x="24" y="381" font-size="14">R1 → Y；下一拍 Y+R2 → Z</text><text x="24" y="400" font-size="14">最后 Z → R1，避免两个源抢总线</text></svg>