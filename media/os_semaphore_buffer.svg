<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 530" role="img" aria-labelledby="title desc">
<title id="title">生产者消费者信号量顺序</title><desc id="desc">先等数量再进入互斥区。生产者等待空位，消费者等待产品，进出缓冲区均用mutex保护。</desc>
<defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#64748b}.hi{fill:#e7f6f4;stroke:#176f68}.h{font:700 19px system-ui,sans-serif;fill:#102a43}.t{font:17px system-ui,sans-serif;fill:#334155}.m{font:17px ui-monospace,monospace;fill:#1d4ed8}.line{stroke:#2563eb;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.box{fill:#17283b;stroke:#647b91}.hi{fill:#173f3c;stroke:#46d6c6}.h{fill:#edf4fb}.t{fill:#b8c5d1}.m{fill:#a9cbff}.line{stroke:#66a3ff}}</style></defs>
<rect class="bg" x="6" y="6" width="378" height="518" rx="16"/>
<text class="h" x="24" y="37">先等数量，再进入互斥区</text>
<rect class="box" x="22" y="56" width="346" height="165" rx="12"/>
<text class="h" x="38" y="85">生产者：等空位</text>
<text class="m" x="38" y="115">P(empty) → P(mutex)</text>
<text class="t" x="38" y="147">放入一件产品</text>
<text class="m" x="38" y="179">V(mutex) → V(full)</text>
<text class="t" x="38" y="205">先退出互斥区，再通知有产品</text>
<path class="line" d="M195 222v16"/>
<rect class="hi" x="60" y="239" width="270" height="49" rx="10"/>
<text class="h" x="195" y="269" text-anchor="middle">共享缓冲区 · mutex=1</text>
<path class="line" d="M195 289v16"/>
<rect class="box" x="22" y="306" width="346" height="165" rx="12"/>
<text class="h" x="38" y="335">消费者：等产品</text>
<text class="m" x="38" y="365">P(full) → P(mutex)</text>
<text class="t" x="38" y="397">取出一件产品</text>
<text class="m" x="38" y="429">V(mutex) → V(empty)</text>
<text class="t" x="38" y="455">先退出互斥区，再通知有空位</text>
<text class="t" x="24" y="503">初始为空：empty=N，full=0</text>
</svg>