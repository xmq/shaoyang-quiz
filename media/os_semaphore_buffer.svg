<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500"><defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.box{fill:#fff;stroke:#64748b;stroke-width:2}.hi{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.line{stroke:#2563eb;stroke-width:4;fill:none}.h{font:700 25px system-ui,sans-serif;fill:#102a43}.t{font:19px system-ui,sans-serif;fill:#334155}.m{font:19px ui-monospace,monospace;fill:#1d4ed8}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.box{fill:#17283b;stroke:#647b91}.hi{fill:#173f3c;stroke:#46d6c6}.line{stroke:#66a3ff}.h{fill:#edf4fb}.t{fill:#b8c5d1}.m{fill:#a9cbff}}</style></defs><rect class="bg" x="12" y="12" width="876" height="476" rx="24"/><text class="h" x="45" y="58">生产者—消费者：先等数量资源，再进互斥区</text><rect class="hi" x="325" y="190" width="250" height="105" rx="18"/><text class="h" x="450" y="235" text-anchor="middle">共享缓冲区</text><text class="m" x="450" y="270" text-anchor="middle">mutex=1</text><g class="box"><rect x="45" y="130" width="220" height="210" rx="18"/><rect x="635" y="130" width="220" height="210" rx="18"/></g><text class="h" x="155" y="170" text-anchor="middle">生产者</text><text class="m" x="70" y="215">P(empty)</text><text class="m" x="70" y="250">P(mutex)</text><text class="m" x="70" y="285">放入产品</text><text class="m" x="70" y="320">V(mutex),V(full)</text><text class="h" x="745" y="170" text-anchor="middle">消费者</text><text class="m" x="660" y="215">P(full)</text><text class="m" x="660" y="250">P(mutex)</text><text class="m" x="660" y="285">取出产品</text><text class="m" x="660" y="320">V(mutex),V(empty)</text><path class="line" d="M265 240H325M575 240H635"/><text class="t" x="45" y="405">初值：empty=N，full=0。等待empty/full时不能占住mutex。</text><text class="t" x="45" y="445">互斥保护共享状态；empty/full表达先后条件。</text></svg>