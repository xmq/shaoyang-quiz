<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-labelledby="title desc" width="400" height="500"><title id="title">先等产品，再拿互斥锁</title><desc id="desc">先等产品，再拿互斥锁；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><text x="22" y="33" class="title" text-anchor="start">先等产品，再拿互斥锁</text><text x="22" y="70" class="" text-anchor="start">N=2，初始 empty=2, full=0, mutex=1</text><text x="22" y="120" class="title" text-anchor="start">生产者：先预约空位</text><rect x="60" y="140" width="280" height="36" rx="7" class="box"/><text x="200.0" y="164.0" class="mono" text-anchor="middle">P(empty)：没有空位就等</text><path class="line" d="M200 176L200 187"/><rect x="60" y="188" width="280" height="36" rx="7" class="box"/><text x="200.0" y="212.0" class="mono" text-anchor="middle">P(mutex)：获得缓冲区锁</text><path class="line" d="M200 224L200 235"/><rect x="60" y="236" width="280" height="36" rx="7" class="hi"/><text x="200.0" y="260.0" class="mono" text-anchor="middle">放入产品</text><path class="line" d="M200 272L200 283"/><rect x="60" y="284" width="280" height="36" rx="7" class="box"/><text x="200.0" y="308.0" class="mono" text-anchor="middle">V(mutex)，V(full)</text><text x="22" y="376" class="" text-anchor="start">消费者：先 P(full)，再 P(mutex)</text><text x="22" y="417" class="" text-anchor="start">若缓冲区空，消费者只等 full，</text><text x="22" y="444" class="" text-anchor="start">不占 mutex，生产者才能放入并唤醒它。</text><text x="22" y="471" class="" text-anchor="start">先占锁再等产品，可能把生产者堵住。</text></svg>