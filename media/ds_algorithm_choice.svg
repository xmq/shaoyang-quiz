<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc" width="400" height="400"><title id="title">先看结果要求，再选算法</title><desc id="desc">先看结果要求，再选算法；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><text x="22" y="33" class="title" text-anchor="start">先看结果要求，再选算法</text><text x="22" y="75" class="" text-anchor="start">无权图求最少边数 → BFS</text><text x="22" y="102" class="" text-anchor="start">有非负权，求单源最短路 → Dijkstra</text><text x="22" y="129" class="" text-anchor="start">连通无向图，总连接费用最低 → MST</text><text x="22" y="156" class="" text-anchor="start">有前后依赖，排执行次序 → 拓扑排序</text><rect x="24" y="190" width="352" height="80" rx="7" class="hi"/><text x="40" y="222" class="" text-anchor="start">同一条边，在不同任务里意义不同。</text><text x="40" y="249" class="" text-anchor="start">MST 费用最少 ≠ 每对点路径最短。</text><text x="22" y="305" class="" text-anchor="start">先核对：有向/无向？有没有负权？</text><text x="22" y="332" class="" text-anchor="start">再写需要维护的状态，而非只记算法名。</text><text x="22" y="359" class="" text-anchor="start">负权路径题不能直接套用 Dijkstra。</text></svg>