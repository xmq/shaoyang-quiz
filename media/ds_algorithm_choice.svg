<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 650" role="img" aria-labelledby="title desc">
  <title id="title">从题目关键词选择数据结构与算法</title><desc id="desc">根据等值查询、范围查询、Top K、无权最短路、非负最短路、连接全部点和依赖顺序等要求选择常见算法。</desc>
  <defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.q{fill:#102a43;stroke:#102a43;stroke-width:2}.box{fill:#fff;stroke:#64748b;stroke-width:2}.ans{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.line{stroke:#64748b;stroke-width:3;fill:none}.h{font:700 25px system-ui,sans-serif;fill:#102a43}.w{font:700 20px system-ui,sans-serif;fill:#fff}.t{font:18px system-ui,sans-serif;fill:#334155}.a{font:700 19px system-ui,sans-serif;fill:#176f68}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.q{fill:#0d3551;stroke:#46d6c6}.box{fill:#17283b;stroke:#647b91}.ans{fill:#173f3c;stroke:#46d6c6}.h{fill:#edf4fb}.t{fill:#b8c5d1}.a{fill:#89e7dd}}</style></defs>
  <rect class="bg" x="12" y="12" width="1016" height="626" rx="26"/><text class="h" x="48" y="58">先识别“结果要求”，再检查算法条件</text>
  <rect class="q" x="390" y="85" width="260" height="62" rx="18"/><text class="w" x="520" y="124" text-anchor="middle">题目最终要什么？</text>
  <path class="line" d="M520 147V180M520 180H150V215M520 180H390V215M520 180H650V215M520 180H890V215"/>
  <g class="box"><rect x="45" y="215" width="210" height="64" rx="14"/><rect x="285" y="215" width="210" height="64" rx="14"/><rect x="545" y="215" width="210" height="64" rx="14"/><rect x="785" y="215" width="210" height="64" rx="14"/></g>
  <g class="t" text-anchor="middle"><text x="150" y="254">查找与顺序</text><text x="390" y="254">极值与Top K</text><text x="650" y="254">路径与连通</text><text x="890" y="254">任务依赖</text></g>
  <path class="line" d="M150 279V330M390 279V330M650 279V330M890 279V330"/>
  <g class="ans"><rect x="35" y="330" width="230" height="230" rx="18"/><rect x="285" y="330" width="210" height="230" rx="18"/><rect x="515" y="330" width="270" height="230" rx="18"/><rect x="805" y="330" width="190" height="230" rx="18"/></g>
  <g class="a"><text x="58" y="375">等值 → 散列表</text><text x="58" y="420">范围 → 平衡树/B+树</text><text x="58" y="465">前缀 → Trie</text><text x="58" y="510">有序数组 → 二分</text><text x="315" y="385">持续Top K → 堆</text><text x="315" y="435">撤销 → 栈</text><text x="315" y="485">先到先处理 → 队列</text><text x="540" y="375">无权最短 → BFS</text><text x="540" y="420">非负权 → Dijkstra</text><text x="540" y="465">连接全部点 → MST</text><text x="540" y="510">动态连通 → 并查集</text><text x="833" y="400">DAG</text><text x="833" y="445">拓扑排序</text><text x="833" y="500">有环则无完整序</text></g>
  <text class="t" x="48" y="608">答案至少写两部分：选什么算法；为什么题目条件满足它的适用范围。</text>
</svg>
