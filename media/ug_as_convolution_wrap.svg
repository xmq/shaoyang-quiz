<svg xmlns="http://www.w3.org/2000/svg" width="360" height="392" viewBox="0 0 360 392" role="img" aria-labelledby="title desc"><title id="title">圆周卷积尾项折回与充分补零</title><desc id="desc">线性结果3、10、8在二点圆周卷积中将8加到下标0得11、10。补到四点后为3、10、8、0。</desc><style>svg{color:#20333b;font:15px system-ui,'Microsoft YaHei',sans-serif}text{fill:currentColor}.line{fill:none;stroke:currentColor;stroke-width:1.6}.box{fill:#edf5f4;stroke:#5c8080;stroke-width:1.5}.accent{fill:none;stroke:#167d70;stroke-width:2.3}.fill{fill:#167d70}.muted{fill:#61747b}@media(prefers-color-scheme:dark){svg{color:#e8f0f2}.box{fill:#1b3438;stroke:#8aabb1}.accent{stroke:#73ceba}.fill{fill:#73ceba}.muted{fill:#adbec5}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="12" y="24" font-size="17">圆周回绕：尾项并没有消失</text><text x="12" y="52" font-size="14">[1,2] 与 [3,4]：线性输出长度为3</text><text x="12" y="85" font-size="14">线性卷积</text><text x="76" y="119" font-size="21" text-anchor="middle">3</text><text x="76" y="142" font-size="13" text-anchor="middle" class="muted">n=0</text><text x="180" y="119" font-size="21" text-anchor="middle">10</text><text x="180" y="142" font-size="13" text-anchor="middle" class="muted">n=1</text><text x="284" y="119" font-size="21" text-anchor="middle">8</text><text x="284" y="142" font-size="13" text-anchor="middle" class="muted">n=2</text><path class="accent" d="M284 151C284 184 98 177 98 213" marker-end="url(#arrow)"/><text x="183" y="191" font-size="13" text-anchor="middle">+8折回n=0</text><text x="12" y="225" font-size="14">N=2</text><text x="110" y="247" font-size="21" text-anchor="middle">11</text><text x="252" y="247" font-size="21" text-anchor="middle">10</text><text x="110" y="269" font-size="13" text-anchor="middle" class="muted">3+8</text><text x="252" y="269" font-size="13" text-anchor="middle" class="muted">原n=1</text><text x="12" y="309" font-size="14">两输入补至N=4 ≥ 2+2−1</text><text x="32" y="343" font-size="16">[3, 10, 8, 0]：不折回，取前3项</text><text x="12" y="372" font-size="13" class="muted">DFT逐点乘→IDFT，必须先检查长度</text></svg>