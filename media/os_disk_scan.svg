<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" role="img" aria-labelledby="title desc" width="400" height="330"><title id="title">SCAN：先走到端点再折返</title><desc id="desc">SCAN：先走到端点再折返；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><text x="22" y="33" class="title" text-anchor="start">SCAN：先走到端点再折返</text><text x="22" y="70" class="" text-anchor="start">磁道0~99，磁头50，先向增大方向</text><text x="22" y="97" class="" text-anchor="start">请求20、40、70、90</text><path class="edge" d="M40 175L355 175"/><path class="edge" d="M40 168L40 184"/><text x="40" y="210" class="mono" text-anchor="middle">0</text><path class="edge" d="M103 168L103 184"/><text x="103" y="210" class="mono" text-anchor="middle">20</text><path class="edge" d="M166 168L166 184"/><text x="166" y="210" class="mono" text-anchor="middle">40</text><path class="edge" d="M198 168L198 184"/><text x="198" y="210" class="mono" text-anchor="middle">50</text><path class="edge" d="M261 168L261 184"/><text x="261" y="210" class="mono" text-anchor="middle">70</text><path class="edge" d="M324 168L324 184"/><text x="324" y="210" class="mono" text-anchor="middle">90</text><path class="edge" d="M355 168L355 184"/><text x="355" y="210" class="mono" text-anchor="middle">99</text><path class="line" d="M198 135L355 135"/><path class="line" d="M355 245L103 245"/><text x="22" y="287" class="" text-anchor="start">次序：70 → 90 → 到99折返 → 40 → 20</text><text x="22" y="314" class="" text-anchor="start">LOOK在90即折返；SCAN继续到端点99。</text></svg>