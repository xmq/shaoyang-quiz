<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-labelledby="title desc"><title id="title">规模翻倍，工作量怎样变？</title><desc id="desc">规模翻倍，工作量怎样变？；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><rect x="1" y="1" width="398" height="338" rx="12" class="bg"/><text x="22" y="33" class="title" text-anchor="start">规模翻倍，工作量怎样变？</text><text x="22" y="70" class="" text-anchor="start">按基本操作次数比较，忽略机器差异</text><text x="26" y="120" class="" text-anchor="start">规模 n</text><rect x="155" y="93" width="98" height="35" rx="7" class="box"/><text x="204.0" y="116.5" class="mono" text-anchor="middle">n=8</text><rect x="270" y="93" width="105" height="35" rx="7" class="box"/><text x="322.5" y="116.5" class="mono" text-anchor="middle">n=16</text><text x="26" y="165" class="" text-anchor="start">O(log₂n)</text><rect x="155" y="138" width="98" height="35" rx="7" class="box"/><text x="204.0" y="161.5" class="mono" text-anchor="middle">3</text><rect x="270" y="138" width="105" height="35" rx="7" class="box"/><text x="322.5" y="161.5" class="mono" text-anchor="middle">4</text><text x="26" y="210" class="" text-anchor="start">O(n)</text><rect x="155" y="183" width="98" height="35" rx="7" class="box"/><text x="204.0" y="206.5" class="mono" text-anchor="middle">8</text><rect x="270" y="183" width="105" height="35" rx="7" class="box"/><text x="322.5" y="206.5" class="mono" text-anchor="middle">16</text><text x="26" y="255" class="" text-anchor="start">O(n²)</text><rect x="155" y="228" width="98" height="35" rx="7" class="box"/><text x="204.0" y="251.5" class="mono" text-anchor="middle">64</text><rect x="270" y="228" width="105" height="35" rx="7" class="box"/><text x="322.5" y="251.5" class="mono" text-anchor="middle">256</text><text x="22" y="305" class="" text-anchor="start">两层循环仍要看边界，不能只数层数。</text></svg>