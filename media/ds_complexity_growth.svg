<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">常见时间复杂度增长趋势</title><desc id="desc">随着输入规模增大，常数、对数、线性、线性对数和平方复杂度的增长速度对比。</desc>
  <defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.axis{stroke:#64748b;stroke-width:3}.grid{stroke:#dbe4ee;stroke-width:1}.t{font:20px system-ui,sans-serif;fill:#334155}.h{font:700 26px system-ui,sans-serif;fill:#102a43}.c1{fill:none;stroke:#176f68;stroke-width:5}.c2{fill:none;stroke:#2563eb;stroke-width:5}.c3{fill:none;stroke:#7c3aed;stroke-width:5}.c4{fill:none;stroke:#d97706;stroke-width:5}.c5{fill:none;stroke:#c2413b;stroke-width:5}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.axis{stroke:#9fb0bf}.grid{stroke:#273a4e}.t{fill:#b8c5d1}.h{fill:#edf4fb}.c1{stroke:#46d6c6}.c2{stroke:#66a3ff}.c3{stroke:#b9a1ff}.c4{stroke:#ffbd66}.c5{stroke:#ff8f87}}</style></defs>
  <rect class="bg" x="12" y="12" width="936" height="536" rx="26"/><text class="h" x="48" y="58">规模增大时，增长速度的差距会迅速放大</text>
