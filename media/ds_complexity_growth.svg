  <path class="c1" d="M120 420H860"/><path class="c2" d="M120 430C270 410 520 365 860 315"/><path class="c3" d="M120 445L860 245"/><path class="c4" d="M120 448C330 420 620 290 860 145"/><path class="c5" d="M120 450C420 440 700 310 860 75"/>
  <g class="t"><text x="750" y="414">O(1)</text><text x="760" y="320">O(log n)</text><text x="775" y="250">O(n)</text><text x="720" y="145">O(n log n)</text><text x="815" y="92">O(n²)</text></g>
