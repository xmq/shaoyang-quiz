<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 355" role="img" aria-labelledby="title desc" width="400" height="355"><title id="title">顺序表插入：从后向前移</title><desc id="desc">顺序表插入：从后向前移；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><text x="22" y="33" class="title" text-anchor="start">顺序表插入：从后向前移</text><text x="22" y="70" class="" text-anchor="start">把 X 插在 B 后；灰框是尚空的位置</text><rect x="24" y="90" width="67" height="39" rx="7" class="box"/><text x="57.5" y="115.5" class="mono" text-anchor="middle">A</text><rect x="94" y="90" width="67" height="39" rx="7" class="box"/><text x="127.5" y="115.5" class="mono" text-anchor="middle">B</text><rect x="164" y="90" width="67" height="39" rx="7" class="box"/><text x="197.5" y="115.5" class="mono" text-anchor="middle">C</text><rect x="234" y="90" width="67" height="39" rx="7" class="box"/><text x="267.5" y="115.5" class="mono" text-anchor="middle">D</text><rect x="304" y="90" width="67" height="39" rx="7" class="box"/><text x="337.5" y="115.5" class="mono" text-anchor="middle">·</text><text x="22" y="158" class="" text-anchor="start">① D 右移，再把 C 右移</text><rect x="24" y="175" width="67" height="39" rx="7" class="box"/><text x="57.5" y="200.5" class="mono" text-anchor="middle">A</text><rect x="94" y="175" width="67" height="39" rx="7" class="box"/><text x="127.5" y="200.5" class="mono" text-anchor="middle">B</text><rect x="164" y="175" width="67" height="39" rx="7" class="box"/><text x="197.5" y="200.5" class="mono" text-anchor="middle">C</text><rect x="234" y="175" width="67" height="39" rx="7" class="hi"/><text x="267.5" y="200.5" class="mono" text-anchor="middle">C</text><rect x="304" y="175" width="67" height="39" rx="7" class="hi"/><text x="337.5" y="200.5" class="mono" text-anchor="middle">D</text><text x="22" y="245" class="" text-anchor="start">② 把 X 写入原 C 的位置</text><rect x="24" y="263" width="67" height="39" rx="7" class="box"/><text x="57.5" y="288.5" class="mono" text-anchor="middle">A</text><rect x="94" y="263" width="67" height="39" rx="7" class="box"/><text x="127.5" y="288.5" class="mono" text-anchor="middle">B</text><rect x="164" y="263" width="67" height="39" rx="7" class="hi"/><text x="197.5" y="288.5" class="mono" text-anchor="middle">X</text><rect x="234" y="263" width="67" height="39" rx="7" class="box"/><text x="267.5" y="288.5" class="mono" text-anchor="middle">C</text><rect x="304" y="263" width="67" height="39" rx="7" class="box"/><text x="337.5" y="288.5" class="mono" text-anchor="middle">D</text><text x="22" y="330" class="" text-anchor="start">若从前向后搬，会覆盖还没搬走的值。</text></svg>