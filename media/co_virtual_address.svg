<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 445" role="img" aria-labelledby="title" width="400" height="445"><title id="title">地址转换：只换页号，不换偏移</title><defs><style>text{font:18px "Microsoft YaHei",system-ui,sans-serif;fill:#183047}.title{font-size:20px;font-weight:700}.bold{font-weight:700}.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#7b8fa2;stroke-width:1.5}.hi{fill:#d9f3ed;stroke:#19806e;stroke-width:1.5}.blue{fill:#e0edff;stroke:#4c79bf;stroke-width:1.5}.warn{fill:#fff0d3;stroke:#c28a25;stroke-width:1.5}.line{stroke:#37768a;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#e6eef6}.bg{fill:#142234;stroke:#405469}.box{fill:#1a2e43;stroke:#859bad}.hi{fill:#16483f;stroke:#69d7bc}.blue{fill:#193e68;stroke:#92b9fb}.warn{fill:#4b3a1e;stroke:#e4b15a}.line{stroke:#82c5d4}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47879b"/></marker></defs><rect class="bg" x="1" y="1" width="398" height="443" rx="14"/><text x="18" y="32" class="title">地址转换：只换页号，不换偏移</text><text x="18" y="68" class="">页大小4 KiB；虚拟地址0x1234。</text><rect class="blue" x="18" y="88" width="186" height="44" rx="7"/><text x="111.0" y="116.0" class="" text-anchor="middle">虚拟页号1</text><rect class="warn" x="204" y="88" width="178" height="44" rx="7"/><text x="293.0" y="116.0" class="" text-anchor="middle">偏移0x234</text><path class="line" d="M100 142L100 172" marker-end="url(#a)"/><rect class="hi" x="18" y="187" width="364" height="44" rx="7"/><text x="200.0" y="215.0" class="" text-anchor="middle">查TLB；未命中再查页表</text><text x="18" y="271" class="">假设页表[1]有效，物理页框号为5。</text><path class="line" d="M100 282L100 307" marker-end="url(#a)"/><rect class="blue" x="18" y="322" width="186" height="44" rx="7"/><text x="111.0" y="350.0" class="" text-anchor="middle">物理页框5</text><rect class="warn" x="204" y="322" width="178" height="44" rx="7"/><text x="293.0" y="350.0" class="" text-anchor="middle">仍为0x234</text><text x="18" y="410" class="">物理地址=5×0x1000+0x234=0x5234</text></svg>