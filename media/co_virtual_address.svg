<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
  <title id="title">虚拟地址经TLB和页表转换为物理地址</title><desc id="desc">虚拟页号查TLB或页表得到物理页框号，页内偏移保持不变并拼成物理地址。</desc>
  <defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.box{fill:#fff;stroke:#64748b;stroke-width:3}.key{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.same{fill:#d1fae5;stroke:#059669;stroke-width:3}.arrow{stroke:#176f68;stroke-width:4;fill:none}.title{font:700 28px system-ui;fill:#102a43}.head{font:700 22px system-ui;fill:#102a43}.text{font:19px system-ui;fill:#334155}.code{font:19px ui-monospace;fill:#1d4ed8}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.box{fill:#17283b;stroke:#647b91}.key{fill:#17304a;stroke:#78b7ff}.same{fill:#173f3c;stroke:#46d6c6}.arrow{stroke:#46d6c6}.title,.head{fill:#edf4fb}.text{fill:#b8c5d1}.code{fill:#a9cbff}}</style></defs>
  <rect class="bg" x="10" y="10" width="700" height="370" rx="24"/><text class="title" x="32" y="52">页号被替换，页内偏移原样保留</text>
  <rect class="key" x="45" y="90" width="220" height="78" rx="10"/><rect class="same" x="265" y="90" width="165" height="78" rx="10"/><text class="head" x="155" y="126" text-anchor="middle">虚拟页号 VPN</text><text class="text" x="347" y="140" text-anchor="middle">页内偏移</text>
  <rect class="box" x="475" y="82" width="190" height="96" rx="14"/><text class="head" x="570" y="120" text-anchor="middle">TLB → 页表</text><text class="text" x="570" y="152" text-anchor="middle">查页框或发现缺页</text><path class="arrow" d="M265 128H475"/>
  <rect class="key" x="45" y="235" width="220" height="78" rx="10"/><rect class="same" x="265" y="235" width="165" height="78" rx="10"/><text class="head" x="155" y="272" text-anchor="middle">物理页框 PPN</text><text class="text" x="347" y="285" text-anchor="middle">同一偏移</text><path class="arrow" d="M570 178V274H430"/>
  <text class="code" x="45" y="355">4KiB页 → 偏移12位；物理地址 = 页框号｜偏移</text>
</svg>
