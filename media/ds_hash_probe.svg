<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">线性探测处理散列冲突</title><desc id="desc">表长7时，10、17、24的散列地址都为3，线性探测后依次放入3、4、5号槽。</desc>
  <defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.cell{fill:#fff;stroke:#64748b;stroke-width:2}.hit{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.arrow{stroke:#d97706;stroke-width:4;fill:none;marker-end:url(#a)}.h{font:700 25px system-ui,sans-serif;fill:#102a43}.t{font:19px system-ui,sans-serif;fill:#334155}.m{font:21px ui-monospace,monospace;fill:#1d4ed8}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.cell{fill:#17283b;stroke:#647b91}.hit{fill:#173f3c;stroke:#46d6c6}.h{fill:#edf4fb}.t{fill:#b8c5d1}.m{fill:#a9cbff}}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#d97706"/></marker></defs>
  <rect class="bg" x="12" y="12" width="936" height="476" rx="26"/><text class="h" x="48" y="62">h(k)=k mod 7：冲突后向后寻找空槽</text>
  <g class="cell"><rect x="55" y="175" width="115" height="85"/><rect x="170" y="175" width="115" height="85"/><rect x="285" y="175" width="115" height="85"/></g><g class="hit"><rect x="400" y="175" width="115" height="85"/><rect x="515" y="175" width="115" height="85"/><rect x="630" y="175" width="115" height="85"/></g><rect class="cell" x="745" y="175" width="115" height="85"/>
  <g class="m" text-anchor="middle"><text x="112" y="225">0</text><text x="227" y="225">1</text><text x="342" y="225">2</text><text x="457" y="210">3</text><text x="457" y="242">10</text><text x="572" y="210">4</text><text x="572" y="242">17</text><text x="687" y="210">5</text><text x="687" y="242">24</text><text x="802" y="225">6</text></g>
  <text class="m" x="85" y="345">10 mod 7 = 3</text><text class="m" x="335" y="345">17 mod 7 = 3 → 4</text><text class="m" x="625" y="345">24 mod 7 = 3 → 4 → 5</text>
  <path class="arrow" d="M445 285H565"/><path class="arrow" d="M560 300H680"/><text class="t" x="165" y="425">删除17不能直接置空，否则查找24可能在槽4错误结束；应放“已删除”标记。</text>
</svg>
