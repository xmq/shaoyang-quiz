<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 395" role="img" aria-labelledby="title desc"><title id="title">散列冲突：沿相同路线找</title><desc id="desc">散列冲突：沿相同路线找；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><rect x="1" y="1" width="398" height="393" rx="12" class="bg"/><text x="22" y="33" class="title" text-anchor="start">散列冲突：沿相同路线找</text><text x="22" y="70" class="" text-anchor="start">h(k)=k%7；依次插入10、17、24</text><rect x="17" y="100" width="50" height="39" rx="7" class="box"/><text x="42.0" y="125.5" class="mono" text-anchor="middle">·</text><rect x="70" y="100" width="50" height="39" rx="7" class="box"/><text x="95.0" y="125.5" class="mono" text-anchor="middle">·</text><rect x="123" y="100" width="50" height="39" rx="7" class="box"/><text x="148.0" y="125.5" class="mono" text-anchor="middle">·</text><rect x="176" y="100" width="50" height="39" rx="7" class="hi"/><text x="201.0" y="125.5" class="mono" text-anchor="middle">10</text><rect x="229" y="100" width="50" height="39" rx="7" class="hi"/><text x="254.0" y="125.5" class="mono" text-anchor="middle">17</text><rect x="282" y="100" width="50" height="39" rx="7" class="hi"/><text x="307.0" y="125.5" class="mono" text-anchor="middle">24</text><rect x="335" y="100" width="50" height="39" rx="7" class="box"/><text x="360.0" y="125.5" class="mono" text-anchor="middle">·</text><text x="42" y="162" class="mono" text-anchor="middle">0</text><text x="95" y="162" class="mono" text-anchor="middle">1</text><text x="148" y="162" class="mono" text-anchor="middle">2</text><text x="201" y="162" class="mono" text-anchor="middle">3</text><text x="254" y="162" class="mono" text-anchor="middle">4</text><text x="307" y="162" class="mono" text-anchor="middle">5</text><text x="360" y="162" class="mono" text-anchor="middle">6</text><text x="22" y="207" class="" text-anchor="start">10：槽3空 → 放3</text><text x="22" y="234" class="" text-anchor="start">17：槽3占用 → 放4</text><text x="22" y="261" class="" text-anchor="start">24：槽3、4占用 → 放5</text><text x="22" y="288" class="" text-anchor="start">查24也沿 3 → 4 → 5，不能跳到5。</text><text x="22" y="315" class="" text-anchor="start">删17：槽4留“已删除”，不能变成空槽。</text><text x="22" y="342" class="" text-anchor="start">空槽可结束查找；已删除槽必须继续。</text></svg>