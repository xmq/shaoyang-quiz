<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
  <title id="title">组相联Cache地址拆分</title><desc id="desc">地址分为标记、组索引和块内偏移，并展示由容量、块大小和路数计算组数。</desc>
  <defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.tag{fill:#ede9fe;stroke:#7c3aed}.index{fill:#dbeafe;stroke:#2563eb}.offset{fill:#d1fae5;stroke:#059669}.box{stroke-width:3}.title{font:700 28px system-ui;fill:#102a43}.head{font:700 22px system-ui;fill:#102a43}.text{font:19px system-ui;fill:#334155}.code{font:20px ui-monospace;fill:#1d4ed8}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.tag{fill:#332450;stroke:#b69cff}.index{fill:#17304a;stroke:#78b7ff}.offset{fill:#173f3c;stroke:#46d6c6}.title,.head{fill:#edf4fb}.text{fill:#b8c5d1}.code{fill:#a9cbff}}</style></defs>
  <rect class="bg" x="10" y="10" width="700" height="370" rx="24"/><text class="title" x="32" y="52">组相联Cache：从右向左拆地址</text>
  <rect class="tag box" x="45" y="92" width="295" height="82" rx="10"/><rect class="index box" x="340" y="92" width="175" height="82" rx="10"/><rect class="offset box" x="515" y="92" width="160" height="82" rx="10"/>
  <text class="head" x="192" y="130" text-anchor="middle">标记</text><text class="text" x="192" y="160" text-anchor="middle">剩余高位</text><text class="head" x="427" y="130" text-anchor="middle">组索引</text><text class="text" x="427" y="160" text-anchor="middle">log₂组数</text><text class="head" x="595" y="130" text-anchor="middle">块内偏移</text><text class="text" x="595" y="160" text-anchor="middle">log₂块大小</text>
  <text class="code" x="45" y="225">组数 = Cache容量 ÷ (块大小 × 路数)</text><text class="text" x="45" y="270">例：16KB、64B块、4路 → 64组 → 索引6位</text><text class="text" x="45" y="310">64B块 → 偏移6位；32位地址剩20位作标记</text><text class="text" x="45" y="350">先确认容量是否只计数据区，再按题意处理。</text>
</svg>
