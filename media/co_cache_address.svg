<svg xmlns="http://www.w3.org/2000/svg" width="400" height="445" viewBox="0 0 400 445" role="img" aria-labelledby="title"><title id="title">Cache地址：先确定每段位数</title><defs><style>text{font:18px "Microsoft YaHei",system-ui,sans-serif;fill:#183047}.title{font-size:20px;font-weight:700}.bold{font-weight:700}.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#7b8fa2;stroke-width:1.5}.hi{fill:#d9f3ed;stroke:#19806e;stroke-width:1.5}.blue{fill:#e0edff;stroke:#4c79bf;stroke-width:1.5}.warn{fill:#fff0d3;stroke:#c28a25;stroke-width:1.5}.line{stroke:#37768a;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#e6eef6}.bg{fill:#142234;stroke:#405469}.box{fill:#1a2e43;stroke:#859bad}.hi{fill:#16483f;stroke:#69d7bc}.blue{fill:#193e68;stroke:#92b9fb}.warn{fill:#4b3a1e;stroke:#e4b15a}.line{stroke:#82c5d4}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47879b"/></marker></defs><rect class="bg" x="1" y="1" width="398" height="443" rx="14"/><text x="18" y="32" class="title">Cache地址：先确定每段位数</text><text x="18" y="68" class="">32位字节地址；数据区16 KiB。</text><text x="18" y="101" class="">块64 B，4路组相联（不含标记开销）。</text><rect class="hi" x="18" y="122" width="160" height="35" rx="7"/><text x="98.0" y="145.5" class="" text-anchor="middle">计算</text><rect class="hi" x="178" y="122" width="204" height="35" rx="7"/><text x="280.0" y="145.5" class="" text-anchor="middle">结果</text><rect class="box" x="18" y="157" width="160" height="35" rx="7"/><text x="98.0" y="180.5" class="" text-anchor="middle">总块数</text><rect class="box" x="178" y="157" width="204" height="35" rx="7"/><text x="280.0" y="180.5" class="" text-anchor="middle">16384÷64=256</text><rect class="box" x="18" y="192" width="160" height="35" rx="7"/><text x="98.0" y="215.5" class="" text-anchor="middle">组数</text><rect class="box" x="178" y="192" width="204" height="35" rx="7"/><text x="280.0" y="215.5" class="" text-anchor="middle">256÷4=64</text><rect class="box" x="18" y="227" width="160" height="35" rx="7"/><text x="98.0" y="250.5" class="" text-anchor="middle">块内偏移</text><rect class="box" x="178" y="227" width="204" height="35" rx="7"/><text x="280.0" y="250.5" class="" text-anchor="middle">log₂64=6位</text><rect class="box" x="18" y="262" width="160" height="35" rx="7"/><text x="98.0" y="285.5" class="" text-anchor="middle">组索引</text><rect class="box" x="178" y="262" width="204" height="35" rx="7"/><text x="280.0" y="285.5" class="" text-anchor="middle">log₂64=6位</text><rect class="box" x="18" y="297" width="160" height="35" rx="7"/><text x="98.0" y="320.5" class="" text-anchor="middle">标记</text><rect class="box" x="178" y="297" width="204" height="35" rx="7"/><text x="280.0" y="320.5" class="" text-anchor="middle">32−6−6=20位</text><rect class="blue" x="18" y="358" width="170" height="44" rx="7"/><text x="103.0" y="386.0" class="" text-anchor="middle">标记20位</text><rect class="hi" x="188" y="358" width="96" height="44" rx="7"/><text x="236.0" y="386.0" class="" text-anchor="middle">组6位</text><rect class="warn" x="284" y="358" width="98" height="44" rx="7"/><text x="333.0" y="386.0" class="" text-anchor="middle">偏移6位</text></svg>