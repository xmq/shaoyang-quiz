<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 543" role="img" aria-labelledby="title desc" width="390" height="543"><title id="title">订单查询：数据从哪里到哪里？</title><desc id="desc">订单查询：数据从哪里到哪里？</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><text class="h" x="20" y="33">订单查询：数据从哪里到哪里？</text><rect class="box" x="110" y="60" width="170" height="58" rx="10"/><text class="t" x="195" y="96" text-anchor="middle">外部实体：用户</text><path class="line" d="M155 118L155 188"/><text class="s" x="20" y="151">订单号=42</text><path class="line" d="M235 188L235 118"/><text class="s" x="250" y="150">结果</text><circle class="hot" cx="195" cy="235" r="62"/><text class="h" x="195" y="232" text-anchor="middle">1.0</text><text class="t" x="195" y="261" text-anchor="middle">查询订单</text><path class="line" d="M155 282L155 356"/><text class="s" x="20" y="326">查找条件</text><path class="line" d="M235 356L235 282"/><text class="s" x="250" y="326">订单数据</text><path class="thin" d="M65 356H330M65 356V414M65 414H330"/><text class="t" x="195" y="391" text-anchor="middle">D1 订单库</text><text class="t" x="22" y="458">输入：订单号42；输出：42号的状态。</text><text class="s"