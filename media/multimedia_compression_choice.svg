<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.b{fill:#fff;stroke:#2563eb;stroke-width:3}.h{fill:#e7f6f4;stroke:#176f68;stroke-width:3}.l{stroke:#526777;stroke-width:4}.tt{font:700 27px system-ui;fill:#102a43}.t{font:20px system-ui;fill:#102a43}.s{font:18px system-ui;fill:#526777}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.b{fill:#17283b;stroke:#78b7ff}.h{fill:#173f3c;stroke:#46d6c6}.l{stroke:#9fb0c0}.tt,.t{fill:#edf4fb}.s{fill:#b8c5d1}}</style></defs><rect class="bg" x="10" y="10" width="700" height="380" rx="24"/><text class="tt" x="35" y="55">先看是否必须精确恢复，再选择压缩方式</text><rect class="h" x="255" y="90" width="210" height="65" rx="12"/><text class="t" x="360" y="130" text-anchor="middle">必须恢复原数据？</text><path class="l" d="M305 155L170 235M415 155L550 235"/><g class="t" text-anchor="middle"><rect class="b" x="55" y="235" width="230" height="95" rx="12"/><text x="170" y="275">是 → 无损</text><text x="170" y="310">文本/程序/母版</text><rect class="b" x="435" y="235" width="230" height="95" rx="12"/><text x="550" y="275">否 → 可有损</text><text x="550" y="310">照片/音视频分发</text></g><text class="s" x="45" y="365">长期编辑保留源文件；分发副本再按质量、体积、透明和兼容要求选择格式</text></svg>
