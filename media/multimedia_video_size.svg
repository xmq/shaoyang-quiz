<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 437" role="img" aria-labelledby="title desc" width="390" height="437"><title id="title">已给总码率，就不再数像素</title><desc id="desc">已给总码率，就不再数像素</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><text class="h" x="20" y="33">已给总码率，就不再数像素</text><rect class="box" x="18" y="56" width="354" height="68" rx="10"/><text class="h" x="32" y="84">题设：总码率2 Mbit/s，60秒</text><text class="t" x="32" y="112">这里“总”已含题设中的各媒体轨道</text><path class="line" d="M195 127L195 148"/><rect class="box" x="18" y="153" width="354" height="68" rx="10"/><text class="h" x="32" y="181">先求总位数</text><text class="t" x="32" y="209">2×10⁶×60＝120×10⁶ bit</text><path class="line" d="M195 224L195 245"/><rect class="hot" x="18" y="250" width="354" height="94" rx="10"/><text class="h" x="32" y="278">再把bit换成Byte</text><text class="t" x="32" y="306">120×10⁶÷8＝15×10⁶ B</text><text class="t" x="32" y="332">约15 MB（1000进制，不计额外开销）</text><text class="s" x="20" y="373">若只给视频码率，还需加音频码率。</text><text class="s" x="20" y="399">再乘分辨率/帧率，会重复计算数据量。</text></svg>
