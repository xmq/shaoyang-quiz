<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 686" role="img" aria-labelledby="title desc" width="390" height="686"><title id="title">三节报告：封面、正文、横向附录</title><desc id="desc">缩略纸页分别显示竖向无页码的封面、竖向且页码从1起的正文、横向带表格的附录。两道下一页分节符隔开三个可独立设置的节。正文页脚取消链接，附录方向应用于本节。</desc><defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#7890a5;stroke-width:1.5}.hot{fill:#e7f6f4;stroke:#14756d;stroke-width:2}.bad{fill:#fff0f0;stroke:#bf4343;stroke-width:2}.h{font:700 20px "Microsoft YaHei",system-ui;fill:#102a43}.t{font:18px "Microsoft YaHei",system-ui;fill:#17324d}.s{font:18px "Microsoft YaHei",system-ui;fill:#415a70}.line{stroke:#3568b0;stroke-width:2;fill:none;marker-end:url(#arrow)}.thin{stroke:#7890a5;stroke-width:1;fill:none}.color{fill:#2368b5}.green{fill:#168679}@media(prefers-color-scheme:dark){.bg{fill:#142234}.box{fill:#1c3046;stroke:#8aa5bb}.hot{fill:#173f3c;stroke:#54cdbb}.bad{fill:#472831;stroke:#f59999}.h,.t{fill:#edf4fb}.s{fill:#c1d0dc}.line{stroke:#8bbcff}.thin{stroke:#8aa5bb}.color{fill:#8bbcff}.green{fill:#54cdbb}}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5687ba"/></marker></defs><rect class="bg" width="390" height="686" rx="14"/><text class="h" x="20" y="33" text-anchor="start">三节报告：封面、正文、横向附录</text><rect class="box" x="28" y="72" width="100" height="138" rx="5"/><text class="h" x="78" y="126" text-anchor="middle">报告</text><text class="t" x="78" y="156" text-anchor="middle">封面</text><text class="h" x="150" y="99" text-anchor="start">第1节：封面</text><text class="s" x="150" y="132" text-anchor="start">竖向</text><text class="s" x="150" y="160" text-anchor="start">不显示页码</text><path class="thin" stroke-dasharray="7 5" d="M25 239H365"/><rect class="hot" x="92" y="224" width="206" height="30" rx="5"/><text class="t" x="195" y="245" text-anchor="middle">下一页分节符</text><rect class="box" x="28" y="274" width="100" height="142" rx="5"/><text class="h" x="78" y="303" text-anchor="middle">正文</text><path class="thin" d="M41 323L115 323"/><path class="thin" d="M41 337L115 337"/><path class="thin" d="M41 351L115 351"/><path class="thin" d="M41 365L115 365"/><text class="t" x="78" y="400" text-anchor="middle">1</text><text class="h" x="150" y="294" text-anchor="start">第2节：正文</text><text class="s" x="150" y="325" text-anchor="start">竖向，页码从1起</text><text class="s" x="150" y="358" text-anchor="start">取消页脚链接</text><text class="s" x="150" y="385" text-anchor="start">“链接到前一节”</text><path class="thin" stroke-dasharray="7 5" d="M25 449H365"/><rect class="hot" x="92" y="434" width="206" height="30" rx="5"/><text class="t" x="195" y="455" text-anchor="middle">下一页分节符</text><rect class="box" x="28" y="490" width="150" height="96" rx="5"/><text class="h" x="103" y="516" text-anchor="middle">附录</text><path class="thin" d="M41 534L165 534"/><path class="thin" d="M41 552L165 552"/><path class="thin" d="M41 570L165 570"/><path class="thin" d="M80 534L80 570"/><path class="thin" d="M122 534L122 570"/><text class="h" x="195" y="511" text-anchor="start">第3节：附录</text><text class="s" x="195" y="542" text-anchor="start">单独设为横向</text><text class="s" x="195" y="572" text-anchor="start">应用于“本节”</text><text class="s" x="20" y="629" text-anchor="start">纸页形状表示竖向或横向，不按比例。</text><text class="s" x="20" y="657" text-anchor="start">分页只能换页，分节才能隔离节设置。</text></svg>
