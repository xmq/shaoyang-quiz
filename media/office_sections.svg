<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"><defs><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.p{fill:#fff;stroke:#2563eb;stroke-width:3}.sct{fill:#e7f6f4;stroke:#176f68;stroke-width:4}.line{stroke:#d97706;stroke-width:5;stroke-dasharray:9 6}.tt{font:700 27px system-ui;fill:#102a43}.t{font:21px system-ui;fill:#102a43}.s{font:18px system-ui;fill:#526777}@media(prefers-color-scheme:dark){.bg{fill:#142234;stroke:#30455b}.p{fill:#17283b;stroke:#78b7ff}.sct{fill:#173f3c;stroke:#46d6c6}.line{stroke:#f4b45f}.tt,.t{fill:#edf4fb}.s{fill:#b8c5d1}}</style></defs><rect class="bg" x="10" y="10" width="700" height="380" rx="24"/><text class="tt" x="35" y="55">分页改变起点，分节隔离页面规则</text><rect class="p" x="55" y="105" width="160" height="205" rx="10"/><text class="t" x="135" y="145" text-anchor="middle">封面</text><text class="s" x="135" y="275" text-anchor="middle">无页码</text><path class="line" d="M235 90V330"/><text class="s" x="245" y="115">分节符</text><rect class="sct" x="295" y="105" width="160" height="205" rx="10"/><text class="t" x="375" y="145" text-anchor="middle">正文</text><text class="s" x="375" y="275" text-anchor="middle">页码从1开始</text><path class="line" d="M475 90V330"/><text class="s" x="485" y="115">分节符</text><rect class="p" x="535" y="105" width="130" height="205" rx="10"/><text class="t" x="600" y="145" text-anchor="middle">附录</text><text class="s" x="600" y="275" text-anchor="middle">横向</text><text class="s" x="55" y="355">分页符只能换页，不能让两侧拥有独立页眉、页码或方向</text></svg>
