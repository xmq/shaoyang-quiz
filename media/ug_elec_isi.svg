<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title"><title id="title">ISI：邻脉冲在同一抽样点留尾巴</title>
<style>svg{--ink:#233b49;--accent:#08796e;--soft:#e8f4f1;--muted:#536d7c;color:var(--ink);font:14px system-ui,"Microsoft YaHei",sans-serif}text{fill:currentColor}.w{stroke:var(--ink);stroke-width:1.7;fill:none}.a{stroke:var(--accent);stroke-width:2;fill:none}.soft{fill:var(--soft);stroke:var(--accent);stroke-width:1.4}.muted{fill:var(--muted)}@media(prefers-color-scheme:dark){svg{--ink:#e0edf2;--accent:#75d2bd;--soft:#173d39;--muted:#b3c4cf}}</style><defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--accent)"/></marker></defs>
<text x="12" y="25" font-size="17" text-anchor="start">ISI：邻脉冲在同一抽样点留尾巴</text>
<text x="12" y="56" font-size="14" text-anchor="start">约定已吸收接收延迟，当前抽样在kT</text>
<rect x="12" y="95" width="100" height="110" class="soft"/>
<text x="62" y="122" font-size="13" text-anchor="middle">前一−1</text>
<text x="62" y="156" font-size="13" text-anchor="middle">p(T)=.2</text>
<text x="62" y="187" font-size="15" text-anchor="middle">−.2</text>
<path class="a" d="M62 205L180 259" marker-end="url(#arr)"/>
<rect x="130" y="95" width="100" height="110" class="soft"/>
<text x="180" y="122" font-size="13" text-anchor="middle">当前+1</text>
<text x="180" y="156" font-size="13" text-anchor="middle">p(0)=1</text>
<text x="180" y="187" font-size="15" text-anchor="middle">+1</text>
<path class="a" d="M180 205L180 259" marker-end="url(#arr)"/>
<rect x="248" y="95" width="100" height="110" class="soft"/>
<text x="298" y="122" font-size="13" text-anchor="middle">后一+1</text>
<text x="298" y="156" font-size="13" text-anchor="middle">p(−T)=.1</text>
<text x="298" y="187" font-size="15" text-anchor="middle">+.1</text>
<path class="a" d="M298 205L180 259" marker-end="url(#arr)"/>
<text x="180" y="285" font-size="16" text-anchor="middle">合计0.9，仍判+1</text>
<text x="12" y="329" font-size="13" text-anchor="start">有ISI不等于本次必误码；条件须对任意数据。</text>
</svg>