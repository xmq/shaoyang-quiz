<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 390" role="img" aria-labelledby="title desc" width="400" height="390"><title id="title">串联：同一条电流路径</title><desc id="desc">串联：同一条电流路径</desc>
<defs><style>
        :root{--ink:#17324b;--muted:#456075;--paper:#fff;--panel:#edf5fa;--blue:#1464ba;--green:#087c67;--orange:#ad5200;--red:#b42318;--border:#cad8e5}
        @media(prefers-color-scheme:dark){:root{--ink:#edf4fb;--muted:#b5c8d8;--paper:#132334;--panel:#1b3349;--blue:#9bcaff;--green:#7de1c4;--orange:#ffc079;--red:#ffab9b;--border:#527087}}
        .paper{fill:var(--paper)}.panel{fill:var(--panel);stroke:var(--border)}.t{font:18px system-ui,sans-serif;fill:var(--ink)}.h{font:700 21px system-ui,sans-serif;fill:var(--ink)}.b{font:700 18px system-ui,sans-serif;fill:var(--blue)}.g{font:700 18px system-ui,sans-serif;fill:var(--green)}.r{font:700 18px system-ui,sans-serif;fill:var(--red)}.muted{font:18px system-ui,sans-serif;fill:var(--muted)}
        .wire{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}.blue{fill:none;stroke:var(--blue);stroke-width:2.5}.green{fill:none;stroke:var(--green);stroke-width:2.5}.orange{fill:none;stroke:var(--orange);stroke-width:2.5}.red{fill:none;stroke:var(--red);stroke-width:2.5}.dash{stroke-dasharray:5 4}.dot{fill:var(--ink)}.shade{fill:var(--green);opacity:.17}
        </style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs>

<text class="h" x="20" y="33">串联：同一条电流路径</text>
<text class="b" x="20" y="64">12 V → 两个电阻，途中没有分支</text>
<path class="wire" d="M45 130L85 130"/>
<path class="wire" d="M85 130L95 130"/>
<rect class="panel" x="95" y="121" width="70" height="18" rx="0"/>
<path class="wire" d="M165 130L175 130"/>
<text class="t" x="130.0" y="111" text-anchor="middle">2 Ω</text>
<path class="wire" d="M190 130L200 130"/>
<rect class="panel" x="200" y="121" width="80" height="18" rx="0"/>
<path class="wire" d="M280 130L290 130"/>
<text class="t" x="240.0" y="111" text-anchor="middle">4 Ω</text>
<path class="wire" d="M175 130L190 130"/>
<path class="wire" d="M290 130H350V245H45V130"/>
<rect class="panel" x="24" y="159" width="42" height="54" rx="10"/>
<text class="t" x="45" y="182" text-anchor="middle">12</text>
<text class="t" x="45" y="204" text-anchor="middle">V</text>
<path class="wire" d="M220 245L100 245" marker-end="url(#arrow)"/>
<text class="t" x="160" y="274" text-anchor="middle">I = 2 A</text>
<text class="t" x="45" y="151" text-anchor="middle">+</text>
<text class="t" x="45" y="233" text-anchor="middle">−</text>
<text class="t" x="20" y="310">① 总电阻 2+4=6 Ω</text>
<text class="t" x="20" y="335">② 电流 12/6=2 A</text>
<text class="t" x="20" y="360">③ 4 Ω上的电压 2×4=8 V</text>
</svg>
