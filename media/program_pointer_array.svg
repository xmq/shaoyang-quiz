<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title desc"><title id="title">数组指针加1：按元素移动</title><desc id="desc">数组指针加1：按元素移动；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><rect x="1" y="1" width="398" height="298" rx="12" class="bg"/><text x="22" y="33" class="title" text-anchor="start">数组指针加1：按元素移动</text><text x="22" y="70" class="" text-anchor="start">int a[3]={10,20,30}；假设int占4字节</text><rect x="70" y="100" width="87" height="39" rx="7" class="hi"/><text x="113.5" y="125.5" class="mono" text-anchor="middle">10</text><rect x="160" y="100" width="87" height="39" rx="7" class="box"/><text x="203.5" y="125.5" class="mono" text-anchor="middle">20</text><rect x="250" y="100" width="87" height="39" rx="7" class="box"/><text x="293.5" y="125.5" class="mono" text-anchor="middle">30</text><text x="113" y="177" class="mono" text-anchor="middle">1000</text><text x="203" y="177" class="mono" text-anchor="middle">1004</text><text x="293" y="177" class="mono" text-anchor="middle">1008</text><text x="22" y="225" class="" text-anchor="start">p=&amp;a[0]；p+1 指向1004，不是1001</text><text x="22" y="252" class="" text-anchor="start">*(p+1)=20；不能越界解引用。</text></svg>