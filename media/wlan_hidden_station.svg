<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" role="img" aria-labelledby="title" width="400" height="420"><title id="title">隐藏站：都听见AP，却互相听不到</title><defs><style>text{font:18px "Microsoft YaHei",system-ui,sans-serif;fill:#183047}.title{font-size:20px;font-weight:700}.bold{font-weight:700}.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#7b8fa2;stroke-width:1.5}.hi{fill:#d9f3ed;stroke:#19806e;stroke-width:1.5}.blue{fill:#e0edff;stroke:#4c79bf;stroke-width:1.5}.warn{fill:#fff0d3;stroke:#c28a25;stroke-width:1.5}.line{stroke:#37768a;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#e6eef6}.bg{fill:#142234;stroke:#405469}.box{fill:#1a2e43;stroke:#859bad}.hi{fill:#16483f;stroke:#69d7bc}.blue{fill:#193e68;stroke:#92b9fb}.warn{fill:#4b3a1e;stroke:#e4b15a}.line{stroke:#82c5d4}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47879b"/></marker></defs><text x="18" y="32" class="title">隐藏站：都听见AP，却互相听不到</text><circle class="hi" cx="68" cy="220" r="33"/><text x="68" y="226" class="" text-anchor="middle">A</text><circle class="hi" cx="200" cy="105" r="33"/><text x="200" y="111" class="" text-anchor="middle">AP</text><circle class="hi" cx="332" cy="220" r="33"/><text x="332" y="226" class="" text-anchor="middle">C</text><path class="line" d="M86 187L178 136" marker-end="url(#a)"/><path class="line" d="M314 187L222 136" marker-end="url(#a)"/><path class="line" d="M105 220H295" stroke-dasharray="6 6"/><text x="200" y="255" class="" text-anchor="middle">A、C彼此听不到</text><text x="18" y="302" class="">都认为空闲 → 同时发送 → AP处冲突。</text><text x="18" y="338" class="">RTS/CTS预约：听到CTS的站先等待。</text><text x="18" y="376" class="">可缓解隐藏站冲突，不能保证零冲突。</text></svg>