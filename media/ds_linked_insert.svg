<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 670" role="img" aria-labelledby="title desc"><title id="title">链表插入：分两次改指针</title><desc id="desc">链表插入：分两次改指针；按从上到下顺序读图。</desc><defs><style>text{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#243b53}.title{font-weight:700;font-size:21px}.mono{font-family:ui-monospace,Consolas,monospace}.box{fill:#fff;stroke:#61778e;stroke-width:1.5}.hi{fill:#ddf5ed;stroke:#087f70;stroke-width:2}.bg{fill:#f8fafc;stroke:#ccd6e0}.line{fill:none;stroke:#37648b;stroke-width:2;marker-end:url(#a)}.edge{fill:none;stroke:#61778e;stroke-width:2}.weight{paint-order:stroke;stroke:#f8fafc;stroke-width:7px;stroke-linejoin:round;fill:#175ea8;font-weight:700}@media(prefers-color-scheme:dark){text{fill:#e6edf5}.bg{fill:#142234;stroke:#42596f}.box{fill:#1b3045;stroke:#9ab0c5}.hi{fill:#17483e;stroke:#5ddcc1}.line,.edge{stroke:#a3c6ee}.weight{stroke:#142234;fill:#b6d9ff}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527ea9"/></marker></defs><rect x="1" y="1" width="398" height="668" rx="12" class="bg"/><text x="22" y="33" class="title" text-anchor="start">链表插入：分两次改指针</text><text x="22" y="70" class="" text-anchor="start">已知 p 后插入 s；箭头就是 next</text><text x="22" y="120" class="" text-anchor="start">原来：p 指向 q</text><rect x="30" y="133" width="75" height="42" rx="7" class="box"/><text x="67.5" y="160.0" class="mono" text-anchor="middle">p</text><rect x="270" y="133" width="75" height="42" rx="7" class="box"/><text x="307.5" y="160.0" class="mono" text-anchor="middle">q</text><rect x="140" y="197" width="75" height="42" rx="7" class="hi"/><text x="177.5" y="224.0" class="mono" text-anchor="middle">s</text><path class="line" d="M105 153L270 153"/><text x="22" y="270" class="" text-anchor="start">① s.next = p.next</text><rect x="30" y="283" width="75" height="42" rx="7" class="box"/><text x="67.5" y="310.0" class="mono" text-anchor="middle">p</text><rect x="270" y="283" width="75" height="42" rx="7" class="box"/><text x="307.5" y="310.0" class="mono" text-anchor="middle">q</text><rect x="140" y="347" width="75" height="42" rx="7" class="hi"/><text x="177.5" y="374.0" class="mono" text-anchor="middle">s</text><path class="line" d="M105 303L270 303"/><path class="line" d="M200 367L285 322"/><text x="22" y="450" class="" text-anchor="start">② p.next = s</text><rect x="30" y="463" width="75" height="42" rx="7" class="box"/><text x="67.5" y="490.0" class="mono" text-anchor="middle">p</text><rect x="270" y="463" width="75" height="42" rx="7" class="box"/><text x="307.5" y="490.0" class="mono" text-anchor="middle">q</text><rect x="140" y="527" width="75" height="42" rx="7" class="hi"/><text x="177.5" y="554.0" class="mono" text-anchor="middle">s</text><path class="line" d="M105 483L140 537"/><path class="line" d="M200 537L285 502"/><text x="22" y="610" class="" text-anchor="start">先让 s 留住 q，再让 p 改指向。</text><text x="22" y="637" class="" text-anchor="start">若直接覆盖 p.next，原 q 可能丢失。</text></svg>