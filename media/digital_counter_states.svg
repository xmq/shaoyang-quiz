<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" role="img" aria-labelledby="title desc" width="400" height="480"><title id="title">模6计数器：数六次回到起点</title><desc id="desc">模6计数器：数六次回到起点</desc>
<defs><style>
        :root{--ink:#17324b;--muted:#456075;--paper:#fff;--panel:#edf5fa;--blue:#1464ba;--green:#087c67;--orange:#ad5200;--red:#b42318;--border:#cad8e5}
        @media(prefers-color-scheme:dark){:root{--ink:#edf4fb;--muted:#b5c8d8;--paper:#132334;--panel:#1b3349;--blue:#9bcaff;--green:#7de1c4;--orange:#ffc079;--red:#ffab9b;--border:#527087}}
        .paper{fill:var(--paper)}.panel{fill:var(--panel);stroke:var(--border)}.t{font:18px system-ui,sans-serif;fill:var(--ink)}.h{font:700 21px system-ui,sans-serif;fill:var(--ink)}.b{font:700 18px system-ui,sans-serif;fill:var(--blue)}.g{font:700 18px system-ui,sans-serif;fill:var(--green)}.r{font:700 18px system-ui,sans-serif;fill:var(--red)}.muted{font:18px system-ui,sans-serif;fill:var(--muted)}
        .wire{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}.blue{fill:none;stroke:var(--blue);stroke-width:2.5}.green{fill:none;stroke:var(--green);stroke-width:2.5}.orange{fill:none;stroke:var(--orange);stroke-width:2.5}.red{fill:none;stroke:var(--red);stroke-width:2.5}.dash{stroke-dasharray:5 4}.dot{fill:var(--ink)}.shade{fill:var(--green);opacity:.17}
        </style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--ink)"/></marker></defs>

<text class="h" x="20" y="33">模6计数器：数六次回到起点</text>
<rect class="panel" x="65" y="85" width="95" height="50" rx="10"/>
<text class="t" x="112" y="118" text-anchor="middle">000</text>
<rect class="panel" x="240" y="85" width="95" height="50" rx="10"/>
<text class="t" x="287" y="118" text-anchor="middle">001</text>
<rect class="panel" x="240" y="175" width="95" height="50" rx="10"/>
<text class="t" x="287" y="208" text-anchor="middle">010</text>
<rect class="panel" x="65" y="175" width="95" height="50" rx="10"/>
<text class="t" x="112" y="208" text-anchor="middle">011</text>
<rect class="panel" x="65" y="265" width="95" height="50" rx="10"/>
<text class="t" x="112" y="298" text-anchor="middle">100</text>
<rect class="panel" x="240" y="265" width="95" height="50" rx="10"/>
<text class="t" x="287" y="298" text-anchor="middle">101</text>
<path class="wire" d="M160 110L240 110" marker-end="url(#arrow)"/>
<path class="wire" d="M287 135L287 175" marker-end="url(#arrow)"/>
<path class="wire" d="M240 200L160 200" marker-end="url(#arrow)"/>
<path class="wire" d="M112 225L112 265" marker-end="url(#arrow)"/>
<path class="wire" d="M160 290L240 290" marker-end="url(#arrow)"/>
<path class="wire" d="M335 290H365V60H112"/>
<path class="wire" d="M112 60L112 85" marker-end="url(#arrow)"/>
<text class="t" x="20" y="382">101之后回000；110、111未使用。</text>
<text class="t" x="20" y="418">规定110→000、111→000，防止上电误入无</text>
<text class="t" x="20" y="443">效状态后锁死。</text>
</svg>
