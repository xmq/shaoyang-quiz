<svg xmlns="http://www.w3.org/2000/svg" width="490" height="278" viewBox="0 0 490 278" role="img" aria-labelledby="title desc"><title id="title">PN结正向与反向偏置</title><desc id="desc">左：P接正N接负，耗尽层变窄、势垒降低。右：P接负N接正，耗尽层变宽、势垒升高。耗尽层内P侧为负的受主离子，N侧为正的施主离子；P区和N区整体仍电中性。</desc><defs><style>:root{--ink:#263d49;--muted:#647781;--line:#c6d3d9;--accent:#147b71;--blue:#356c9b;--warm:#b37327;--pale:#e7f3f0}@media(prefers-color-scheme:dark){:root{--ink:#dfebf0;--muted:#a2b8c3;--line:#415965;--accent:#7ed6c6;--blue:#a3c8ed;--warm:#e7bb77;--pale:#203d3c}}text{font:20px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:var(--ink)}.small{font-size:18px;fill:var(--muted)}.label{font-size:20px;font-weight:600}.accent{fill:var(--accent)}.blue{fill:var(--blue)}.warm{fill:var(--warm)}.wire,.axis{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.guide{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 5}.grid{fill:none;stroke:var(--line);stroke-width:1}.curve{fill:none;stroke:var(--accent);stroke-width:2.6}.point{fill:var(--accent)}.resistor{fill:none;stroke:var(--ink);stroke-width:1.8}.accent-line{fill:none;stroke:var(--accent);stroke-width:2.1}</style><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="var(--ink)"/></marker></defs><text x="125" y="27" class="label" text-anchor="middle">正向偏置</text><text x="125" y="55" class="small" text-anchor="middle">P接 +，N接 −</text><rect x="21" y="80" width="104" height="94" fill="var(--accent)" opacity=".10"/><rect x="125" y="80" width="104" height="94" fill="var(--blue)" opacity=".10"/><rect x="110.0" y="80" width="30" height="94" fill="var(--line)" opacity=".65"/><path d="M125 80V174" class="guide"/><text x="47" y="133" class="label accent" text-anchor="middle">P</text><text x="203" y="133" class="label blue" text-anchor="middle">N</text><text x="117.5" y="131" class="small" text-anchor="middle">−</text><text x="132.5" y="131" class="small" text-anchor="middle">+</text><path d="M110.0 188v12M140.0 188v12M110.0 195H140.0" class="axis"/><text x="125" y="228" class="label" text-anchor="middle">耗尽层变窄</text><text x="125" y="257" class="small" text-anchor="middle">势垒降低</text><text x="365" y="27" class="label" text-anchor="middle">反向偏置</text><text x="365" y="55" class="small" text-anchor="middle">P接 −，N接 +</text><rect x="261" y="80" width="104" height="94" fill="var(--accent)" opacity=".10"/><rect x="365" y="80" width="104" height="94" fill="var(--blue)" opacity=".10"/><rect x="326.0" y="80" width="78" height="94" fill="var(--line)" opacity=".65"/><path d="M365 80V174" class="guide"/><text x="287" y="133" class="label accent" text-anchor="middle">P</text><text x="443" y="133" class="label blue" text-anchor="middle">N</text><text x="345.5" y="131" class="small" text-anchor="middle">−</text><text x="384.5" y="131" class="small" text-anchor="middle">+</text><path d="M326.0 188v12M404.0 188v12M326.0 195H404.0" class="axis"/><text x="365" y="228" class="label" text-anchor="middle">耗尽层变宽</text><text x="365" y="257" class="small" text-anchor="middle">势垒升高</text></svg>