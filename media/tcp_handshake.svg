<svg xmlns="http://www.w3.org/2000/svg" width="400" height="470" viewBox="0 0 400 470" role="img" aria-labelledby="title"><title id="title">三次握手：SYN也占一个序号</title><defs><style>text{font:18px "Microsoft YaHei",system-ui,sans-serif;fill:#183047}.title{font-size:20px;font-weight:700}.bold{font-weight:700}.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#7b8fa2;stroke-width:1.5}.hi{fill:#d9f3ed;stroke:#19806e;stroke-width:1.5}.blue{fill:#e0edff;stroke:#4c79bf;stroke-width:1.5}.warn{fill:#fff0d3;stroke:#c28a25;stroke-width:1.5}.line{stroke:#37768a;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#e6eef6}.bg{fill:#142234;stroke:#405469}.box{fill:#1a2e43;stroke:#859bad}.hi{fill:#16483f;stroke:#69d7bc}.blue{fill:#193e68;stroke:#92b9fb}.warn{fill:#4b3a1e;stroke:#e4b15a}.line{stroke:#82c5d4}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47879b"/></marker></defs><rect class="bg" x="1" y="1" width="398" height="468" rx="14"/><text x="18" y="32" class="title">三次握手：SYN也占一个序号</text><text x="50" y="69" class="">客户端A</text><text x="260" y="69" class="">服务器B</text><path class="line" d="M70 88V380M330 88V380" stroke-dasharray="5 5"/><text x="20" y="111" class="">① SYN=1，seq=100</text><text x="20" y="138" class="">请求同步A的起始序号</text><path class="line" d="M70 156L330 174" marker-end="url(#a)"/><text x="20" y="205" class="">② SYN=1，ACK=1</text><text x="20" y="232" class="">seq=500，ack=101</text><path class="line" d="M330 250L70 268" marker-end="url(#a)"/><text x="20" y="299" class="">③ ACK=1，seq=101</text><text x="20" y="326" class="">ack=501（不带数据）</text><path class="line" d="M70 344L330 362" marker-end="url(#a)"/><text x="18" y="412" class="">ack表示下一个期望收到的序号。</text><text x="18" y="444" class="">纯ACK不占序号；首个数据从101起。</text></svg>