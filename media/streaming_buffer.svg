<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 410" role="img" aria-labelledby="title" width="400" height="410"><title id="title">播放缓冲：看存量如何变化</title><defs><style>text{font:18px "Microsoft YaHei",system-ui,sans-serif;fill:#183047}.title{font-size:20px;font-weight:700}.bold{font-weight:700}.bg{fill:#f8fafc;stroke:#cbd5e1}.box{fill:#fff;stroke:#7b8fa2;stroke-width:1.5}.hi{fill:#d9f3ed;stroke:#19806e;stroke-width:1.5}.blue{fill:#e0edff;stroke:#4c79bf;stroke-width:1.5}.warn{fill:#fff0d3;stroke:#c28a25;stroke-width:1.5}.line{stroke:#37768a;stroke-width:2;fill:none}@media(prefers-color-scheme:dark){text{fill:#e6eef6}.bg{fill:#142234;stroke:#405469}.box{fill:#1a2e43;stroke:#859bad}.hi{fill:#16483f;stroke:#69d7bc}.blue{fill:#193e68;stroke:#92b9fb}.warn{fill:#4b3a1e;stroke:#e4b15a}.line{stroke:#82c5d4}}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#47879b"/></marker></defs><text x="18" y="32" class="title">播放缓冲：看存量如何变化</text><text x="18" y="69" class="">初存量8 Mb，播放速率4 Mb/s。</text><text x="18" y="99" class="">网络输入2 Mb/s，每秒净减少2 Mb。</text><text x="18" y="147" class="">0秒</text><rect class="box" x="82" y="123" width="280" height="30" rx="7"/><rect class="hi" x="82" y="123" width="280.0" height="30" rx="7"/><text x="367" y="146" class="">8</text><text x="18" y="191" class="">1秒</text><rect class="box" x="82" y="167" width="280" height="30" rx="7"/><rect class="hi" x="82" y="167" width="210.0" height="30" rx="7"/><text x="367" y="190" class="">6</text><text x="18" y="235" class="">2秒</text><rect class="box" x="82" y="211" width="280" height="30" rx="7"/><rect class="hi" x="82" y="211" width="140.0" height="30" rx="7"/><text x="367" y="234" class="">4</text><text x="18" y="279" class="">3秒</text><rect class="box" x="82" y="255" width="280" height="30" rx="7"/><rect class="hi" x="82" y="255" width="70.0" height="30" rx="7"/><text x="367" y="278" class="">2</text><text x="18" y="323" class="">4秒</text><rect class="box" x="82" y="299" width="280" height="30" rx="7"/><text x="367" y="322" class="">0</text><text x="18" y="379" class="">4秒耗尽：缓冲吸收波动，不能造数据。</text></svg>