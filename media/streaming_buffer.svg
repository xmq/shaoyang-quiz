<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">流媒体缓冲过程</title><desc id="desc">网络持续把媒体数据送入缓冲区，播放器按媒体码率从缓冲区取出数据。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176f68"/></marker><style>.bg{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.box{fill:#fff;stroke:#64748b;stroke-width:3}.buffer{fill:#e7f6f4;stroke:#176f68;stroke-width:4}.a{stroke:#176f68;stroke-width:5;fill:none;marker-end:url(#a)}.t{font:21px system-ui,sans-serif;fill:#102a43}.s{font:15px system-ui,sans-serif;fill:#526777}</style></defs>
  <rect class="bg" x="12" y="12" width="736" height="336" rx="24"/>
  <rect class="box" x="45" y="120" width="160" height="90" rx="14"/><rect class="buffer" x="300" y="95" width="170" height="140" rx="14"/><rect class="box" x="560" y="120" width="150" height="90" rx="14"/>
  <text class="t" x="125" y="172" text-anchor="middle">网络输入</text><text class="t" x="385" y="150" text-anchor="middle">播放缓冲</text><text class="s" x="385" y="184" text-anchor="middle">吸收短时波动</text><text class="t" x="635" y="172" text-anchor="middle">播放器</text>
  <path class="a" d="M205 165H290"/><path class="a" d="M470 165H550"/>
  <text class="s" x="245" y="145" text-anchor="middle">输入速率</text><text class="s" x="510" y="145" text-anchor="middle">媒体码率</text>
  <text class="s" x="380" y="292" text-anchor="middle">长期输入速率低于媒体码率 → 缓冲逐渐耗尽 → 播放卡顿</text>
</svg>
